  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useRef, useEffect, useCallback } = React;

      /* ---------------------------------------------------------------
         Fictional estate, shared with the other protocol simulators.
         Names are inside example.com (RFC 2606) and every address is
         inside the RFC 5737 documentation ranges.
         --------------------------------------------------------------- */
      const HOST = "ftp.example.com";
      const IP = "192.0.2.45";
      const USER = "fbloggs";
      const HOME = "/home/" + USER;
      const PUB = "/pub";
      const PASSWORD = "not-a-real-password";
      const ANON_PASSWORD = "student@example.com";

      const DEVIATION_MESSAGE =
        "That is not the action for this step. Follow the simulation instructions exactly — enter the command shown in the instruction panel.";

      // Two directories, each allowing different access. An anonymous user
      // gets read-only access to the public directory; an account holder
      // gets read and write access to their own home directory.
      const DIRECTORIES = [
        {
          path: PUB,
          note: "world readable — anonymous login permitted, but read only",
          anonymous: "read",
          account: "read",
        },
        {
          path: HOME,
          note: "the home directory of the account " + USER + " — read and write",
          anonymous: "none",
          account: "write",
        },
      ];

      const accessFor = (path, loggedIn) => {
        const directory = DIRECTORIES.find((entry) => entry.path === path);
        if (!directory) return "none";
        return loggedIn === "anonymous" ? directory.anonymous : directory.account;
      };

      const REMOTE_START = [
        { name: "readme.txt", dir: PUB, size: "1.4 KB", type: "ascii", modified: "2026-08-20 09:14" },
        { name: "prospectus.pdf", dir: PUB, size: "820 KB", type: "binary", modified: "2026-07-02 11:00" },
        { name: "notes.txt", dir: HOME, size: "2.1 KB", type: "ascii", modified: "2026-08-28 16:40" },
      ];

      const LOCAL_START = [
        { name: "coursework.zip", size: "4.6 MB", type: "binary", modified: "2026-08-31 09:20" },
        { name: "logo.png", size: "18.0 KB", type: "binary", modified: "2026-08-25 10:05" },
      ];

      // Exercise C starts with both sides part-way in step, so exactly one
      // file is missing each way and one has been edited more recently here.
      const SYNC_LOCAL = [
        { name: "readme.txt", size: "1.5 KB", type: "ascii", modified: "2026-08-30 08:02" },
        { name: "prospectus.pdf", size: "820 KB", type: "binary", modified: "2026-07-02 11:00" },
        { name: "logo.png", size: "18.0 KB", type: "binary", modified: "2026-08-25 10:05" },
      ];
      const SYNC_REMOTE = [
        { name: "readme.txt", dir: HOME, size: "1.4 KB", type: "ascii", modified: "2026-08-20 09:14" },
        { name: "prospectus.pdf", dir: HOME, size: "820 KB", type: "binary", modified: "2026-07-02 11:00" },
        { name: "notes.txt", dir: HOME, size: "2.1 KB", type: "ascii", modified: "2026-08-28 16:40" },
      ];

      /* --------------------------- helpers --------------------------- */

      const norm = (value) =>
        String(value == null ? "" : value).trim().replace(/\s+/g, " ");

      const matchesExpectation = (expect, value) => {
        if (expect instanceof RegExp) return expect.test(value);
        return norm(expect).toLowerCase() === value.toLowerCase();
      };

      const renderRich = (text) => {
        const parts = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
        return parts.map((part, index) => {
          if (part.startsWith("**") && part.endsWith("**")) {
            return (
              <strong key={index} className="font-bold">
                {part.slice(2, -2)}
              </strong>
            );
          }
          if (part.startsWith("`") && part.endsWith("`")) {
            return (
              <code
                key={index}
                className="mono rounded bg-slate-200 px-1 py-0.5 text-[0.92em] text-slate-900 dark:bg-slate-700 dark:text-slate-50"
              >
                {part.slice(1, -1)}
              </code>
            );
          }
          return part;
        });
      };

      const remoteIn = (state) =>
        state.remoteFiles.filter((file) => file.dir === state.cwd);

      // What an FTP client's "compare directories" does: anything present on
      // one side only, plus anything whose copies differ, newest wins.
      const buildSyncPlan = (state) => {
        const remote = remoteIn(state);
        const plan = [];
        remote.forEach((file) => {
          const local = state.localFiles.find((entry) => entry.name === file.name);
          if (!local) {
            plan.push({
              id: file.name,
              name: file.name,
              direction: "download",
              reason: "on the server only",
              detail: "server copy " + file.modified,
            });
          } else if (local.modified > file.modified) {
            plan.push({
              id: file.name,
              name: file.name,
              direction: "upload",
              reason: "this computer has the newer copy",
              detail: "here " + local.modified + " · server " + file.modified,
            });
          } else if (local.modified < file.modified) {
            plan.push({
              id: file.name,
              name: file.name,
              direction: "download",
              reason: "the server has the newer copy",
              detail: "server " + file.modified + " · here " + local.modified,
            });
          } else {
            plan.push({
              id: file.name,
              name: file.name,
              direction: "none",
              reason: "identical on both sides",
              detail: "both " + file.modified,
            });
          }
        });
        state.localFiles.forEach((file) => {
          if (!remote.some((entry) => entry.name === file.name)) {
            plan.push({
              id: file.name,
              name: file.name,
              direction: "upload",
              reason: "on this computer only",
              detail: "local copy " + file.modified,
            });
          }
        });
        return plan.map((item) => ({ ...item, checked: false }));
      };

      /* ----------------------- step construction ----------------------
         FTP keeps two connections open: a control connection on port 21
         that carries commands and numbered replies for the whole session,
         and a separate data connection that opens for one transfer and
         closes again. Both are drawn separately in the connection pane. */

      const ctrl = (from, to, text, kind) => ({
        from,
        to,
        text,
        kind,
        channel: "control",
        port: 21,
      });
      const data = (from, to, text, kind) => ({
        from,
        to,
        text,
        kind,
        channel: "data",
        port: 20,
      });

      const transferWire = (verb, filename) => [
        ctrl("FTP client", HOST, verb + " " + filename, "cmd"),
        ctrl(HOST, "FTP client", "150 Opening data connection for " + filename, "reply"),
        data("FTP client", HOST, "‹file contents transferred on the data connection›", "cmd"),
        ctrl(HOST, "FTP client", "226 Transfer complete — data connection closed", "reply"),
      ];

      const lineStep = ({ id, teach, command, reply, misstep, set, extraWire, extraTerm }) => ({
        id,
        teach,
        terminal: {
          instruction: "Type: " + command,
          expect: command,
          display: command,
          misstep,
        },
        app: null,
        effect: () => ({
          wire: [
            ctrl("FTP client", HOST, command, "cmd"),
            ...(reply ? [ctrl(HOST, "FTP client", reply, "reply")] : []),
            ...(extraWire || []),
          ],
          term: [
            { type: "command", text: command },
            ...(reply ? [{ type: "recv", text: reply }] : []),
            ...(extraTerm || []),
          ],
          set,
        }),
      });

      const dirStep = ({ id, teach, expect, prompt, wrong, onPick }) => ({
        id,
        teach,
        terminal: null,
        app: null,
        dirPick: { expect, prompt, wrong },
        effect: onPick,
      });

      const typeStep = ({ id, teach, expect, prompt, wrong }) => ({
        id,
        teach,
        terminal: null,
        app: null,
        typePick: {
          expect,
          prompt,
          wrong,
          options: [
            { id: "A", label: "TYPE A — ASCII (text)" },
            { id: "I", label: "TYPE I — image (binary)" },
          ],
        },
        effect: () => ({ set: { chosenType: expect } }),
      });

      const fileStep = ({ id, teach, expect, side, prompt, wrong }) => ({
        id,
        teach,
        terminal: null,
        app: null,
        filePick: { expect, side, prompt, wrong },
        effect: () => ({ set: { selectedFile: expect } }),
      });

      /* --------------------------- exercises -------------------------- */

      const CONNECT_CMD = "ftp " + HOST;

      const listWire = (path, names) => [
        ctrl("FTP client", HOST, "CWD " + path, "cmd"),
        ctrl(HOST, "FTP client", "250 Directory changed to " + path, "reply"),
        ctrl("FTP client", HOST, "LIST", "cmd"),
        ctrl(HOST, "FTP client", "150 Opening data connection for directory listing", "reply"),
        data(HOST, "FTP client", names.join("  "), "reply"),
        ctrl(HOST, "FTP client", "226 Directory listing complete", "reply"),
      ];

      const EXERCISES = [
        {
          id: "anonymous",
          label: "A: Anonymous access — read only",
          examPoints: [
            "FTP (File Transfer Protocol) transfers files between an FTP client and an FTP server.",
            "Anonymous access lets any user log in without an account, by convention with the username anonymous and an email address as the password.",
            "Anonymous access normally grants read-only access to public directories, and no access at all to private ones.",
            "FTP uses two connections: a control connection on port 21 for commands and replies, and a separate data connection for each transfer.",
          ],
          initial: {},
          buildSteps: (view) => {
            const enterPub = dirStep({
              id: "pickdir",
              teach:
                "The server holds two directories and each allows different access. An anonymous user has **no account**, so it will only be let into a directory marked publicly readable. Check the access column in the server panel, then open that directory.",
              expect: PUB,
              prompt: "Which directory may an anonymous user open?",
              wrong:
                "That is somebody's private home directory and needs a real account. Anonymous access only reaches publicly readable directories.",
              onPick: () => ({
                wire: listWire(PUB, ["readme.txt", "prospectus.pdf"]),
                term: [
                  { type: "recv", text: "250 Directory changed to " + PUB },
                  { type: "recv", text: "226 Directory listing complete" },
                ],
                set: { cwd: PUB, listed: true },
              }),
            });
            const denied = dirStep({
              id: "denied",
              teach:
                "Finally, see what anonymous access does **not** allow. Try to open the private home directory and watch the server's reply.",
              expect: HOME,
              prompt: "Try to open " + HOME + ".",
              wrong: "For this step open " + HOME + " — the directory that belongs to a real account.",
              onPick: () => ({
                wire: [
                  ctrl("FTP client", HOST, "CWD " + HOME, "cmd"),
                  ctrl(HOST, "FTP client", "550 Permission denied", "reply"),
                ],
                term: [{ type: "error", text: "550 Permission denied" }],
                set: { denied: true },
              }),
            });

            if (view === "terminal") {
              return [
                {
                  id: "connect",
                  teach:
                    "**FTP (File Transfer Protocol)** transfers files between an **FTP client** and an **FTP server**. The client first opens a **control connection** to the server's well-known port **21**. This connection stays open for the whole session and carries commands and numbered replies.",
                  terminal: {
                    instruction: "Type: " + CONNECT_CMD,
                    expect: CONNECT_CMD,
                    display: CONNECT_CMD,
                  },
                  app: null,
                  effect: () => ({
                    wire: [ctrl(HOST, "FTP client", "220 Service ready for new user", "reply")],
                    term: [
                      { type: "command", text: CONNECT_CMD },
                      { type: "info", text: "Connected to " + IP + ":21." },
                      { type: "recv", text: "220 Service ready for new user" },
                    ],
                    set: { controlOpen: true },
                  }),
                },
                lineStep({
                  id: "user",
                  teach:
                    "**Anonymous access** means logging in without an account. By convention the username is literally `anonymous`. Read the server's reply — it says what to send as the password.",
                  command: "USER anonymous",
                  reply: "331 Guest login ok, send your email address as your password",
                }),
                lineStep({
                  id: "pass",
                  teach:
                    "For anonymous access the password is a courtesy: an email address, so the administrator knows who is using the service. It is not checked. Note that FTP sends it in **clear text**.",
                  command: "PASS " + ANON_PASSWORD,
                  reply: "230 User logged in — anonymous access granted",
                  set: { loggedIn: "anonymous" },
                }),
                enterPub,
                fileStep({
                  id: "pickfile",
                  teach:
                    "The listing arrived over the **data connection**, which then closed again. Choose the file to download — the client will name it in a `RETR` command on the control connection.",
                  expect: "readme.txt",
                  side: "remote",
                  prompt: "Click readme.txt in the server's " + PUB + " directory.",
                  wrong: "This exercise downloads readme.txt. Click that file in the " + PUB + " directory.",
                }),
                {
                  id: "retr",
                  teach:
                    "`RETR` asks the server to send a file. Watch the connection panel: the control connection stays open while a **separate data connection opens on port 20**, carries the file, and closes again.",
                  terminal: {
                    instruction: "Type: RETR readme.txt",
                    expect: "RETR readme.txt",
                    display: "RETR readme.txt",
                    misstep: [
                      {
                        match: /^get\b/i,
                        message:
                          "`get` is what a friendly FTP program calls it. The protocol command itself is RETR readme.txt",
                      },
                    ],
                  },
                  app: null,
                  effect: (state) => ({
                    wire: transferWire("RETR", "readme.txt"),
                    term: [
                      { type: "command", text: "RETR readme.txt" },
                      { type: "recv", text: "150 Opening data connection for readme.txt" },
                      { type: "recv", text: "226 Transfer complete" },
                    ],
                    set: {
                      localFiles: [
                        ...state.localFiles,
                        {
                          name: "readme.txt",
                          size: "1.4 KB",
                          type: "ascii",
                          modified: "2026-08-20 09:14",
                        },
                      ],
                      lastTransfer: "readme.txt",
                    },
                  }),
                },
                {
                  id: "stor-refused",
                  teach:
                    "Now try the other direction. Anonymous access is **read only**, so the server should refuse to accept a file.",
                  terminal: {
                    instruction: "Type: STOR logo.png",
                    expect: "STOR logo.png",
                    display: "STOR logo.png",
                  },
                  app: null,
                  effect: () => ({
                    wire: [
                      ctrl("FTP client", HOST, "STOR logo.png", "cmd"),
                      ctrl(HOST, "FTP client", "532 Permission denied — anonymous access is read only", "reply"),
                    ],
                    term: [
                      { type: "command", text: "STOR logo.png" },
                      { type: "error", text: "532 Permission denied — anonymous access is read only" },
                    ],
                    set: { refusedUpload: true },
                  }),
                },
                denied,
                {
                  id: "quit",
                  teach: "`QUIT` closes the control connection and ends the session.",
                  terminal: { instruction: "Type: QUIT", expect: "QUIT", display: "QUIT" },
                  app: null,
                  effect: () => ({
                    wire: [
                      ctrl("FTP client", HOST, "QUIT", "cmd"),
                      ctrl(HOST, "FTP client", "221 Goodbye", "reply"),
                    ],
                    term: [{ type: "recv", text: "221 Goodbye" }],
                    set: { controlOpen: false, loggedIn: null },
                  }),
                },
              ];
            }
            return [
              {
                id: "connect",
                teach:
                  "**FTP client software** shows your own files on one side and the server's on the other. Underneath it opens a **control connection** to port **21** and logs in. For **anonymous access** the username is `anonymous` and the password is an email address.",
                terminal: null,
                app: {
                  instruction: "Type " + HOST + " into the Host box and click Quickconnect.",
                  control: "connect",
                  expectHost: HOST,
                  expectUser: "anonymous",
                  displayHost: HOST,
                  displayUser: "anonymous",
                },
                effect: () => ({
                  wire: [
                    ctrl(HOST, "FTP client", "220 Service ready for new user", "reply"),
                    ctrl("FTP client", HOST, "USER anonymous", "cmd"),
                    ctrl(HOST, "FTP client", "331 Guest login ok, send your email address as your password", "reply"),
                    ctrl("FTP client", HOST, "PASS " + ANON_PASSWORD, "cmd"),
                    ctrl(HOST, "FTP client", "230 User logged in — anonymous access granted", "reply"),
                  ],
                  term: [{ type: "info", text: "Client logged in anonymously to " + HOST + ":21" }],
                  set: { controlOpen: true, loggedIn: "anonymous" },
                }),
              },
              enterPub,
              {
                id: "download",
                teach:
                  "Both sides are now listed side by side. Select the file you want on the **Remote site** and move it across with the **◀** button. Underneath, the client sends `RETR readme.txt`: the command goes on the control connection while the file travels on a **separate data connection** that opens and closes again.",
                terminal: null,
                app: {
                  instruction:
                    "Select readme.txt in the Remote site pane, then click the ◀ button.",
                  control: "download",
                  expectFile: "readme.txt",
                },
                effect: (state) => ({
                  wire: transferWire("RETR", "readme.txt"),
                  term: [{ type: "recv", text: "226 Transfer complete" }],
                  set: {
                    localFiles: [
                      ...state.localFiles,
                      {
                        name: "readme.txt",
                        size: "1.4 KB",
                        type: "ascii",
                        modified: "2026-08-20 09:14",
                      },
                    ],
                    lastTransfer: "readme.txt",
                    selectedRemote: null,
                  },
                }),
              },
              {
                id: "upload-refused",
                teach:
                  "Now try the other direction. The client will happily send the command — it is the **server** that decides whether it is allowed.",
                terminal: null,
                app: {
                  instruction:
                    "Select logo.png in the Local site pane, then click the ▶ button.",
                  control: "upload",
                  expectFile: "logo.png",
                  refuse: true,
                },
                effect: () => ({
                  wire: [
                    ctrl("FTP client", HOST, "STOR logo.png", "cmd"),
                    ctrl(HOST, "FTP client", "532 Permission denied — anonymous access is read only", "reply"),
                  ],
                  term: [{ type: "error", text: "532 Permission denied — anonymous access is read only" }],
                  set: { refusedUpload: true, selectedLocal: null },
                }),
              },
              denied,
              {
                id: "disconnect",
                teach:
                  "Disconnecting sends `QUIT` and closes the control connection. **Anonymous access gave read-only access to one public directory and nothing else.**",
                terminal: null,
                app: null,
                effect: () => ({
                  wire: [
                    ctrl("FTP client", HOST, "QUIT", "cmd"),
                    ctrl(HOST, "FTP client", "221 Goodbye", "reply"),
                  ],
                  set: { controlOpen: false, loggedIn: null },
                }),
              },
            ];
          },
        },
        {
          id: "authenticated",
          label: "B: Non-anonymous access — uploading to your own folder",
          examPoints: [
            "Non-anonymous access requires a valid username and password for an account on the server.",
            "The account determines which directories the user may read from and write to — normally including their own home directory.",
            "Plain FTP sends the username and password in clear text; SFTP or FTPS carry FTP over an encrypted connection.",
            "TYPE I (binary) must be set for non-text files; TYPE A (ASCII) is for text.",
            "STOR uploads a file, again over a separate data connection.",
          ],
          initial: {},
          buildSteps: (view) => {
            const enterHome = dirStep({
              id: "pickdir",
              teach:
                "Logged in as a real account, the home directory belonging to that account becomes available — and unlike " +
                PUB +
                ", it may be **written** to. Check the access column, then open it.",
              expect: HOME,
              prompt: "Which directory may " + USER + " write to?",
              wrong:
                PUB +
                " is readable by everyone but not writable. Look for the directory belonging to this account.",
              onPick: () => ({
                wire: listWire(HOME, ["notes.txt"]),
                term: [
                  { type: "recv", text: "250 Directory changed to " + HOME },
                  { type: "recv", text: "226 Directory listing complete" },
                ],
                set: { cwd: HOME, listed: true },
              }),
            });
            const pickType = typeStep({
              id: "type",
              teach:
                "Before any transfer the client must tell the server **how** to treat the bytes. **TYPE A (ASCII)** is for text files and lets the server convert line endings between systems. **TYPE I (image, meaning binary)** sends the bytes through completely untouched. `coursework.zip` is a compressed archive.",
              expect: "I",
              prompt: "Which transfer type should be set for coursework.zip?",
              wrong:
                "ASCII mode may alter line endings, which would corrupt a compressed archive. A non-text file must be sent in binary.",
            });

            if (view === "terminal") {
              return [
                {
                  id: "connect",
                  teach:
                    "The same control connection to port **21**, but this time the session will log in as a real account. This is **non-anonymous access**.",
                  terminal: {
                    instruction: "Type: " + CONNECT_CMD,
                    expect: CONNECT_CMD,
                    display: CONNECT_CMD,
                  },
                  app: null,
                  effect: () => ({
                    wire: [ctrl(HOST, "FTP client", "220 Service ready for new user", "reply")],
                    term: [
                      { type: "command", text: CONNECT_CMD },
                      { type: "recv", text: "220 Service ready for new user" },
                    ],
                    set: { controlOpen: true },
                  }),
                },
                lineStep({
                  id: "user",
                  teach:
                    "**Non-anonymous access** requires a username that exists on the server. The reply is different from the anonymous one: this time a real password is demanded.",
                  command: "USER " + USER,
                  reply: "331 Password required for " + USER,
                }),
                lineStep({
                  id: "pass",
                  teach:
                    "The password is sent. Look at the wire panel: **plain FTP sends it in clear text**, so anyone able to read the traffic could capture it. The secure alternatives are **SFTP** (file transfer over SSH) and **FTPS** (FTP over TLS) — see the SSH simulator for how an encrypted channel works.",
                  command: "PASS " + PASSWORD,

                fileStep({
                  id: "pickfile",
                  teach:

                  expect: "coursework.zip",
                  side: "local",

                  id: "stor",
                  teach:
                    "`STOR` uploads a file. As with `RETR`, the command travels on the control connection and the file itself travels on a **separate data connection** that opens and closes for this one transfer. Watch the home directory gain the file.",
                  terminal: {
                    instruction: "Type: STOR coursework.zip",
                    expect: "STOR coursework.zip",
                    display: "STOR coursework.zip",
                    misstep: [
                      {
                        match: /^put\b/i,
                        message:
                          "`put` is what a friendly FTP program calls it. The protocol command itself is STOR coursework.zip",
                      },
                      {
                        match: /^retr\b/i,
                        message:
                          "RETR downloads from the server. To send a file to the server the command is STOR.",
                      },
                    ],
                  },
                  app: null,
                  effect: (state) => ({
                    wire: transferWire("STOR", "coursework.zip"),
                    term: [
                      { type: "recv", text: "150 Opening data connection for coursework.zip" },
                      { type: "recv", text: "226 Transfer complete" },

                    set: {
                      remoteFiles: [
                        ...state.remoteFiles,
                        {
                          name: "coursework.zip",

                          type: "binary",

                {

            return [
              {

                terminal: null,

                    ctrl("FTP client", HOST, "USER " + USER, "cmd"),
                    ctrl(HOST, "FTP client", "331 Password required for " + USER, "reply"),
                    ctrl("FTP client", HOST, "PASS " + PASSWORD, "cmd"),
                    ctrl(HOST, "FTP client", "230 User " + USER + " logged in", "reply"),
                  ],
                  term: [{ type: "info", text: "Client logged in as " + USER }],
                  set: { controlOpen: true, loggedIn: USER },
                }),
              },
              enterHome,
              pickType,
              {
                id: "upload",
                teach:
                  "Select the file on the **Local site** and move it across with the **▶** button. The client sends `STOR coursework.zip`: the command goes on the control connection, the file on a **separate data connection**. Watch the Remote site pane gain the file.",
                terminal: null,
                app: {
                  instruction:
                    "Select coursework.zip in the Local site pane, then click the ▶ button.",
                  control: "upload",
                  expectFile: "coursework.zip",
                },
                effect: (state) => ({
                  wire: transferWire("STOR", "coursework.zip"),
                  term: [{ type: "recv", text: "226 Transfer complete" }],
                  set: {
                    remoteFiles: [
                      ...state.remoteFiles,
                      {
                        name: "coursework.zip",
                        dir: HOME,
                        size: "4.6 MB",
                        type: "binary",
                        modified: "2026-08-31 09:20",
                      },
                    ],
                    lastTransfer: "coursework.zip",
                    selectedLocal: null,
                  },
                }),
              },
              {
                id: "disconnect",
                teach:
                  "Disconnecting sends `QUIT`. The account holder could read **and** write in their own home directory — the difference an account makes.",
                terminal: null,
                app: null,
                effect: () => ({
                  wire: [
                    ctrl("FTP client", HOST, "QUIT", "cmd"),
                    ctrl(HOST, "FTP client", "221 Goodbye", "reply"),
                  ],
                  set: { controlOpen: false, loggedIn: null },
                }),
              },
            ];
          },
        },
        {
          id: "sync",
          label: "C: Keeping local and remote in step",
          examPoints: [
            "FTP is used to synchronise files and folders between a client and a server.",
            "A file present on one side only is transferred in that direction.",
            "When both sides hold a copy, the modification timestamps decide which is newer.",
            "Files that are identical on both sides need no transfer at all.",
            "TYPE A (ASCII) is for text files; TYPE I (binary) is for everything else.",
          ],
          initial: {
            controlOpen: true,
            loggedIn: USER,
            cwd: HOME,
            listed: true,
            localFiles: SYNC_LOCAL.map((file) => ({ ...file })),
            remoteFiles: SYNC_REMOTE.map((file) => ({ ...file })),
          },
          buildSteps: (view) => {
            if (view === "terminal") {
              return [
                fileStep({
                  id: "missing-local",
                  teach:
                    "**FTP is used to synchronise files and folders between a client and a server.** By hand that means comparing the two listings yourself. Start with the file that is on the server but not on this computer.",
                  expect: "notes.txt",
                  side: "remote",
                  prompt: "Which file is on the server but missing from this computer?",
                  wrong: "Compare the two lists carefully — that file is already on both sides.",
                }),
                typeStep({
                  id: "typea",
                  teach:
                    "`notes.txt` is a **text** file. Choose the transfer type that lets the server translate line endings between systems.",
                  expect: "A",
                  prompt: "Which transfer type should be used for notes.txt?",
                  wrong:
                    "Binary mode would work, but ASCII is the correct choice for a text file: it converts line endings between the two systems.",
                }),
                {
                  id: "download",
                  teach: "Bring it down. The file appears in the local listing.",
                  terminal: {
                    instruction: "Type: RETR notes.txt",
                    expect: "RETR notes.txt",
                    display: "RETR notes.txt",
                  },
                  app: null,
                  effect: (state) => ({
                    wire: [
                      ctrl("FTP client", HOST, "TYPE A", "cmd"),
                      ctrl(HOST, "FTP client", "200 Type set to A", "reply"),
                      ...transferWire("RETR", "notes.txt"),
                    ],
                    term: [{ type: "recv", text: "226 Transfer complete — notes.txt" }],
                    set: {
                      localFiles: [
                        ...state.localFiles,
                        { name: "notes.txt", size: "2.1 KB", type: "ascii", modified: "2026-08-28 16:40" },
                      ],
                      lastTransfer: "notes.txt",
                    },
                  }),
                },
                fileStep({
                  id: "missing-remote",
                  teach: "Now the other direction: the file that is here but not on the server.",
                  expect: "logo.png",
                  side: "local",
                  prompt: "Which file is on this computer but missing from the server?",
                  wrong: "Compare the two lists again — that file is already on the server.",
                }),
                typeStep({
                  id: "typei",
                  teach:
                    "`logo.png` is an **image**, not text. Choose the transfer type that sends every byte through untouched.",
                  expect: "I",
                  prompt: "Which transfer type should be used for logo.png?",
                  wrong:
                    "In ASCII mode the server would alter byte sequences that look like line endings, and the image would arrive corrupted. A non-text file must be sent in binary.",
                }),
                {
                  id: "upload",
                  teach: "Send it up. The server's listing gains the file.",
                  terminal: {
                    instruction: "Type: STOR logo.png",
                    expect: "STOR logo.png",
                    display: "STOR logo.png",
                  },
                  app: null,
                  effect: (state) => ({
                    wire: [
                      ctrl("FTP client", HOST, "TYPE I", "cmd"),
                      ctrl(HOST, "FTP client", "200 Type set to I", "reply"),
                      ...transferWire("STOR", "logo.png"),
                    ],
                    term: [{ type: "recv", text: "226 Transfer complete — logo.png" }],
                    set: {
                      remoteFiles: [
                        ...state.remoteFiles,
                        { name: "logo.png", dir: HOME, size: "18.0 KB", type: "binary", modified: "2026-08-25 10:05" },
                      ],
                      lastTransfer: "logo.png",
                    },
                  }),
                },
                {
                  id: "classify",
                  teach:
                    "Two files are left, and both exist on **both** sides. `prospectus.pdf` has the same timestamp in both listings. `readme.txt` does not — compare its modified times in the two panels.",
                  terminal: null,
                  app: null,
                  classify: {
                    prompt: "readme.txt is on both sides. Which copy should be kept?",
                    options: [
                      { id: "local", label: "The copy on this computer — it is newer" },
                      { id: "remote", label: "The copy on the server — it is newer" },
                      { id: "none", label: "Neither — they are identical" },
                    ],
                    expect: "local",
                    wrong:
                      "Read the modified column in both panels. The copy here is dated 2026-08-30; the server's is dated 2026-08-20, so this computer holds the more recent version.",
                  },
                  effect: () => ({}),
                },
                {
                  id: "overwrite",
                  teach:
                    "Send the newer copy up, overwriting the older one on the server. `prospectus.pdf` needs nothing at all: **identical files are not transferred**, which is the whole point of comparing before copying.",
                  terminal: {
                    instruction: "Type: STOR readme.txt",
                    expect: "STOR readme.txt",
                    display: "STOR readme.txt",
                  },
                  app: null,
                  effect: (state) => ({
                    wire: transferWire("STOR", "readme.txt"),
                    term: [{ type: "recv", text: "226 Transfer complete — readme.txt overwritten" }],
                    set: {
                      remoteFiles: state.remoteFiles.map((file) =>
                        file.name === "readme.txt" && file.dir === HOME
                          ? { ...file, size: "1.5 KB", modified: "2026-08-30 08:02" }
                          : file,
                      ),
                      lastTransfer: "readme.txt",
                    },
                  }),
                },
                {
                  id: "review",
                  teach:
                    "Both listings now match. Synchronising with FTP means exactly this: compare the two sides, transfer whatever is missing in each direction, send the newer copy where both sides differ, and leave identical files alone — choosing **TYPE A** for text and **TYPE I** for everything else.",
                  terminal: null,
                  app: null,
                  effect: () => ({ set: {} }),
                },
              ];
            }
            return [
              {
                id: "compare",
                teach:
                  "**FTP is used to synchronise files and folders between a client and a server.** Rather than comparing the two listings by eye, FTP client software can do it for you. Look at both panes first — note the **modified** column, which is what makes the comparison possible.",
                terminal: null,
                app: {
                  instruction: "Click Compare directories in the FTP client.",
                  control: "sync",
                },
                effect: (state) => ({
                  term: [{ type: "info", text: "Comparing " + state.cwd + " with the local folder ..." }],
                  set: { syncPlan: buildSyncPlan(state) },
                }),
              },
              {
                id: "queue",
                teach:
                  "The client has worked out what each file needs. A file on one side only is copied in that direction; where both sides hold a copy the **timestamps** decide, and where they are identical **nothing is transferred at all**. Tick every action that is needed, then start the transfer.",
                terminal: null,
                app: {
                  instruction:
                    "Tick all three required actions, then click Transfer queued items.",
                  control: "synctransfer",
                },
                effect: (state) => {
                  const remote = remoteIn(state);
                  const localAdds = state.syncPlan
                    .filter((item) => item.direction === "download")
                    .map((item) => {
                      const source = remote.find((file) => file.name === item.name);
                      return {
                        name: source.name,
                        size: source.size,
                        type: source.type,
                        modified: source.modified,
                      };
                    });
                  let remoteFiles = state.remoteFiles.slice();
                  state.syncPlan
                    .filter((item) => item.direction === "upload")
                    .forEach((item) => {
                      const source = state.localFiles.find((file) => file.name === item.name);
                      const existing = remoteFiles.findIndex(
                        (file) => file.name === item.name && file.dir === state.cwd,
                      );
                      const replacement = {
                        name: source.name,
                        dir: state.cwd,
                        size: source.size,
                        type: source.type,
                        modified: source.modified,
                      };
                      if (existing >= 0) remoteFiles[existing] = replacement;
                      else remoteFiles = [...remoteFiles, replacement];
                    });
                  return {
                    wire: state.syncPlan
                      .filter((item) => item.direction !== "none")
                      .flatMap((item) =>
                        transferWire(item.direction === "download" ? "RETR" : "STOR", item.name),
                      ),
                    term: [{ type: "recv", text: "226 All queued transfers complete" }],
                    set: {
                      localFiles: [...state.localFiles, ...localAdds],
                      remoteFiles,
                      syncPlan: null,
                      lastTransfer: "3 files",
                    },
                  };
                },
              },
              {
                id: "classify",
                teach:
                  "One of those three was not a missing file at all — `readme.txt` existed on both sides.",
                terminal: null,
                app: null,
                classify: {
                  prompt: "Why was readme.txt sent from this computer to the server?",
                  options: [
                    { id: "newer", label: "Its copy here had a later modified time" },
                    { id: "bigger", label: "Its copy here was a larger file" },
                    { id: "missing", label: "It was missing from the server" },
                  ],
                  expect: "newer",
                  wrong:
                    "It was on the server already, so it was not missing. The client compared the modified timestamps and sent whichever copy was more recent.",
                },
                effect: () => ({}),
              },
              {
                id: "review",
                teach:
                  "Both panes now match. Notice what the client did **not** do: `prospectus.pdf` was identical on both sides, so no data was transferred for it at all. Synchronising is comparing first and copying only what has changed — the same job you did by hand in the terminal view.",
                terminal: null,
                app: null,
                effect: () => ({ set: {} }),
              },
            ];
          },
        },
      ];

      /* -------------------------- presentation ------------------------ */

                        onConnect(hostDraft, userDraft);

            <div className="min-h-0 flex-1 overflow-auto p-3">

                      <FileRow

                  <button

                  >
                    Remote site {sim.cwd ? "— " + sim.cwd : ""}

                    <p className="p-2 text-[11px] text-slate-500 dark:text-slate-400">

                    <ul className="space-y-0.5 p-1">
                      {remoteFiles.map((file) => (

                          file={file}
                          selected={sim.selectedRemote === file.name}
                          onSelect={onSelectRemote}

              </div>

              {sim.controlOpen && (
                <div className="mt-3">
                  {sim.syncPlan ? (
                    <div className="rounded-md border border-indigo-300 bg-indigo-50 p-2 dark:border-indigo-700 dark:bg-indigo-950">
                      <p className="text-[11px] font-bold uppercase tracking-wide text-indigo-900 dark:text-indigo-100">
                        Actions needed to synchronise
                      </p>
                      <ul className="mt-1 space-y-1">
                        {sim.syncPlan.map((item) => (
                          <li key={item.id}>
                            {item.direction === "none" ? (
                              <p className="mono rounded border border-slate-300 bg-white px-2 py-1 text-[11px] text-slate-500 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-400">

                                  <span className="font-bold">
                                    {item.direction === "download"
                                      ? "◀ server to here"
                                      : "▶ here to server"}
                                  </span>{" "}
                                  {item.name}
                                  <span className="block text-slate-500 dark:text-slate-400">

                      <button

                      >
                        Transfer queued items
                      </button>
                    </div>

                    <button
                      type="button"
                      onClick={onSync}
                      className="shrink-0 whitespace-nowrap rounded-md border border-indigo-500 px-3 py-1.5 text-xs font-bold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:text-indigo-300 dark:hover:bg-indigo-950"
                    >
                      Compare directories
                    </button>
                  )}
                </div>
              )}

              {sim.lastTransfer && (
                <p className="mt-2 rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-900 dark:border-emerald-700 dark:bg-emerald-950 dark:text-emerald-100">
                  Transfer queue: {sim.lastTransfer} — complete
                </p>
              )}
              {sim.refusedUpload && (
                <p className="mt-2 rounded border border-red-300 bg-red-50 px-2 py-1 text-xs font-bold text-red-900 dark:border-red-700 dark:bg-red-950 dark:text-red-100">

                </p>

          </div>

      function TerminalView({ sim, draft, setDraft, onSubmit, onHistory, inputRef }) {
        const scrollRef = useRef(null);
        useEffect(() => {
          if (scrollRef.current) {
            scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
          }
        }, [sim.term.length]);

        return (
          <div className="flex min-h-[22rem] flex-1 flex-col overflow-hidden rounded-lg border border-slate-300 bg-slate-50 lg:min-h-0 dark:border-slate-700 dark:bg-slate-950">
            <div className="border-b border-slate-200 bg-slate-100 px-3 py-2 text-xs font-bold uppercase tracking-wide text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
              {sim.controlOpen
                ? "FTP client — control connection to " + IP + ":21"
                : "Local terminal"}
            </div>
            <div
              ref={scrollRef}
              role="log"
              aria-live="polite"
              aria-label="Terminal output"
              className="mono min-h-0 flex-1 overflow-auto px-3 py-2 text-xs leading-relaxed"
            >
              {sim.term.map((line, index) => (
                <div
                  key={index}
                  className={"wire-text " + (TERM_LINE_CLASS[line.type] || TERM_LINE_CLASS.info)}
                >
                  <span aria-hidden="true">{TERM_LINE_PREFIX[line.type] || "  "}</span>
                  {line.text}
                </div>
              ))}
            </div>
            <form
              onSubmit={onSubmit}
              className="border-t border-slate-200 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"
            >
              <label
                htmlFor="terminal-input"
                className="block text-xs font-bold text-slate-600 dark:text-slate-300"
              >
                Command
              </label>
              <div className="mt-1 flex items-center gap-2">
                <span
                  aria-hidden="true"
                  className="mono shrink-0 font-bold text-indigo-700 dark:text-indigo-300"
                >
                  $
                </span>
                <input
                  id="terminal-input"
                  ref={inputRef}
                  type="text"
                  autoComplete="off"
                  spellCheck="false"
                  value={draft}
                  onChange={(event) => setDraft(event.target.value)}
                  onKeyDown={(event) => {
                    if (event.key === "ArrowUp") {
                      event.preventDefault();
                      onHistory("up");
                    } else if (event.key === "ArrowDown") {
                      event.preventDefault();
                      onHistory("down");
                    } else if (event.key === "Enter") {
                      event.preventDefault();
                      onSubmit(event);
                    }
                  }}
                  className="mono min-w-0 flex-1 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
                />
                <button
                  type="submit"
                  className="shrink-0 whitespace-nowrap rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-bold text-white hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
                >
                  Enter
                </button>
              </div>
            </form>
          </div>
        );
      }

      function LocalPanel({ sim, filePick, onFilePick }) {
        const pickable = filePick && filePick.side === "local";
        return (
          <section

            className="shrink-0 overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-900"

              <h3
                id="local-heading"
                className="text-xs font-bold uppercase tracking-wide text-slate-600 dark:text-slate-300"
              >
                Local site — files on this computer
              </h3>
            </div>
            <div className="px-3 py-2">
              {pickable && (
                <p className="mb-1 rounded border border-indigo-300 bg-indigo-50 px-2 py-1 text-[11px] font-bold text-indigo-900 dark:border-indigo-700 dark:bg-indigo-950 dark:text-indigo-100">
                  {filePick.prompt}
                </p>
              )}
              <ul className="mono space-y-0.5 text-xs">
                {sim.localFiles.map((file) => (
                  <li key={file.name}>
                    {pickable ? (
                      <button

                        onClick={() => onFilePick(file.name)}
                        className="w-full rounded border border-indigo-400 px-1.5 py-0.5 text-left font-bold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-indigo-500 dark:text-indigo-300 dark:hover:bg-indigo-950"

                        <span className="ml-2 font-normal text-slate-500 dark:text-slate-400">

                    ) : (
                      <span className="text-slate-800 dark:text-slate-200">
                        {file.name}
                        <span className="ml-2 text-slate-500 dark:text-slate-400">
                          {file.size} · {file.type} · {file.modified}
                        </span>
                      </span>

                  </li>

              </ul>
            </div>
          </section>

      // The two-connection model is the thing students most often miss, so
      // it gets its own strip rather than being buried in the log.
      function ConnectionStrip({ sim, typePick, onTypePick }) {
        return (
          <section
            aria-labelledby="conn-heading"
            className="shrink-0 overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-900"
          >
            <div className="border-b border-slate-200 bg-slate-100 px-3 py-1.5 dark:border-slate-700 dark:bg-slate-800">
              <h3
                id="conn-heading"
                className="text-xs font-bold uppercase tracking-wide text-slate-600 dark:text-slate-300"
              >
                FTP uses two connections
              </h3>
            </div>
            <div className="space-y-1 px-3 py-2 text-[11px]">
              <p className="flex flex-wrap items-center gap-2">
                <span className="mono font-bold text-slate-800 dark:text-slate-100">
                  Control connection · port 21
                </span>
                <span
                  className={
                    sim.controlOpen
                      ? "rounded bg-emerald-200 px-1.5 py-0.5 font-bold text-emerald-900 dark:bg-emerald-800 dark:text-emerald-50"
                      : "rounded bg-slate-200 px-1.5 py-0.5 font-bold text-slate-700 dark:bg-slate-700 dark:text-slate-100"
                  }
                >
                  {sim.controlOpen ? "OPEN for the whole session" : "closed"}
                </span>
              </p>
              <p className="flex flex-wrap items-center gap-2">
                <span className="mono font-bold text-slate-800 dark:text-slate-100">
                  Data connection · port 20
                </span>
                <span
                  className={
                    sim.lastTransfer
                      ? "rounded bg-amber-200 px-1.5 py-0.5 font-bold text-amber-950 dark:bg-amber-700 dark:text-amber-50"
                      : "rounded bg-slate-200 px-1.5 py-0.5 font-bold text-slate-700 dark:bg-slate-700 dark:text-slate-100"
                  }
                >
                  {sim.lastTransfer
                    ? "opened and closed again for " + sim.lastTransfer
                    : "closed — opens only for a transfer"}
                </span>
              </p>
              <p className="text-slate-500 dark:text-slate-400">
                Commands and replies travel on the control connection; file
                contents and directory listings travel on a data connection that
                is created for one transfer and then closed.
              </p>
              {sim.chosenType && (
                <p className="mono text-slate-700 dark:text-slate-200">
                  Transfer type: TYPE {sim.chosenType} (
                  {sim.chosenType === "A" ? "ASCII — text" : "image — binary"})
                </p>
              )}
              {typePick && (
                <div className="rounded-md border border-indigo-300 bg-indigo-50 p-2 dark:border-indigo-700 dark:bg-indigo-950">
                  <p className="font-bold text-indigo-900 dark:text-indigo-100">
                    {typePick.prompt}
                  </p>
                  <div className="mt-1 flex flex-wrap gap-2">
                    {typePick.options.map((option) => (
                      <button
                        key={option.id}
                        type="button"
                        onClick={() => onTypePick(option.id)}
                        className="shrink-0 whitespace-nowrap rounded-md border border-indigo-500 bg-white px-2 py-1 text-[11px] font-bold text-indigo-700 hover:bg-indigo-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:bg-slate-900 dark:text-indigo-300 dark:hover:bg-indigo-900"
                      >
                        {option.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </section>
        );
      }

      function ServerPane({ sim, dirPick, onDirPick, filePick, onFilePick, classify, onClassify }) {
        const pickable = filePick && filePick.side === "remote";
        return (
          <section
            aria-labelledby="server-heading"
            className="flex min-h-[16rem] flex-1 flex-col overflow-hidden rounded-lg border border-slate-300 bg-white lg:min-h-0 dark:border-slate-700 dark:bg-slate-900"
          >
            <div className="border-b border-slate-200 bg-slate-100 px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
              <h2
                id="server-heading"
                className="text-xs font-bold uppercase tracking-wide text-slate-600 dark:text-slate-300"
              >
                FTP server — {HOST} ({IP})
              </h2>
            </div>
            <div className="min-h-0 flex-1 space-y-2 overflow-auto p-3">
              {(dirPick || pickable) && (
                <p className="rounded-md border border-indigo-300 bg-indigo-50 px-2 py-1 text-xs font-bold text-indigo-900 dark:border-indigo-700 dark:bg-indigo-950 dark:text-indigo-100">
                  {(dirPick || filePick).prompt}
                </p>
              )}
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Access shown for the current session
                {sim.loggedIn ? " (logged in as " + sim.loggedIn + ")" : " (not logged in)"}.
              </p>
              {DIRECTORIES.map((directory) => {
                const files = sim.remoteFiles.filter((file) => file.dir === directory.path);

                return (
                  <div
                    key={directory.path}
                    className={
                      "rounded-md border p-2 " +
                      (sim.cwd === directory.path
                        ? "border-indigo-400 bg-indigo-50 dark:border-indigo-500 dark:bg-indigo-950/50"
                        : "border-slate-200 dark:border-slate-700")
                    }
                  >
                    <div className="flex flex-wrap items-center gap-2">
                      {dirPick ? (
                        <button
                          type="button"
                          onClick={() => onDirPick(directory.path)}
                          className="mono rounded border border-indigo-400 px-1.5 py-0.5 text-xs font-bold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-indigo-500 dark:text-indigo-300 dark:hover:bg-indigo-950"
                        >
                          {directory.path}
                        </button>
                      ) : (
                        <span className="mono text-xs font-bold text-slate-800 dark:text-slate-100">
                          {directory.path}
                        </span>
                      )}
                      <span
                        className={
                          "rounded px-1.5 py-0.5 text-[10px] font-bold " + ACCESS_CLASS[access]

                        {ACCESS_LABEL[access]}

                    <p className="text-[11px] text-slate-500 dark:text-slate-400">
                      {directory.note}

                    {files.length > 0 && (
                      <ul className="mono mt-1 space-y-0.5 text-[11px]">

                          <li key={file.name}>

                              <button
                                type="button"
                                onClick={() => onFilePick(file.name)}
                                className="w-full rounded border border-indigo-400 px-1.5 py-0.5 text-left font-bold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-indigo-500 dark:text-indigo-300 dark:hover:bg-indigo-950"
                              >
                                {file.name}
                                <span className="ml-2 font-normal text-slate-500 dark:text-slate-400">

                                {file.name}
                                <span className="ml-2 text-slate-500 dark:text-slate-400">
                                  {file.size} · {file.type} · {file.modified}
                                </span>
                              </span>
                            )}
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                );
              })}
              {classify && (
                <div className="rounded-md border border-indigo-300 bg-indigo-50 p-2 dark:border-indigo-700 dark:bg-indigo-950">
                  <p className="text-xs font-bold text-indigo-900 dark:text-indigo-100">
                    {classify.prompt}
                  </p>
                  <div className="mt-2 flex flex-wrap gap-2">
                    {classify.options.map((option) => (
                      <button
                        key={option.id}
                        type="button"
                        onClick={() => onClassify(option.id)}
                        className="shrink-0 whitespace-nowrap rounded-md border border-indigo-500 bg-white px-3 py-1.5 text-xs font-bold text-indigo-700 hover:bg-indigo-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:bg-slate-900 dark:text-indigo-300 dark:hover:bg-indigo-900"
                      >
                        {option.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </section>
        );
      }

      function WirePane({ sim }) {
        const scrollRef = useRef(null);
        useEffect(() => {
          if (scrollRef.current) {
            scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
          }
        }, [sim.wire.length]);

        return (
          <section
            aria-labelledby="wire-heading"
            className="flex min-h-[12rem] flex-1 flex-col overflow-hidden rounded-lg border border-slate-300 bg-white lg:min-h-0 dark:border-slate-700 dark:bg-slate-900"
          >
            <div className="border-b border-slate-200 bg-slate-100 px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
              <h2
                id="wire-heading"
                className="text-xs font-bold uppercase tracking-wide text-slate-600 dark:text-slate-300"
              >
                On the wire — every line sent in clear text
              </h2>
            </div>
            <div
              ref={scrollRef}
              aria-live="polite"
              className="min-h-0 flex-1 space-y-1 overflow-auto p-3"
            >
              {sim.wire.length === 0 && (
                <p className="text-sm text-slate-500 dark:text-slate-400">
                  Nothing has been sent yet.
                </p>
              )}
              {sim.wire.map((entry, index) => (
                <div
                  key={index}
                  className="wire-enter rounded-md border border-slate-200 bg-slate-50 px-2 py-1 dark:border-slate-700 dark:bg-slate-950"
                >
                  <div className="flex flex-wrap items-center gap-1.5 text-[10px] font-bold">
                    <span className="rounded bg-slate-700 px-1.5 py-0.5 text-white dark:bg-slate-600">
                      {entry.from} &rarr; {entry.to}
                    </span>
                    <span
                      className={
                        entry.channel === "data"
                          ? "rounded bg-amber-200 px-1.5 py-0.5 text-amber-950 dark:bg-amber-700 dark:text-amber-50"

                      {entry.channel} connection · port {entry.port}

                  </div>
                  <pre className="mono wire-text mt-0.5 text-[11px] text-slate-800 dark:text-slate-200">
                    {entry.text}
                  </pre>
                </div>

            </div>
          </section>
