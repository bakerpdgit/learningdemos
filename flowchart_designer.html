      /* ---------------------------------------------------------------
         Run panel
         --------------------------------------------------------------- */
      function RunPanel({ runner, doc, autoRun, speed, onSpeed, onStep, onRun, onPause, onRestart, onStop, onInput, onEditError, limitNotice }) {
        const state = runner.state;
        const [inputValue, setInputValue] = useState("");
        const inputRef = useRef(null);
        const outputRef = useRef(null);
        const traceRef = useRef(null);

        useEffect(() => {
          if (state.status === "input" && inputRef.current) inputRef.current.focus();
        }, [state.status, state.steps, state.pendingInput]);
        useEffect(() => {
          if (outputRef.current) outputRef.current.scrollTop = outputRef.current.scrollHeight;
          if (traceRef.current) traceRef.current.scrollTop = traceRef.current.scrollHeight;
        });

        const here = state.status === "ready" || state.status === "input" ? runner.currentNode() : null;
        const finished = state.status === "done" || state.status === "error";
        const columns = useMemo(() => {
          const keys = [];
          state.trace.forEach((row) => row.changes.forEach((change) => {
            if (!keys.includes(change.key)) keys.push(change.key);
          }));
          return keys;
        }, [state.trace.length]);
        const hasOutput = state.trace.some((row) => row.output !== null);

        function submit(event) {
          event.preventDefault();
          onInput(inputValue);
          setInputValue("");
        }

        return (
          <div className="flex min-h-0 flex-col gap-3">
            <section aria-label="Run controls" className={cardClass + " flex flex-col gap-2"}>
              <div className="flex flex-wrap items-center gap-2">
                <button type="button" className={smallButton} onClick={onRestart}>
                  ⟲ Restart
                </button>
                <button type="button" className={smallButton} onClick={onStep} disabled={autoRun || state.status !== "ready"}>
                  Step ▶|
                </button>
                {autoRun ? (
                  <button type="button" className={primaryButton} onClick={onPause}>
                    ❚❚ Pause
                  </button>
                ) : (
                  <button type="button" className={primaryButton} onClick={onRun} disabled={finished}>
                    ▶ Run
                  </button>
                )}
              </div>
              <div className="flex flex-wrap items-center justify-between gap-2">
                <label className="flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-200">
                  Speed
                  <select
                    value={speed}
                    onChange={(event) => onSpeed(Number(event.target.value))}
                    className="rounded-md border border-slate-300 bg-white px-2 py-1 text-sm font-normal text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
                  >
                    {SPEEDS.map((item, index) => (
                      <option key={item.label} value={index}>
                        {item.label}
                      </option>
                    ))}
                  </select>
                </label>
                <button type="button" className={smallButton} onClick={onStop}>
                  ✎ Back to Design
                </button>
              </div>
            </section>

            <section aria-label="Run status" aria-live="polite" className={cardClass + " flex flex-col gap-2 text-sm"}>
              {state.status === "error" ? (
                <div className="rounded-md border border-red-300 bg-red-50 p-2 text-red-900 dark:border-red-800 dark:bg-red-950/60 dark:text-red-100">
                  <p className="font-bold">Run-time error</p>
                  <p>{state.error.message}</p>
                  {state.error.hint && <p className="mt-1 text-xs">{state.error.hint}</p>}
                  <button type="button" className={smallButton + " mt-2 bg-white dark:bg-slate-900"} onClick={onEditError}>
                    Edit this block
                  </button>
                </div>
              ) : state.status === "done" ? (
                <p className="font-semibold text-emerald-800 dark:text-emerald-300">✓ Finished: reached END after {state.steps} step{state.steps === 1 ? "" : "s"}.</p>
              ) : state.status === "input" ? (
                <form onSubmit={submit} className="flex flex-col gap-1.5">
                  <label htmlFor="fc-run-input" className="font-semibold">
                    INPUT <span className="fc-mono">{state.pendingInput.name}</span>: type a value and press Enter
                  </label>
                  <div className="flex gap-2">
                    <input
                      id="fc-run-input"
                      ref={inputRef}
                      type="text"
                      value={inputValue}
                      onChange={(event) => setInputValue(event.target.value)}
                      autoComplete="off"
                      autoCapitalize="off"
                      autoCorrect="off"
                      spellCheck={false}
                      className={fieldClass}
                    />
                    <button type="submit" className={primaryButton}>
                      Enter
                    </button>
                  </div>
                  <p className="text-xs text-slate-600 dark:text-slate-400">Whole numbers become INT, decimals REAL, anything else STRING.</p>
                </form>
              ) : (
                <p>
                  <span className="font-semibold">Next block: </span>
                  <span className="fc-mono">{here ? FlowLang.nodeSummary(here.node, doc) : ""}</span>
                  {here && here.tab.kind === "sub" && <span> (in {here.tab.name})</span>}
                </p>
              )}
              {state.lastEvent && state.status !== "input" && (
                <p className="text-slate-600 dark:text-slate-400">
                  <span className="font-semibold">Last step: </span>
                  <span className="fc-mono">{state.lastEvent}</span>
                </p>
              )}
              {limitNotice && (
                <p className="rounded-md border border-amber-300 bg-amber-50 p-2 text-amber-900 dark:border-amber-700 dark:bg-amber-950/50 dark:text-amber-100">
                  Paused after {STEP_LIMIT.toLocaleString()} steps. The flowchart may be stuck in an infinite loop. Press Run to carry on.
                </p>
              )}
            </section>

            <section aria-labelledby="fc-output-title" className={cardClass}>
              <h2 id="fc-output-title" className="mb-1 text-sm font-bold">
                Output
              </h2>
              <div
                ref={outputRef}
                className="fc-mono max-h-40 min-h-[3.5rem] overflow-y-auto rounded-md border border-slate-200 bg-slate-50 p-2 text-sm dark:border-slate-700 dark:bg-slate-950"
              >
                {state.output.length === 0 ? (
                  <p className="text-slate-500 dark:text-slate-400">Nothing output yet.</p>
                ) : (
                  state.output.map((line, index) =>
                    line.kind === "input" ? (
                      <p key={index} className="whitespace-pre-wrap break-words text-indigo-700 dark:text-indigo-300">
                        <span aria-hidden="true">&gt; </span>
                        <span className="sr-only">You entered </span>
                        {line.text}
                      </p>
                    ) : (
                      <p key={index} className="whitespace-pre-wrap break-words">
                        {line.text}
                      </p>
                    ),
                  )
                )}
              </div>
            </section>

            <section aria-labelledby="fc-vars-title" className={cardClass}>
              <h2 id="fc-vars-title" className="mb-1 text-sm font-bold">
                Variables
              </h2>
              <div className="flex flex-col gap-2">
                {state.frames
                  .slice()
                  .reverse()
                  .map((frame, index) => {
                    const tab = doc.tabs.find((item) => item.id === frame.tabId);
                    const name = tab.kind === "main" ? "Main" : tab.name;
                    const entries = Array.from(frame.vars.entries());
                    return (
                      <div key={index}>
                        <p className="text-xs font-semibold text-slate-600 dark:text-slate-400">
                          {name}
                          {state.frames.length > 1 && index === 0 ? " (running)" : ""}
                          {index > 0 ? " (waiting for the call to return)" : ""}
                        </p>
                        {entries.length === 0 ? (
                          <p className="text-sm text-slate-500 dark:text-slate-400">No variables yet.</p>
                        ) : (
                          <table className="w-full text-sm">
                            <thead>
                              <tr className="text-left text-xs text-slate-600 dark:text-slate-400">
                                <th scope="col" className="py-0.5 pr-2 font-semibold">Name</th>
                                <th scope="col" className="py-0.5 pr-2 font-semibold">Type</th>
                                <th scope="col" className="py-0.5 font-semibold">Value</th>
                              </tr>
                            </thead>
                            <tbody>
                              {entries.map(([key, value]) => (
                                <tr key={key} className="border-t border-slate-200 dark:border-slate-700">
                                  <td className="fc-mono py-0.5 pr-2">{key}</td>
                                  <td className="py-0.5 pr-2 text-xs font-semibold text-slate-600 dark:text-slate-400">{value.type}</td>
                                  <td className="fc-mono break-all py-0.5">{FlowLang.formatValue(value)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                      </div>
                    );
                  })}
              </div>
            </section>

            <section aria-labelledby="fc-trace-title" className={cardClass + " flex min-h-0 flex-col"}>
              <h2 id="fc-trace-title" className="mb-1 text-sm font-bold">
                Trace table
              </h2>
              {state.trace.length === 0 ? (
                <p className="text-sm text-slate-500 dark:text-slate-400">A row is added each time a variable changes or something is output.</p>
              ) : (
                <div ref={traceRef} className="max-h-72 overflow-auto rounded-md border border-slate-200 dark:border-slate-700">
                  <table className="fc-mono w-full border-collapse text-xs">
                    <thead className="sticky top-0 bg-slate-100 dark:bg-slate-800">
                      <tr>
                        <th scope="col" className="border-b border-slate-300 px-1.5 py-1 text-left font-sans font-semibold dark:border-slate-600">Step</th>
                        {columns.map((key) => (
                          <th key={key} scope="col" className="border-b border-slate-300 px-1.5 py-1 text-left font-semibold dark:border-slate-600">
                            {key}
                          </th>
                        ))}
                        {hasOutput && <th scope="col" className="border-b border-slate-300 px-1.5 py-1 text-left font-sans font-semibold dark:border-slate-600">Output</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {state.trace.slice(-400).map((row, index) => (
                        <tr key={index} className="border-b border-slate-200 dark:border-slate-700" title={row.label}>
                          <td className="px-1.5 py-0.5 text-slate-500 dark:text-slate-400">{row.step}</td>
                          {columns.map((key) => {
                            const change = row.changes.find((item) => item.key === key);
                            return (
                              <td key={key} className="whitespace-nowrap px-1.5 py-0.5">
                                {change ? change.display : ""}
                              </td>
                            );
                          })}
                          {hasOutput && <td className="whitespace-pre px-1.5 py-0.5">{row.output !== null ? row.output : ""}</td>}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </section>
          </div>
        );
      }

      /* ---------------------------------------------------------------
         Zoom percentage: shows the current zoom and accepts a typed value.
         --------------------------------------------------------------- */
      function ZoomField({ zoom, onZoom }) {
        const shown = String(Math.round(zoom * 100));
        const [draft, setDraft] = useState(null);
        const justFocused = useRef(false);
        const apply = () => {
          if (draft === null) return;
          const percent = parseFloat(draft);
          setDraft(null);
          if (Number.isFinite(percent)) onZoom(clamp(percent, MIN_ZOOM * 100, MAX_ZOOM * 100) / 100);
        };
        return (
          <label className="flex items-center rounded-md border border-slate-300 px-1 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/40 dark:border-slate-600">
            <span className="sr-only">Zoom percentage</span>
            <input
              type="text"
              inputMode="numeric"
              value={draft === null ? shown : draft}
              // Select the whole value at once so typing replaces it; the
              // mouseup that follows a click would otherwise drop the selection.
              onFocus={(event) => {
                setDraft(shown);
                event.target.select();
                justFocused.current = true;
              }}
              onMouseUp={(event) => {
                if (justFocused.current) event.preventDefault();
                justFocused.current = false;
              }}
              onChange={(event) => setDraft(event.target.value.replace(/[^0-9.]/g, "").slice(0, 5))}
              onBlur={apply}
              onKeyDown={(event) => {
                if (event.key === "Enter") {
                  event.preventDefault();
                  apply();
                  event.target.blur();
                } else if (event.key === "Escape") {
                  event.preventDefault();
                  setDraft(null);
                  requestAnimationFrame(() => event.target.blur());
                }
              }}
              title={`Type a zoom between ${MIN_ZOOM * 100}% and ${MAX_ZOOM * 100}%`}
              className="w-9 bg-transparent py-1 text-right text-xs font-semibold tabular-nums text-slate-700 focus:outline-none dark:text-slate-200"
            />
            <span aria-hidden="true" className="text-xs font-semibold text-slate-600 dark:text-slate-300">
              %
            </span>
          </label>
        );
      }

      /* ---------------------------------------------------------------
         Grip between the canvas and the side panel. Drag it, or focus it
         and use the arrow keys; double-click restores the default width.
         --------------------------------------------------------------- */
      const SIDE_WIDTH_KEY = "flowchart-designer-panel-width";
      const SIDE_MIN = 280;

      function sideMax(container) {
        const width = container ? container.clientWidth : window.innerWidth;
        return Math.max(SIDE_MIN, Math.min(760, Math.round(width * 0.55)));
      }

      function SideResizer({ width, onResize, containerRef, asideRef }) {
        const [dragging, setDragging] = useState(false);
        const current = width || (asideRef.current ? Math.round(asideRef.current.getBoundingClientRect().width) : 352);
        const max = sideMax(containerRef.current);
        const set = (value) => onResize(clamp(Math.round(value), SIDE_MIN, sideMax(containerRef.current)));

        function onPointerDown(event) {
          if (event.button !== 0) return;
          event.preventDefault();
          event.currentTarget.setPointerCapture(event.pointerId);
          setDragging(true);
        }
        function onPointerMove(event) {
          if (!dragging || !asideRef.current) return;
          const right = asideRef.current.getBoundingClientRect().right;
          set(right - event.clientX - 6);
        }
        function onPointerUp(event) {
          if (event.currentTarget.hasPointerCapture(event.pointerId)) event.currentTarget.releasePointerCapture(event.pointerId);
          setDragging(false);
        }
        function onKeyDown(event) {
          const step = event.shiftKey ? 64 : 16;
          if (event.key === "ArrowLeft") set(current + step);
          else if (event.key === "ArrowRight") set(current - step);
          else if (event.key === "Home") set(max);
          else if (event.key === "End") set(SIDE_MIN);
          else return;
          event.preventDefault();
        }

        return (
          <div
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize the side panel"
            aria-valuemin={SIDE_MIN}
            aria-valuemax={max}
            aria-valuenow={current}
            tabIndex={0}
            title="Drag to resize the side panel (double-click to reset)"
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerCancel={() => setDragging(false)}
            onDoubleClick={() => onResize(null)}
            onKeyDown={onKeyDown}
            className="fc-resizer group hidden cursor-col-resize touch-none items-center justify-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 lg:flex"
          >
            <span
              aria-hidden="true"
              className={
                "h-12 w-1.5 rounded-full transition-colors " +
                (dragging ? "bg-indigo-500" : "bg-slate-300 group-hover:bg-indigo-400 dark:bg-slate-600 dark:group-hover:bg-indigo-400")
              }
            ></span>
          </div>
        );
      }

      /* ---------------------------------------------------------------
         Image export: the current tab as a PNG with light colours.
         --------------------------------------------------------------- */
      async function exportPng(svgElement, tab, layouts, filename) {
        const bounds = contentBounds(tab, layouts);
        const pad = 50;
        const width = Math.ceil(bounds.right - bounds.left + pad * 2);
        const height = Math.ceil(bounds.bottom - bounds.top + pad * 2);
        const content = svgElement.querySelector("[data-content]").cloneNode(true);
        content.querySelectorAll("[data-export-skip], title").forEach((element) => element.remove());
        content.setAttribute("transform", `translate(${pad - bounds.left} ${pad - bounds.top})`);
        const markup =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">` +
          "<style>svg{--fc-bg:#ffffff;--fc-stroke:#1e293b;--fc-text:#0f172a;--fc-muted:#64748b;--fc-edge:#334155;--fc-select:#1e293b;--fc-current:#334155;--fc-current-glow:transparent;--fc-error:#1e293b;--fc-true:#047857;--fc-false:#b91c1c}" +
          ".fc-label{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style>" +
          `<rect width="${width}" height="${height}" fill="#ffffff"/>` +
          new XMLSerializer().serializeToString(content) +
          "</svg>";
        const image = new Image();
        const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml" }));
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext("2d");
        context.scale(scale, scale);
        context.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        await new Promise((resolve) => canvas.toBlob((blob) => {
          if (blob) downloadBlob(blob, filename);
          resolve();
        }, "image/png"));
      }

      /* ---------------------------------------------------------------
         App
         --------------------------------------------------------------- */
      function App() {
        const [doc, setDocState] = useState(loadInitialDoc);
        const docRef = useRef(doc);
        const undoRef = useRef([]);
        const redoRef = useRef([]);
        const [, setHistoryVersion] = useState(0);
        const [activeTabId, setActiveTabId] = useState(() => doc.tabs[0].id);
        const [selection, setSelection] = useState(null);
        const [views, setViews] = useState({});
        const [mode, setMode] = useState("design");
        const [notice, setNotice] = useState(null);
        const [editKey, setEditKey] = useState(null);
        const [problemsFlash, setProblemsFlash] = useState(0);
        const [chosenPort, setChosenPort] = useState(null);
        const [editing, setEditing] = useState(null);
        const [sideWidth, setSideWidth] = useState(() => {
          try {
            const saved = Number(localStorage.getItem(SIDE_WIDTH_KEY));
            return saved >= SIDE_MIN ? saved : null;
          } catch (error) {
            return null;
          }
        });
        const mainRef = useRef(null);
        const asideRef = useRef(null);
        useEffect(() => {
          try {
            if (sideWidth) localStorage.setItem(SIDE_WIDTH_KEY, String(sideWidth));
            else localStorage.removeItem(SIDE_WIDTH_KEY);
          } catch (error) {
            // Remembering the width is only a convenience.
          }
        }, [sideWidth]);
        const selectedId = selection && selection.kind === "node" ? selection.id : null;
        useEffect(() => {
          if (chosenPort && chosenPort.nodeId !== selectedId) setChosenPort(null);
        }, [selectedId]);
        const [ghost, setGhost] = useState(null);
        const [autoRun, setAutoRun] = useState(false);
        const [speed, setSpeed] = useState(2);
        const [runVersion, setRunVersion] = useState(0);
        const [limitNotice, setLimitNotice] = useState(false);
        const runnerRef = useRef(null);
        const runStepsRef = useRef(0);
        const canvasRef = useRef(null);
        const fileRef = useRef(null);
        const dragSnapshotRef = useRef(null);
        const fieldRef = useRef({ element: null, apply: null, snapshot: null });

        const tab = doc.tabs.find((item) => item.id === activeTabId) || doc.tabs[0];
        const key = logicKey(doc);
        const validation = useMemo(() => FlowLang.validateDoc(docRef.current), [key]);
        const editingId = editing ? editing.nodeId : null;
        const layouts = useMemo(() => computeLayouts(tab, doc, editingId), [tab, doc.tabs, editingId]);
        const routes = useMemo(() => routeEdges(tab, layouts), [tab, layouts]);
        const variables = useMemo(() => FlowLang.variablesInTab(tab, doc), [tab]);
        const problemNodes = useMemo(() => {
          const map = new Map();
          validation.problems.forEach((problem) => {
            if (problem.tabId !== tab.id) return;
            (problem.nodeIds || (problem.nodeId ? [problem.nodeId] : [])).forEach((id) => {
              if (map.get(id) !== "error") map.set(id, problem.severity);
            });
          });
          return map;
        }, [validation, tab.id]);

        /* ----- document history ----- */
        const setDoc = useCallback((next) => {
          docRef.current = next;
          setDocState(next);
        }, []);

        const remember = useCallback((snapshot) => {
          undoRef.current.push(snapshot);
          if (undoRef.current.length > 150) undoRef.current.shift();
          redoRef.current = [];
          setHistoryVersion((value) => value + 1);
        }, []);

        const commit = useCallback((update) => {
          const previous = docRef.current;
          const next = update(previous);
          if (!next || next === previous) return previous;
          remember(previous);
          setDoc(next);
          return next;
        }, [remember, setDoc]);

        const live = useCallback((update) => {
          const next = update(docRef.current);
          if (next && next !== docRef.current) setDoc(next);
        }, [setDoc]);

        function restore(target) {
          setDoc(target);
          if (!target.tabs.some((item) => item.id === activeTabId)) setActiveTabId(target.tabs[0].id);
          setSelection(null);
          setHistoryVersion((value) => value + 1);
        }

        function undo() {
          if (!undoRef.current.length || mode !== "design") return;
          redoRef.current.push(docRef.current);
          restore(undoRef.current.pop());
        }

        function redo() {
          if (!redoRef.current.length || mode !== "design") return;
          undoRef.current.push(docRef.current);
          restore(redoRef.current.pop());
        }

        // Typing in a field updates the flowchart live; one undo step is
        // recorded per field visit.
        const fieldApi = useMemo(() => ({
          caret(nodeId, position) {
            setEditing((current) => {
              if (!nodeId) return null;
              if (current && current.nodeId === nodeId && current.caret === position) return current;
              return { nodeId, caret: position };
            });
          },
          focus(element, apply) {
            fieldRef.current = { element, apply, snapshot: docRef.current };
          },
          blur() {
            const { snapshot } = fieldRef.current;
            if (snapshot && snapshot !== docRef.current) remember(snapshot);
            fieldRef.current = { ...fieldRef.current, snapshot: null };
          },
          insert(text) {
            const { element, apply } = fieldRef.current;
            if (!element || !apply || !element.isConnected) return;
            if (document.activeElement !== element) remember(docRef.current);
            const start = element.selectionStart ?? element.value.length;
            const end = element.selectionEnd ?? element.value.length;
            const value = element.value.slice(0, start) + text + element.value.slice(end);
            apply(value);
            requestAnimationFrame(() => {
              element.focus();
              element.setSelectionRange(start + text.length, start + text.length);
            });
          },
        }), [remember]);

        useEffect(() => {
          const timer = setTimeout(() => {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(doc));
            } catch (error) {
              // Saving is a convenience; the designer still works without it.
            }
          }, 400);
          return () => clearTimeout(timer);
        }, [doc]);

        useEffect(() => {
          if (!notice) return undefined;
          const timer = setTimeout(() => setNotice(null), notice.tone === "error" ? 7000 : 4500);
          return () => clearTimeout(timer);
        }, [notice]);

        /* ----- editing actions ----- */
        const showTab = useCallback((tabId) => {
          setActiveTabId(tabId);
          setSelection(null);
        }, []);

        function requestEdit(nodeId) {
          setSelection({ kind: "node", id: nodeId });
          setEditKey((current) => ({ nodeId, count: (current ? current.count : 0) + 1 }));
        }

        function placeNewBlock(type, worldPoint) {
          const current = docRef.current;
          const currentTab = current.tabs.find((item) => item.id === tab.id);
          const node = makeNode(type, 0, 0);
          const newLayout = blockLayout(node, currentTab, current);
          let nodes = currentTab.nodes.slice();
          let edges = currentTab.edges.slice();

          if (worldPoint) {
            node.x = snap(worldPoint.x);
            node.y = snap(worldPoint.y);
          } else {
            const selected = selection && selection.kind === "node" ? nodes.find((item) => item.id === selection.id) : null;
            const ports = selected ? FlowLang.OUTPUT_PORTS[selected.type] : [];
            if (!selected || !ports.length) {
              const centre = canvasRef.current ? canvasRef.current.centre() : { x: 300, y: 200 };
              const base = selected ? { x: selected.x, y: selected.y + layouts.get(selected.id).h / 2 + 50 + newLayout.h / 2 } : centre;
              node.x = snap(base.x);
              node.y = snap(base.y);
            } else {
              const selectedLayout = layouts.get(selected.id);
              const port = insertPortFor(selected, chosenPort);
              const side = portSide(selected, port);
              const existing = edges.find((edge) => edge.from === selected.id && edge.port === port);
              if (side === "bottom") {
                node.x = selected.x;
                node.y = snap(selected.y + selectedLayout.h / 2 + 44 + newLayout.h / 2);
                if (existing) {
                  // Make room: everything below moves down by the new block's height.
                  const shift = snap(newLayout.h + 44);
                  nodes = nodes.map((item) => (item.y > selected.y && item.id !== selected.id ? { ...item, y: item.y + shift } : item));
                }
              } else {
                const direction = side === "right" ? 1 : -1;
                node.x = snap(selected.x + direction * (selectedLayout.w / 2 + 60 + newLayout.w / 2));
                node.y = snap(selected.y + selectedLayout.h / 2 + 30 + newLayout.h / 2);
              }
              edges = edges.filter((edge) => edge !== existing);
              edges.push({ id: newId("e"), from: selected.id, port, to: node.id });
              if (existing && FlowLang.OUTPUT_PORTS[type].length) {
                const outPort = type === "decision" ? "true" : "next";
                edges.push({ id: newId("e"), from: node.id, port: outPort, to: existing.to });
              }
            }
          }
          nodes.push(node);
          commit((value) => mapTab(value, tab.id, (item) => ({ ...item, nodes, edges })));
          if (type === "call" && !current.tabs.some((item) => item.kind === "sub")) {
            setNotice({ tone: "info", text: "Create a subprogram for this block to call." });
          }
          requestEdit(node.id);
        }

        function deleteSelection() {
          if (!selection || mode !== "design") return;
          if (selection.kind === "edge") {
            commit((value) => mapTab(value, tab.id, (item) => ({ ...item, edges: item.edges.filter((edge) => edge.id !== selection.id) })));
            setSelection(null);
            return;
          }
          const node = tab.nodes.find((item) => item.id === selection.id);
          if (!node) return;
          if (node.type === "start") {
            setNotice({ tone: "info", text: "START can't be deleted: every flowchart needs one." });
            return;
          }
          commit((value) => mapTab(value, tab.id, (item) => {
            const out = item.edges.filter((edge) => edge.from === node.id);
            // A block with a single exit is removed from the middle of a
            // sequence, so the blocks either side stay connected.
            const successor = out.length === 1 && out[0].port === "next" ? out[0].to : null;
            const edges = [];
            item.edges.forEach((edge) => {
              if (edge.from === node.id) return;
              if (edge.to === node.id) {
                if (successor && successor !== edge.from) edges.push({ ...edge, to: successor });
                return;
              }
              edges.push(edge);
            });
            return { ...item, nodes: item.nodes.filter((other) => other.id !== node.id), edges };
          }));
          setSelection(null);
        }

        // The connectors stay where they are; only which exit is True and
        // which is False changes.
        function swapDecisionLabels(nodeId) {
          const flip = { true: "false", false: "true" };
          commit((value) => mapTab(value, tab.id, (item) => ({
            ...item,
            nodes: item.nodes.map((node) => (node.id === nodeId ? { ...node, trueSide: portSide(node, "false"), falseSide: portSide(node, "true") } : node)),
            edges: item.edges.map((edge) => (edge.from === nodeId && flip[edge.port] ? { ...edge, port: flip[edge.port] } : edge)),
          })));
          if (chosenPort && chosenPort.nodeId === nodeId) setChosenPort({ nodeId, port: flip[chosenPort.port] });
        }

        function connectBlocks(fromId, port, toId) {
          if (fromId === toId) return;
          commit((value) => mapTab(value, tab.id, (item) => {
            const target = item.nodes.find((other) => other.id === toId);
            if (!target || target.type === "start") return item;
            const kept = item.edges.filter((edge) => !(edge.from === fromId && edge.port === port));
            return { ...item, edges: [...kept, { id: newId("e"), from: fromId, port, to: toId }] };
          }));
        }

        function createSubprogram() {
          const sub = newSubTab(docRef.current);
          let updated = commit((value) => ({ ...value, tabs: [...value.tabs, sub] }));
          // A call block that is waiting for a subprogram now calls this one.
          const waiting = selection && selection.kind === "node" ? tab.nodes.find((item) => item.id === selection.id) : null;
          if (waiting && waiting.type === "call" && !waiting.calleeId) {
            setDoc(patchNode(updated, tab.id, waiting.id, { calleeId: sub.id }));
          }
          setActiveTabId(sub.id);
          const startNode = sub.nodes[0];
          setSelection({ kind: "node", id: startNode.id });
          setEditKey((current) => ({ nodeId: startNode.id, count: (current ? current.count : 0) + 1 }));
        }

        function deleteSubprogram() {
          const id = tab.id;
          if (tab.kind !== "sub") return;
          commit((value) => ({ ...value, tabs: value.tabs.filter((item) => item.id !== id) }));
          setActiveTabId(docRef.current.tabs[0].id);
          setSelection(null);
          setNotice({ tone: "info", text: "Subprogram deleted. Undo brings it back." });
        }

        function loadExample(id) {
          const example = FlowExamples.list.find((item) => item.id === id);
          if (!example) return;
          stopRun();
          commit(() => normaliseDoc(clone(example.doc)));
          setViews({});
          setActiveTabId("main");
          setSelection(null);
          setNotice({ tone: "info", text: `Loaded “${example.label}”. Undo returns to your previous flowchart.` });
        }

        function newFlowchart() {
          stopRun();
          commit(() => FlowExamples.blank());
          setViews({});
          setActiveTabId("main");
          setSelection({ kind: "node", id: "start" });
          setNotice({ tone: "info", text: "New flowchart started. Undo returns to your previous one." });
        }

        function saveFile() {
          const blob = new Blob([JSON.stringify({ format: "flowchart-designer", version: 1, ...docRef.current }, null, 2)], { type: "application/json" });
          downloadBlob(blob, "flowchart.json");
        }

        function openFile(file) {
          const reader = new FileReader();
          reader.onload = () => {
            let next = null;
            try {
              next = normaliseDoc(JSON.parse(String(reader.result)));
            } catch (error) {
              next = null;
            }
            if (!next) {
              setNotice({ tone: "error", text: "That file isn't a flowchart saved from this designer." });
              return;
            }
            stopRun();
            commit(() => next);
            setViews({});
            setActiveTabId(next.tabs[0].id);
            setSelection(null);
            setNotice({ tone: "info", text: `Opened ${file.name}.` });
          };
          reader.readAsText(file);
        }

        async function saveImage() {
          const svg = canvasRef.current && canvasRef.current.svg();
          if (!svg) return;
          try {
            await exportPng(svg, tab, layouts, `flowchart-${(tab.kind === "main" ? "main" : tab.name).toLowerCase()}.png`);
          } catch (error) {
            setNotice({ tone: "error", text: "The image could not be created in this browser." });
          }
        }

        /* ----- running ----- */
        function startRun() {
          if (validation.errors) {
            setNotice({ tone: "error", text: `Fix the ${validation.errors} error${validation.errors === 1 ? "" : "s"} listed under Checks before simulating.` });
            setProblemsFlash((value) => value + 1);
            return;
          }
          if (fieldRef.current.element && document.activeElement === fieldRef.current.element) fieldRef.current.element.blur();
          runnerRef.current = FlowLang.createRunner(validation.program);
          runStepsRef.current = 0;
          setLimitNotice(false);
          setMode("run");
          setSelection(null);
          setActiveTabId(validation.program.mainId);
          setRunVersion((value) => value + 1);
        }

        function stopRun() {
          setAutoRun(false);
          setLimitNotice(false);
          runnerRef.current = null;
          setMode("design");
        }

        function restartRun() {
          setAutoRun(false);
          setLimitNotice(false);
          runnerRef.current = FlowLang.createRunner(validation.program);
          runStepsRef.current = 0;
          setActiveTabId(validation.program.mainId);
          setRunVersion((value) => value + 1);
        }

        function stepRun() {
          const runner = runnerRef.current;
          if (!runner) return;
          runner.step();
          setRunVersion((value) => value + 1);
        }

        function provideInput(text) {
          const runner = runnerRef.current;
          if (!runner) return;
          runner.provideInput(text);
          setRunVersion((value) => value + 1);
        }

        function editRunError() {
          const runner = runnerRef.current;
          const error = runner && runner.state.error;
          stopRun();
          if (error) {
            setActiveTabId(error.tabId);
            requestEdit(error.nodeId);
          }
        }

        useEffect(() => {
          if (!autoRun) return undefined;
          const runner = runnerRef.current;
          if (!runner) return undefined;
          if (runner.state.status === "done" || runner.state.status === "error") {
            setAutoRun(false);
            return undefined;
          }
          if (runner.state.status !== "ready") return undefined;
          const { delay, batch } = SPEEDS[speed];
          const timer = setTimeout(() => {
            for (let count = 0; count < batch && runner.state.status === "ready"; count += 1) {
              runner.step();
              runStepsRef.current += 1;
              if (runStepsRef.current >= STEP_LIMIT) {
                runStepsRef.current = 0;
                setAutoRun(false);
                setLimitNotice(true);
                break;
              }
            }
            setRunVersion((value) => value + 1);
          }, delay);
          return () => clearTimeout(timer);
        }, [autoRun, runVersion, speed]);

        // Follow execution into subprogram tabs and back.
        const runner = runnerRef.current;
        let highlight = null;
        if (mode === "run" && runner) {
          const state = runner.state;
          if (state.status === "error") {
            highlight = state.error.tabId === tab.id ? { errorId: state.error.nodeId } : null;
          } else if (state.status !== "done") {
            const frame = state.frames[state.frames.length - 1];
            highlight = frame.tabId === tab.id ? { currentId: frame.nodeId } : {};
          } else {
            highlight = {};
          }
          if (highlight && state.lastEdge && state.lastEdge.tabId === tab.id) highlight.edge = state.lastEdge;
        }
        useEffect(() => {
          const current = runnerRef.current;
          if (mode !== "run" || !current) return;
          const state = current.state;
          const target = state.status === "error" ? state.error.tabId : state.frames[state.frames.length - 1].tabId;
          if (target !== activeTabId) setActiveTabId(target);
        }, [runVersion]);

        /* ----- palette drag ----- */
        function startPaletteDrag(type, event) {
          if (mode !== "design") return;
          event.preventDefault();
          const startX = event.clientX;
          const startY = event.clientY;
          let dragging = false;
          const move = (moveEvent) => {
            if (!dragging && Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY) < 5) return;
            dragging = true;
            setGhost({ type, x: moveEvent.clientX, y: moveEvent.clientY });
          };
          const up = (upEvent) => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            window.removeEventListener("pointercancel", cancel);
            setGhost(null);
            if (!dragging) {
              placeNewBlock(type);
              return;
            }
            const canvas = canvasRef.current;
            if (canvas && canvas.contains(upEvent.clientX, upEvent.clientY)) {
              placeNewBlock(type, canvas.clientToWorld(upEvent.clientX, upEvent.clientY));
            }
          };
          const cancel = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            window.removeEventListener("pointercancel", cancel);
            setGhost(null);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
          window.addEventListener("pointercancel", cancel);
        }

        /* ----- keyboard ----- */
        useEffect(() => {
          const onKey = (event) => {
            const target = event.target;
            const typing = target && (target.matches("input, textarea, select") || target.isContentEditable);
            const modifier = event.ctrlKey || event.metaKey;
            if (typing) return;
            if (modifier && event.key.toLowerCase() === "z") {
              event.preventDefault();
              if (event.shiftKey) redo();
              else undo();
              return;
            }
            if (modifier && event.key.toLowerCase() === "y") {
              event.preventDefault();
              redo();
              return;
            }
            if (mode !== "design" || !selection) return;
            if (event.key === "Delete" || event.key === "Backspace") {
              event.preventDefault();
              deleteSelection();
              return;
            }
            if (event.key === "Escape") {
              setSelection(null);
              return;
            }
            const typedOnBlock = event.key.length === 1 && !modifier && !event.altKey && selection.kind === "node"
              && target && target.closest && target.closest(".fc-canvas");
            if (typedOnBlock) {
              const node = tab.nodes.find((item) => item.id === selection.id);
              if (node && ["process", "input", "output", "decision", "return"].includes(node.type)) {
                event.preventDefault();
                commit((value) => patchNode(value, tab.id, node.id, { text: String(node.text || "") + event.key }));
                requestEdit(node.id);
                return;
              }
            }
            const arrows = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
            if (arrows[event.key] && selection.kind === "node" && target && target.closest && target.closest(".fc-canvas")) {
              event.preventDefault();
              const [dx, dy] = arrows[event.key];
              const step = event.shiftKey ? GRID * 5 : GRID;
              commit((value) => mapTab(value, tab.id, (item) => ({
                ...item,
                nodes: item.nodes.map((node) => (node.id === selection.id ? { ...node, x: node.x + dx * step, y: node.y + dy * step } : node)),
              })));
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        });

        const setView = useCallback((view) => setViews((current) => ({ ...current, [tab.id]: view })), [tab.id]);

        function showProblem(problem) {
          setActiveTabId(problem.tabId);
          if (problem.nodeId) requestEdit(problem.nodeId);
          else setSelection(null);
        }

        const subs = doc.tabs.filter((item) => item.kind === "sub");
        const design = mode === "design";
        const view = views[tab.id];
        const titleButton =
          "shrink-0 whitespace-nowrap rounded-md border border-white/40 bg-white/10 px-3 py-1.5 text-sm font-semibold text-white hover:bg-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-white";

        return (
          <div className="flowchart-app flex flex-col bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
            <header data-interactive-header className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-xl font-bold md:text-2xl">Flowchart Designer &amp; Simulator</h1>
                <p className="text-sm opacity-90">Build a flowchart from standard symbols, check it, then run it step by step</p>
              </div>
              <div data-interactive-actions className="flex flex-wrap items-center gap-2">
                <select
                  aria-label="Load an example flowchart"
                  value=""
                  onChange={(event) => loadExample(event.target.value)}
                  className="shrink-0 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm font-semibold text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
                >
                  <option value="">Load an example…</option>
                  {FlowExamples.list.map((example) => (
                    <option key={example.id} value={example.id}>
                      {example.label}
                    </option>
                  ))}
                </select>
                <button type="button" className={titleButton} onClick={newFlowchart}>
                  New
                </button>
                <button type="button" className={titleButton} onClick={() => fileRef.current.click()}>
                  Open…
                </button>
                <button type="button" className={titleButton} onClick={saveFile}>
                  Save
                </button>
                <input
                  ref={fileRef}
                  type="file"
                  accept=".json,application/json"
                  className="hidden"
                  aria-hidden="true"
                  tabIndex={-1}
                  onChange={(event) => {
                    const file = event.target.files && event.target.files[0];
                    if (file) openFile(file);
                    event.target.value = "";
                  }}
                />
              </div>
            </header>

            <div
              ref={mainRef}
              className="fc-main grid min-h-0 flex-1 gap-3 p-3"
              style={sideWidth ? { "--fc-side-width": sideWidth + "px" } : undefined}
            >
              <Palette tabKind={tab.kind} disabled={!design} onAdd={placeNewBlock} onDragStart={startPaletteDrag} />

              <section aria-label="Flowchart" className="fc-canvas-column flex min-w-0 flex-col overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-900">
                <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 px-2 py-2 dark:border-slate-700">
                  <div role="group" aria-label="Mode" className="flex overflow-hidden rounded-md border border-slate-300 dark:border-slate-600">
                    <button
                      type="button"
                      aria-pressed={design}
                      onClick={() => !design && stopRun()}
                      className={"px-3 py-1.5 text-sm font-bold focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 " + (design ? "bg-indigo-600 text-white" : "bg-white text-slate-700 hover:bg-slate-100 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800")}
                    >
                      ✎ Design
                    </button>
                    <button
                      type="button"
                      aria-pressed={!design}
                      onClick={() => design && startRun()}
                      className={"border-l border-slate-300 px-3 py-1.5 text-sm font-bold focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 dark:border-slate-600 " + (!design ? "bg-indigo-600 text-white" : "bg-white text-slate-700 hover:bg-slate-100 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800")}
                    >
                      ▶ Simulate
                    </button>
                  </div>
                  {design && (
                    <span
                      className={
                        "whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-bold " +
                        (validation.errors
                          ? "bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-100"
                          : "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-100")
                      }
                    >
                      {validation.errors ? `${validation.errors} error${validation.errors === 1 ? "" : "s"} to fix` : "✓ Ready to run"}
                    </span>
                  )}
                  <div className="ml-auto flex flex-wrap items-center gap-1">
                    <button type="button" className={smallButton} onClick={undo} disabled={!design || !undoRef.current.length} title="Undo (Ctrl+Z)">
                      ↶ Undo
                    </button>
                    <button type="button" className={smallButton} onClick={redo} disabled={!design || !redoRef.current.length} title="Redo (Ctrl+Y)">
                      ↷ Redo
                    </button>
                    <span className="mx-1 h-5 w-px bg-slate-300 dark:bg-slate-600" aria-hidden="true"></span>
                    <button type="button" className={smallButton} onClick={() => canvasRef.current.zoom(1 / 1.2)} aria-label="Zoom out">
                      −
                    </button>
                    <ZoomField zoom={view ? view.z : 1} onZoom={(z) => canvasRef.current.zoom(z / (view ? view.z : 1))} />
                    <button type="button" className={smallButton} onClick={() => canvasRef.current.zoom(1.2)} aria-label="Zoom in">
                      +
                    </button>
                    <button type="button" className={smallButton} onClick={() => canvasRef.current.fit()}>
                      Fit
                    </button>
                    <button type="button" className={smallButton} onClick={saveImage} title="Download this tab as a PNG image">
                      Image
                    </button>
                  </div>
                </div>

                <div role="tablist" aria-label="Flowcharts" className="flex items-end gap-1 overflow-x-auto border-b border-slate-200 bg-slate-50 px-2 pt-1.5 dark:border-slate-700 dark:bg-slate-950">
                  {doc.tabs.map((item) => {
                    const active = item.id === tab.id;
                    const hasError = validation.problems.some((problem) => problem.tabId === item.id && problem.severity === "error");
                    return (
                      <button
                        key={item.id}
                        type="button"
                        role="tab"
                        aria-selected={active}
                        onClick={() => showTab(item.id)}
                        className={
                          "fc-mono -mb-px flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-t-md border px-3 py-1.5 text-sm font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 " +
                          (active
                            ? "border-slate-300 border-b-white bg-white text-indigo-700 dark:border-slate-600 dark:border-b-slate-900 dark:bg-slate-900 dark:text-indigo-300"
                            : "border-transparent text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800")
                        }
                      >
                        {item.kind === "main" ? "Main" : FlowLang.subprogramSignature(item)}
                        {hasError && design && (
                          <span className="rounded-full bg-red-600 px-1.5 text-[0.65rem] font-bold leading-4 text-white" aria-label="has errors">
                            !
                          </span>
                        )}
                      </button>
                    );
                  })}
                  {design && (
                    <button
                      type="button"
                      onClick={createSubprogram}
                      className="mb-1 ml-1 shrink-0 whitespace-nowrap rounded-md px-2 py-1 text-sm font-semibold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:text-indigo-300 dark:hover:bg-slate-800"
                    >
                      + New subprogram
                    </button>
                  )}
                </div>

                <div className="relative min-h-0 flex-1">
                  <FlowCanvas
                    ref={canvasRef}
                    doc={doc}
                    tab={tab}
                    layouts={layouts}
                    routes={routes}
                    view={view}
                    onViewChange={setView}
                    mode={mode}
                    selection={selection}
                    onSelect={design ? setSelection : () => {}}
                    onNodeDragStart={() => {
                      dragSnapshotRef.current = docRef.current;
                    }}
                    onNodeDrag={(id, x, y) => live((value) => patchNode(value, tab.id, id, { x, y }))}
                    onNodeDragEnd={() => {
                      if (dragSnapshotRef.current && dragSnapshotRef.current !== docRef.current) remember(dragSnapshotRef.current);
                      dragSnapshotRef.current = null;
                    }}
                    onConnect={connectBlocks}
                    onChoosePort={(nodeId, port) => setChosenPort({ nodeId, port })}
                    insertPort={chosenPort}
                    problemNodes={problemNodes}
                    highlight={highlight}
                    reveal={
                      mode === "run"
                        ? { id: highlight && (highlight.errorId || highlight.currentId), key: runVersion + ":" + tab.id }
                        : editKey && { id: editKey.nodeId, key: "edit" + editKey.count + ":" + tab.id }
                    }
                    onEditNode={requestEdit}
                    editing={editing}
                  />
                  {notice && (
                    <div
                      role="status"
                      className={
                        "absolute bottom-3 left-3 right-3 z-10 mx-auto max-w-xl rounded-md border px-3 py-2 text-sm font-semibold shadow-md " +
                        (notice.tone === "error"
                          ? "border-red-300 bg-red-50 text-red-900 dark:border-red-800 dark:bg-red-950 dark:text-red-100"
                          : "border-indigo-200 bg-indigo-50 text-indigo-900 dark:border-indigo-800 dark:bg-indigo-950 dark:text-indigo-100")
                      }
                    >
                      {notice.text}
                    </div>
                  )}
                </div>
              </section>

              <SideResizer width={sideWidth} onResize={setSideWidth} containerRef={mainRef} asideRef={asideRef} />

              <aside ref={asideRef} aria-label={design ? "Block editor and checks" : "Simulation"} className="flex min-w-0 flex-col gap-3 lg:min-h-0 lg:overflow-y-auto">
                {design ? (
                  <React.Fragment>
                    <Inspector
                      doc={doc}
                      tab={tab}
                      selection={selection}
                      problems={validation.problems.filter((problem) => problem.tabId === tab.id)}
                      fieldApi={fieldApi}
                      editKey={editKey}
                      variables={variables}
                      onUpdateNode={(nodeId, patch) => live((value) => patchNode(value, tab.id, nodeId, patch))}
                      onUpdateTab={(patch) => live((value) => mapTab(value, tab.id, (item) => ({ ...item, ...patch })))}
                      onDeleteTab={deleteSubprogram}
                      onDeleteSelection={deleteSelection}
                      onCreateSub={createSubprogram}
                      onShowTab={showTab}
                      chosenPort={chosenPort}
                      onChoosePort={(nodeId, port) => setChosenPort({ nodeId, port })}
                      onSwapLabels={swapDecisionLabels}
                    />
                    <ProblemsPanel doc={doc} validation={validation} onShowProblem={showProblem} highlightKey={problemsFlash} />
                    <ReferenceCard />
                  </React.Fragment>
                ) : (
                  runner && (
                    <RunPanel
                      runner={runner}
                      doc={doc}
                      autoRun={autoRun}
                      speed={speed}
                      onSpeed={setSpeed}
                      onStep={stepRun}
                      onRun={() => {
                        setLimitNotice(false);
                        runStepsRef.current = 0;
                        setAutoRun(true);
                      }}
                      onPause={() => setAutoRun(false)}
                      onRestart={restartRun}
                      onStop={stopRun}
                      onInput={provideInput}
                      onEditError={editRunError}
                      limitNotice={limitNotice}
                    />
                  )
                )}
              </aside>
            </div>

            {ghost && (
              <div className="fc-ghost flex items-center gap-2 rounded-md border border-indigo-400 bg-white px-2 py-1 text-sm font-semibold text-slate-800 shadow-lg dark:bg-slate-800 dark:text-slate-100" style={{ left: ghost.x, top: ghost.y }}>
                <PaletteIcon type={ghost.type} />
                {BLOCKS[ghost.type].label}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
