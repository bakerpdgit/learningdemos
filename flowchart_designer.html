    <script id="flowchart-code">
      /* ---------------------------------------------------------------
         Flowchart <-> Python. Plain JavaScript like FlowLang, so the build
         checks can test it.

         structureTab turns one tab's connector graph into a statement tree
         (if / while / repeat loops). buildTab turns a tree back into blocks
         and connectors with a tidy layout. toPython and parsePython convert
         between whole documents and Python source text.

         A statement keeps the id of the block it came from:
           { k: "assign", id, line, text }          one line of a process block
           { k: "input", id, text, inputType }
           { k: "output", id, text }
           { k: "call", id, calleeId, args, target }
           { k: "return", id, text }   { k: "end", id }
           { k: "if", id, text, negated, then: [], else: [] }
           { k: "while", id, text, negated, body: [] }
           { k: "repeat", id, text, negated, body: [] }   while True … break
         negated means the code shows the opposite of the block's condition,
         because the decision's False exit is the one that enters the branch
         (if/while) or leaves the loop (repeat).
         --------------------------------------------------------------- */
      var FlowCode = (function () {
        "use strict";

        var L = FlowLang;
        var BINDING = L.BINDING;
        var COMPARISONS = L.COMPARISONS;
        var SINK = "#sink";
        var PY_NAMES = { LEN: "len", INT: "int", REAL: "float", STR: "str", ROUND: "round", RANDOM_INT: "random.randint" };
        var PY_OPS = { AND: "and", OR: "or", DIV: "//", MOD: "%", "^": "**" };
        var NEGATED = { "==": "!=", "!=": "==", "<": ">=", ">=": "<", ">": "<=", "<=": ">" };
        var CASTS = { "int": "int", real: "float", string: "" };
        var counter = 0;

        function CodeError(message, hint, nodeIds) {
          this.message = message;
          this.hint = hint || "";
          this.nodeIds = nodeIds || [];
        }
        CodeError.prototype = Object.create(Error.prototype);
        CodeError.prototype.name = "CodeError";

        function unstructured(message, hint, nodeIds) {
          throw new CodeError(message, hint, nodeIds);
        }

        function defaultId(prefix) {
          counter += 1;
          return prefix + "c" + Date.now().toString(36) + counter.toString(36);
        }

        /* ---------- Expressions ---------- */

        function quote(text) {
          return text.indexOf("\"") >= 0 && text.indexOf("'") < 0 ? "'" + text + "'" : "\"" + text + "\"";
        }

        function isNumeric(type) {
          return type === "INT" || type === "REAL";
        }

        // The static type of an expression, or null when it can't be known.
        function typeOf(ast, env) {
          switch (ast.k) {
            case "lit": return ast.value.type;
            case "var": return (env && env[ast.name]) || null;
            case "neg": {
              var inner = typeOf(ast.e, env);
              return isNumeric(inner) ? inner : null;
            }
            case "not": return "BOOL";
            case "call":
              if (ast.name === "REAL") return "REAL";
              if (ast.name === "STR") return "STRING";
              if (ast.name === "ROUND") return ast.args.length > 1 ? "REAL" : "INT";
              return "INT";
            case "bin": {
              if (COMPARISONS[ast.op] || ast.op === "AND" || ast.op === "OR") return "BOOL";
              var l = typeOf(ast.l, env);
              var r = typeOf(ast.r, env);
              if (ast.op === "+" && (l === "STRING" || r === "STRING")) return "STRING";
              if (ast.op === "/") return "REAL";
              if (ast.op === "DIV" || ast.op === "MOD") return "INT";
              if (isNumeric(l) && isNumeric(r)) return l === "REAL" || r === "REAL" ? "REAL" : "INT";
              return null;
            }
          }
          return null;
        }

        function bindingOf(ast) {
          if (ast.k === "bin") return BINDING[ast.op];
          if (ast.k === "neg") return 60;
          if (ast.k === "not") return 25;
          return 100;
        }

        // Prints an expression tree as pseudocode or as Python, with only the
        // brackets the precedence rules need. For Python, a value joined to
        // text with + is wrapped in str() unless it is already text.
        function printExpr(ast, python, env) {
          function go(node) {
            switch (node.k) {
              case "lit": {
                var value = node.value;
                if (value.type === "STRING") return quote(value.v);
                if (value.type === "BOOL") return value.v ? "True" : "False";
                if (value.type === "REAL") return L.formatReal(value.v);
                return String(value.v);
              }
              case "var": return node.name;
              case "call": return (python ? PY_NAMES[node.name] : node.name) + "(" + node.args.map(go).join(", ") + ")";
              case "neg": {
                var inner = go(node.e);
                var needs = (node.e.k === "bin" && BINDING[node.e.op] <= 60) || node.e.k === "neg" || node.e.k === "not";
                return "-" + (needs ? "(" + inner + ")" : inner);
              }
              case "not": {
                var operand = go(node.e);
                return (python ? "not " : "NOT ") + (bindingOf(node.e) <= 25 ? "(" + operand + ")" : operand);
              }
              case "bin": {
                var op = node.op;
                var b = BINDING[op];
                var lb = bindingOf(node.l);
                var rb = bindingOf(node.r);
                var left = go(node.l);
                var right = go(node.r);
                var leftNeeds = lb < b || (op === "^" && lb === b) || (COMPARISONS[op] && node.l.k === "bin" && COMPARISONS[node.l.op]);
                var rightNeeds = rb < b || (rb === b && op !== "^");
                if (leftNeeds) left = "(" + left + ")";
                if (rightNeeds) right = "(" + right + ")";
                if (python && op === "+") {
                  var lt = typeOf(node.l, env);
                  var rt = typeOf(node.r, env);
                  if (lt === "STRING" && rt !== "STRING") right = "str(" + go(node.r) + ")";
                  else if (rt === "STRING" && lt !== "STRING") left = "str(" + go(node.l) + ")";
                }
                return left + " " + (python ? PY_OPS[op] || op : op) + " " + right;
              }
            }
            return "";
          }
          return go(ast);
        }

        function printPseudo(ast) {
          return printExpr(ast, false, null);
        }

        function printPython(ast, env) {
          return printExpr(ast, true, env || {});
        }

        function negate(ast) {
          if (ast.k === "bin" && NEGATED[ast.op]) return { k: "bin", op: NEGATED[ast.op], l: ast.l, r: ast.r };
          if (ast.k === "not") return ast.e;
          return { k: "not", e: ast };
        }

        function parsePseudo(text) {
          return L.parseExpression(text, {});
        }

        // Pseudocode text from a block -> Python text for the code view.
        // ok is false for an empty slot (a hole) or text that doesn't parse.
        function exprToPython(text, env, negated) {
          var source = String(text || "").trim();
          if (!source) return { ok: false, hole: true, text: "" };
          try {
            var ast = parsePseudo(source);
            return { ok: true, text: printPython(negated ? negate(ast) : ast, env) };
          } catch (error) {
            if (!(error instanceof L.FlowError)) throw error;
            return { ok: false, text: negated ? "not (" + source + ")" : source, error: error.message };
          }
        }

        // Python text typed by the student -> pseudocode for the block.
        // Throws a FlowError when it isn't valid.
        function pythonToPseudo(text, subprogramNames) {
          var ast = L.parseExpression(text, { dialect: "python", subprogramNames: subprogramNames || [] });
          return printPseudo(ast);
        }

        function usesRandom(ast) {
          if (!ast) return false;
          if (ast.k === "call") return ast.name === "RANDOM_INT" || ast.args.some(usesRandom);
          if (ast.k === "bin") return usesRandom(ast.l) || usesRandom(ast.r);
          if (ast.k === "neg" || ast.k === "not") return usesRandom(ast.e);
          return false;
        }

        // Splits one line of a process block into its target and value
        // without insisting that either is valid.
        function splitAssignment(line) {
          var text = String(line || "");
          for (var i = 0; i < text.length; i += 1) {
            var ch = text[i];
            if (ch === "\"" || ch === "'") {
              var close = text.indexOf(ch, i + 1);
              if (close < 0) break;
              i = close;
              continue;
            }
            if (ch === "←") return { target: text.slice(0, i).trim(), expr: text.slice(i + 1).trim() };
            if (ch === "=" && text[i + 1] !== "=" && !(i > 0 && "=!<>".indexOf(text[i - 1]) >= 0)) {
              return { target: text.slice(0, i).trim(), expr: text.slice(i + 1).trim() };
            }
          }
          return { target: "", expr: text.trim() };
        }

        function joinAssignment(target, expr) {
          target = String(target || "").trim();
          expr = String(expr || "").trim();
          if (!target && !expr) return "";
          return target + " = " + expr;
        }

        function processLines(text) {
          return String(text || "").split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean);
        }

        /* ---------- Data types ---------- */

        function mergeType(a, b) {
          if (!a) return b;
          if (!b || a === b) return a;
          if (isNumeric(a) && isNumeric(b)) return "REAL";
          return "MIXED";
        }

        function mergeWant(a, b) {
          if (!a) return b;
          if (!b || a === b) return a;
          if ((a === "NUM" && b === "REAL") || (a === "REAL" && b === "NUM")) return "REAL";
          return a;
        }

        function wantOfType(type) {
          if (type === "INT") return "NUM";
          if (type === "REAL") return "REAL";
          if (type === "STRING") return "STRING";
          return null;
        }

        function tryParse(text) {
          try {
            return parsePseudo(text);
          } catch (error) {
            if (!(error instanceof L.FlowError)) throw error;
            return null;
          }
        }

        function tryAssignment(line) {
          try {
            return L.parseAssignment(line, {});
          } catch (error) {
            if (!(error instanceof L.FlowError)) throw error;
            return null;
          }
        }

        // Works out each variable's type, flow-insensitively. An Input block
        // set to Auto gets the type its uses need: a number when it is used
        // in arithmetic or compared with a number, otherwise text.
        function inferTypes(doc) {
          var tabs = doc.tabs;
          var envs = {};
          var wants = {};
          var params = {};
          var inputTypes = {};
          tabs.forEach(function (tab) {
            envs[tab.id] = {};
            wants[tab.id] = {};
            params[tab.id] = tab.kind === "sub" ? L.parseParams(tab.paramsText).params : [];
          });

          function setType(env, name, type, typed) {
            if (!name || !type) return;
            var merged = mergeType(typed[name], type);
            typed[name] = merged;
          }

          function addWant(tabId, name, want) {
            if (!want) return false;
            var before = wants[tabId][name];
            var after = mergeWant(before, want);
            if (after !== before) {
              wants[tabId][name] = after;
              return true;
            }
            return false;
          }

          for (var round = 0; round < 12; round += 1) {
            var changed = false;
            var next = {};
            var paramTypes = {};
            var returnTypes = {};

            tabs.forEach(function (tab) {
              var env = envs[tab.id];
              var typed = {};
              tab.nodes.forEach(function (node) {
                if (node.type === "input") {
                  var name = String(node.text || "").trim();
                  var type = null;
                  if (node.inputType === "int") type = "INT";
                  else if (node.inputType === "real") type = "REAL";
                  else if (node.inputType === "string") type = "STRING";
                  else {
                    var want = wants[tab.id][name];
                    // Undecided until a use needs a number; text by default.
                    type = want === "REAL" ? "REAL" : want === "NUM" ? "INT" : want === "STRING" ? "STRING" : null;
                  }
                  inputTypes[node.id] = type === "INT" ? "int" : type === "REAL" ? "real" : "string";
                  setType(env, name, type, typed);
                }
                if (node.type === "process") {
                  processLines(node.text).forEach(function (line) {
                    var assignment = tryAssignment(line);
                    if (assignment) setType(env, assignment.target, typeOf(assignment.expr, env), typed);
                  });
                }
                if (node.type === "call") {
                  var target = String(node.target || "").trim();
                  if (target) setType(env, target, envs.__returns && envs.__returns[node.calleeId], typed);
                  (node.args || []).forEach(function (arg, index) {
                    var ast = tryParse(arg);
                    if (!ast) return;
                    var key = node.calleeId + "#" + index;
                    paramTypes[key] = paramTypes[key] === undefined ? typeOf(ast, env) : mergeType(paramTypes[key], typeOf(ast, env));
                  });
                }
                if (node.type === "return" && String(node.text || "").trim()) {
                  var value = tryParse(node.text);
                  if (value) returnTypes[tab.id] = mergeType(returnTypes[tab.id], typeOf(value, env) || "MIXED");
                }
              });
              next[tab.id] = typed;
            });

            tabs.forEach(function (tab) {
              params[tab.id].forEach(function (param, index) {
                var type = paramTypes[tab.id + "#" + index];
                if (type) next[tab.id][param] = mergeType(next[tab.id][param], type);
              });
            });

            var returns = {};
            Object.keys(returnTypes).forEach(function (id) {
              returns[id] = returnTypes[id] === "MIXED" ? null : returnTypes[id];
            });

            tabs.forEach(function (tab) {
              var clean = {};
              Object.keys(next[tab.id]).forEach(function (name) {
                var type = next[tab.id][name];
                clean[name] = type === "MIXED" ? null : type;
              });
              if (JSON.stringify(clean) !== JSON.stringify(envs[tab.id])) changed = true;
              envs[tab.id] = clean;
            });
            if (JSON.stringify(returns) !== JSON.stringify(envs.__returns || {})) changed = true;
            envs.__returns = returns;

            // What each variable needs to be, from how it is used.
            tabs.forEach(function (tab) {
              var env = envs[tab.id];
              function want(ast, expected) {
                if (!ast) return;
                switch (ast.k) {
                  case "var":
                    if (addWant(tab.id, ast.name, expected)) changed = true;
                    return;
                  case "neg":
                    want(ast.e, "NUM");
                    return;
                  case "not":
                    want(ast.e, null);
                    return;
                  case "call":
                    ast.args.forEach(function (arg) {
                      if (ast.name === "LEN") want(arg, "STRING");
                      else if (ast.name === "ROUND" || ast.name === "RANDOM_INT") want(arg, "NUM");
                      else want(arg, null);
                    });
                    return;
                  case "bin": {
                    var lt = typeOf(ast.l, env);
                    var rt = typeOf(ast.r, env);
                    if (ast.op === "AND" || ast.op === "OR") {
                      want(ast.l, null);
                      want(ast.r, null);
                    } else if (COMPARISONS[ast.op]) {
                      want(ast.l, wantOfType(rt) || wants[tab.id][varName(ast.r)] || null);
                      want(ast.r, wantOfType(lt) || wants[tab.id][varName(ast.l)] || null);
                    } else if (ast.op === "+") {
                      if (lt === "STRING" || rt === "STRING" || expected === "STRING") {
                        want(ast.l, null);
                        want(ast.r, null);
                      } else if (expected || isNumeric(lt) || isNumeric(rt)) {
                        var kind = expected === "REAL" || lt === "REAL" || rt === "REAL" ? "REAL" : "NUM";
                        want(ast.l, kind);
                        want(ast.r, kind);
                      }
                    } else {
                      var numeric = lt === "REAL" || rt === "REAL" ? "REAL" : "NUM";
                      want(ast.l, numeric);
                      want(ast.r, numeric);
                    }
                    return;
                  }
                }
              }
              tab.nodes.forEach(function (node) {
                if (node.type === "process") {
                  processLines(node.text).forEach(function (line) {
                    var assignment = tryAssignment(line);
                    if (assignment) want(assignment.expr, wants[tab.id][assignment.target] || null);
                  });
                } else if (node.type === "output" || node.type === "decision" || node.type === "return") {
                  want(tryParse(L.cleanCondition(node.text)), null);
                } else if (node.type === "call") {
                  (node.args || []).forEach(function (arg, index) {
                    var callee = params[node.calleeId];
                    var param = callee && callee[index];
                    want(tryParse(arg), param ? wants[node.calleeId][param] || null : null);
                  });
                }
              });
              // A parameter that must be a number makes the value passed in one.
              params[tab.id].forEach(function (param) {
                if (wants[tab.id][param]) {
                  // handled from the caller's side above
                }
              });
            });

            if (!changed) break;
          }
          // An Auto input that nothing needed as a number is text.
          tabs.forEach(function (tab) {
            tab.nodes.forEach(function (node) {
              var name = String(node.text || "").trim();
              if (node.type === "input" && inputTypes[node.id] === "string" && !envs[tab.id][name]) envs[tab.id][name] = "STRING";
            });
          });
          var result = { envs: {}, inputTypes: inputTypes, returns: envs.__returns || {} };
          tabs.forEach(function (tab) { result.envs[tab.id] = envs[tab.id]; });
          return result;
        }

        function varName(ast) {
          return ast && ast.k === "var" ? ast.name : "";
        }

        /* ---------- Flowchart -> statement tree ---------- */

        function graphOf(tab) {
          var nodes = new Map();
          var succ = new Map();
          var preds = new Map();
          tab.nodes.forEach(function (node) {
            nodes.set(node.id, node);
            succ.set(node.id, {});
            preds.set(node.id, []);
          });
          tab.edges.forEach(function (edge) {
            if (nodes.has(edge.from) && nodes.has(edge.to)) {
              succ.get(edge.from)[edge.port] = edge.to;
              preds.get(edge.to).push(edge.from);
            }
          });
          return { nodes: nodes, succ: succ, preds: preds };
        }

        function portsOf(node) {
          return L.OUTPUT_PORTS[node.type] || [];
        }

        function isTerminal(node) {
          return node.type === "end" || node.type === "return";
        }

        function terminalStatement(node) {
          if (node.type === "end") return { k: "end", id: node.id };
          return { k: "return", id: node.id, text: L.stripKeyword(node.text, "RETURN").trim() };
        }

        function simpleStatements(node) {
          switch (node.type) {
            case "process": {
              var lines = processLines(node.text);
              if (!lines.length) return [{ k: "assign", id: node.id, line: 0, text: "" }];
              return lines.map(function (line, index) { return { k: "assign", id: node.id, line: index, text: line }; });
            }
            case "input":
              return [{ k: "input", id: node.id, text: String(node.text || "").trim(), inputType: node.inputType || "auto" }];
            case "output":
              return [{ k: "output", id: node.id, text: String(node.text || "").trim() }];
            case "call":
              return [{ k: "call", id: node.id, calleeId: node.calleeId || "", args: (node.args || []).slice(), target: String(node.target || "").trim() }];
          }
          return [];
        }

        // True when every path through these statements ends at END or RETURN.
        function terminates(list) {
          var last = list[list.length - 1];
          if (!last) return false;
          if (last.k === "end" || last.k === "return") return true;
          if (last.k === "if") return terminates(last.then) && last.else.length > 0 && terminates(last.else);
          return false;
        }

        function endsWithBareExit(list) {
          var last = list[list.length - 1];
          return !!last && (last.k === "end" || (last.k === "return" && !last.text));
        }

        function structureTab(tab) {
          try {
            return { ok: true, body: structureOrThrow(tab) };
          } catch (error) {
            if (!(error instanceof CodeError)) throw error;
            return { ok: false, message: error.message, hint: error.hint, nodeIds: error.nodeIds };
          }
        }

        function structureOrThrow(tab) {
          var g = graphOf(tab);
          var start = tab.nodes.filter(function (node) { return node.type === "start"; })[0];
          if (!start) unstructured(tab.kind === "main" ? "Main has no START block." : "This subprogram has no START block.");

          // Everything reachable from START, with every exit connected.
          var reachable = [];
          var seen = new Set([start.id]);
          var queue = [start.id];
          while (queue.length) {
            var id = queue.shift();
            reachable.push(id);
            var node = g.nodes.get(id);
            portsOf(node).forEach(function (port) {
              var to = g.succ.get(id)[port];
              if (!to) {
                unstructured("Finish connecting the flowchart to see its code.", "Every exit of every block needs a connector.", [id]);
              }
              if (!seen.has(to)) {
                seen.add(to);
                queue.push(to);
              }
            });
          }
          var inGraph = new Set(reachable);

          // Every block must be able to reach END or RETURN.
          var finishes = new Set();
          var grew = true;
          while (grew) {
            grew = false;
            reachable.forEach(function (rid) {
              if (finishes.has(rid)) return;
              var rnode = g.nodes.get(rid);
              if (isTerminal(rnode) || portsOf(rnode).some(function (port) { return finishes.has(g.succ.get(rid)[port]); })) {
                finishes.add(rid);
                grew = true;
              }
            });
          }
          var stuck = reachable.filter(function (rid) { return !finishes.has(rid); });
          if (stuck.length) unstructured("These blocks loop forever, so they can't be written as code.", "Add a decision so that one path leaves the loop.", stuck);

          function outs(nid) {
            var n = g.nodes.get(nid);
            return portsOf(n).map(function (port) { return g.succ.get(nid)[port]; });
          }

          // Dominators, to find loops and check they are only entered at the top.
          var dom = new Map();
          reachable.forEach(function (rid) { dom.set(rid, rid === start.id ? new Set([rid]) : new Set(reachable)); });
          var changed = true;
          while (changed) {

            reachable.forEach(function (rid) {

              var meet = null;
              predecessors.forEach(function (p) {

            onStack.add(nid);

                if (!dom.get(nid).has(to)) {

                }
                if (!headers.has(to)) headers.set(to, []);

            onStack.delete(nid);

          // An edge into the middle of a loop from outside it.

              if (member === header) return;
              g.preds.get(member).forEach(function (p) {
                if (inGraph.has(p) && !naturalLoop(header).has(p)) {

                }
              });
            });
          });

          function naturalLoop(header) {
            if (loopCache.has(header)) return loopCache.get(header);
            var body = new Set([header]);
            var stack = (headers.get(header) || []).slice();
            while (stack.length) {
              var x = stack.pop();
              if (body.has(x)) continue;
              body.add(x);
              g.preds.get(x).forEach(function (p) { if (inGraph.has(p)) stack.push(p); });
            }
            loopCache.set(header, body);
            return body;
          }

          function reach(from, avoid) {
            var found = new Set();
            var list = [from];
            while (list.length) {
              var x = list.pop();
              if (found.has(x) || (avoid && avoid.has(x))) continue;
              found.add(x);
              outs(x).forEach(function (to) { list.push(to); });
            }
            return found;
          }

          var emitted = new Map();
          function emit(nid) {
            var node = g.nodes.get(nid);
            if (isTerminal(node)) return;
            if (emitted.has(nid)) {

            }
            emitted.set(nid, true);
          }

          function postdoms(region) {
            if (region.pd) return region.pd;
            var ids = Array.from(region.nodes);
            var succIn = new Map();
            ids.forEach(function (rid) {
              var node = g.nodes.get(rid);
              if (isTerminal(node)) {

              }
              succIn.set(rid, outs(rid).map(function (to) { return region.nodes.has(to) ? to : SINK; }));
            });
            var all = ids.concat([SINK]);
            var pd = new Map();
            ids.forEach(function (rid) { pd.set(rid, new Set(all)); });
            pd.set(SINK, new Set([SINK]));
            var again = true;
            while (again) {
              again = false;
              ids.forEach(function (rid) {
                var meet = null;
                succIn.get(rid).forEach(function (s) {
                  var set = pd.get(s);
                  if (!meet) meet = new Set(set);
                  else meet.forEach(function (x) { if (!set.has(x)) meet.delete(x); });
                });
                meet = meet || new Set([SINK]);
                meet.add(rid);
                if (meet.size !== pd.get(rid).size) {
                  pd.set(rid, meet);
                  again = true;
                }
              });
            }
            region.pd = pd;
            return pd;
          }

          function ipdom(region, nid) {
            var pd = postdoms(region);
            var strict = Array.from(pd.get(nid)).filter(function (x) { return x !== nid; });
            for (var i = 0; i < strict.length; i += 1) {
              if (pd.get(strict[i]).size === strict.length) return strict[i];
            }
            return SINK;
          }

          function seq(entry, stop, region, depth) {
            var out = [];
            var current = entry;
            for (var guard = 0; ; guard += 1) {
              if (guard > 5000 || depth > 300) unstructured("This flowchart is too complicated to turn into code.");
              if (current === stop) return out;
              if (!region.nodes.has(current)) {
                if (current === region.header || current === region.latch) return out;
                var outside = g.nodes.get(current);
                if (outside && isTerminal(outside)) {
                  out.push(terminalStatement(outside));
                  return out;
                }
                unstructured("A path leaves this loop part-way through, which Python's while can't express.", "Make the loop's decision the only way out.", [current]);
              }
              var node = g.nodes.get(current);
              if (isTerminal(node)) {
                out.push(terminalStatement(node));
                return out;
              }
              if (headers.has(current) && current !== region.skip) {
                var loop = buildLoop(current, depth);
                out.push(loop.stmt);
                current = loop.exit;
                continue;
              }
              emit(current);
              if (node.type === "decision") {
                var merge = ipdom(region, current);
                var mergeStop = merge === SINK ? null : merge;
                var whenTrue = seq(g.succ.get(current)["true"], mergeStop, region, depth + 1);
                var whenFalse = seq(g.succ.get(current)["false"], mergeStop, region, depth + 1);
                var stmt = { k: "if", id: current, text: L.cleanCondition(node.text), negated: false, then: whenTrue, "else": whenFalse };
                if (!whenTrue.length && whenFalse.length) {
                  stmt.negated = true;
                  stmt.then = whenFalse;
                  stmt["else"] = [];
                }
                if (merge === SINK && terminates(stmt.then) && stmt["else"].length
                  && (!terminates(stmt["else"]) || endsWithBareExit(stmt.then))) {
                  // if … : return  — the rest carries on at the same level.
                  var rest = stmt["else"];
                  stmt["else"] = [];
                  out.push(stmt);
                  rest.forEach(function (item) { out.push(item); });
                  return out;
                }
                out.push(stmt);
                if (merge === SINK) return out;
                current = merge;
                continue;
              }
              simpleStatements(node).forEach(function (item) { out.push(item); });
              current = g.succ.get(current).next;
            }
          }

          function buildLoop(header, depth) {
            var body = naturalLoop(header);
            var latches = headers.get(header);
            var exits = [];
            body.forEach(function (member) {
              var mnode = g.nodes.get(member);
              portsOf(mnode).forEach(function (port) {
                var to = g.succ.get(member)[port];
                if (!body.has(to)) exits.push({ from: member, port: port, to: to });
              });
            });
            var headNode = g.nodes.get(header);
            var whileExit = null;
            if (headNode.type === "decision") {
              var fromHead = exits.filter(function (edge) { return edge.from === header; });
              if (fromHead.length === 1) whileExit = fromHead[0];
            }
            var repeatExit = null;
            var latch = latches.length === 1 ? latches[0] : null;
            if (latch && latch !== header && g.nodes.get(latch).type === "decision") {
              var latchOuts = g.succ.get(latch);
              var back = latchOuts["true"] === header ? "true" : latchOuts["false"] === header ? "false" : null;
              var leave = back === "true" ? "false" : "true";
              if (back && !body.has(latchOuts[leave])) repeatExit = { from: latch, port: leave, to: latchOuts[leave] };
            }
            var members = Array.from(body);
            if (whileExit && repeatExit) {
              unstructured("This loop has two ways out, which Python's while can't express.", "Join the exits so the loop leaves from one decision.", [whileExit.from, repeatExit.from]);
            }
            var main = whileExit || repeatExit;
            if (!main) {
              unstructured("This loop doesn't leave from a decision at its top or bottom, so it can't be written as a while loop.", "Put the decision that ends the loop first or last in the loop.", members);
            }
            var mainReach = reach(main.to, null);
            var extras = new Set();
            exits.forEach(function (edge) {
              if (edge === main || (edge.from === main.from && edge.port === main.port)) return;
              var found = reach(edge.to, null);
              var ok = true;
              found.forEach(function (x) {
                if (body.has(x)) ok = false;
                if (mainReach.has(x) && !isTerminal(g.nodes.get(x))) ok = false;
              });
              if (!ok) {
                unstructured("This loop has more than one way out, which Python's while can't express.", "Join the exits so the loop leaves from one decision.", [edge.from, main.from]);
              }
              found.forEach(function (x) { extras.add(x); });
            });
            var nodes = new Set();
            if (whileExit) {
              body.forEach(function (x) { if (x !== header) nodes.add(x); });
              extras.forEach(function (x) { nodes.add(x); });
              var contPort = whileExit.port === "true" ? "false" : "true";
              emit(header);
              var inner = seq(g.succ.get(header)[contPort], null, { nodes: nodes, header: header }, depth + 1);
              return {
                stmt: { k: "while", id: header, text: L.cleanCondition(headNode.text), negated: contPort === "false", body: inner },
                exit: whileExit.to,
              };
            }
            body.forEach(function (x) { if (x !== latch) nodes.add(x); });
            extras.forEach(function (x) { nodes.add(x); });
            emit(latch);
            var repeated = seq(header, latch, { nodes: nodes, latch: latch, skip: header }, depth + 1);
            return {
              stmt: { k: "repeat", id: latch, text: L.cleanCondition(g.nodes.get(latch).text), negated: repeatExit.port === "false", body: repeated },
              exit: repeatExit.to,
            };
          }

          return seq(g.succ.get(start.id).next, null, { nodes: inGraph }, 0);
        }

        /* ---------- Statement tree -> flowchart ---------- */

        var GAP = 40;

        function estimateSize(node) {
          var text = String(node.text || "");
          var longest = function (lines) { return lines.reduce(function (max, line) { return Math.max(max, line.length); }, 0); };
          switch (node.type) {
            case "start": case "end": return { w: 110, h: 42 };
            case "return": return { w: Math.max(120, text.length * 8.5 + 52), h: text.trim() ? 58 : 42 };
            case "process": {
              var lines = processLines(text);
              return { w: Math.max(140, longest(lines) * 8.5 + 40), h: Math.max(46, lines.length * 20 + 24) };
            }
            case "input": case "output": return { w: Math.max(150, text.length * 8.5 + 60), h: 58 };
            case "decision": return { w: Math.max(170, Math.round(text.length * 8.5 * 1.45) + 44), h: 96 };
            case "call": return { w: Math.max(160, 20 * 8.5 + 60), h: 48 };
          }
          return { w: 140, h: 46 };
        }

        // Rebuilds a tab's blocks and connectors from a statement tree.
        // Block ids are reused where possible so the rest of the editor still
        // recognises them. options.measure(node) gives each block's size.
        function buildTab(tree, tab, options) {
          options = options || {};
          var newId = options.newId || defaultId;
          var measure = options.measure || estimateSize;
          var used = new Set();
          var edges = [];
          var finalCandidate = null;

          function take(id, prefix) {
            if (id && !used.has(id)) {
              used.add(id);
              return id;
            }
            var made = newId(prefix);
            used.add(made);
            return made;
          }

          function block(type, id, fields) {
            var node = { id: take(id, "n"), type: type, x: 0, y: 0, text: "" };
            Object.keys(fields || {}).forEach(function (key) { node[key] = fields[key]; });
            return node;
          }

          function connect(open, to) {
            open.forEach(function (port) {
              edges.push({ id: newId("e"), from: port.from, port: port.port, to: to });
            });
          }

          function single(node, open) {
            var size = measure(node);
            return { items: [{ node: node, dx: 0, dy: size.h / 2 }], h: size.h, left: -size.w / 2, right: size.w / 2, entry: node.id, open: open };
          }

          function empty() {
            return { items: [], h: 0, left: 0, right: 0, entry: null, open: [] };
          }

          function place(frag, dx, dy, into) {
            frag.items.forEach(function (item) {
              into.items.push({ node: item.node, dx: item.dx + dx, dy: item.dy + dy });
            });
            into.left = Math.min(into.left, frag.left + dx);
            into.right = Math.max(into.right, frag.right + dx);
          }

          function sequence(list, tail) {
            var parts = [];
            for (var i = 0; i < list.length; i += 1) {
              var stmt = list[i];
              if (stmt.k === "assign") {
                var group = [stmt];
                while (stmt.id && i + 1 < list.length && list[i + 1].k === "assign" && list[i + 1].id === stmt.id) {
                  i += 1;
                  group.push(list[i]);
                }
                var text = group.map(function (item) { return String(item.text || "").trim(); }).filter(Boolean).join("\n");
                var processNode = block("process", stmt.id, { text: text });
                parts.push(single(processNode, [{ from: processNode.id, port: "next" }]));
                continue;
              }
              parts.push(statement(stmt, tail && i === list.length - 1));
            }
            var result = empty();
            var y = 0;
            var previous = null;
            parts.forEach(function (part) {
              if (previous) connect(previous.open, part.entry);
              else result.entry = part.entry;
              if (part.items.length) {
                if (previous && previous.items.length) y += GAP;
                place(part, 0, y, result);
                y += part.h;
              }
              previous = part;
            });
            result.h = y;
            result.open = previous ? previous.open : [];
            return result;
          }

          function statement(stmt, tail) {
            switch (stmt.k) {
              case "input": {
                var input = block("input", stmt.id, { text: stmt.text || "", inputType: stmt.inputType || "auto" });
                return single(input, [{ from: input.id, port: "next" }]);
              }
              case "output": {
                var output = block("output", stmt.id, { text: stmt.text || "" });
                return single(output, [{ from: output.id, port: "next" }]);
              }
              case "call": {
                var call = block("call", stmt.id, { calleeId: stmt.calleeId || "", args: (stmt.args || []).slice(), target: stmt.target || "" });
                return single(call, [{ from: call.id, port: "next" }]);
              }
              case "end":
              case "return": {
                var bare = stmt.k === "end" || !String(stmt.text || "").trim();
                if (bare && tail) {
                  if (!finalCandidate && stmt.id) finalCandidate = stmt.id;
                  var shared = empty();
                  shared.entry = "@final";
                  return shared;
                }
                if (stmt.k === "end") return single(block("end", stmt.id, {}), []);
                return single(block("return", stmt.id, { text: stmt.text || "" }), []);
              }
              case "if": return ifFragment(stmt, tail);
              case "while": return whileFragment(stmt);
              case "repeat": return repeatFragment(stmt);
            }
            return empty();
          }

          function decisionNode(stmt) {
            return block("decision", stmt.id, { text: stmt.text || "", trueSide: "bottom", falseSide: "right" });
          }

          function setSide(node, port, side) {
            node[port === "true" ? "trueSide" : "falseSide"] = side;
          }

          function ifFragment(stmt, tail) {
            var decision = decisionNode(stmt);
            var size = measure(decision);
            var thenPort = stmt.negated ? "false" : "true";
            var elsePort = stmt.negated ? "true" : "false";
            var whenThen = sequence(stmt.then || [], tail);
            var whenElse = sequence(stmt["else"] || [], tail);
            var result = { items: [{ node: decision, dx: 0, dy: size.h / 2 }], h: size.h, left: -size.w / 2, right: size.w / 2, entry: decision.id, open: [] };
            var below = size.h + GAP;
            if (!whenElse.entry) {
              setSide(decision, thenPort, "bottom");
              setSide(decision, elsePort, "right");
              if (whenThen.entry) {
                connect([{ from: decision.id, port: thenPort }], whenThen.entry);
                place(whenThen, 0, below, result);
                if (whenThen.items.length) result.h = below + whenThen.h;
                result.open = whenThen.open.slice();
              } else {
                result.open.push({ from: decision.id, port: thenPort });
              }
              result.open.push({ from: decision.id, port: elsePort });
              result.right = Math.max(result.right, size.w / 2 + 30) + 20;
              return result;
            }
            setSide(decision, thenPort, "left");
            setSide(decision, elsePort, "right");
            var thenX = -Math.max(size.w / 2, whenThen.right + 30);
            var elseX = Math.max(size.w / 2, -whenElse.left + 30);
            if (whenThen.entry) {
              connect([{ from: decision.id, port: thenPort }], whenThen.entry);
              place(whenThen, thenX, below, result);
              result.open = result.open.concat(whenThen.open);
            } else {
              result.open.push({ from: decision.id, port: thenPort });
            }
            connect([{ from: decision.id, port: elsePort }], whenElse.entry);
            place(whenElse, elseX, below, result);
            result.open = result.open.concat(whenElse.open);
            result.h = below + Math.max(whenThen.h, whenElse.h);
            return result;
          }

          function whileFragment(stmt) {
            var decision = decisionNode(stmt);
            var size = measure(decision);
            var contPort = stmt.negated ? "false" : "true";
            var exitPort = stmt.negated ? "true" : "false";
            setSide(decision, contPort, "bottom");
            setSide(decision, exitPort, "right");
            var inner = sequence(stmt.body || [], false);
            var result = { items: [{ node: decision, dx: 0, dy: size.h / 2 }], h: size.h, left: -size.w / 2, right: size.w / 2, entry: decision.id, open: [{ from: decision.id, port: exitPort }] };
            var below = size.h + GAP;
            if (inner.entry) {
              connect([{ from: decision.id, port: contPort }], inner.entry);
              place(inner, 0, below, result);
              connect(inner.open, decision.id);
              result.h = below + inner.h + 20;
            } else {
              connect([{ from: decision.id, port: contPort }], decision.id);
            }
            result.left -= 40;
            result.right += 40;
            return result;
          }

          function repeatFragment(stmt) {
            var decision = decisionNode(stmt);
            var size = measure(decision);
            var exitPort = stmt.negated ? "false" : "true";
            var contPort = stmt.negated ? "true" : "false";
            setSide(decision, contPort, "left");
            setSide(decision, exitPort, "bottom");
            var inner = sequence(stmt.body || [], false);
            var result = empty();
            place(inner, 0, 0, result);
            var top = inner.items.length ? inner.h + GAP : 0;
            result.items.push({ node: decision, dx: 0, dy: top + size.h / 2 });
            result.left = Math.min(result.left, -size.w / 2) - 40;
            result.right = Math.max(result.right, size.w / 2);
            result.h = top + size.h;
            if (inner.entry) {
              connect(inner.open, decision.id);
              connect([{ from: decision.id, port: contPort }], inner.entry);
              result.entry = inner.entry;
            } else {
              connect([{ from: decision.id, port: contPort }], decision.id);
              result.entry = decision.id;
            }
            result.open = [{ from: decision.id, port: exitPort }];
            return result;
          }

          var oldStart = (tab.nodes || []).filter(function (node) { return node.type === "start"; })[0];
          var start = { id: take(oldStart ? oldStart.id : null, "n"), type: "start", x: 300, y: tab.kind === "sub" ? 110 : 60, text: "" };
          var startSize = measure(start);
          var body = sequence(tree, true);
          var top = start.y + startSize.h / 2 + GAP;
          var finalType = tab.kind === "sub" ? "return" : "end";
          var needsFinal = !body.entry || body.open.length > 0 || edges.some(function (edge) { return edge.to === "@final"; }) || body.entry === "@final";
          if (tab.kind === "main") needsFinal = true;
          connect([{ from: start.id, port: "next" }], body.entry || "@final");
          var nodes = [start];
          var minLeft = body.left;
          var offset = 300;
          if (offset + minLeft < 60) offset = Math.ceil((60 - minLeft) / 10) * 10;
          start.x = offset;
          body.items.forEach(function (item) {
            item.node.x = Math.round((offset + item.dx) / 10) * 10;
            item.node.y = Math.round((top + item.dy) / 10) * 10;
            nodes.push(item.node);
          });
          if (needsFinal) {
            var oldFinal = (tab.nodes || []).filter(function (node) { return node.type === finalType && !String(node.text || "").trim(); })[0];
            var finalNode = { id: take(finalCandidate || (oldFinal && oldFinal.id), "n"), type: finalType, x: offset, y: 0, text: "" };
            var finalSize = measure(finalNode);
            finalNode.y = Math.round((top + body.h + (body.items.length ? GAP : 0) + finalSize.h / 2) / 10) * 10;
            nodes.push(finalNode);
            connect(body.open, finalNode.id);
            edges.forEach(function (edge) { if (edge.to === "@final") edge.to = finalNode.id; });
          }
          edges = edges.filter(function (edge) { return edge.to !== "@final"; });
          var copy = {};
          Object.keys(tab).forEach(function (key) { copy[key] = tab[key]; });
          copy.nodes = nodes;
          copy.edges = edges;
          return copy;
        }

        /* ---------- Python text ---------- */

        function subprogramMap(doc) {
          var map = {};
          doc.tabs.forEach(function (tab) { if (tab.kind === "sub") map[tab.id] = tab; });
          return map;
        }

        // The cast written around input(): "int", "float" or "" for text.
        function inputCast(stmt, types) {
          var chosen = stmt.inputType && stmt.inputType !== "auto" ? stmt.inputType : (types && types.inputTypes[stmt.id]) || "string";
          return CASTS[chosen] || "";
        }

        // Each code line for one tab as rows the code view draws. A row has
        // kind, depth, the statement and its path in the tree.
        function rowsFor(tree, depth) {
          var rows = [];
          function block(list, path, key, level, tail) {
            var start = rows.length;
            list.forEach(function (stmt, index) {
              var at = path.concat([[key, index]]);
              var isTail = tail && index === list.length - 1;
              if ((stmt.k === "end" || (stmt.k === "return" && !stmt.text)) && isTail) return;
              statement(stmt, at, level, isTail);
            });
            if (rows.length === start) rows.push({ kind: "pass", depth: level, path: path, key: key });
          }
          function statement(stmt, at, level, tail) {
            if (stmt.k === "if") {
              rows.push({ kind: "if", depth: level, stmt: stmt, path: at });
              block(stmt.then, at, "then", level + 1, tail);
              var current = stmt;
              var currentPath = at;
              while (current["else"].length === 1 && current["else"][0].k === "if") {
                var nextPath = currentPath.concat([["else", 0]]);
                current = current["else"][0];
                currentPath = nextPath;
                rows.push({ kind: "elif", depth: level, stmt: current, path: currentPath });
                block(current.then, currentPath, "then", level + 1, tail);
              }
              if (current["else"].length) {
                rows.push({ kind: "else", depth: level, stmt: current, path: currentPath });
                block(current["else"], currentPath, "else", level + 1, tail);
              }
              return;
            }
            if (stmt.k === "while") {
              rows.push({ kind: "while", depth: level, stmt: stmt, path: at });
              block(stmt.body, at, "body", level + 1, false);
              return;
            }
            if (stmt.k === "repeat") {
              rows.push({ kind: "repeat", depth: level, stmt: stmt, path: at });
              block(stmt.body, at, "body", level + 1, false);
              rows.push({ kind: "until", depth: level + 1, stmt: stmt, path: at });
              return;
            }
            rows.push({ kind: "simple", depth: level, stmt: stmt, path: at, tail: tail });
          }
          block(tree, [], "body", depth || 0, true);
          return rows;
        }

        // Python text for one row, plus any problem that stops it being saved.
        function rowText(row, tab, doc, types) {
          var env = (types && types.envs[tab.id]) || {};
          var problems = [];
          function expr(text, what, negated) {
            var result = exprToPython(text, env, negated);
            if (!result.ok) problems.push(result.hole ? what + " is empty." : what + ": " + result.error);
            return result.ok ? result.text : result.hole ? "…" : result.text;
          }
          function name(text, what) {
            var value = String(text || "").trim();
            if (!value) {
              problems.push(what + " is empty.");
              return "…";
            }
            var problem = L.nameProblem(value);
            if (problem) problems.push(problem.message);
            return value;
          }
          var stmt = row.stmt;
          var text = "";
          switch (row.kind) {
            case "pass": text = "pass"; break;
            case "if": text = "if " + expr(stmt.text, "The condition", stmt.negated) + ":"; break;
            case "elif": text = "elif " + expr(stmt.text, "The condition", stmt.negated) + ":"; break;
            case "else": text = "else:"; break;
            case "while": text = "while " + expr(stmt.text, "The condition", stmt.negated) + ":"; break;
            case "repeat": text = "while True:"; break;
            case "until": text = "if " + expr(stmt.text, "The condition", stmt.negated) + ": break"; break;
            case "simple":
              switch (stmt.k) {
                case "assign": {
                  var parts = splitAssignment(stmt.text);
                  text = name(parts.target, "The variable name") + " = " + expr(parts.expr, "The value");
                  break;
                }
                case "input": {
                  var cast = inputCast(stmt, types);
                  text = name(stmt.text, "The input variable") + " = " + (cast ? cast + "(input())" : "input()");
                  break;
                }
                case "output": text = "print(" + expr(stmt.text, "The value to print") + ")"; break;
                case "call": {
                  var sub = subprogramMap(doc)[stmt.calleeId];
                  if (!sub) {
                    problems.push("Choose which subprogram to call.");
                    text = "…()";
                    break;
                  }
                  var params = L.parseParams(sub.paramsText).params;
                  var args = params.map(function (param, index) { return expr((stmt.args || [])[index], "The value for " + param); });
                  text = (stmt.target ? name(stmt.target, "The result variable") + " = " : "") + sub.name + "(" + args.join(", ") + ")";
                  break;
                }
                case "return": {
                  var value = String(stmt.text || "").trim();
                  text = value ? "return " + expr(value, "The return value") : "return";
                  break;
                }
                case "end": text = "exit()"; break;
              }
              break;
          }
          return { text: text, problems: problems };
        }

        function treeUsesRandom(doc) {
          return doc.tabs.some(function (tab) {
            return tab.nodes.some(function (node) {
              var sources = [];
              if (node.type === "process") processLines(node.text).forEach(function (line) { sources.push(splitAssignment(line).expr); });
              else if (node.type === "call") sources = (node.args || []).slice();
              else sources.push(L.cleanCondition(node.text));
              return sources.some(function (source) { return usesRandom(tryParse(source)); });
            });
          });
        }

        function orderedTabs(doc) {
          var subs = doc.tabs.filter(function (tab) { return tab.kind === "sub"; });
          var main = doc.tabs.filter(function (tab) { return tab.kind === "main"; });
          return subs.concat(main);
        }

        // The whole document as a Python program. ok is false while any tab
        // can't be structured or any slot is empty or invalid.
        function toPython(doc) {
          var types = inferTypes(doc);
          var out = [];
          var problems = [];
          if (treeUsesRandom(doc)) out.push("import random");
          orderedTabs(doc).forEach(function (tab) {
            var structured = structureTab(tab);
            var label = tab.kind === "main" ? "Main" : tab.name;
            if (out.length) out.push("", "");
            if (tab.kind === "sub") {
              var nameProblem = L.nameProblem(String(tab.name || "").trim(), "The subprogram name");
              if (nameProblem) problems.push({ tabId: tab.id, nodeId: null, message: label + ": " + nameProblem.message });
              var paramsError = L.parseParams(tab.paramsText).error;
              if (paramsError) problems.push({ tabId: tab.id, nodeId: null, message: label + ": " + paramsError.message });
              out.push("def " + tab.name + "(" + L.parseParams(tab.paramsText).params.join(", ") + "):");
            }
            var depth = tab.kind === "sub" ? 1 : 0;
            if (!structured.ok) {
              problems.push({ tabId: tab.id, nodeId: structured.nodeIds[0] || null, message: label + ": " + structured.message });
              out.push(indent(depth) + "# " + structured.message);
              out.push(indent(depth) + "pass");
              return;
            }
            rowsFor(structured.body, depth).forEach(function (row) {
              var line = rowText(row, tab, doc, types);
              line.problems.forEach(function (message) {
                problems.push({ tabId: tab.id, nodeId: row.stmt ? row.stmt.id : null, message: label + ": " + message });

              layout.header = { text: signature, w: Math.max(150, textWidth(signature, "code") + 56), h: 40 };
            }
            return layout;
          }
          case "end": {
            const lines = [{ text: "END", kind: "key" }];
            return { shape: "terminator", lines, w: Math.max(110, widest(lines) + 48), h: 42 };
          }
          case "return": {
            const value = text.trim();
            const lines = [{ text: "RETURN", kind: "key" }];
            if (value) lines.push({ text: value, kind: "code" });
            else if (editing) lines.push({ text: "value", kind: "hint" });
            return { shape: "terminator", lines, w: Math.max(120, widest(lines) + 52), h: lines.length > 1 ? 58 : 42 };
          }
          case "process": {
            const rows = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const lines = rows.length ? rows.map((line) => ({ text: line, kind: "code" })) : [{ text: "assignment", kind: "hint" }];
            return { shape: "process", lines, w: Math.max(140, widest(lines) + 40), h: Math.max(46, lines.length * LINE + 24) };
          }
          case "input":
          case "output": {
            const typed = node.type === "input" && node.inputType && node.inputType !== "auto";
            const lines = [
              { text: typed ? "INPUT (" + FlowLang.INPUT_TYPES[node.inputType].label + ")" : node.type.toUpperCase(), kind: "key" },
              text.trim() ? { text: text.trim(), kind: "code" } : { text: node.type === "input" ? "variable" : "value", kind: "hint" },
            ];
            return { shape: "io", lines, w: Math.max(150, widest(lines) + 44 + SKEW), h: 58 };
          }
          case "decision": {
            const condition = FlowLang.cleanCondition(text);
            const lines = [condition ? { text: condition, kind: "code" } : { text: "condition", kind: "hint" }];
            return { shape: "decision", lines, w: Math.max(170, Math.round(widest(lines) * 1.45) + 44), h: 96 };
          }
          case "call": {
            const label = FlowLang.callText(node, doc);
            const lines = [label ? { text: label, kind: "code" } : { text: "choose subprogram", kind: "hint" }];
            return { shape: "call", lines, w: Math.max(160, widest(lines) + 60), h: 48 };
          }
        }
        return { shape: "process", lines: [{ text: node.type, kind: "hint" }], w: 140, h: 46 };
      }

      function blockBox(node, layout, withHeader) {
        const box = {
          left: node.x - layout.w / 2,
          right: node.x + layout.w / 2,
          top: node.y - layout.h / 2,
          bottom: node.y + layout.h / 2,
        };
        if (withHeader && layout.header) {
          box.top = node.y - layout.h / 2 - HEADER_GAP - layout.header.h;
          box.left = Math.min(box.left, node.x - layout.header.w / 2);
          box.right = Math.max(box.right, node.x + layout.header.w / 2);
        }
        return box;
      }

      function sidePoint(node, layout, side) {
        const inset = layout.shape === "io" ? SKEW / 2 : 0;
        if (side === "left") return { x: node.x - layout.w / 2 + inset, y: node.y };
        if (side === "right") return { x: node.x + layout.w / 2 - inset, y: node.y };
        if (side === "top") return { x: node.x, y: node.y - layout.h / 2 };
        return { x: node.x, y: node.y + layout.h / 2 };
      }

      // The exit a block added from the palette attaches to: the one the
      // student picked by clicking its dot, otherwise the bottom exit.
      function insertPortFor(node, chosen) {
        const ports = FlowLang.OUTPUT_PORTS[node.type] || [];
        if (chosen && chosen.nodeId === node.id && ports.includes(chosen.port)) return chosen.port;
        return ports.find((port) => portSide(node, port) === "bottom") || ports[0] || null;
      }

      function portSide(node, port) {
        if (port === "true") return node.trueSide || "bottom";
        if (port === "false") return node.falseSide || "right";
        return "bottom";
      }

      /* ---------------------------------------------------------------
         Connector routing. Connectors are orthogonal and run along a
         sparse grid of lines that keep clear of every block. Each one is
         found with a shortest-path search that charges for length, for
         each bend, for crossing another connector and for running along
         one, so connectors take the clearest path rather than a fixed
         shape.

         A decision is only ever entered from the top and its exits stay
         on the sides the student chose. Any other block may be entered
         from any side its exit isn't using, and its exit may leave from
         any side no connector enters, although the usual top-in,
         bottom-out arrangement is preferred whenever it is as clear.
         After a first pass, each troubled block's connectors are
         re-routed exits-first and the result is kept if the whole chart
         is clearer. Where connectors join before entering a block, the
         one that joins gets an arrowhead at the junction.
         --------------------------------------------------------------- */
      const CLEAR = 20; // routing lines run this far from a block
      const LANE = 16; // spacing of the extra lanes used by nested loops
      const PAD = 12; // no connector comes closer to a block than this
      const BEND_COST = 22;
      const CROSS_COST = 160;
      const OVERLAP_COST = 5; // per unit of length shared with an unrelated connector
      const EXIT_COST = { bottom: 0, left: 34, right: 34, top: 46 };
      const ENTRY_COST = { top: 0, left: 22, right: 22, bottom: 40 };
      const ROUTE_SIDES = ["bottom", "right", "left", "top"];
      const SEARCH_LIMIT = 4000; // grid steps one search may explore
      const SIDE_DIR = { top: 0, right: 1, bottom: 2, left: 3 }; // up, right, down, left

      function stubLength(node, side) {
        if (node.type !== "decision" || side === "top") return CLEAR;
        // Room for the True/False label beside a decision's exit.
        return side === "bottom" ? 34 : 54;
      }

      // Where a connector leaving or entering this side meets the grid.
      function stubPoint(node, layout, side) {
        const p = sidePoint(node, layout, side);
        const box = blockBox(node, layout, false);
        const length = stubLength(node, side);
        if (side === "top") return { x: p.x, y: box.top - length };
        if (side === "bottom") return { x: p.x, y: box.bottom + length };
        if (side === "left") return { x: box.left - length, y: p.y };
        return { x: box.right + length, y: p.y };
      }

      // The True/False labels beside a decision's exits; other connectors keep off them.
      function labelBoxes(node, layout) {
        if (node.type !== "decision") return [];
        return FlowLang.OUTPUT_PORTS.decision.map((port) => {
          const side = portSide(node, port);
          const p = sidePoint(node, layout, side);
          if (side === "bottom") return { left: p.x + 4, right: p.x + 46, top: p.y + 4, bottom: p.y + 24 };
          if (side === "right") return { left: p.x + 4, right: p.x + 48, top: p.y - 20, bottom: p.y + 2 };
          return { left: p.x - 48, right: p.x - 4, top: p.y - 20, bottom: p.y + 2 };
        });
      }

      function segmentClear(obstacles, a, b, ownId) {
        const low = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y) };
        const high = { x: Math.max(a.x, b.x), y: Math.max(a.y, b.y) };
        return !obstacles.some((o) => {
          if (o.id === ownId) return false;
          if (a.x === b.x) return o.left < a.x && a.x < o.right && o.top < high.y && o.bottom > low.y;
          return o.top < a.y && a.y < o.bottom && o.left < high.x && o.right > low.x;
        });
      }

      function lowerBound(values, target) {
        let low = 0;
        let high = values.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (values[mid] < target) low = mid + 1;
          else high = mid;
        }
        return low;
      }

      function buildRouteGrid(nodes, layouts) {
        const xsSet = new Set();
        const ysSet = new Set();
        const obstacles = [];
        let bounds = null;
        nodes.forEach((node) => {
          const layout = layouts.get(node.id);
          const box = blockBox(node, layout, true);
          obstacles.push({ id: node.id, left: box.left - PAD, right: box.right + PAD, top: box.top - PAD, bottom: box.bottom + PAD });
          labelBoxes(node, layout).forEach((label) => obstacles.push({ id: node.id, ...label }));
          xsSet.add(node.x);
          ysSet.add(node.y);
          [CLEAR, CLEAR + LANE].forEach((gap) => {
            xsSet.add(box.left - gap);
            xsSet.add(box.right + gap);
            ysSet.add(box.top - gap);
            ysSet.add(box.bottom + gap);
          });
          ROUTE_SIDES.forEach((side) => {
            const stub = stubPoint(node, layout, side);
            xsSet.add(stub.x);
            ysSet.add(stub.y);
          });
          if (!bounds) bounds = { ...box };
          else {
            bounds.left = Math.min(bounds.left, box.left);
            bounds.right = Math.max(bounds.right, box.right);
            bounds.top = Math.min(bounds.top, box.top);
            bounds.bottom = Math.max(bounds.bottom, box.bottom);
          }
        });
        // Outer lanes for connectors that must go round everything.
        for (let lane = 0; lane < 3; lane += 1) {
          const gap = 70 + lane * LANE;
          xsSet.add(bounds.left - gap);
          xsSet.add(bounds.right + gap);
          ysSet.add(bounds.top - gap);
          ysSet.add(bounds.bottom + gap);
        }
        const xs = [...xsSet].sort((a, b) => a - b);
        const ys = [...ysSet].sort((a, b) => a - b);
        const NX = xs.length;
        const NY = ys.length;
        const nb = new Int32Array(NX * NY * 4).fill(-1);
        for (let yi = 0; yi < NY; yi += 1) {
          const y = ys[yi];
          const row = obstacles.filter((o) => o.top < y && y < o.bottom);
          for (let xi = 0; xi < NX - 1; xi += 1) {
            const xa = xs[xi];
            const xb = xs[xi + 1];
            if (row.some((o) => o.left < xb && o.right > xa)) continue;
            const a = yi * NX + xi;
            nb[a * 4 + 1] = a + 1;
            nb[(a + 1) * 4 + 3] = a;
          }
        }
        for (let xi = 0; xi < NX; xi += 1) {
          const x = xs[xi];
          const column = obstacles.filter((o) => o.left < x && x < o.right);
          for (let yi = 0; yi < NY - 1; yi += 1) {
            const ya = ys[yi];
            const yb = ys[yi + 1];
            if (column.some((o) => o.top < yb && o.bottom > ya)) continue;
            const a = yi * NX + xi;
            nb[a * 4 + 2] = a + NX;
            nb[(a + NX) * 4] = a;
          }
        }
        const NP = NX * NY;
        const px = new Float64Array(NP);
        const py = new Float64Array(NP);
        for (let pi = 0; pi < NP; pi += 1) {
          px[pi] = xs[pi % NX];
          py[pi] = ys[(pi / NX) | 0];
        }
        // Connected regions, so a connector with no possible path is
        // spotted at once instead of after searching the whole grid.
        const region = new Int32Array(NP).fill(-1);
        const stack = [];
        let regions = 0;
        for (let start = 0; start < NP; start += 1) {
          if (region[start] >= 0) continue;
          region[start] = regions;
          stack.push(start);
          while (stack.length) {
            const pi = stack.pop();
            for (let dir = 0; dir < 4; dir += 1) {
              const next = nb[pi * 4 + dir];
              if (next >= 0 && region[next] < 0) {
                region[next] = regions;
                stack.push(next);
              }
            }
          }
          regions += 1;
        }
        return {
          xs, ys, NX, NY, nb, obstacles, px, py, region,
          nodeIndex: new Map([...nodes.keys()].map((id, index) => [id, index])),
          xIndex: new Map(xs.map((x, index) => [x, index])),
          yIndex: new Map(ys.map((y, index) => [y, index])),
          gScore: new Float64Array(NP * 4),
          prev: new Int32Array(NP * 4),
          seen: new Int32Array(NP * 4),
          stamp: 0,
        };
      }

      // Which grid points and grid segments the placed connectors use. Each
      // entry holds the index of the block those connectors lead to, -1 for
      // none, or -2 when connectors to different blocks share it.
      function buildOccupancy(grid, routeList, into) {
        const NP = grid.NX * grid.NY;
        const occ = into || {
          h: new Int32Array(NP).fill(-1),
          v: new Int32Array(NP).fill(-1),
          hp: new Int32Array(NP).fill(-1),
          vp: new Int32Array(NP).fill(-1),
        };
        const add = (cells, pi, to) => {
          const current = cells[pi];
          if (current === -1) cells[pi] = to;
          else if (current !== to) cells[pi] = -2;
        };
        routeList.forEach((routeItem) => {
          const route = { points: routeItem.points, to: grid.nodeIndex.get(routeItem.to) };
          const points = route.points;
          for (let index = 0; index < points.length - 1; index += 1) {
            const a = points[index];
            const b = points[index + 1];
            if (a.y === b.y) {
              const yi = grid.yIndex.get(a.y);
              if (yi === undefined) continue;
              const high = Math.max(a.x, b.x);
              for (let xi = lowerBound(grid.xs, Math.min(a.x, b.x)); xi < grid.NX && grid.xs[xi] <= high; xi += 1) {
                const pi = yi * grid.NX + xi;
                add(occ.hp, pi, route.to);
                if (xi + 1 < grid.NX && grid.xs[xi + 1] <= high) add(occ.h, pi, route.to);
              }
            } else if (a.x === b.x) {
              const xi = grid.xIndex.get(a.x);
              if (xi === undefined) continue;
              const high = Math.max(a.y, b.y);
              for (let yi = lowerBound(grid.ys, Math.min(a.y, b.y)); yi < grid.NY && grid.ys[yi] <= high; yi += 1) {
                const pi = yi * grid.NX + xi;
                add(occ.vp, pi, route.to);
                if (yi + 1 < grid.NY && grid.ys[yi + 1] <= high) add(occ.v, pi, route.to);
              }
            }
          }
        });
        return occ;
      }

      // Connectors heading for the same block may share a line: they merge.
      function conflicts(cells, pi, to) {
        const current = cells[pi];
        return current !== -1 && current !== to;
      }

      function simplifyPoints(points) {
        const result = [];
        points.forEach((point) => {
          const last = result[result.length - 1];
          if (last && Math.abs(last.x - point.x) < 0.01 && Math.abs(last.y - point.y) < 0.01) return;
          if (result.length >= 2) {
            const before = result[result.length - 2];
            if ((before.x === last.x && last.x === point.x) || (before.y === last.y && last.y === point.y)) {
              result[result.length - 1] = point;
              return;
            }
          }
          result.push(point);
        });
        return result;
      }

      function routeLength(points) {
        let total = 0;
        for (let index = 1; index < points.length; index += 1) {
          total += Math.abs(points[index].x - points[index - 1].x) + Math.abs(points[index].y - points[index - 1].y);
        }
        return total;
      }

      // Shortest path from any allowed exit of `from` to any allowed entry of `to`.
      // With `ignoreOthers` the search skips the cost of crossing other
      // connectors: a quick fallback for very tangled charts.
      function searchRoute(grid, occ, from, fromLayout, to, toLayout, exitSides, entrySides, fixedExit, ignoreOthers) {
        const { NX, nb, px, py, gScore, prev, seen, region } = grid;
        const own = grid.nodeIndex.get(to.id);
        grid.stamp += 1;
        const stamp = grid.stamp;
        const scoreOf = (state) => (seen[state] === stamp ? gScore[state] : Infinity);
        const heapF = [];
        const heapS = [];
        const push = (f, state) => {
          let index = heapF.length;
          heapF.push(f);
          heapS.push(state);
          while (index > 0) {
            const parent = (index - 1) >> 1;
            if (heapF[parent] <= f) break;
            heapF[index] = heapF[parent];
            heapS[index] = heapS[parent];
            index = parent;
          }
          heapF[index] = f;
          heapS[index] = state;
        };
        const pop = () => {
          const top = heapS[0];
          const topF = heapF[0];
          const lastF = heapF.pop();
          const lastS = heapS.pop();
          if (heapF.length) {
            let index = 0;
            const size = heapF.length;
            while (true) {
              let child = index * 2 + 1;
              if (child >= size) break;
              if (child + 1 < size && heapF[child + 1] < heapF[child]) child += 1;
              if (heapF[child] >= lastF) break;
              heapF[index] = heapF[child];
              heapS[index] = heapS[child];
              index = child;
            }
            heapF[index] = lastF;
            heapS[index] = lastS;
          }
          return [topF, top];
        };

        const goals = new Map();
        const goalList = [];
        entrySides.forEach((side) => {
          const q = sidePoint(to, toLayout, side);
          const t = stubPoint(to, toLayout, side);
          const xi = grid.xIndex.get(t.x);
          const yi = grid.yIndex.get(t.y);
          if (xi === undefined || yi === undefined || !segmentClear(grid.obstacles, t, q, to.id)) return;
          const goal = { side, q, t, inward: (SIDE_DIR[side] + 2) % 4, extra: ENTRY_COST[side] + routeLength([t, q]) };
          const pi = yi * NX + xi;
          if (!goals.has(pi)) goals.set(pi, []);
          goals.get(pi).push(goal);
          goalList.push(goal);
        });
        if (!goalList.length) return null;
        const goalX = goalList.map((goal) => goal.t.x);
        const goalY = goalList.map((goal) => goal.t.y);
        const goalRegions = new Set([...goals.keys()].map((pi) => region[pi]));
        const heuristic = (pi) => {
          const x = px[pi];
          const y = py[pi];
          let best = Infinity;
          for (let index = 0; index < goalX.length; index += 1) {
            const d = Math.abs(x - goalX[index]) + Math.abs(y - goalY[index]);
            if (d < best) best = d;
          }
          return best;
        };
        const goalRowGap = (y) => {
          let best = Infinity;
          for (let index = 0; index < goalY.length; index += 1) {
            const d = Math.abs(y - goalY[index]);
            if (d < best) best = d;
          }
          return best;
        };

        const startSide = new Map();
        exitSides.forEach((side) => {
          const p = sidePoint(from, fromLayout, side);
          const s = stubPoint(from, fromLayout, side);
          const xi = grid.xIndex.get(s.x);
          const yi = grid.yIndex.get(s.y);
          if (xi === undefined || yi === undefined || !segmentClear(grid.obstacles, p, s, from.id)) return;
          const pi = yi * NX + xi;
          if (!goalRegions.has(region[pi])) return;
          const state = pi * 4 + SIDE_DIR[side];
          const g = (fixedExit ? 0 : EXIT_COST[side]) + routeLength([p, s]);
          if (g < scoreOf(state)) {
            seen[state] = stamp;
            gScore[state] = g;
            prev[state] = -1;
            startSide.set(state, { side, p });
            push(g + heuristic(pi), state);
          }
        });
        if (!startSide.size) return null;

        let bestCost = Infinity;
        let best = null;
        let expanded = 0;
        while (heapF.length) {
          expanded += 1;
          if (expanded > SEARCH_LIMIT) {
            if (best) break;
            return ignoreOthers ? null : searchRoute(grid, occ, from, fromLayout, to, toLayout, exitSides, entrySides, fixedExit, true);
          }
          const [f, state] = pop();
          if (f >= bestCost) break;
          const g = gScore[state];
          if (f - heuristic(state >> 2) > g + 1e-6) continue;
          const pi = state >> 2;
          const dir = state & 3;
          const here = goals.get(pi);
          if (here) {
            here.forEach((goal) => {
              if (dir === (goal.inward + 2) % 4) return;
              const total = g + (dir === goal.inward ? 0 : BEND_COST) + goal.extra;
              if (total < bestCost) {
                bestCost = total;
                best = { state, goal };
              }
            });
          }
          const ax = px[pi];
          const ay = py[pi];
          for (let nd = 0; nd < 4; nd += 1) {
            if (nd === (dir + 2) % 4) continue;
            const npi = nb[pi * 4 + nd];
            if (npi < 0) continue;
            const horizontal = nd === 1 || nd === 3;
            const length = horizontal ? Math.abs(px[npi] - ax) : Math.abs(py[npi] - ay);
            let cost = length + (nd === dir ? 0 : BEND_COST);
            const segment = Math.min(pi, npi);
            if (!ignoreOthers) {
              if (conflicts(horizontal ? occ.h : occ.v, segment, own)) cost += OVERLAP_COST * length;
              if (conflicts(horizontal ? occ.vp : occ.hp, npi, own)) cost += CROSS_COST;
            }
            // Run across at the target's level, so connectors join neatly.
            if (horizontal) cost += length * goalRowGap(ay) * 0.0005;
            const next = npi * 4 + nd;
            if (g + cost < scoreOf(next) - 1e-9) {
              seen[next] = stamp;
              gScore[next] = g + cost;
              prev[next] = state;
              push(g + cost + heuristic(npi), next);
            }
          }
        }
        if (!best) return null;
        const trail = [];
        let state = best.state;
        let first = state;
        while (state >= 0) {
          trail.push(state >> 2);
          first = state;
          state = prev[state];
        }
        trail.reverse();
        const start = startSide.get(first);
        const points = [start.p, ...trail.map((pi) => ({ x: px[pi], y: py[pi] })), best.goal.q];
        return { points: simplifyPoints(points), exit: start.side, entry: best.goal.side, fixedExit };
      }

      // Blocks too close for the grid: a straight line between facing sides.
      function directRoute(grid, from, fromLayout, to, toLayout, exitSides, entrySides, fixedExit) {
        const facing = { bottom: "top", top: "bottom", left: "right", right: "left" };
        let best = null;
        exitSides.forEach((exit) => {
          const entry = facing[exit];
          if (!entrySides.includes(entry)) return;
          const p = sidePoint(from, fromLayout, exit);
          const q = sidePoint(to, toLayout, entry);
