    <style>
      body {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }

      /* Full-height designer. The production site navigation bar is 58px
         tall, so the built page subtracts it to keep the canvas and the run
         controls inside the viewport. Below the desktop breakpoint the panels
         stack and the page scrolls as a document. */
      .flowchart-app {
        min-height: 100vh;
      }
      @media (min-width: 1024px) {
        .flowchart-app {
          height: 100vh;
          min-height: 0;
        }
        body[data-site-page="interactive"] .flowchart-app {
          height: calc(100vh - 58px);
        }
      }

      .fc-main {
        grid-template-columns: minmax(0, 1fr);
      }
      .fc-canvas-column {
        height: 72vh;
        min-height: 420px;
      }
      @media (min-width: 1024px) {
        /* An explicit flexible row, so the shared shell's align-content
           rule for post-header grids cannot collapse the canvas. */
        .fc-main {
          column-gap: 0.25rem;
          grid-template-columns: 12rem minmax(0, 1fr) 0.75rem var(--fc-side-width, 22rem);
          grid-template-rows: minmax(0, 1fr);
        }
        .fc-main > aside:first-child {
          margin-right: 0.5rem;
        }
        .fc-canvas-column {
          height: auto;
          min-height: 0;
        }
      }
      @media (min-width: 1536px) {
        .fc-main {
          grid-template-columns: 12rem minmax(0, 1fr) 0.75rem var(--fc-side-width, 26rem);
        }
      }

      /* Canvas colours. Shapes are outlines only; the shape interior uses the
         canvas colour so that connectors passing behind a block are hidden. */
      .fc-canvas {
        --fc-bg: #ffffff;
        --fc-grid: #d3dae4;
        --fc-stroke: #1e293b;
        --fc-text: #0f172a;
        --fc-muted: #64748b;
        --fc-edge: #334155;
        --fc-select: #4f46e5;
        --fc-current: #b45309;
        --fc-current-glow: rgba(217, 119, 6, 0.28);
        --fc-error: #dc2626;
        --fc-true: #047857;
        --fc-false: #b91c1c;
        background-color: var(--fc-bg);
        background-image: radial-gradient(var(--fc-grid) 1.1px, transparent 1.2px);
      }
      html.dark .fc-canvas {
        --fc-bg: #0b1220;
        --fc-grid: #273449;
        --fc-stroke: #e2e8f0;
        --fc-text: #f1f5f9;
        --fc-muted: #94a3b8;
        --fc-edge: #cbd5e1;
        --fc-select: #a5b4fc;
        --fc-current: #fbbf24;
        --fc-current-glow: rgba(251, 191, 36, 0.3);
        --fc-error: #f87171;
        --fc-true: #6ee7b7;
        --fc-false: #fca5a5;
      }
      .fc-canvas svg {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .fc-canvas.fc-panning,
      .fc-canvas.fc-panning * {
        cursor: grabbing !important;
      }
      .fc-node {
        cursor: grab;
        outline: none;
      }
      .fc-run .fc-node {
        cursor: default;
      }
      .fc-node:focus-visible .fc-focus-ring {
        stroke: var(--fc-select);
        stroke-width: 2;
        stroke-dasharray: 5 4;
        opacity: 1;
      }
      .fc-focus-ring {
        opacity: 0;
      }
      .fc-port {
        cursor: crosshair;
      }
      .fc-port-connected {
        opacity: 0;
        transition: opacity 120ms;
      }
      .fc-node:hover .fc-port-connected,
      .fc-node-selected .fc-port-connected {
        opacity: 1;
      }
      .fc-edge-hit {
        cursor: pointer;
      }
      .fc-caret {
        animation: fc-caret-blink 1.05s steps(1) infinite;
      }
      @keyframes fc-caret-blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fc-caret {
          animation: none;
        }
      }
      .fc-label {
        paint-order: stroke;
        stroke: var(--fc-bg);
        stroke-width: 4px;
        stroke-linejoin: round;
      }

      .fc-ghost {
        pointer-events: none;
        position: fixed;
        z-index: 60;
        transform: translate(-50%, -50%);
      }

      .fc-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
      }
    </style>

    <div id="root"></div>

    <script id="flowchart-language">
      /* ---------------------------------------------------------------
         Flowchart language. Plain JavaScript, independent of React, so the
         build checks can load it and run every example flowchart.

         Values are { type, v } with type INT, REAL, STRING or BOOL.
         Variables are created by assignment or INPUT and are local to the
         flowchart (Main or one subprogram) that creates them.
         --------------------------------------------------------------- */
      var FlowLang = (function () {
        "use strict";

        var BUILTINS = {
          LEN: { min: 1, max: 1, usage: "LEN(text)" },
          INT: { min: 1, max: 1, usage: "INT(value)" },
          REAL: { min: 1, max: 1, usage: "REAL(value)" },
          STR: { min: 1, max: 1, usage: "STR(value)" },
          ROUND: { min: 1, max: 2, usage: "ROUND(number) or ROUND(number, places)" },
          RANDOM_INT: { min: 2, max: 2, usage: "RANDOM_INT(low, high)" },
        };
        var WORD_OPERATORS = { AND: 1, OR: 1, NOT: 1, DIV: 1, MOD: 1 };
        var RESERVED = {};
        ["AND", "OR", "NOT", "DIV", "MOD", "TRUE", "FALSE", "INPUT", "OUTPUT", "RETURN", "START", "END"]
          .concat(Object.keys(BUILTINS))
          .forEach(function (word) { RESERVED[word] = 1; });
        var COMPARISONS = { "==": 1, "!=": 1, "<": 1, "<=": 1, ">": 1, ">=": 1 };
        var BINDING = {
          OR: 10, AND: 20,
          "==": 30, "!=": 30, "<": 30, "<=": 30, ">": 30, ">=": 30,
          "+": 40, "-": 40,
          "*": 50, "/": 50, DIV: 50, MOD: 50,
          "^": 70,
        };
        var MAX_CALL_DEPTH = 200;

        function FlowError(message, hint) {
          this.message = message;
          this.hint = hint || "";
        }
        FlowError.prototype = Object.create(Error.prototype);
        FlowError.prototype.name = "FlowError";

        function fail(message, hint) {
          throw new FlowError(message, hint);
        }

        /* ---------- Names ---------- */

        function isReserved(name) {
          return Object.prototype.hasOwnProperty.call(RESERVED, String(name).toUpperCase());
        }

        // Returns null for a usable variable or subprogram name, otherwise a
        // FlowError explaining what is wrong with it.
        function nameProblem(name, what) {
          what = what || "A variable name";
          if (!name) return new FlowError(what + " is missing.");
          if (/\s/.test(name)) {
            return new FlowError(what + " can't contain spaces.", "Try " + name.trim().replace(/\s+/g, "_") + " instead.");
          }
          if (/^[0-9]/.test(name)) return new FlowError(what + " must start with a letter.");
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
            return new FlowError(what + " can only use letters, digits and _.", "\"" + name + "\" is not allowed.");
          }
          if (isReserved(name)) {
            return new FlowError(name + " is a reserved word, so it can't be used as a name.");
          }
          return null;
        }

        /* ---------- Tokens ---------- */

        var OPEN_QUOTES = { "\"": "\"", "“": "\"", "”": "\"", "'": "'", "‘": "'", "’": "'" };

        function tokenize(source) {
          var tokens = [];
          var i = 0;
          var text = String(source);
          while (i < text.length) {
            var ch = text[i];
            if (/\s/.test(ch)) { i += 1; continue; }
            var start = i;

            if (/[0-9]/.test(ch)) {
              var j = i;
              while (j < text.length && /[0-9]/.test(text[j])) j += 1;
              var real = false;
              if (text[j] === "." && /[0-9]/.test(text[j + 1] || "")) {
                real = true;
                j += 1;
                while (j < text.length && /[0-9]/.test(text[j])) j += 1;
              } else if (text[j] === ".") {
                fail("\"" + text.slice(i, j + 1) + "\" is not a complete number.", "Write decimals with a digit after the point, e.g. 2.5 or 2.0");
              }
              if (/[A-Za-z_]/.test(text[j] || "")) {
                var word = text.slice(i).match(/^[A-Za-z0-9_]+/)[0];
                fail("\"" + word + "\" is not a number or a valid name.", "Variable names must start with a letter.");
              }
              tokens.push({ t: "num", v: Number(text.slice(i, j)), real: real, pos: start, text: text.slice(i, j) });
              i = j;
              continue;
            }

            if (OPEN_QUOTES[ch]) {
              var family = OPEN_QUOTES[ch];
              var k = i + 1;
              while (k < text.length && OPEN_QUOTES[text[k]] !== family) k += 1;
              if (k >= text.length) {
                fail("This text is missing its closing quote mark.", "Text must be inside a matching pair of quotes, e.g. \"Hello\"");
              }
              tokens.push({ t: "str", v: text.slice(i + 1, k), pos: start, text: text.slice(i, k + 1) });
              i = k + 1;
              continue;
            }

            if (/[A-Za-z_]/.test(ch)) {
              var name = text.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/)[0];
              var upper = name.toUpperCase();
              if (upper === "TRUE" || upper === "FALSE") {
                tokens.push({ t: "bool", v: upper === "TRUE", pos: start, text: name });
              } else if (WORD_OPERATORS[upper]) {
                tokens.push({ t: "op", v: upper, pos: start, text: name });
              } else {
                tokens.push({ t: "id", v: name, pos: start, text: name });
              }
              i += name.length;
              continue;
            }

            var two = text.slice(i, i + 2);
            if (two === "+=" || two === "-=" || two === "*=" || two === "/=") {
              fail(two + " is not used in this pseudocode.", "Write the full assignment, e.g. total = total + 1");
            }
            if (two === "//") fail("// is not an operator here.", "Use DIV for whole-number division, e.g. 7 DIV 2");
            if (two === "&&") fail("&& is not an operator here.", "Use AND, e.g. x > 1 AND x < 10");
            if (two === "||") fail("|| is not an operator here.", "Use OR, e.g. x < 1 OR x > 10");
            if (two === "==" || two === "!=" || two === "<=" || two === ">=") {
              tokens.push({ t: "op", v: two, pos: start, text: two });
              i += 2;
              continue;
            }
            if (two === "<>") {
              tokens.push({ t: "op", v: "!=", pos: start, text: two });
              i += 2;
              continue;
            }
            if (ch === "≠") { tokens.push({ t: "op", v: "!=", pos: start, text: ch }); i += 1; continue; }
            if (ch === "≤") { tokens.push({ t: "op", v: "<=", pos: start, text: ch }); i += 1; continue; }
            if (ch === "≥") { tokens.push({ t: "op", v: ">=", pos: start, text: ch }); i += 1; continue; }
            if (ch === "←") { tokens.push({ t: "assign", v: "=", pos: start, text: ch }); i += 1; continue; }
            if (ch === "=") { tokens.push({ t: "assign", v: "=", pos: start, text: ch }); i += 1; continue; }
            if ("<>+-*/^".indexOf(ch) >= 0) { tokens.push({ t: "op", v: ch, pos: start, text: ch }); i += 1; continue; }
            if (ch === "(" || ch === ")" || ch === ",") { tokens.push({ t: ch, v: ch, pos: start, text: ch }); i += 1; continue; }
            if (ch === "%") fail("% is not an operator here.", "Use MOD for the remainder, e.g. 7 MOD 2");
            if (ch === "!") fail("! on its own is not an operator here.", "Use NOT, or != for “not equal to”");
            if (ch === "[" || ch === "]") fail("Arrays are not supported yet.");
            if (ch === "?") fail("A ? is only used on decisions, and it is added for you.");
            fail("Unexpected character \"" + ch + "\".");
          }
          return tokens;
        }

        /* ---------- Expressions ---------- */

        function Parser(tokens, options) {
          this.tokens = tokens;
          this.index = 0;
          this.options = options || {};
        }
        Parser.prototype.peek = function () { return this.tokens[this.index]; };
        Parser.prototype.next = function () { return this.tokens[this.index++]; };
        Parser.prototype.done = function () { return this.index >= this.tokens.length; };

        Parser.prototype.unexpected = function (token) {
          if (!token) fail("This expression is incomplete.", "Something is missing at the end.");
          if (token.t === "assign") {
            fail("A single = gives a variable a value; it can't be used here.", "To compare two values use ==, e.g. guess == answer");
          }
          if (token.t === ",") {
            fail("Commas can only separate the values given to a function.", "To join values together use +, e.g. \"Score: \" + total");
          }
          if (token.t === ")") fail("There is a ) without a matching (.");
          fail("\"" + token.text + "\" was not expected here.");
        };

        Parser.prototype.expression = function (minBinding) {
          var left = this.prefix();
          for (;;) {
            var token = this.peek();
            if (!token || token.t === ")" || token.t === ",") break;
            if (token.t !== "op" || !BINDING[token.v]) {
              if (token.t === "id" || token.t === "num" || token.t === "str" || token.t === "bool" || token.t === "(") {
                fail("An operator is missing before \"" + token.text + "\".", "To join text and values use +, e.g. \"Score: \" + total");
              }
              if (token.t === "op" && token.v === "NOT") fail("NOT can only go before a condition, e.g. NOT (x > 5)");
              this.unexpected(token);
            }
            var binding = BINDING[token.v];
            if (binding <= minBinding) break;
            this.next();
            var op = token.v;
            var right = this.expression(op === "^" ? binding - 1 : binding);
            if (COMPARISONS[op]) {
              var after = this.peek();
              if (after && after.t === "op" && COMPARISONS[after.v]) {
                fail("Comparisons can't be chained like this.", "Join two comparisons with AND, e.g. x > 1 AND x < 10");
              }
            }
            left = { k: "bin", op: op, l: left, r: right };
          }
          return left;
        };

        Parser.prototype.prefix = function () {
          var token = this.next();
          if (!token) fail("This expression is incomplete.", "Something is missing at the end.");
          if (token.t === "num") return { k: "lit", value: { type: token.real ? "REAL" : "INT", v: token.v } };
          if (token.t === "str") return { k: "lit", value: { type: "STRING", v: token.v } };
          if (token.t === "bool") return { k: "lit", value: { type: "BOOL", v: token.v } };
          if (token.t === "(") {
            var inner = this.expression(0);
            var close = this.next();
            if (!close || close.t !== ")") fail("A ( is missing its closing ).");
            return inner;
          }
          if (token.t === "op" && token.v === "-") return { k: "neg", e: this.expression(60) };
          if (token.t === "op" && token.v === "+") return this.expression(60);
          if (token.t === "op" && token.v === "NOT") return { k: "not", e: this.expression(25) };
          if (token.t === "id") {
            var following = this.peek();
            if (following && following.t === "(") return this.call(token);
            if (isReserved(token.v)) {
              var upper = token.v.toUpperCase();
              if (BUILTINS[upper]) fail(upper + " is a function, so it needs brackets.", "e.g. " + BUILTINS[upper].usage);
              fail(upper + " is a reserved word and can't be used in an expression.");
            }
            return { k: "var", name: token.v };
          }
          this.unexpected(token);
        };

        Parser.prototype.call = function (nameToken) {
          var upper = nameToken.v.toUpperCase();
          if (!BUILTINS[upper]) {
            var subs = this.options.subprogramNames || [];
            if (subs.indexOf(nameToken.v) >= 0) {
              fail(nameToken.v + " is a subprogram.", "Call subprograms with a Subprogram Call block (the box with double side bars).");
            }
            fail("There is no built-in function called " + nameToken.v + ".", "Built-in functions: LEN, INT, REAL, STR, ROUND, RANDOM_INT");
          }
          this.next();
          var args = [];
          if (this.peek() && this.peek().t === ")") {
            this.next();
          } else {
            for (;;) {
              args.push(this.expression(0));
              var separator = this.next();
              if (!separator) fail(upper + "( is missing its closing ).");
              if (separator.t === ")") break;
              if (separator.t !== ",") this.unexpected(separator);
            }
          }
          var spec = BUILTINS[upper];
          if (args.length < spec.min || args.length > spec.max) {
            fail(upper + " was given " + args.length + " value" + (args.length === 1 ? "" : "s") + ".", "Use it like this: " + spec.usage);
          }
          return { k: "call", name: upper, args: args };
        };

        function parseTokens(tokens, options) {
          if (!tokens.length) fail("This is empty.");
          var parser = new Parser(tokens, options);
          var ast = parser.expression(0);
          if (!parser.done()) parser.unexpected(parser.peek());
          return ast;
        }

        function parseExpression(source, options) {
          return parseTokens(tokenize(source), options);
        }

        function collectVariables(ast, into) {
          into = into || [];
          if (!ast) return into;
          if (ast.k === "var" && into.indexOf(ast.name) < 0) into.push(ast.name);
          if (ast.k === "bin") { collectVariables(ast.l, into); collectVariables(ast.r, into); }
          if (ast.k === "neg" || ast.k === "not") collectVariables(ast.e, into);
          if (ast.k === "call") ast.args.forEach(function (arg) { collectVariables(arg, into); });
          return into;
        }

        /* ---------- Values ---------- */

        function isNumber(value) {
          return value.type === "INT" || value.type === "REAL";
        }

        function formatReal(number) {
          var tidy = Number(number.toPrecision(12));
          if (Number.isInteger(tidy) && Math.abs(tidy) < 1e21) return tidy.toFixed(1);
          return String(tidy);
        }

        // Automatic conversion used by OUTPUT and by + when text is involved.
        function toText(value) {
          if (value.type === "STRING") return value.v;
          if (value.type === "BOOL") return value.v ? "True" : "False";
          if (value.type === "REAL") return formatReal(value.v);
          return String(value.v);
        }

        // Shows the type as well: strings keep their quotes in tables.
        function formatValue(value) {
          if (!value) return "";
          return value.type === "STRING" ? "\"" + value.v + "\"" : toText(value);
        }

        function describe(value) {
          return value.type + " " + formatValue(value);
        }

        function makeNumber(number, real) {
          if (!isFinite(number)) fail("That calculation gave a number that is too large or undefined.");
          return { type: real ? "REAL" : "INT", v: number };
        }

        // INPUT stores whole numbers as INT, decimals as REAL and anything else as STRING.
        function inputValue(raw) {
          var trimmed = String(raw).trim();
          if (/^[+-]?\d+$/.test(trimmed)) return { type: "INT", v: parseInt(trimmed, 10) };
          if (/^[+-]?\d*\.\d+$/.test(trimmed) || /^[+-]?\d+\.\d*$/.test(trimmed)) {
            return { type: "REAL", v: parseFloat(trimmed) };
          }
          return { type: "STRING", v: String(raw) };
        }

        function arithmetic(op, l, r) {
          if (op === "+" && (l.type === "STRING" || r.type === "STRING")) {
            return { type: "STRING", v: toText(l) + toText(r) };
          }
          if (!isNumber(l) || !isNumber(r)) {
            var hint = l.type === "STRING" || r.type === "STRING"
              ? "Only + works with text (it joins). Use INT() or REAL() to turn text into a number."
              : "Arithmetic needs INT or REAL values.";
            fail("Can't use " + op + " with " + describe(l) + " and " + describe(r) + ".", hint);
          }
          var real = l.type === "REAL" || r.type === "REAL";
          switch (op) {
            case "+": return makeNumber(l.v + r.v, real);
            case "-": return makeNumber(l.v - r.v, real);
            case "*": return makeNumber(l.v * r.v, real);
            case "/":
              if (r.v === 0) fail("Division by zero.", "Check the value you are dividing by.");
              return makeNumber(l.v / r.v, true);
            case "^":
              if (!real && r.v >= 0) return makeNumber(Math.pow(l.v, r.v), false);
              return makeNumber(Math.pow(l.v, r.v), true);
            case "DIV":
            case "MOD":
              if (real) {
                fail(op + " needs two whole numbers (INT), but got " + describe(l) + " and " + describe(r) + ".", "Use INT() to convert a REAL first.");
              }
              if (r.v === 0) fail(op + " by zero is not possible.");
              var quotient = Math.floor(l.v / r.v);
              return makeNumber(op === "DIV" ? quotient : l.v - r.v * quotient, false);
          }
          fail("Unknown operator " + op + ".");
        }

        function compare(op, l, r) {
          var comparable = (isNumber(l) && isNumber(r)) || l.type === r.type;
          if (!comparable) {
            var hint = "Convert one side first with STR(), INT() or REAL().";
            if ((l.type === "STRING" && isNumber(r)) || (r.type === "STRING" && isNumber(l))) {
              hint = "INPUT stores numbers as INT or REAL, so compare with a number (no quotes), or convert with STR() or INT().";
            }
            fail("Can't compare " + describe(l) + " with " + describe(r) + ".", hint);
          }
          if (l.type === "BOOL" && op !== "==" && op !== "!=") {
            fail("True and False can only be compared with == or !=.");
          }
          var a = l.v;
          var b = r.v;
          switch (op) {
            case "==": return a === b;
            case "!=": return a !== b;
            case "<": return a < b;
            case "<=": return a <= b;
            case ">": return a > b;
            case ">=": return a >= b;
          }
        }

        function requireBool(value, op) {
          if (value.type !== "BOOL") {
            fail(op + " needs True or False on each side, but got " + describe(value) + ".", "e.g. x > 1 AND x < 10");
          }
          return value.v;
        }

        function roundHalfAway(number, places) {
          var factor = Math.pow(10, places);
          var scaled = Math.abs(number) * factor;
          var rounded = Math.round(Number(scaled.toPrecision(15))) / factor;
          return number < 0 ? -rounded : rounded;
        }

        function callBuiltin(name, args, runtime) {
          var a = args[0];
          switch (name) {
            case "LEN":
              if (a.type !== "STRING") fail("LEN needs text, but got " + describe(a) + ".", "Use LEN(STR(x)) to count the digits in a number.");
              return { type: "INT", v: Array.from(a.v).length };
            case "STR":
              return { type: "STRING", v: toText(a) };
            case "INT":
              if (a.type === "INT") return a;
              if (a.type === "REAL") return { type: "INT", v: Math.trunc(a.v) };
              if (a.type === "STRING" && /^\s*[+-]?\d+\s*$/.test(a.v)) return { type: "INT", v: parseInt(a.v, 10) };
              fail("Can't convert " + describe(a) + " to INT.");
              break;
            case "REAL":
              if (isNumber(a)) return { type: "REAL", v: a.v };
              if (a.type === "STRING" && /^\s*[+-]?(\d+\.?\d*|\.\d+)\s*$/.test(a.v)) return { type: "REAL", v: parseFloat(a.v) };
              fail("Can't convert " + describe(a) + " to REAL.");
              break;
            case "ROUND":
              if (!isNumber(a)) fail("ROUND needs a number, but got " + describe(a) + ".");
              if (args.length === 1) return { type: "INT", v: roundHalfAway(a.v, 0) };
              if (args[1].type !== "INT" || args[1].v < 0) fail("The number of decimal places for ROUND must be a whole number of 0 or more.");
              return { type: "REAL", v: roundHalfAway(a.v, args[1].v) };
            case "RANDOM_INT":
              if (a.type !== "INT" || args[1].type !== "INT") fail("RANDOM_INT needs two whole numbers (INT).");
              if (a.v > args[1].v) fail("RANDOM_INT needs the lower number first.");
              return { type: "INT", v: a.v + Math.floor(runtime.random() * (args[1].v - a.v + 1)) };
          }
          fail("Unknown function " + name + ".");
        }

        function evaluate(ast, scope, runtime) {
          switch (ast.k) {
            case "lit":
              return ast.value;
            case "var":
              if (!scope.has(ast.name)) {
                fail("The variable " + ast.name + " has not been given a value yet.", "Assign it, or INPUT it, before this block runs.");
              }
              return scope.get(ast.name);
            case "neg": {
              var inner = evaluate(ast.e, scope, runtime);
              if (!isNumber(inner)) fail("Can't make " + describe(inner) + " negative.");
              return makeNumber(-inner.v, inner.type === "REAL");
            }
            case "not":
              return { type: "BOOL", v: !requireBool(evaluate(ast.e, scope, runtime), "NOT") };
            case "call":
              return callBuiltin(ast.name, ast.args.map(function (arg) { return evaluate(arg, scope, runtime); }), runtime);
            case "bin": {
              if (ast.op === "AND" || ast.op === "OR") {
                var left = requireBool(evaluate(ast.l, scope, runtime), ast.op);
                if (ast.op === "AND" && !left) return { type: "BOOL", v: false };
                if (ast.op === "OR" && left) return { type: "BOOL", v: true };
                return { type: "BOOL", v: requireBool(evaluate(ast.r, scope, runtime), ast.op) };
              }
              var l = evaluate(ast.l, scope, runtime);
              var r = evaluate(ast.r, scope, runtime);
              if (COMPARISONS[ast.op]) return { type: "BOOL", v: compare(ast.op, l, r) };
              return arithmetic(ast.op, l, r);
            }
          }
          fail("Unknown expression.");
        }

        /* ---------- Blocks ---------- */

        var OUTPUT_PORTS = {
          start: ["next"], process: ["next"], input: ["next"], output: ["next"], call: ["next"],
          decision: ["true", "false"], end: [], "return": [],
        };

        function stripKeyword(text, keyword) {
          var pattern = new RegExp("^\\s*" + keyword + "\\b\\s*", "i");
          return String(text || "").replace(pattern, "");
        }

        function cleanCondition(text) {
          return String(text || "").trim().replace(/\?+\s*$/, "").trim();
        }

        function parseAssignment(line, options) {
          var tokens = tokenize(line);
          var first = tokens[0];
          if (first && first.t === "id" && /^(INPUT|OUTPUT)$/i.test(first.v)) {
            fail(first.v.toUpperCase() + " has its own block.", "Use the parallelogram " + (/^input$/i.test(first.v) ? "Input" : "Output") + " block instead.");
          }
          if (first && first.t === "id" && /^RETURN$/i.test(first.v)) fail("RETURN has its own block.", "Use the rounded RETURN block.");
          var at = -1;
          for (var i = 0; i < tokens.length; i += 1) {
            if (tokens[i].t === "assign") { at = i; break; }
          }
          if (at < 0) {
            if (tokens.some(function (token) { return token.v === "=="; })) {
              fail("== compares values; it doesn't store anything.", "To store a value use a single =, e.g. total = 0");
            }
            fail("A process block must store a value in a variable.", "e.g. total = total + 1");
          }
          if (at === 0) fail("There is no variable name before the =.", "e.g. total = 0");
          if (at > 1 || tokens[0].t !== "id") {
            fail("Only a single variable name can go before the =.", "Put the calculation on the right, e.g. total = num1 + num2");
          }
          var problem = nameProblem(tokens[0].v);
          if (problem) throw problem;
          var rest = tokens.slice(at + 1);
          if (!rest.length) fail("There is nothing after the = to store in " + tokens[0].v + ".", "e.g. " + tokens[0].v + " = 0");
          return { target: tokens[0].v, expr: parseTokens(rest, options), source: line.trim() };
        }

        // Turns one block's fields into executable form or throws a FlowError.
        function compileNode(node, context) {
          var options = { subprogramNames: context.subprogramNames || [] };
          switch (node.type) {
            case "start":
            case "end":
              return {};
            case "process": {
              var lines = String(node.text || "").split(/\r?\n/).map(function (line) { return line.trim(); })
                .filter(Boolean);
              if (!lines.length) fail("This process block is empty.", "Type an assignment such as total = 0");
              return { assignments: lines.map(function (line) { return parseAssignment(line, options); }) };
            }
            case "input": {
              var name = String(node.text || "").trim();
              if (!name) fail("Type the variable that will store the input.", "e.g. guess");
              if (/^input\b/i.test(name)) fail("INPUT is already shown on the block.", "Just type the variable name, e.g. guess");
              var problem = nameProblem(name);
              if (problem) throw problem;
              return { target: name };
            }
            case "output": {
              var text = String(node.text || "").trim();
              if (!text) fail("Type what to OUTPUT.", "e.g. \"Score: \" + total");
              if (/^output\b/i.test(text)) fail("OUTPUT is already shown on the block.", "Just type what to output, e.g. \"Score: \" + total");
              return { expr: parseExpression(text, options) };
            }
            case "decision": {
              var condition = cleanCondition(node.text);
              if (!condition) fail("Type a condition for this decision.", "e.g. total > 10   (the ? is added for you)");
              var ast = parseExpression(condition, options);
              var notBoolean = (ast.k === "lit" && ast.value.type !== "BOOL")
                || (ast.k === "bin" && !COMPARISONS[ast.op] && ast.op !== "AND" && ast.op !== "OR")
                || ast.k === "neg";
              if (notBoolean) {
                fail("A decision needs a condition that is True or False.", "Compare values, e.g. total > 10 or guess != answer");
              }
              return { expr: ast };
            }
            case "return": {
              var value = stripKeyword(node.text, "RETURN").trim();
              if (/^return\b/i.test(String(node.text || "").trim())) {
                fail("RETURN is already shown on the block.", "Just type the value to return, or leave it empty.");
              }
              return { expr: value ? parseExpression(value, options) : null };
            }
            case "call": {
              var sub = context.subprograms && context.subprograms.get(node.calleeId);
              if (!sub) fail("Choose which subprogram to call.");
              var params = sub.params || [];
              var args = (node.args || []).slice(0, params.length);
              var compiledArgs = params.map(function (param, index) {
                var argText = String(args[index] || "").trim();
                if (!argText) fail("Give a value for the parameter " + param + ".", "e.g. a variable name or a number");
                try {
                  return parseExpression(argText, options);
                } catch (error) {
                  if (error instanceof FlowError) error.message = "Parameter " + param + ": " + error.message;
                  throw error;
                }
              });
              var extra = (node.args || []).slice(params.length).filter(function (arg) { return String(arg || "").trim(); });
              if (extra.length) fail(sub.name + " only takes " + params.length + " parameter" + (params.length === 1 ? "" : "s") + ".");
              var target = String(node.target || "").trim();
              if (target) {
                var targetProblem = nameProblem(target, "The variable to store the result in");
                if (targetProblem) throw targetProblem;
              }
              return { calleeId: sub.id, args: compiledArgs, target: target || null };
            }
          }
          fail("Unknown block type.");
        }

        function parseParams(text) {
          var raw = String(text || "").trim();
          if (!raw) return { params: [] };
          var params = raw.split(",").map(function (part) { return part.trim(); });
          for (var i = 0; i < params.length; i += 1) {
            var problem = nameProblem(params[i], "A parameter name");
            if (problem) return { params: params.filter(Boolean), error: problem };
            if (params.indexOf(params[i]) !== i) {
              return { params: params, error: new FlowError("The parameter " + params[i] + " is listed twice.") };
            }
          }
          return { params: params };
        }

        function subprogramSignature(tab) {
          return tab.name + "(" + parseParams(tab.paramsText).params.join(", ") + ")";
        }

        function nodeSummary(node, doc) {
          switch (node.type) {
            case "start": return "START";
            case "end": return "END";
            case "process": return String(node.text || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean).join("; ") || "(empty process)";
            case "input": return "INPUT " + (String(node.text || "").trim() || "?");
            case "output": return "OUTPUT " + (String(node.text || "").trim() || "?");
            case "decision": return (cleanCondition(node.text) || "(empty condition)") + "?";
            case "return": {
              var value = String(node.text || "").trim();
              return value ? "RETURN " + value : "RETURN";
            }
            case "call": return callText(node, doc) || "(choose a subprogram)";
          }
          return node.type;
        }

        function callText(node, doc) {
          var sub = doc && doc.tabs.filter(function (tab) { return tab.id === node.calleeId; })[0];
          if (!sub) return "";
          var params = parseParams(sub.paramsText).params;
          var args = params.map(function (_, index) { return String((node.args || [])[index] || "").trim() || "?"; });
          var target = String(node.target || "").trim();
          return (target ? target + " = " : "") + sub.name + "(" + args.join(", ") + ")";
        }

        /* ---------- Whole-flowchart checks ---------- */

        function similarName(name, candidates) {
          var lower = name.toLowerCase();
          var best = null;
          var bestScore = Infinity;
          candidates.forEach(function (candidate) {
            if (candidate === name) return;
            var score = candidate.toLowerCase() === lower ? 0 : editDistance(lower, candidate.toLowerCase());
            if (score < bestScore) { bestScore = score; best = candidate; }
          });
          return bestScore <= (name.length > 4 ? 2 : 1) ? best : null;
        }

        function editDistance(a, b) {
          var previous = [];
          for (var j = 0; j <= b.length; j += 1) previous[j] = j;
          for (var i = 1; i <= a.length; i += 1) {
            var current = [i];
            for (var k = 1; k <= b.length; k += 1) {
              current[k] = Math.min(previous[k] + 1, current[k - 1] + 1, previous[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
            }
            previous = current;
          }
          return previous[b.length];
        }

        function tabLabel(tab) {
          return tab.kind === "main" ? "Main" : tab.name || "this subprogram";
        }

        var PORT_MESSAGES = {
          next: "This block isn't connected to a next block.",
          "true": "The True path of this decision isn't connected.",
          "false": "The False path of this decision isn't connected.",
        };

        function validateDoc(doc) {
          var problems = [];
          function report(severity, tab, nodeId, message, hint, extra) {
            var problem = { severity: severity, tabId: tab.id, nodeId: nodeId || null, message: message, hint: hint || "" };
            if (extra) Object.keys(extra).forEach(function (key) { problem[key] = extra[key]; });
            problems.push(problem);
          }

          var subs = doc.tabs.filter(function (tab) { return tab.kind === "sub"; });
          var subprograms = new Map();
          subs.forEach(function (tab) {
            var parsed = parseParams(tab.paramsText);
            subprograms.set(tab.id, { id: tab.id, name: tab.name, params: parsed.params, tab: tab });
          });
          var subprogramNames = subs.map(function (tab) { return tab.name; });
          var context = { subprograms: subprograms, subprogramNames: subprogramNames };

          var program = { mainId: null, tabs: new Map(), doc: doc };

          doc.tabs.forEach(function (tab) {
            var startNodes = tab.nodes.filter(function (node) { return node.type === "start"; });
            var start = startNodes[0];
            var startId = start ? start.id : null;

            if (tab.kind === "sub") {
              var nameError = nameProblem(String(tab.name || "").trim(), "The subprogram name");
              if (nameError) report("error", tab, startId, nameError.message, nameError.hint, { field: "name" });
              var clash = subs.filter(function (other) {
                return other !== tab && String(other.name).toLowerCase() === String(tab.name).toLowerCase();
              });
              if (!nameError && clash.length) {
                report("error", tab, startId, "Another subprogram is also called " + tab.name + ".", "Give each subprogram a different name.", { field: "name" });
              }
              var paramsError = parseParams(tab.paramsText).error;
              if (paramsError) report("error", tab, startId, paramsError.message, paramsError.hint, { field: "params" });
            } else {
              program.mainId = tab.id;
            }

            if (!start) {
              report("error", tab, null, tabLabel(tab) + " has no START block.");
              return;
            }

            var nodesById = new Map();
            tab.nodes.forEach(function (node) { nodesById.set(node.id, node); });
            var next = new Map();
            tab.nodes.forEach(function (node) { next.set(node.id, {}); });
            tab.edges.forEach(function (edge) {
              if (nodesById.has(edge.from) && nodesById.has(edge.to)) next.get(edge.from)[edge.port] = edge.to;
            });

            var compiled = new Map();
            var assigned = (tab.kind === "sub" ? parseParams(tab.paramsText).params : []).slice();
            var usage = [];
            var missingPorts = false;

            tab.nodes.forEach(function (node) {
              if (tab.kind === "main" && node.type === "return") {
                report("error", tab, node.id, "RETURN is only used at the end of a subprogram.", "Main finishes with an END block.");
              }
              if (tab.kind === "sub" && node.type === "end") {
                report("error", tab, node.id, "A subprogram finishes with RETURN, not END.", "Delete this END and use a RETURN block.");
              }
              if (node.type === "start" && node !== start) {
                report("error", tab, node.id, "Only one START block is allowed.");
              }
              try {
                var result = compileNode(node, context);
                compiled.set(node.id, result);
                if (result.assignments) {
                  result.assignments.forEach(function (assignment) {
                    usage.push({ node: node, names: collectVariables(assignment.expr) });
                    if (assigned.indexOf(assignment.target) < 0) assigned.push(assignment.target);
                  });
                }
                if (node.type === "input" && assigned.indexOf(result.target) < 0) assigned.push(result.target);
                if (result.expr) usage.push({ node: node, names: collectVariables(result.expr) });
                if (result.args) {
                  var names = [];
                  result.args.forEach(function (arg) { collectVariables(arg, names); });
                  usage.push({ node: node, names: names });
                }
                if (node.type === "call" && result.target && assigned.indexOf(result.target) < 0) assigned.push(result.target);
              } catch (error) {
                if (!(error instanceof FlowError)) throw error;
                report("error", tab, node.id, error.message, error.hint);
              }
              (OUTPUT_PORTS[node.type] || []).forEach(function (port) {
                if (!next.get(node.id)[port]) {
                  missingPorts = true;
                  report("error", tab, node.id, PORT_MESSAGES[port], port === "next" ? "Drag from the dot at the bottom of the block to the next block." : "Drag from the " + (port === "true" ? "True" : "False") + " dot to the block that should run next.");
                }
              });
            });

            var reported = {};
            usage.forEach(function (use) {
              use.names.forEach(function (name) {
                if (assigned.indexOf(name) >= 0) return;
                var key = use.node.id + ":" + name;
                if (reported[key]) return;
                reported[key] = true;
                var suggestion = similarName(name, assigned);
                var hint = suggestion ? "Did you mean " + suggestion + "? Names are case-sensitive." : "Give it a value first with a process or Input block.";
                if (!suggestion && tab.kind === "sub") {
                  var mainTab = doc.tabs.filter(function (t) { return t.kind === "main"; })[0];
                  var mainVars = mainTab ? variablesInTab(mainTab, doc) : [];
                  if (mainVars.indexOf(name) >= 0) hint = "Subprograms can't see Main's variables. Add " + name + " as a parameter and pass it in.";
                }
                report("error", tab, use.node.id, name + " is used here but is never given a value in " + tabLabel(tab) + ".", hint);
              });
            });

            var lowerSeen = {};
            assigned.forEach(function (name) {
              var lower = name.toLowerCase();
              if (lowerSeen[lower] && lowerSeen[lower] !== name) {
                report("warning", tab, null, lowerSeen[lower] + " and " + name + " are different variables because names are case-sensitive.", "Use exactly the same capital letters each time.");
              } else {
                lowerSeen[lower] = name;
              }
            });

            var terminalType = tab.kind === "main" ? "end" : "return";
            var terminals = tab.nodes.filter(function (node) { return node.type === terminalType; });
            if (!terminals.length) {
              report("error", tab, startId, tab.kind === "main" ? "Main has no END block." : tabLabel(tab) + " has no RETURN block.", tab.kind === "main" ? "Every flowchart must finish at END." : "Every subprogram must finish at a RETURN.");
            }

            var reachable = {};
            var queue = [startId];
            reachable[startId] = true;
            while (queue.length) {
              var current = queue.shift();
              var outs = next.get(current) || {};
              Object.keys(outs).forEach(function (port) {
                var target = outs[port];
                if (!reachable[target]) { reachable[target] = true; queue.push(target); }
              });
            }
            tab.nodes.forEach(function (node) {
              if (!reachable[node.id]) {
                report("warning", tab, node.id, "Nothing leads to this block from START, so it will never run.", "Connect it into the flow, or delete it.");
              }
            });

            if (!missingPorts && terminals.length) {
              var finishes = {};
              terminals.forEach(function (node) { finishes[node.id] = true; });
              var changed = true;
              while (changed) {
                changed = false;
                tab.nodes.forEach(function (node) {
                  if (finishes[node.id]) return;
                  var outs = next.get(node.id) || {};
                  if (Object.keys(outs).some(function (port) { return finishes[outs[port]]; })) {
                    finishes[node.id] = true;
                    changed = true;
                  }
                });
              }
              var stuck = tab.nodes.filter(function (node) { return reachable[node.id] && !finishes[node.id]; });
              if (stuck.length) {
                report("error", tab, stuck[0].id, "These blocks loop forever: there is no way out to " + terminalType.toUpperCase() + ".", "Add a decision so that one path leaves the loop.", { nodeIds: stuck.map(function (node) { return node.id; }) });
              }
            }

            program.tabs.set(tab.id, {
              id: tab.id, kind: tab.kind, name: tabLabel(tab), startId: startId,
              params: tab.kind === "sub" ? parseParams(tab.paramsText).params : [],
              nodes: nodesById, compiled: compiled, next: next,
            });
          });

          // Calls that store a result need a subprogram that RETURNs a value.
          doc.tabs.forEach(function (tab) {
            tab.nodes.forEach(function (node) {
              if (node.type !== "call" || !String(node.target || "").trim()) return;
              var sub = subprograms.get(node.calleeId);
              if (!sub) return;
              var returns = sub.tab.nodes.filter(function (n) { return n.type === "return"; });
              var withValue = returns.filter(function (n) { return String(n.text || "").trim(); });
              if (returns.length && !withValue.length) {
                report("error", tab, node.id, sub.name + " doesn't RETURN a value, so there is nothing to store in " + String(node.target).trim() + ".", "Type a value in " + sub.name + "'s RETURN block, or clear the result variable.");
              } else if (withValue.length < returns.length) {
                report("warning", tab, node.id, "Some RETURN blocks in " + sub.name + " don't return a value.", "Every RETURN should give a value if the result is stored.");
              }
            });
          });

          problems.sort(function (a, b) {
            return (a.severity === "error" ? 0 : 1) - (b.severity === "error" ? 0 : 1);
          });
          var errors = problems.filter(function (problem) { return problem.severity === "error"; }).length;
          return { problems: problems, errors: errors, program: errors ? null : program };
        }

        // Every variable name a tab gives a value to, in a stable order.
        function variablesInTab(tab, doc) {
          var names = tab.kind === "sub" ? parseParams(tab.paramsText).params.slice() : [];
          function add(name) {
            if (name && names.indexOf(name) < 0 && !nameProblem(name)) names.push(name);
          }
          tab.nodes.forEach(function (node) {
            if (node.type === "process") {
              String(node.text || "").split(/\r?\n/).forEach(function (line) {
                var match = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*(?:=|←)(?!=)/);
                if (match) add(match[1]);
              });
            }
            if (node.type === "input") add(String(node.text || "").trim());
            if (node.type === "call") add(String(node.target || "").trim());
          });
          return names;
        }

        /* ---------- Running ---------- */

        function createRunner(program, options) {
          options = options || {};
          var runtime = { random: options.random || Math.random };
          var main = program.tabs.get(program.mainId);
          var state = {
            status: "ready",
            frames: [{ tabId: main.id, nodeId: main.startId, vars: new Map(), returnTo: null }],
            output: [],
            trace: [],
            steps: 0,
            lastEvent: null,
            lastEdge: null,
            error: null,
            pendingInput: null,
          };

          function top() {
            return state.frames[state.frames.length - 1];
          }

          function scopeKey(frame, name) {
            var tab = program.tabs.get(frame.tabId);
            return tab.kind === "main" ? name : tab.name + "." + name;
          }

          function record(frame, label, changes, output) {
            state.trace.push({
              step: state.steps,
              scope: program.tabs.get(frame.tabId).name,
              label: label,
              changes: changes.map(function (change) {
                return { key: scopeKey(frame, change.name), name: change.name, display: formatValue(change.value) };
              }),
              output: output === undefined ? null : output,
            });
          }

          function advance(frame, port) {
            var tab = program.tabs.get(frame.tabId);
            var target = (tab.next.get(frame.nodeId) || {})[port];
            if (!target) fail("This block has no " + port + " connection.");
            state.lastEdge = { tabId: tab.id, from: frame.nodeId, port: port };
            frame.nodeId = target;
          }

          function stop(error, frame) {
            state.status = "error";
            state.error = {
              message: error.message,
              hint: error.hint || "",
              tabId: frame.tabId,
              nodeId: frame.nodeId,
            };
          }

          function currentNode() {
            var frame = top();
            var tab = program.tabs.get(frame.tabId);
            return { frame: frame, tab: tab, node: tab.nodes.get(frame.nodeId), compiled: tab.compiled.get(frame.nodeId) };
          }

          function step() {
            if (state.status !== "ready") return state;
            var here = currentNode();
            var frame = here.frame;
            var node = here.node;
