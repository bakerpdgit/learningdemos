          let lane = 0;
          placed.forEach((other) => {
            if (other.loopSide === loopSide && other.high >= loop.low && other.low <= loop.high) {
              lane = Math.max(lane, other.lane + 1);
            }
          });
          loop.lane = lane;
          placed.push(loop);
          // A loop leaving a side of a decision starts further out, so its
          // True/False label sits clear of the vertical run.
          const gap = side === "bottom" ? 28 : 66;
          const laneX = loopSide === "left" ? extreme - gap - lane * 16 : extreme + gap + lane * 16;
          const points = [p];
          const outY = out.y + (side === "bottom" ? lane * 6 : 0);
          if (side === "bottom") points.push({ x: p.x, y: outY });
          points.push({ x: laneX, y: outY }, { x: laneX, y: joinY }, { x: to.x, y: joinY }, top);
          routes.set(edge.id, { points, side, start: p });
        });
        return routes;
      }

      function pathFromPoints(points) {
        return points.map((point, index) => `${index ? "L" : "M"}${point.x} ${point.y}`).join(" ");
      }

      function arrowHead(points) {
        const end = points[points.length - 1];
        const before = points[points.length - 2] || end;
        const angle = Math.atan2(end.y - before.y, end.x - before.x);
        const size = 9;
        const spread = 0.42;
        const a = { x: end.x - size * Math.cos(angle - spread), y: end.y - size * Math.sin(angle - spread) };
        const b = { x: end.x - size * Math.cos(angle + spread), y: end.y - size * Math.sin(angle + spread) };
        return `M${end.x} ${end.y} L${a.x} ${a.y} L${b.x} ${b.y} Z`;
      }

      function computeLayouts(tab, doc, editingId) {
        const layouts = new Map();
        tab.nodes.forEach((node) => layouts.set(node.id, blockLayout(node, tab, doc, node.id === editingId)));
        return layouts;
      }

      function contentBounds(tab, layouts) {
        let box = null;
        tab.nodes.forEach((node) => {
          const layout = layouts.get(node.id);
          if (!layout) return;
          const b = blockBox(node, layout, true);
          if (!box) box = { ...b };
          else {
            box.left = Math.min(box.left, b.left);
            box.right = Math.max(box.right, b.right);
            box.top = Math.min(box.top, b.top);
            box.bottom = Math.max(box.bottom, b.bottom);
          }
        });
        return box || { left: 0, right: 400, top: 0, bottom: 300 };
      }

      function fitView(tab, layouts, size) {
        const bounds = contentBounds(tab, layouts);
        const pad = 36;
        const width = bounds.right - bounds.left + pad * 2;
        const height = bounds.bottom - bounds.top + pad * 2;
        const z = clamp(Math.min(size.w / width, size.h / height, 1.15), MIN_ZOOM, MAX_ZOOM);
        const x = (size.w - (bounds.right - bounds.left) * z) / 2 - bounds.left * z;
        const fitsVertically = height * z <= size.h;
        const y = fitsVertically ? Math.min((size.h - (bounds.bottom - bounds.top) * z) / 2, 36) - bounds.top * z : pad * z - bounds.top * z;
        return { x, y, z };
      }

      /* ---------------------------------------------------------------
         Document helpers
         --------------------------------------------------------------- */
      function makeNode(type, x, y) {
        const node = { id: newId("n"), type, x: snap(x), y: snap(y), text: "" };
        if (type === "decision") {
          node.trueSide = "bottom";
          node.falseSide = "right";
        }
        if (type === "call") {
          node.calleeId = "";
          node.args = [];
          node.target = "";
        }
        return node;
      }

      function mapTab(doc, tabId, update) {
        return { ...doc, tabs: doc.tabs.map((tab) => (tab.id === tabId ? update(tab) : tab)) };
      }

      function patchNode(doc, tabId, nodeId, patch) {
        return mapTab(doc, tabId, (tab) => ({
          ...tab,
          nodes: tab.nodes.map((node) => (node.id === nodeId ? { ...node, ...patch } : node)),
        }));
      }

      function uniqueSubName(doc) {
        const taken = new Set(doc.tabs.map((tab) => String(tab.name).toLowerCase()));
        let index = 1;
        while (taken.has(("subprogram" + index).toLowerCase())) index += 1;
        return "Subprogram" + index;
      }

      function newSubTab(doc) {
        const id = newId("sub");
        const start = makeNode("start", 300, 110);
        const end = makeNode("return", 300, 220);
        return {
          id,
          kind: "sub",
          name: uniqueSubName(doc),
          paramsText: "",
          nodes: [start, end],
          edges: [{ id: newId("e"), from: start.id, port: "next", to: end.id }],
        };
      }

      const NODE_TYPES = new Set(["start", "end", "return", "process", "input", "output", "decision", "call"]);
      const SIDES = new Set(["bottom", "left", "right"]);

      // Accepts a saved or imported document and returns a clean copy, or
      // null when it is not a flowchart file.
      function normaliseDoc(raw) {
        if (!raw || !Array.isArray(raw.tabs)) return null;
        const tabs = [];
        for (const rawTab of raw.tabs) {
          if (!rawTab || !Array.isArray(rawTab.nodes) || !Array.isArray(rawTab.edges)) return null;
          const kind = rawTab.kind === "sub" ? "sub" : "main";
          const nodes = rawTab.nodes
            .filter((node) => node && NODE_TYPES.has(node.type) && typeof node.id === "string")
            .map((node) => {
              const clean = {
                id: node.id,
                type: node.type,
                x: Number.isFinite(node.x) ? node.x : 300,
                y: Number.isFinite(node.y) ? node.y : 100,
                text: typeof node.text === "string" ? node.text : "",
              };
              if (node.type === "decision") {
                clean.trueSide = SIDES.has(node.trueSide) ? node.trueSide : "bottom";
                clean.falseSide = SIDES.has(node.falseSide) && node.falseSide !== clean.trueSide ? node.falseSide : clean.trueSide === "right" ? "bottom" : "right";
              }
              if (node.type === "call") {
                clean.calleeId = typeof node.calleeId === "string" ? node.calleeId : "";
                clean.args = Array.isArray(node.args) ? node.args.map((arg) => String(arg ?? "")) : [];
                clean.target = typeof node.target === "string" ? node.target : "";
              }
              return clean;
            });
          const ids = new Set(nodes.map((node) => node.id));
          const usedPorts = new Set();
          const edges = rawTab.edges
            .filter((edge) => edge && ids.has(edge.from) && ids.has(edge.to) && ["next", "true", "false"].includes(edge.port))
            .filter((edge) => {
              const key = edge.from + ":" + edge.port;
              if (usedPorts.has(key)) return false;
              usedPorts.add(key);
              return true;
            })
            .map((edge) => ({ id: typeof edge.id === "string" ? edge.id : newId("e"), from: edge.from, port: edge.port, to: edge.to }));
          tabs.push({
            id: typeof rawTab.id === "string" ? rawTab.id : newId("tab"),
            kind,
            name: kind === "main" ? "Main" : String(rawTab.name || "Subprogram"),
            paramsText: kind === "sub" ? String(rawTab.paramsText || "") : "",
            nodes,
            edges,
          });
        }
        const mains = tabs.filter((tab) => tab.kind === "main");
        if (mains.length !== 1) return null;
        tabs.sort((a, b) => (a.kind === "main" ? -1 : b.kind === "main" ? 1 : 0));
        return { tabs };
      }

      function loadInitialDoc() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const doc = normaliseDoc(JSON.parse(saved));
            if (doc) return doc;
          }
        } catch (error) {
          // Storage can be unavailable; start with a fresh flowchart.
        }
        return FlowExamples.blank();
      }

      function logicKey(doc) {
        return JSON.stringify(doc.tabs.map((tab) => [
          tab.id, tab.kind, tab.name, tab.paramsText,
          tab.nodes.map((node) => [node.id, node.type, node.text, node.calleeId, node.args, node.target]),
          tab.edges.map((edge) => [edge.from, edge.port, edge.to]),
        ]));
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      /* ---------------------------------------------------------------
         SVG shapes
         --------------------------------------------------------------- */
      // Colours are CSS variables, so they are applied as styles: var() is not
      // reliable in SVG presentation attributes across browsers.
      function shapeElements(shape, cx, cy, w, h, { fill, stroke, ...rest }) {
        const props = { ...rest, style: { fill, stroke } };
        const left = cx - w / 2;
        const top = cy - h / 2;
        if (shape === "terminator") {
          return [<rect key="s" x={left} y={top} width={w} height={h} rx={Math.min(h / 2, 24)} {...props} />];
        }
        if (shape === "io") {
          const points = `${left + SKEW},${top} ${left + w},${top} ${left + w - SKEW},${top + h} ${left},${top + h}`;
          return [<polygon key="s" points={points} {...props} />];
        }
        if (shape === "decision") {
          const points = `${cx},${top} ${left + w},${cy} ${cx},${top + h} ${left},${cy}`;
          return [<polygon key="s" points={points} {...props} />];
        }
        const elements = [<rect key="s" x={left} y={top} width={w} height={h} rx={2} {...props} />];
        if (shape === "call") {
          const lineProps = { ...rest, style: { stroke } };
          elements.push(<line key="l" x1={left + 10} y1={top} x2={left + 10} y2={top + h} {...lineProps} />);
          elements.push(<line key="r" x1={left + w - 10} y1={top} x2={left + w - 10} y2={top + h} {...lineProps} />);
        }
        return elements;
      }

      // Where the right-pane editor's cursor falls in the text drawn inside
      // the block: which drawn line, and the text before the cursor on it.
      function caretInBlock(node, layout, caret) {
        const raw = String(node.text || "");
        const before = raw.slice(0, caret);
        let index = 0;
        let shown = "";
        let prefix = "";
        if (node.type === "process") {
          const rows = raw.split(/\r?\n/);
          const beforeRows = before.split(/\r?\n/);
          const row = beforeRows.length - 1;
          const shownRows = rows.map((item) => item.trim()).filter(Boolean);
          index = rows.slice(0, row).filter((item) => item.trim()).length;
          if (!shownRows.length) {
            index = 0;
          } else if (!rows[row].trim()) {
            index = Math.max(0, index - 1);
            shown = shownRows[index];
            prefix = index === 0 && !rows.slice(0, row).some((item) => item.trim()) ? "" : shown;
          } else {
            shown = shownRows[index];
            prefix = beforeRows[row].replace(/^\s+/, "").slice(0, shown.length);
          }
        } else {
          shown = node.type === "decision" ? FlowLang.cleanCondition(raw) : raw.trim();
          prefix = before.replace(/^\s+/, "").slice(0, shown.length);
          index = node.type === "decision" ? 0 : 1;
        }
        if (index >= layout.lines.length) return null;
        const textCy = layout.shape === "decision" ? node.y - 5 : node.y;
        const y = textCy - ((layout.lines.length - 1) * LINE) / 2 + index * LINE;
        const x = shown ? node.x - textWidth(shown, "code") / 2 + textWidth(prefix, "code") : node.x;
        return { x, y };
      }

      function TextLines({ lines, cx, cy, hideHints }) {
        const offset = -((lines.length - 1) * LINE) / 2;
        return lines.map((line, index) => {
          const font = FONTS[line.kind];
          return (
            <text
              key={index}
              x={cx}
              y={cy + offset + index * LINE}
              textAnchor="middle"
              dominantBaseline="central"
              fontFamily={font.family}
              fontSize={font.size}
              fontWeight={font.weight}
              fontStyle={line.kind === "hint" ? "italic" : "normal"}
              style={{ fill: line.kind === "hint" ? "var(--fc-muted)" : "var(--fc-text)", whiteSpace: "pre" }}
            >
              {hideHints && line.kind === "hint" ? "" : line.text}
            </text>
          );
        });
      }

      function BlockGraphic({ node, layout, state, problem, design, connected, summary, insertPort, caret }) {
        const { shape, w, h, lines, header } = layout;
        const cx = node.x;
        const cy = node.y;
        const stroke = state === "error" ? "var(--fc-error)" : state === "current" ? "var(--fc-current)" : state === "selected" || state === "target" ? "var(--fc-select)" : "var(--fc-stroke)";
        const strokeWidth = state === "plain" ? 2 : 3;
        const textCy = shape === "decision" ? cy - 5 : cy;
        const ports = FlowLang.OUTPUT_PORTS[node.type] || [];
        return (
          <React.Fragment>
            <title>{summary}</title>
            {header && (
              <g>
                <line x1={cx} y1={cy - h / 2 - HEADER_GAP} x2={cx} y2={cy - h / 2} style={{ stroke: "var(--fc-stroke)" }} strokeWidth={2} />
                {shapeElements("call", cx, cy - h / 2 - HEADER_GAP - header.h / 2, header.w, header.h, {
                  fill: "var(--fc-bg)",
                  stroke: state === "selected" ? "var(--fc-select)" : "var(--fc-stroke)",
                  strokeWidth: state === "selected" ? 3 : 2,
                })}
                <TextLines lines={[{ text: header.text, kind: "code" }]} cx={cx} cy={cy - h / 2 - HEADER_GAP - header.h / 2} />
              </g>
            )}
            {(state === "current" || state === "error") &&
              shapeElements(shape, cx, cy, w + 10, h + 10, {
                fill: "none",
                stroke: state === "error" ? "var(--fc-error)" : "var(--fc-current-glow)",
                strokeWidth: 6,
                opacity: state === "error" ? 0.3 : 1,
                "data-export-skip": "",
              })}
            {shapeElements(shape, cx, cy, w, h, { fill: "var(--fc-bg)", stroke, strokeWidth, strokeLinejoin: "round" })}
            {shapeElements(shape, cx, cy, w + 12, h + 12, { fill: "none", className: "fc-focus-ring", "data-export-skip": "" })}
            <TextLines lines={lines} cx={cx} cy={textCy} hideHints={caret != null} />
            {caret != null &&
              (() => {
                const point = caretInBlock(node, layout, caret);
                return point ? (
                  <line
                    className="fc-caret"
                    data-export-skip=""
                    x1={point.x + 1}
                    x2={point.x + 1}
                    y1={point.y - 9}
                    y2={point.y + 9}
                    strokeWidth={2}
                    style={{ stroke: "var(--fc-select)" }}
                  />
                ) : null;
              })()}
            {shape === "decision" && (
              <text x={cx} y={cy + h / 2 - 15} textAnchor="middle" dominantBaseline="central" fontFamily={KEY_FONT_FAMILY} fontSize={16} fontWeight={700} style={{ fill: "var(--fc-text)" }}>
                ?
              </text>
            )}
            {node.type === "decision" &&
              ports.map((port) => {
                const side = portSide(node, port);
                const p = sidePoint(node, layout, side);
                const label = port === "true" ? "True" : "False";
                const x = side === "left" ? p.x - 8 : p.x + 8;
                const y = side === "bottom" ? p.y + 14 : p.y - 10;
                return (
                  <text
                    key={port}
                    className="fc-label"
                    x={x}
                    y={y}
                    textAnchor={side === "left" ? "end" : "start"}
                    dominantBaseline="central"
                    fontFamily={KEY_FONT_FAMILY}
                    fontSize={13}
                    fontWeight={700}
                    style={{ fill: port === "true" ? "var(--fc-true)" : "var(--fc-false)" }}
                  >
                    {label}
                  </text>
                );
              })}
            {problem && (
              <g data-export-skip="" aria-hidden="true">
                <circle cx={cx + w / 2 - (shape === "decision" ? w / 4 : 2)} cy={cy - h / 2 + (shape === "decision" ? h / 4 : 2)} r={10} style={{ fill: problem === "error" ? "var(--fc-error)" : "#d97706" }} />
                <text x={cx + w / 2 - (shape === "decision" ? w / 4 : 2)} y={cy - h / 2 + (shape === "decision" ? h / 4 : 2) + 1} textAnchor="middle" dominantBaseline="central" fontSize={13} fontWeight={800} fill="#fff" fontFamily={KEY_FONT_FAMILY}>
                  !
                </text>
              </g>
            )}
            {state === "current" && (
              <text data-export-skip="" x={cx - w / 2 + (shape === "io" ? SKEW : 0)} y={cy - h / 2 - 12} textAnchor="start" dominantBaseline="central" fontFamily={KEY_FONT_FAMILY} fontSize={13} fontWeight={800} style={{ fill: "var(--fc-current)" }} className="fc-label">
                ▶ next
              </text>
            )}
            {design &&
              ports.map((port) => {
                const p = sidePoint(node, layout, portSide(node, port));
                const isConnected = connected.has(port);
                const isInsert = insertPort === port;
                const pathName = port === "true" ? "True" : "False";
                return (
                  <circle
                    key={"port-" + port}
                    data-port={port}
                    data-export-skip=""
                    className={"fc-port" + (isConnected && !isInsert ? " fc-port-connected" : "")}
                    cx={p.x}
                    cy={p.y}
                    r={isInsert ? 8 : 7}
                    style={{ fill: isInsert ? "var(--fc-select)" : "var(--fc-bg)", stroke: "var(--fc-select)" }}
                    strokeWidth={2.5}
                  >
                    <title>
                      {port === "next"
                        ? "Drag to connect to the next block"
                        : isInsert
                          ? `New blocks are added on the ${pathName} path. Drag to connect it.`
                          : `Click to add new blocks on the ${pathName} path, or drag to connect it`}
                    </title>
                  </circle>
                );
              })}
          </React.Fragment>
        );
      }

      /* ---------------------------------------------------------------
         Canvas: pan, zoom, drag blocks and drag connectors.
         --------------------------------------------------------------- */
      const FlowCanvas = React.forwardRef(function FlowCanvas(props, ref) {
        const {
          doc, tab, layouts, routes, view, onViewChange, mode, selection, onSelect,
          onNodeDragStart, onNodeDrag, onNodeDragEnd, onConnect, onChoosePort, insertPort, problemNodes, highlight,
          reveal, onEditNode, editing,
        } = props;
        const wrapRef = useRef(null);
        const svgRef = useRef(null);
        const dragRef = useRef(null);
        const lastPressRef = useRef({ id: null, time: 0 });
        const [size, setSize] = useState({ w: 0, h: 0 });
        const [connect, setConnect] = useState(null);
        const [panning, setPanning] = useState(false);
        const design = mode === "design";

        useLayoutEffect(() => {
          const element = wrapRef.current;
          const update = () => setSize({ w: element.clientWidth, h: element.clientHeight });
          update();
          const observer = new ResizeObserver(update);
          observer.observe(element);
          return () => observer.disconnect();
        }, []);

        useEffect(() => {
          if (!view && size.w > 0 && size.h > 0) onViewChange(fitView(tab, layouts, size));
        }, [view, size.w, size.h, tab.id]);

        const v = view || { x: 0, y: 0, z: 1 };

        const clientToWorld = useCallback((clientX, clientY) => {
          const rect = svgRef.current.getBoundingClientRect();
          return { x: (clientX - rect.left - v.x) / v.z, y: (clientY - rect.top - v.y) / v.z };
        }, [v.x, v.y, v.z]);

        const zoomAt = useCallback((factor, screenX, screenY) => {
          const z = clamp(v.z * factor, MIN_ZOOM, MAX_ZOOM);
          const sx = screenX ?? size.w / 2;
          const sy = screenY ?? size.h / 2;
          const wx = (sx - v.x) / v.z;
          const wy = (sy - v.y) / v.z;
          onViewChange({ x: sx - wx * z, y: sy - wy * z, z });
        }, [v.x, v.y, v.z, size.w, size.h, onViewChange]);

        useImperativeHandle(ref, () => ({
          clientToWorld,
          contains(clientX, clientY) {
            const rect = svgRef.current.getBoundingClientRect();
            return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
          },
          centre() {
            return { x: (size.w / 2 - v.x) / v.z, y: (size.h / 3 - v.y) / v.z };
          },
          fit() {
            onViewChange(fitView(tab, layouts, size));
          },
          zoom(factor) {
            zoomAt(factor);
          },
          svg() {
            return svgRef.current;
          },
        }), [clientToWorld, zoomAt, size, v.x, v.y, v.z, tab, layouts, onViewChange]);

        // Wheel: pinch or Ctrl+wheel zooms; otherwise the wheel pans.
        useEffect(() => {
          const svg = svgRef.current;
          const onWheel = (event) => {
            event.preventDefault();
            const rect = svg.getBoundingClientRect();
            if (event.ctrlKey || event.metaKey) {
              zoomAt(Math.exp(-event.deltaY * 0.0022), event.clientX - rect.left, event.clientY - rect.top);
            } else {
              onViewChange({ ...v, x: v.x - event.deltaX, y: v.y - event.deltaY });
            }
          };
          svg.addEventListener("wheel", onWheel, { passive: false });
          return () => svg.removeEventListener("wheel", onWheel);
        }, [zoomAt, v.x, v.y, v.z, onViewChange]);

        // Keep the block that runs next, or a block just added, in view.
        useEffect(() => {
          if (!reveal || !reveal.id || !view || !size.w) return;
          const node = tab.nodes.find((item) => item.id === reveal.id);
          const layout = node && layouts.get(node.id);
          if (!layout) return;
          const box = blockBox(node, layout, true);
          const margin = 30;
          const inside = box.left * v.z + v.x >= margin && box.right * v.z + v.x <= size.w - margin
            && box.top * v.z + v.y >= margin && box.bottom * v.z + v.y <= size.h - margin;
          if (!inside) onViewChange({ ...v, x: size.w / 2 - node.x * v.z, y: size.h / 2 - node.y * v.z });
        }, [reveal && reveal.key]);

        function nodeAt(world, excludeId) {
          for (let index = tab.nodes.length - 1; index >= 0; index -= 1) {
            const node = tab.nodes[index];
            if (node.id === excludeId) continue;
            const layout = layouts.get(node.id);
            if (!layout) continue;
            const box = blockBox(node, layout, true);
            if (world.x >= box.left - 6 && world.x <= box.right + 6 && world.y >= box.top - 6 && world.y <= box.bottom + 6) return node;
          }
          return null;
        }

        function onPointerDown(event) {
          if (event.button !== 0 && event.pointerType === "mouse") return;
          const world = clientToWorld(event.clientX, event.clientY);
          const portElement = event.target.closest("[data-port]");
          const nodeElement = event.target.closest("[data-node-id]");
          const edgeElement = event.target.closest("[data-edge-id]");
          svgRef.current.setPointerCapture(event.pointerId);

          if (design && portElement && nodeElement) {
            const node = tab.nodes.find((item) => item.id === nodeElement.dataset.nodeId);
            const port = portElement.dataset.port;
            const start = sidePoint(node, layouts.get(node.id), portSide(node, port));
            dragRef.current = { kind: "connect", clientX: event.clientX, clientY: event.clientY };
            setConnect({ fromId: node.id, port, start, pointer: world, hoverId: null });
            onSelect({ kind: "node", id: node.id });
            event.preventDefault();
            return;
          }
          if (nodeElement) {
            const node = tab.nodes.find((item) => item.id === nodeElement.dataset.nodeId);
            if (!node) return;
            onSelect({ kind: "node", id: node.id });
            // Pointer capture sends click events to the canvas, so a double
            // press is detected here rather than with onDoubleClick.
            const now = Date.now();
            const last = lastPressRef.current;
            lastPressRef.current = { id: node.id, time: now };
            if (design && last.id === node.id && now - last.time < 400) {
              event.preventDefault();
              dragRef.current = null;
              onEditNode(node.id);
              return;
            }
            if (design) {
              dragRef.current = { kind: "node", id: node.id, origin: world, nodeX: node.x, nodeY: node.y, moved: false };
            }
            return;
          }
          if (edgeElement && design) {
            onSelect({ kind: "edge", id: edgeElement.dataset.edgeId });
            dragRef.current = null;
            return;
          }
          dragRef.current = { kind: "pan", clientX: event.clientX, clientY: event.clientY, view: v, moved: false };
        }

        function onPointerMove(event) {
          const drag = dragRef.current;
          if (!drag) return;
          if (drag.kind === "pan") {
            const dx = event.clientX - drag.clientX;
            const dy = event.clientY - drag.clientY;
            if (!drag.moved && Math.hypot(dx, dy) < 3) return;
            if (!drag.moved) setPanning(true);
            drag.moved = true;
            onViewChange({ ...drag.view, x: drag.view.x + dx, y: drag.view.y + dy });
            return;
          }
          const world = clientToWorld(event.clientX, event.clientY);
          if (drag.kind === "node") {
            const x = snap(drag.nodeX + world.x - drag.origin.x);
            const y = snap(drag.nodeY + world.y - drag.origin.y);
            if (!drag.moved) {
              if (Math.hypot(world.x - drag.origin.x, world.y - drag.origin.y) * v.z < 4) return;
              drag.moved = true;
              onNodeDragStart();
            }
            onNodeDrag(drag.id, x, y);
            return;
          }
          if (drag.kind === "connect") {
            setConnect((current) => {
              if (!current) return current;
              const over = nodeAt(world, current.fromId);
              return { ...current, pointer: world, hoverId: over && over.type !== "start" ? over.id : null };
            });
          }
        }

        function onPointerUp(event) {
          const drag = dragRef.current;
          dragRef.current = null;
          setPanning(false);
          if (svgRef.current.hasPointerCapture(event.pointerId)) svgRef.current.releasePointerCapture(event.pointerId);
          if (!drag) return;
          if (drag.kind === "pan" && !drag.moved) onSelect(null);
          if (drag.kind === "node" && drag.moved) onNodeDragEnd();
          if (drag.kind === "connect") {
            const current = connect;
            setConnect(null);
            if (current && current.hoverId) onConnect(current.fromId, current.port, current.hoverId);
            else if (current && Math.hypot(event.clientX - drag.clientX, event.clientY - drag.clientY) < 5) {
              onChoosePort(current.fromId, current.port);
            }
          }
        }

        function onPointerCancel() {
          const drag = dragRef.current;
          dragRef.current = null;
          setPanning(false);
          setConnect(null);
          if (drag && drag.kind === "node" && drag.moved) onNodeDragEnd();
        }

        const connectedPorts = useMemo(() => {
          const map = new Map();
          tab.edges.forEach((edge) => {
            if (!map.has(edge.from)) map.set(edge.from, new Set());
            map.get(edge.from).add(edge.port);
          });
          return map;
        }, [tab.edges]);

        const activeEdgeId = highlight && highlight.edge
          ? (tab.edges.find((edge) => edge.from === highlight.edge.from && edge.port === highlight.edge.port) || {}).id
          : null;
        const empty = new Set();

        return (
          <div
            ref={wrapRef}
            className={"fc-canvas relative h-full w-full overflow-hidden" + (panning ? " fc-panning" : "") + (design ? "" : " fc-run")}
            style={{ backgroundSize: `${20 * v.z}px ${20 * v.z}px`, backgroundPosition: `${v.x}px ${v.y}px` }}
          >
            <svg
              ref={svgRef}
              className="absolute inset-0 block h-full w-full"
              role="group"
              aria-label={`Flowchart canvas for ${tab.kind === "main" ? "Main" : tab.name}`}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerCancel}
            >
              <g data-content="" transform={`translate(${v.x} ${v.y}) scale(${v.z})`}>
                {tab.edges.map((edge) => {
                  const route = routes.get(edge.id);
                  if (!route) return null;
                  const selected = selection && selection.kind === "edge" && selection.id === edge.id;
                  const active = edge.id === activeEdgeId;
                  const colour = selected ? "var(--fc-select)" : active ? "var(--fc-current)" : "var(--fc-edge)";
                  const d = pathFromPoints(route.points);
                  return (
                    <g key={edge.id} data-edge-id={edge.id}>
                      <path className="fc-edge-hit" d={d} fill="none" stroke="transparent" strokeWidth={14} data-export-skip="" />
                      <path d={d} style={{ fill: "none", stroke: colour }} strokeWidth={selected || active ? 3 : 2} strokeLinejoin="round" pointerEvents="none" />
                      <path d={arrowHead(route.points)} style={{ fill: colour, stroke: colour }} strokeWidth={1} strokeLinejoin="round" pointerEvents="none" />
                    </g>
                  );
                })}
                {tab.nodes.map((node) => {
                  const layout = layouts.get(node.id);
                  const selected = selection && selection.kind === "node" && selection.id === node.id;
                  let state = "plain";
                  if (highlight && highlight.errorId === node.id) state = "error";
                  else if (highlight && highlight.currentId === node.id) state = "current";
                  else if (connect && connect.hoverId === node.id) state = "target";
                  else if (selected) state = "selected";
                  const summary = FlowLang.nodeSummary(node, doc);
                  return (
                    <g
                      key={node.id}
                      data-node-id={node.id}
                      className={"fc-node" + (selected ? " fc-node-selected" : "")}
                      tabIndex={0}
                      role="button"
                      aria-label={`${BLOCKS[node.type] ? BLOCKS[node.type].label + " block" : "START block"}: ${summary}${problemNodes.get(node.id) ? " (has a problem)" : ""}`}
                      aria-pressed={selected ? "true" : "false"}
                      onFocus={() => {
                        if (!selected) onSelect({ kind: "node", id: node.id });
                      }}
                      onKeyDown={(event) => {
                        if (event.key === "Enter" && design) {
                          event.preventDefault();
                          onEditNode(node.id);
                        }
                      }}
                    >
                      <BlockGraphic
                        node={node}
                        layout={layout}
                        state={state}
                        problem={design ? problemNodes.get(node.id) : null}
                        design={design}
                        connected={connectedPorts.get(node.id) || empty}
                        summary={summary}
                        insertPort={selected ? insertPortFor(node, insertPort) : null}
                        caret={editing && editing.nodeId === node.id ? editing.caret : null}
                      />
                    </g>
                  );
                })}
                {connect && (
                  <line
                    x1={connect.start.x}
                    y1={connect.start.y}
                    x2={connect.pointer.x}
                    y2={connect.pointer.y}
                    style={{ stroke: "var(--fc-select)" }}
                    strokeWidth={2}
                    strokeDasharray="6 5"
                    pointerEvents="none"
                  />
                )}
              </g>
            </svg>
          </div>
        );
      });

      /* ---------------------------------------------------------------
         Palette
         --------------------------------------------------------------- */
      function PaletteIcon({ type }) {
        const common = { fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinejoin: "round" };
        let shape = null;
        if (type === "process") shape = <rect x="6" y="9" width="44" height="22" rx="1.5" {...common} />;
        if (type === "input" || type === "output") shape = <polygon points="14,9 50,9 42,31 6,31" {...common} />;
        if (type === "decision") shape = <polygon points="28,3 52,20 28,37 4,20" {...common} />;
        if (type === "call") {
          shape = (
            <g {...common}>
              <rect x="6" y="9" width="44" height="22" rx="1.5" />
              <line x1="11" y1="9" x2="11" y2="31" />
              <line x1="45" y1="9" x2="45" y2="31" />
            </g>
          );
        }
        if (type === "end" || type === "return") shape = <rect x="6" y="10" width="44" height="20" rx="10" {...common} />;
        return (
          <svg viewBox="0 0 56 40" className="h-7 w-10 shrink-0" aria-hidden="true">
            {shape}
          </svg>
        );
      }

      function Palette({ tabKind, disabled, onAdd, onDragStart }) {
        const types = ["process", "input", "output", "decision", "call", tabKind === "sub" ? "return" : "end"];
        return (
          <aside
            aria-label="Blocks"
            className="flex min-w-0 flex-col gap-2 rounded-lg border border-slate-300 bg-white p-2 dark:border-slate-700 dark:bg-slate-900 lg:min-h-0 lg:overflow-y-auto"
          >
            <h2 className="px-1 text-sm font-bold text-slate-700 dark:text-slate-200">Blocks</h2>
            <div className="flex flex-wrap gap-2 lg:flex-col lg:flex-nowrap">
              {types.map((type) => (
                <button
                  key={type}
                  type="button"
                  disabled={disabled}
                  onPointerDown={(event) => !disabled && onDragStart(type, event)}
                  onClick={(event) => {
                    if (event.detail === 0) onAdd(type);
                  }}
                  title={BLOCKS[type].help}
                  className="flex min-w-[8.5rem] touch-none select-none items-center gap-2 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-left text-sm font-semibold text-slate-800 hover:border-indigo-400 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:border-indigo-400 dark:hover:bg-slate-700 lg:min-w-0"
                >
                  <PaletteIcon type={type} />
                  <span className="leading-tight">{BLOCKS[type].label}</span>
                </button>
              ))}
            </div>
            <p className="px-1 text-xs leading-snug text-slate-600 dark:text-slate-400">
              {disabled
                ? "Switch to Design to change the flowchart."
                : "Drag a block onto the canvas, or select a block and click here to add the next one at its filled dot."}
            </p>
          </aside>
        );
      }

      /* ---------------------------------------------------------------
         Inspector: edits the selected block with labelled fields.
         --------------------------------------------------------------- */
      const fieldClass =
        "fc-mono w-full rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100";
      const smallButton =
        "shrink-0 whitespace-nowrap rounded-md border border-slate-300 px-2.5 py-1 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800";
      const dangerButton =
        "shrink-0 whitespace-nowrap rounded-md border border-red-300 px-2.5 py-1 text-sm font-semibold text-red-700 hover:bg-red-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 dark:border-red-800 dark:text-red-300 dark:hover:bg-red-950";
      const primaryButton =
        "shrink-0 whitespace-nowrap rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-bold text-white hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:focus-visible:ring-offset-slate-900";
      const cardClass = "rounded-lg border border-slate-300 bg-white p-3 dark:border-slate-700 dark:bg-slate-900";

      function CodeField({ id, label, value, onChange, placeholder, help, fieldApi, focusKey, onNormalise, caretFor }) {
        const inputRef = useRef(null);
        // Double-clicking a block (or typing on it) puts the cursor after
        // its current contents, ready to carry on typing.
        useEffect(() => {
          if (!focusKey || !inputRef.current) return undefined;
          const element = inputRef.current;
          const frame = requestAnimationFrame(() => {
            element.focus();
            const end = element.value.length;
            element.setSelectionRange(end, end);
            report(element);
          });
          return () => cancelAnimationFrame(frame);
        }, [focusKey]);
        const report = (element) => {
          if (caretFor && document.activeElement === element) fieldApi.caret(caretFor, element.selectionEnd);
        };
        const shared = {
          id,
          ref: inputRef,
          value,
          placeholder,
          spellCheck: false,
          autoCapitalize: "off",
          autoCorrect: "off",
          autoComplete: "off",
          className: fieldClass,
          onChange: (event) => {
            onChange(event.target.value);
            report(event.target);
          },
          onSelect: (event) => report(event.target),
          onFocus: (event) => {
            fieldApi.focus(event.target, onChange);
            report(event.target);
          },
          // Enter or Escape finishes editing the block.
          onKeyDown: (event) => {
            if (event.key === "Enter" || event.key === "Escape") {
              event.preventDefault();
              event.target.blur();
            }
          },
          onBlur: () => {
            if (onNormalise) {
              const cleaned = onNormalise(value);
              if (cleaned !== value) onChange(cleaned);
            }
            if (caretFor) fieldApi.caret(null);
            fieldApi.blur();
          },
        };
        return (
          <div className="flex flex-col gap-1">
            <label htmlFor={id} className="text-sm font-semibold text-slate-700 dark:text-slate-200">
              {label}
            </label>
            <input type="text" {...shared} />
            {help && <p className="text-xs text-slate-600 dark:text-slate-400">{help}</p>}
          </div>
        );
      }

      function Chips({ label, items, onInsert, mono }) {
        if (!items.length) return null;
        return (
          <div className="flex flex-col gap-1">
            <p className="text-xs font-semibold text-slate-600 dark:text-slate-400">{label}</p>
            <div className="flex flex-wrap gap-1">
              {items.map((item) => (
                <button
                  key={item.label}
                  type="button"
                  onMouseDown={(event) => event.preventDefault()}
                  onClick={() => onInsert(item.insert)}
                  className={(mono ? "fc-mono " : "") + "rounded border border-slate-300 bg-slate-50 px-1.5 py-0.5 text-xs font-semibold text-slate-800 hover:border-indigo-400 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"}
                  title={item.title || "Insert " + item.insert.trim()}
                >
                  {item.label}
                </button>
              ))}
            </div>
          </div>
        );
      }

      function ProblemMessages({ problems }) {
        if (!problems.length) return null;
        return (
          <ul className="flex flex-col gap-1.5" aria-live="polite">
            {problems.map((problem, index) => (
              <li
                key={index}
                className={
                  "rounded-md border px-2 py-1.5 text-sm " +
                  (problem.severity === "error"
                    ? "border-red-300 bg-red-50 text-red-900 dark:border-red-800 dark:bg-red-950/60 dark:text-red-100"
                    : "border-amber-300 bg-amber-50 text-amber-900 dark:border-amber-700 dark:bg-amber-950/50 dark:text-amber-100")
                }
              >
                <span className="font-bold">{problem.severity === "error" ? "Error: " : "Warning: "}</span>
                {problem.message}
                {problem.hint && <span className="mt-0.5 block text-xs opacity-90">{problem.hint}</span>}
              </li>
            ))}
          </ul>
        );
      }

      const COMPARISON_CHIPS = ["==", "!=", "<", "<=", ">", ">=", "AND", "OR", "NOT"].map((op) => ({ label: op, insert: ` ${op} ` }));
      const OUTPUT_CHIPS = [
        { label: "+ join", insert: " + ", title: "Join text and values with +" },
        { label: '" "', insert: '" "', title: "Insert a pair of quotes for text" },
      ];

      function SubprogramSettings({ tab, problems, fieldApi, onUpdateTab, onDeleteTab, focusKey }) {
        const [confirming, setConfirming] = useState(false);
        useEffect(() => setConfirming(false), [tab.id]);
        return (
          <div className="flex flex-col gap-3">
            <CodeField
              id="fc-sub-name"
              label="Subprogram name"
              value={tab.name}
              onChange={(name) => onUpdateTab({ name })}
              placeholder="e.g. CountDown"
              fieldApi={fieldApi}
              focusKey={focusKey}
            />
            <CodeField
              id="fc-sub-params"
              label="Parameters (optional)"
              value={tab.paramsText}
              onChange={(paramsText) => onUpdateTab({ paramsText })}
              placeholder="e.g. total, step"
              help="Separate parameter names with commas. Each call gives every parameter a value."
              fieldApi={fieldApi}
            />
            <ProblemMessages problems={problems} />
            {confirming ? (
              <div className="flex flex-wrap items-center gap-2 rounded-md border border-red-300 bg-red-50 p-2 text-sm text-red-900 dark:border-red-800 dark:bg-red-950/60 dark:text-red-100">
                <span>Delete {tab.name} and all of its blocks?</span>
                <button type="button" className={smallButton} onClick={() => setConfirming(false)}>
                  Cancel
                </button>
                <button type="button" className={dangerButton} onClick={onDeleteTab}>
                  Delete
                </button>
              </div>
            ) : (
              <div>
                <button type="button" className={dangerButton} onClick={() => setConfirming(true)}>
                  Delete subprogram
                </button>
              </div>
            )}
          </div>
        );
      }

      function Inspector(props) {
        const {
          doc, tab, selection, problems, fieldApi, editKey, variables,
          onUpdateNode, onUpdateTab, onDeleteTab, onDeleteSelection, onCreateSub, onShowTab,
          chosenPort, onChoosePort, onSwapLabels,
        } = props;
        const node = selection && selection.kind === "node" ? tab.nodes.find((item) => item.id === selection.id) : null;
        const edge = selection && selection.kind === "edge" ? tab.edges.find((item) => item.id === selection.id) : null;
        const nodeProblems = node ? problems.filter((problem) => problem.nodeId === node.id) : [];
        const variableChips = variables.map((name) => ({ label: name, insert: name }));
        const subs = doc.tabs.filter((item) => item.kind === "sub");

        let title = "Edit block";
        let body = null;

        if (edge) {
          const from = tab.nodes.find((item) => item.id === edge.from);
          const to = tab.nodes.find((item) => item.id === edge.to);
          title = "Connector";
          body = (
            <div className="flex flex-col gap-2 text-sm">
              <p>
                From <span className="fc-mono font-semibold">{from ? FlowLang.nodeSummary(from, doc) : "?"}</span>
                {edge.port !== "next" && <span> ({edge.port === "true" ? "True" : "False"} path)</span>} to{" "}
                <span className="fc-mono font-semibold">{to ? FlowLang.nodeSummary(to, doc) : "?"}</span>.
              </p>
              <p className="text-xs text-slate-600 dark:text-slate-400">To reconnect it, drag from the dot on the block it leaves to a different block.</p>
              <div>
                <button type="button" className={dangerButton} onClick={onDeleteSelection}>
                  Delete connector
                </button>
              </div>
            </div>
          );
        } else if (!node) {
          title = tab.kind === "sub" ? "Subprogram" : "Getting started";
          body = tab.kind === "sub" ? (
            <SubprogramSettings
              tab={tab}
              problems={problems.filter((problem) => problem.field)}
              fieldApi={fieldApi}
              onUpdateTab={onUpdateTab}
              onDeleteTab={onDeleteTab}
            />
          ) : (
            <div className="flex flex-col gap-2 text-sm leading-relaxed text-slate-700 dark:text-slate-300">
              <p>
                <strong>Select START</strong>, then click blocks in the palette: each new block is added and connected at the selected
                block's filled dot. On a decision, click the other dot to build on that path instead.
              </p>
              <p>Drag blocks to move them. Drag from a block's dot to another block to connect them. Double-click a block, or select it and start typing, to edit it here and in the block.</p>
              <p>Press <strong>Simulate</strong> when the checks below are clear, or load an example from the title bar.</p>
            </div>
          );
        } else {
          const update = (patch) => onUpdateNode(node.id, patch);
          const editFocus = editKey && editKey.nodeId === node.id ? editKey.count : 0;
          switch (node.type) {
            case "start":
              if (tab.kind === "sub") {
                title = "Subprogram header";
                body = (
                  <SubprogramSettings
                    tab={tab}
                    problems={nodeProblems}
                    fieldApi={fieldApi}
                    onUpdateTab={onUpdateTab}
                    onDeleteTab={onDeleteTab}
                    focusKey={editFocus}
                  />
                );
              } else {
                title = "START";
                body = <p className="text-sm text-slate-700 dark:text-slate-300">Every run begins at START. Connect it to the first block of your flowchart.</p>;
              }
              break;
            case "end":
              title = "END";
              body = <p className="text-sm text-slate-700 dark:text-slate-300">The program stops when it reaches END. Several paths may lead to the same END.</p>;
              break;
            case "return":
              title = "RETURN";
              body = (
                <div className="flex flex-col gap-3">
                  <CodeField
                    id="fc-return"
                    caretFor={node.id}
                    label="Value to return (optional)"
                    value={node.text}
                    onChange={(text) => update({ text })}
                    onNormalise={(text) => FlowLang.stripKeyword(text, "RETURN").trim()}
                    placeholder="e.g. total"
                    help="Leave empty for a subprogram that only does a job. A value here can be stored by the call."
                    fieldApi={fieldApi}
                    focusKey={editFocus}
                  />
                  <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />
                </div>
              );
              break;
            case "process":
              title = "Process (assignment)";
              body = (
                <div className="flex flex-col gap-3">
                  <CodeField
                    id="fc-process"
                    caretFor={node.id}
                    label="Assignment"
                    value={node.text}
                    onChange={(text) => update({ text })}
                    placeholder="total = num1 + num2"
                    help="variable = value, e.g. total = total + 1. Use another process block for another assignment."
                    fieldApi={fieldApi}
                    focusKey={editFocus}
                  />
                  <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />
                </div>
              );
              break;
            case "input":
              title = "Input";
              body = (
                <div className="flex flex-col gap-3">
                  <CodeField
                    id="fc-input"
                    caretFor={node.id}
                    label="INPUT into variable"
                    value={node.text}
                    onChange={(text) => update({ text })}
                    onNormalise={(text) => FlowLang.stripKeyword(text, "INPUT").trim()}
                    placeholder="guess"
                    help="Whole numbers are stored as INT, decimals as REAL and anything else as STRING."
                    fieldApi={fieldApi}
                    focusKey={editFocus}
                  />
                  <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />
                </div>
              );
              break;
            case "output":
              title = "Output";
              body = (
                <div className="flex flex-col gap-3">
                  <CodeField
                    id="fc-output"
                    caretFor={node.id}
                    label="OUTPUT"
                    value={node.text}
                    onChange={(text) => update({ text })}
                    onNormalise={(text) => FlowLang.stripKeyword(text, "OUTPUT").trim()}
                    placeholder={'"Score: " + total'}
                    help="Put text in quotes. Join text and values with + (numbers and True/False are converted to text)."
                    fieldApi={fieldApi}
                    focusKey={editFocus}
                  />
                  <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />
                  <Chips label="Joining" items={OUTPUT_CHIPS} onInsert={fieldApi.insert} mono />
                </div>
              );
              break;
            case "decision": {
              title = "Decision";
              const setSide = (port, side) => {
                const other = port === "true" ? "falseSide" : "trueSide";
                const key = port === "true" ? "trueSide" : "falseSide";
                const patch = { [key]: side };
                if (node[other] === side) patch[other] = node[key];
                update(patch);
              };
              body = (
                <div className="flex flex-col gap-3">
                  <CodeField
                    id="fc-decision"
                    caretFor={node.id}
                    label="Condition"
                    value={node.text}
                    onChange={(text) => update({ text })}
                    onNormalise={(text) => FlowLang.cleanCondition(text)}
                    placeholder="total > 10"
                    help="Must be True or False. The ? is added at the bottom of the diamond for you."
                    fieldApi={fieldApi}
                    focusKey={editFocus}
                  />
                  <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />
                  <Chips label="Operators" items={COMPARISON_CHIPS} onInsert={fieldApi.insert} mono />
                  <div className="grid grid-cols-2 gap-2">
                    {["true", "false"].map((port) => (
                      <label key={port} className="flex flex-col gap-1 text-sm font-semibold text-slate-700 dark:text-slate-200">
                        {port === "true" ? "True path leaves" : "False path leaves"}
                        <select
                          value={portSide(node, port)}
                          onChange={(event) => setSide(port, event.target.value)}
                          className="rounded-md border border-slate-300 bg-white px-2 py-1 text-sm font-normal text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
                        >
                          {Object.keys(SIDE_NAMES).map((side) => (
                            <option key={side} value={side}>
                              {SIDE_NAMES[side]}
                            </option>
                          ))}
                        </select>
                      </label>
                    ))}
                  </div>
                  <div>
                    <button type="button" className={smallButton} onClick={() => onSwapLabels(node.id)}>
                      Swap True and False labels
                    </button>
                  </div>
                  <fieldset className="flex flex-col gap-1">
                    <legend className="text-sm font-semibold text-slate-700 dark:text-slate-200">Add the next block on</legend>
                    <div className="flex flex-wrap gap-x-4 gap-y-1">
                      {["true", "false"].map((port) => (
                        <label key={port} className="flex items-center gap-1.5 text-sm">
                          <input
                            type="radio"
                            name={"fc-insert-" + node.id}
                            checked={insertPortFor(node, chosenPort) === port}
                            onChange={() => onChoosePort(node.id, port)}
                            className="accent-indigo-600"
                          />
                          {port === "true" ? "True" : "False"} path ({SIDE_NAMES[portSide(node, port)].toLowerCase()})
                        </label>
                      ))}
                    </div>
                    <p className="text-xs text-slate-600 dark:text-slate-400">The filled dot shows where. Click the other dot on the diamond to switch.</p>
                  </fieldset>
                </div>
              );
              break;
            }
            case "call": {
              title = "Subprogram call";
              const callee = subs.find((item) => item.id === node.calleeId);
              const params = callee ? FlowLang.parseParams(callee.paramsText).params : [];
              const args = node.args || [];
              body = (
                <div className="flex flex-col gap-3">
                  {subs.length === 0 ? (
                    <div className="flex flex-col gap-2 text-sm text-slate-700 dark:text-slate-300">
                      <p>There are no subprograms yet. Create one, give it a name, then choose it here.</p>
                      <div>
                        <button type="button" className={primaryButton} onClick={onCreateSub}>
                          + New subprogram
                        </button>
                      </div>
                    </div>
                  ) : (
                    <label className="flex flex-col gap-1 text-sm font-semibold text-slate-700 dark:text-slate-200">
                      Subprogram to call
                      <select
                        value={callee ? callee.id : ""}
                        autoFocus={!!editFocus}
                        onChange={(event) => update({ calleeId: event.target.value })}
                        className="fc-mono rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm font-normal text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
                      >
                        <option value="">Choose…</option>
                        {subs.map((item) => (
                          <option key={item.id} value={item.id}>
                            {FlowLang.subprogramSignature(item)}
                          </option>
                        ))}
                      </select>
                    </label>
                  )}
                  {params.map((param, index) => (
                    <CodeField
                      key={callee.id + "-" + index}
                      id={"fc-arg-" + index}
                      label={`Value for ${param}`}
                      value={args[index] || ""}
                      onChange={(value) => {
                        const next = params.map((_, i) => (i === index ? value : args[i] || ""));
                        update({ args: next });
                      }}
                      placeholder="variable or value"
                      fieldApi={fieldApi}
                    />
                  ))}
                  {callee && (
                    <CodeField
                      id="fc-call-target"
                      label="Store the returned value in (optional)"
                      value={node.target || ""}
                      onChange={(target) => update({ target })}
                      placeholder="e.g. result"
                      help={`Fill this in when ${callee.name} RETURNs a value, e.g. result = ${callee.name}(…).`}
                      fieldApi={fieldApi}
                    />
                  )}
                  {callee && <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />}
                  {callee && (
                    <div>
                      <button type="button" className={smallButton} onClick={() => onShowTab(callee.id)}>
                        Open {callee.name}
                      </button>
                    </div>
                  )}
                </div>
              );
              break;
            }
          }
        }

        const deletable = node && node.type !== "start";
        return (
          <section aria-labelledby="fc-inspector-title" className={cardClass}>
            <div className="mb-2 flex items-center justify-between gap-2">
              <h2 id="fc-inspector-title" className="text-base font-bold">
                {title}
              </h2>
              {deletable && (
                <button type="button" className={dangerButton} onClick={onDeleteSelection}>
                  Delete block
                </button>
              )}
            </div>
            <div className="flex flex-col gap-3">
              {body}
              {node && !(node.type === "start" && tab.kind === "sub") && <ProblemMessages problems={nodeProblems} />}
            </div>
          </section>
        );
      }

      function ProblemsPanel({ doc, validation, onShowProblem, highlightKey }) {
        const { problems, errors } = validation;
        const sectionRef = useRef(null);
        const [flashing, setFlashing] = useState(false);
        useEffect(() => {
          if (!highlightKey) return undefined;
          setFlashing(true);
          if (sectionRef.current) sectionRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" });
          const timer = setTimeout(() => setFlashing(false), 1800);
          return () => clearTimeout(timer);
        }, [highlightKey]);
        const warnings = problems.length - errors;
        const tabName = (tabId) => {
          const tab = doc.tabs.find((item) => item.id === tabId);
          return tab ? (tab.kind === "main" ? "Main" : tab.name) : "";
        };
        return (
          <section
            ref={sectionRef}
            aria-labelledby="fc-problems-title"
            className={cardClass + (flashing ? " ring-2 ring-red-400 dark:ring-red-500" : "")}
          >
            <h2 id="fc-problems-title" className="mb-2 flex items-center gap-2 text-base font-bold">
              Checks
              <span
                className={
                  "rounded-full px-2 py-0.5 text-xs font-bold " +
                  (errors
                    ? "bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-100"
                    : "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-100")
                }
              >
                {errors ? `${errors} error${errors === 1 ? "" : "s"}` : "Ready to run"}
              </span>
              {warnings > 0 && (
                <span className="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-bold text-amber-900 dark:bg-amber-900/60 dark:text-amber-100">
                  {warnings} warning{warnings === 1 ? "" : "s"}
                </span>
              )}
            </h2>
            {problems.length === 0 ? (
              <p className="text-sm text-slate-700 dark:text-slate-300">✓ Every block is filled in and connected, and every path reaches the end.</p>
            ) : (
              <ul className="flex max-h-72 flex-col gap-1 overflow-y-auto pr-1">
                {problems.map((problem, index) => (
                  <li key={index}>
                    <button
                      type="button"
                      onClick={() => onShowProblem(problem)}
                      className="flex w-full items-start gap-2 rounded-md px-1.5 py-1 text-left text-sm hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:hover:bg-slate-800"
                    >
                      <span
                        className={
                          "mt-0.5 shrink-0 rounded px-1 text-[0.7rem] font-bold uppercase " +
                          (problem.severity === "error"
                            ? "bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-100"
                            : "bg-amber-100 text-amber-900 dark:bg-amber-900/60 dark:text-amber-100")
                        }
                      >
                        {problem.severity}
                      </span>
                      <span className="min-w-0">
                        <span className="font-semibold">{tabName(problem.tabId)}:</span> {problem.message}
                      </span>
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </section>
        );
      }

                  <th scope="row" className={row + " w-28 pr-2 font-semibold"}>Data types</th>
                  <td className={row}>INT <span className="fc-mono">42</span>, REAL <span className="fc-mono">3.5</span>, STRING <span className="fc-mono">"hi"</span>, BOOL <span className="fc-mono">True</span>/<span className="fc-mono">False</span></td>
