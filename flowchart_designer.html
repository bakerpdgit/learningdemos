                      <p>There are no subprograms yet. Create one, give it a name, then choose it here.</p>
                      <div>
                        <button type="button" className={primaryButton} onClick={onCreateSub}>
                          + New subprogram
                        </button>
                      </div>
                    </div>
                  ) : (
                    <label className="flex flex-col gap-1 text-sm font-semibold text-slate-700 dark:text-slate-200">
                      Subprogram to call
                      <select
                        value={callee ? callee.id : ""}
                        autoFocus={!!editFocus}
                        onChange={(event) => update({ calleeId: event.target.value })}
                        className="fc-mono rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm font-normal text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
                      >
                        <option value="">Choose…</option>
                        {subs.map((item) => (
                          <option key={item.id} value={item.id}>
                            {FlowLang.subprogramSignature(item)}
                          </option>
                        ))}
                      </select>
                    </label>
                  )}
                  {params.map((param, index) => (
                    <CodeField
                      key={callee.id + "-" + index}
                      id={"fc-arg-" + index}
                      label={`Value for ${param}`}
                      value={args[index] || ""}
                      onChange={(value) => {
                        const next = params.map((_, i) => (i === index ? value : args[i] || ""));
                        update({ args: next });
                      }}
                      placeholder="variable or value"
                      fieldApi={fieldApi}
                    />
                  ))}
                  {callee && (
                    <CodeField
                      id="fc-call-target"
                      label="Store the returned value in (optional)"
                      value={node.target || ""}
                      onChange={(target) => update({ target })}
                      placeholder="e.g. result"
                      help={`Fill this in when ${callee.name} RETURNs a value, e.g. result = ${callee.name}(…).`}
                      fieldApi={fieldApi}
                    />
                  )}
                  {callee && <Chips label="Variables" items={variableChips} onInsert={fieldApi.insert} mono />}
                  {callee && (
                    <div>
                      <button type="button" className={smallButton} onClick={() => onShowTab(callee.id)}>
                        Open {callee.name}
                      </button>
                    </div>
                  )}
                </div>
              );
              break;
            }
          }
        }

        const deletable = node && node.type !== "start";
        return (
          <section aria-labelledby="fc-inspector-title" className={cardClass}>
            <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
              <h2 id="fc-inspector-title" className="text-base font-bold">
                {title}
              </h2>
              {deletable && (

      function ProblemsPanel({ doc, validation, onShowProblem, highlightKey }) {
        const { problems, errors } = validation;

        }, [highlightKey]);

      /* ---------------------------------------------------------------
         Zoom percentage: shows the current zoom and accepts a typed value.
         --------------------------------------------------------------- */
      function ZoomField({ zoom, onZoom }) {
        const shown = String(Math.round(zoom * 100));
        const [draft, setDraft] = useState(null);
        const justFocused = useRef(false);
        const apply = () => {
          if (draft === null) return;
          const percent = parseFloat(draft);
          setDraft(null);
          if (Number.isFinite(percent)) onZoom(clamp(percent, MIN_ZOOM * 100, MAX_ZOOM * 100) / 100);
        };
        return (
          <label className="flex items-center rounded-md border border-slate-300 px-1 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/40 dark:border-slate-600">
            <span className="sr-only">Zoom percentage</span>
            <input
              type="text"
              inputMode="numeric"
              value={draft === null ? shown : draft}
              // Select the whole value at once so typing replaces it; the
              // mouseup that follows a click would otherwise drop the selection.
              onFocus={(event) => {
                setDraft(shown);
                event.target.select();
                justFocused.current = true;
              }}
              onMouseUp={(event) => {
                if (justFocused.current) event.preventDefault();
                justFocused.current = false;
              }}
              onChange={(event) => setDraft(event.target.value.replace(/[^0-9.]/g, "").slice(0, 5))}
              onBlur={apply}
              onKeyDown={(event) => {
                if (event.key === "Enter") {
                  event.preventDefault();
                  apply();
                  event.target.blur();
                } else if (event.key === "Escape") {
                  event.preventDefault();
                  setDraft(null);
                  requestAnimationFrame(() => event.target.blur());
                }
              }}
              title={`Type a zoom between ${MIN_ZOOM * 100}% and ${MAX_ZOOM * 100}%`}
              className="w-9 bg-transparent py-1 text-right text-xs font-semibold tabular-nums text-slate-700 focus:outline-none dark:text-slate-200"
            />
            <span aria-hidden="true" className="text-xs font-semibold text-slate-600 dark:text-slate-300">
              %
            </span>
          </label>
        );
      }

      /* ---------------------------------------------------------------
         Grip between the canvas and the side panel. Drag it, or focus it
         and use the arrow keys; double-click restores the default width.
         --------------------------------------------------------------- */
      const SIDE_WIDTH_KEY = "flowchart-designer-panel-width";
      const SIDE_MIN = 280;

      function sideMax(container) {
        const width = container ? container.clientWidth : window.innerWidth;
        return Math.max(SIDE_MIN, Math.min(760, Math.round(width * 0.55)));
      }

      function SideResizer({ width, onResize, containerRef, asideRef }) {
        const [dragging, setDragging] = useState(false);
        const current = width || (asideRef.current ? Math.round(asideRef.current.getBoundingClientRect().width) : 352);
        const max = sideMax(containerRef.current);
        const set = (value) => onResize(clamp(Math.round(value), SIDE_MIN, sideMax(containerRef.current)));

        function onPointerDown(event) {
          if (event.button !== 0) return;
          event.preventDefault();
          event.currentTarget.setPointerCapture(event.pointerId);
          setDragging(true);
        }
        function onPointerMove(event) {
          if (!dragging || !asideRef.current) return;
          const right = asideRef.current.getBoundingClientRect().right;
          set(right - event.clientX - 6);
        }
        function onPointerUp(event) {
          if (event.currentTarget.hasPointerCapture(event.pointerId)) event.currentTarget.releasePointerCapture(event.pointerId);
          setDragging(false);
        }
        function onKeyDown(event) {
          const step = event.shiftKey ? 64 : 16;
          if (event.key === "ArrowLeft") set(current + step);
          else if (event.key === "ArrowRight") set(current - step);
          else if (event.key === "Home") set(max);
          else if (event.key === "End") set(SIDE_MIN);
          else return;
          event.preventDefault();
        }

        return (
          <div
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize the side panel"
            aria-valuemin={SIDE_MIN}
            aria-valuemax={max}
            aria-valuenow={current}
            tabIndex={0}
            title="Drag to resize the side panel (double-click to reset)"
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerCancel={() => setDragging(false)}
            onDoubleClick={() => onResize(null)}
            onKeyDown={onKeyDown}
            className="fc-resizer group hidden cursor-col-resize touch-none items-center justify-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 lg:flex"
          >
            <span
              aria-hidden="true"
              className={
                "h-12 w-1.5 rounded-full transition-colors " +
                (dragging ? "bg-indigo-500" : "bg-slate-300 group-hover:bg-indigo-400 dark:bg-slate-600 dark:group-hover:bg-indigo-400")
              }
            ></span>
          </div>
        );
      }

      /* ---------------------------------------------------------------
         Image export: the current tab as a PNG with light colours.
         --------------------------------------------------------------- */
      async function exportPng(svgElement, tab, layouts, routes, filename) {
        const bounds = contentBounds(tab, layouts, routes);
        const pad = 50;
        const width = Math.ceil(bounds.right - bounds.left + pad * 2);
        const height = Math.ceil(bounds.bottom - bounds.top + pad * 2);
        const content = svgElement.querySelector("[data-content]").cloneNode(true);
        content.querySelectorAll("[data-export-skip], title").forEach((element) => element.remove());
        content.setAttribute("transform", `translate(${pad - bounds.left} ${pad - bounds.top})`);
        const markup =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">` +
          "<style>svg{--fc-bg:#ffffff;--fc-stroke:#1e293b;--fc-text:#0f172a;--fc-muted:#64748b;--fc-edge:#334155;--fc-select:#1e293b;--fc-current:#334155;--fc-current-glow:transparent;--fc-error:#1e293b;--fc-true:#047857;--fc-false:#b91c1c}" +
          ".fc-label{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style>" +
          `<rect width="${width}" height="${height}" fill="#ffffff"/>` +
          new XMLSerializer().serializeToString(content) +
          "</svg>";
        const image = new Image();
        const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml" }));
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext("2d");
        context.scale(scale, scale);
        context.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        await new Promise((resolve) => canvas.toBlob((blob) => {
          if (blob) downloadBlob(blob, filename);
          resolve();
        }, "image/png"));
      }

      /* ---------------------------------------------------------------
         App
         --------------------------------------------------------------- */
      /* ---------------------------------------------------------------
         Code view: the whole program as Python. Keywords are fixed and
         each value is an editable slot that only accepts valid Python, so
         the code can never hold a syntax error. Typing in a slot updates
         that block's text; adding, deleting or moving a statement rebuilds
         the tab's flowchart with a tidy layout.
         --------------------------------------------------------------- */
      const CODE_STATEMENTS = [
        { type: "assign", label: "Assignment", code: "x = …" },
        { type: "input", label: "Input", code: "input()" },
        { type: "output", label: "Output", code: "print()" },
        { type: "if", label: "If", code: "if" },
        { type: "ifelse", label: "If / else", code: "if … else" },
        { type: "while", label: "While loop", code: "while" },
        { type: "repeat", label: "Repeat loop", code: "while True … break" },
        { type: "call", label: "Subprogram call", code: "name()" },
        { type: "return", label: "Return", code: "return", subOnly: true },
        { type: "def", label: "New subprogram", code: "def" },
      ];

      const holeStatement = () => ({ k: "assign", id: null, text: "" });

      function newStatement(type, doc) {
        switch (type) {
          case "input": return { k: "input", id: null, text: "", inputType: "auto" };
          case "output": return { k: "output", id: null, text: "" };
          case "if": return { k: "if", id: null, text: "", negated: false, then: [holeStatement()], else: [] };
          case "ifelse": return { k: "if", id: null, text: "", negated: false, then: [holeStatement()], else: [holeStatement()] };
          case "while": return { k: "while", id: null, text: "", negated: false, body: [holeStatement()] };
          case "repeat": return { k: "repeat", id: null, text: "", negated: false, body: [holeStatement()] };
          case "call": {
            const sub = doc.tabs.find((item) => item.kind === "sub");
            return { k: "call", id: null, calleeId: sub ? sub.id : "", args: [], target: "" };
          }
          case "return": return { k: "return", id: null, text: "" };
        }
        return holeStatement();
      }

      const isTerminalStatement = (stmt) => !!stmt && (stmt.k === "end" || stmt.k === "return");

      // A new statement goes after the selected line, first inside a selected
      // if / else / loop header, or otherwise at the end of the program.
      function insertStatement(root, row, stmt) {
        let path = [];
        let key = "body";
        let index = null;
        if (row) {
          const at = row.path;
          switch (row.kind) {
            case "pass": path = at; key = row.key; index = 0; break;
            case "def": path = []; key = "body"; index = 0; break;
            case "if": case "elif": path = at; key = "then"; index = 0; break;
            case "else": path = at; key = "else"; index = 0; break;
            case "while": case "repeat": path = at; key = "body"; index = 0; break;
            case "until": path = at; key = "body"; index = FlowCode.stmtAt(root, at).body.length; break;
            default: {
              path = at.slice(0, -1);
              key = at[at.length - 1][0];
              const position = at[at.length - 1][1];
              const siblings = FlowCode.listAt(root, path, key);
              index = isTerminalStatement(siblings[position]) ? position : position + 1;
            }
          }
        }
        const list = FlowCode.listAt(root, path, key);
        if (index === null) index = list.length && isTerminalStatement(list[list.length - 1]) ? list.length - 1 : list.length;
        list.splice(index, 0, stmt);
        return { root, path: path.concat([[key, index]]) };
      }

      function chainEnd(stmt) {
        let current = stmt;
        while (current.else.length === 1 && current.else[0].k === "if") current = current.else[0];
        return current;
      }

      function rowKey(row) {
        return row.kind + ":" + JSON.stringify(row.path) + ":" + (row.key || "");
      }

      function codeCheck(kind, subNames) {
        return (text) => {
          const value = text.trim();
          if (!value) return { ok: true, value: "" };
          if (kind === "name") {
            const problem = FlowLang.nameProblem(value);
            return problem ? { ok: false, error: problem.message + (problem.hint ? " " + problem.hint : "") } : { ok: true, value };
          }
          try {
            return { ok: true, value: FlowCode.pythonToPseudo(value, subNames) };
          } catch (error) {
            if (!(error instanceof FlowLang.FlowError)) throw error;
            return { ok: false, error: error.message + (error.hint ? " " + error.hint : "") };
          }
        };
      }

      function CodeSlot({ value, invalid, label, placeholder, check, onValid, onStart, onEnd, faint }) {
        const [draft, setDraft] = useState(null);
        const [error, setError] = useState(null);
        const shown = draft === null ? value : draft;
        const chars = (String(shown).length || (placeholder ? placeholder.length : 1)) + 0.6;
        const hole = !String(shown).trim();
        return (
          <span className="relative inline-block align-baseline">
            <input
              type="text"
              value={shown}
              aria-label={label}
              aria-invalid={error || invalid ? "true" : undefined}
              placeholder={placeholder}
              spellCheck={false}
              autoCapitalize="off"
              autoComplete="off"
              autoCorrect="off"
              style={{ width: `calc(${chars}ch + 0.6rem)` }}
              onFocus={() => {
                setDraft(value);
                onStart();
              }}
              onChange={(event) => {
                const text = event.target.value;
                setDraft(text);
                const result = check(text);
                if (result.ok) {
                  setError(null);
                  onValid(result.value);
                } else {
                  setError(result.error);
                }
              }}
              onBlur={() => {
                setDraft(null);
                setError(null);
                onEnd();
              }}
              onKeyDown={(event) => {
                if (event.key === "Enter" || event.key === "Escape") {
                  event.preventDefault();
                  event.currentTarget.blur();
                }
              }}
              className={
                "fc-mono fc-code-slot rounded border px-1 py-0 text-[15px] leading-6 focus:outline-none focus:ring-2 " +
                (error
                  ? "border-red-500 bg-red-50 text-red-900 focus:ring-red-400/50 dark:border-red-400 dark:bg-red-950 dark:text-red-100"
                  : invalid
                    ? "border-red-400 bg-red-50 text-red-900 underline decoration-wavy decoration-red-500 focus:ring-indigo-500/40 dark:border-red-500 dark:bg-red-950/60 dark:text-red-100"
                    : hole && faint
                      ? "border-dashed border-slate-300 bg-transparent text-slate-900 placeholder:text-slate-500 opacity-70 focus:opacity-100 focus:ring-indigo-500/40 dark:border-slate-600 dark:text-slate-100 dark:placeholder:text-slate-400"
                    : hole
                      ? "border-dashed border-amber-500 bg-amber-50 text-slate-900 placeholder:text-amber-700 focus:ring-indigo-500/40 dark:border-amber-400 dark:bg-amber-950/40 dark:text-slate-100 dark:placeholder:text-amber-300"
                      : "border-transparent bg-slate-100 text-slate-900 hover:border-slate-300 focus:border-indigo-500 focus:bg-white focus:ring-indigo-500/40 dark:bg-slate-800 dark:text-slate-100 dark:hover:border-slate-600 dark:focus:bg-slate-950") +
                ""
              }
            />
            {error && (
              <span
                role="alert"
                className="absolute left-0 top-full z-30 mt-1 w-max max-w-[20rem] whitespace-normal rounded-md border border-red-300 bg-red-50 px-2 py-1 font-sans text-xs font-semibold leading-snug text-red-900 shadow-md dark:border-red-700 dark:bg-red-950 dark:text-red-100"
              >
                {error}
                <span className="mt-0.5 block font-normal">Not applied yet: leaving this box undoes the change.</span>
              </span>
            )}
          </span>
        );
      }

      const kwClass = "font-bold text-purple-700 dark:text-purple-300";
      const fnClass = "font-semibold text-sky-800 dark:text-sky-300";
      const punctClass = "text-slate-500 dark:text-slate-400";

      function CodeRow({ tab, doc, row, env, types, subNames, selected, onSelect, slotApi, edit, commitEdit, onTree }) {
        const stmt = row.stmt;
        const expr = (text, negated) => FlowCode.exprToPython(text, env, negated);
        const checkExpr = codeCheck("expr", subNames);
        const checkName = codeCheck("name", subNames);
        const slot = (props) => <CodeSlot onStart={slotApi.start} onEnd={slotApi.end} {...props} />;
        const patch = (nodeId, fields) => edit((value) => patchNode(value, tab.id, nodeId, fields));

        const setCondition = (text) => edit((value) => mapTab(value, tab.id, (item) => {
          const node = item.nodes.find((other) => other.id === stmt.id);
          if (!node) return item;
          if (!stmt.negated) return { ...item, nodes: item.nodes.map((other) => (other.id === stmt.id ? { ...other, text } : other)) };
          // The code shows the opposite of this decision's condition, so the
          // new condition is stored with True and False swapped round.
          const flip = { true: "false", false: "true" };
          return {
            ...item,
            nodes: item.nodes.map((other) => (other.id === stmt.id ? { ...other, text, trueSide: other.falseSide, falseSide: other.trueSide } : other)),
            edges: item.edges.map((edge) => (edge.from === stmt.id && flip[edge.port] ? { ...edge, port: flip[edge.port] } : edge)),
          };
        }));

        const setAssignment = (part, text) => edit((value) => mapTab(value, tab.id, (item) => {
          const node = item.nodes.find((other) => other.id === stmt.id);
          if (!node) return item;
          const lines = FlowCode.processLines(node.text);
          const parts = FlowCode.splitAssignment(lines[stmt.line] || "");
          parts[part] = text;
          const line = FlowCode.joinAssignment(parts.target, parts.expr);
          if (stmt.line < lines.length) lines[stmt.line] = line;
          else lines.push(line);
          const joined = lines.filter((entry) => entry.trim()).join("\n");
          return { ...item, nodes: item.nodes.map((other) => (other.id === node.id ? { ...other, text: joined } : other)) };
        }));

        const condition = (negated) => {
          const shown = expr(stmt.text, negated);
          return slot({
            value: shown.ok ? shown.text : shown.hole ? "" : shown.text,
            invalid: !shown.ok && !shown.hole,
            label: "Condition",
            placeholder: "condition",
            check: checkExpr,
            onValid: setCondition,
          });
        };

        let content = null;
        switch (row.kind) {
          case "pass":
            content = <span className={punctClass + " italic"}>pass</span>;
            break;
          case "if":
          case "elif":
            content = (
              <React.Fragment>
                <span className={kwClass}>{row.kind}</span> {condition(stmt.negated)}
                <span className={punctClass}>:</span>
              </React.Fragment>
            );
            break;
          case "else":
            content = (
              <React.Fragment>
                <span className={kwClass}>else</span>
                <span className={punctClass}>:</span>
              </React.Fragment>
            );
            break;
          case "while":
            content = (
              <React.Fragment>
                <span className={kwClass}>while</span> {condition(stmt.negated)}
                <span className={punctClass}>:</span>
              </React.Fragment>
            );
            break;
          case "repeat":
            content = (
              <React.Fragment>
                <span className={kwClass}>while</span> <span className={kwClass}>True</span>
                <span className={punctClass}>:</span>
                <span className="ml-2 font-sans text-xs font-semibold text-slate-500 dark:text-slate-400">repeat loop</span>
              </React.Fragment>
            );
            break;
          case "until":
            content = (
              <React.Fragment>
                <span className={kwClass}>if</span> {condition(stmt.negated)}
                <span className={punctClass}>:</span> <span className={kwClass}>break</span>
              </React.Fragment>
            );
            break;
          default:
            switch (stmt.k) {
              case "assign": {
                const parts = FlowCode.splitAssignment(stmt.text);
                const value = expr(parts.expr);
                const targetProblem = parts.target && FlowLang.nameProblem(parts.target);
                content = (
                  <React.Fragment>
                    {slot({ value: parts.target, invalid: !!targetProblem, label: "Variable name", placeholder: "name", check: checkName, onValid: (text) => setAssignment("target", text) })}
                    <span className={punctClass}>{" = "}</span>
                    {slot({ value: value.ok || !value.hole ? value.text : "", invalid: !value.ok && !value.hole, label: "Value", placeholder: "value", check: checkExpr, onValid: (text) => setAssignment("expr", text) })}
                  </React.Fragment>
                );
                break;
              }
              case "input": {
                const inferred = FlowCode.inputCast({ id: stmt.id, inputType: "auto" }, types);
                content = (
                  <React.Fragment>
                    {slot({ value: stmt.text, invalid: !!(stmt.text && FlowLang.nameProblem(stmt.text)), label: "Input variable", placeholder: "name", check: checkName, onValid: (text) => patch(stmt.id, { text }) })}
                    <span className={punctClass}>{" = "}</span>
                    <select
                      aria-label="Data type of the input"
                      value={stmt.inputType || "auto"}
                      onChange={(event) => commitEdit((value) => patchNode(value, tab.id, stmt.id, { inputType: event.target.value }))}
                      className="fc-mono rounded border border-slate-300 bg-white px-1 py-0.5 text-[15px] text-sky-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-slate-600 dark:bg-slate-900 dark:text-sky-300"
                    >
                      <option value="auto">{inferred ? inferred + "(input())" : "input()"} · auto</option>
                      <option value="int">int(input())</option>
                      <option value="real">float(input())</option>
                      <option value="string">input()</option>
                    </select>
                  </React.Fragment>
                );
                break;
              }
              case "output": {
                const value = expr(stmt.text);
                content = (
                  <React.Fragment>
                    <span className={fnClass}>print</span>
                    <span className={punctClass}>(</span>
                    {slot({ value: value.ok || !value.hole ? value.text : "", invalid: !value.ok && !value.hole, label: "Value to print", placeholder: "value", check: checkExpr, onValid: (text) => patch(stmt.id, { text }) })}
                    <span className={punctClass}>)</span>
                  </React.Fragment>
                );
                break;
              }
              case "call": {
                const sub = doc.tabs.find((item) => item.id === stmt.calleeId && item.kind === "sub");
                const params = sub ? FlowLang.parseParams(sub.paramsText).params : [];
                const subs = doc.tabs.filter((item) => item.kind === "sub");
                // A subprogram that RETURNs a value is a function, so its call
                // stores the result; a procedure's call stands on its own.
                const isFunction = !!sub && sub.nodes.some((node) => node.type === "return" && String(node.text || "").trim());
                const showTarget = isFunction || !!stmt.target;
                content = (
                  <React.Fragment>
                    {showTarget && (
                      <React.Fragment>
                        {slot({
                          value: stmt.target,
                          invalid: !isFunction,
                          label: isFunction ? "Variable to store the result in" : "Result variable: remove it, because " + (sub ? sub.name : "this subprogram") + " doesn't return a value",
                          placeholder: "result",
                          check: checkName,
                          onValid: (text) => patch(stmt.id, { target: text }),
                        })}
                        <span className={punctClass}>{" = "}</span>
                      </React.Fragment>
                    )}
                    <select
                      aria-label="Subprogram to call"
                      value={sub ? sub.id : ""}
                      onChange={(event) => commitEdit((value) => patchNode(value, tab.id, stmt.id, { calleeId: event.target.value }))}
                      className="fc-mono rounded border border-slate-300 bg-white px-1 py-0.5 text-[15px] font-semibold text-sky-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-slate-600 dark:bg-slate-900 dark:text-sky-300"
                    >
                      {!sub && <option value="">choose…</option>}
                      {subs.map((item) => (
                        <option key={item.id} value={item.id}>{item.name || "?"}</option>
                      ))}
                    </select>
                    <span className={punctClass}>(</span>
                    {params.map((param, index) => {
                      const value = expr((stmt.args || [])[index]);
                      return (
                        <React.Fragment key={param + index}>
                          {index > 0 && <span className={punctClass}>{", "}</span>}
                          {slot({
                            value: value.ok || !value.hole ? value.text : "",
                            invalid: !value.ok && !value.hole,
                            label: "Value for " + param,
                            placeholder: param,
                            check: checkExpr,
                            onValid: (text) => {
                              const args = params.map((_, position) => String((stmt.args || [])[position] || ""));
                              args[index] = text;
                              patch(stmt.id, { args });
                            },
                          })}
                        </React.Fragment>
                      );
                    })}
                    <span className={punctClass}>)</span>
                  </React.Fragment>
                );
                break;
              }
              case "return": {
                const value = expr(stmt.text);
                content = (
                  <React.Fragment>
                    <span className={kwClass}>return</span>{" "}
                    {slot({ value: value.ok || !value.hole ? value.text : "", invalid: !value.ok && !value.hole, label: "Value to return (optional)", placeholder: "value", faint: true, check: checkExpr, onValid: (text) => patch(stmt.id, { text }) })}
                  </React.Fragment>
                );
                break;
              }
              case "end":
                content = (
                  <React.Fragment>
                    <span className={fnClass}>exit</span>
                    <span className={punctClass}>()</span>
                    <span className="ml-2 font-sans text-xs font-semibold text-slate-500 dark:text-slate-400">END</span>
                  </React.Fragment>
                );
                break;
            }
        }

        const actions = [];
        if (selected) {
          const movable = row.kind === "simple" || row.kind === "if" || row.kind === "while" || row.kind === "repeat";
          if (row.kind === "if" || row.kind === "elif") {
            // Within an if / elif chain, a clause swaps with its neighbour;
            // past either end, the whole if statement moves.
            const move = (direction) => onTree(tab.id, (root) => {
              const where = FlowCode.clauseOf(root, row.path);
              const count = FlowCode.clauseCount(root, where.headPath);
              const target = where.index + direction;
              if (target >= 0 && target < count) return FlowCode.moveClause(root, where.headPath, where.index, direction);
              return FlowCode.moveStatement(root, where.headPath, direction);
            });
            actions.push({ label: "↑", name: row.kind === "elif" ? "Move this clause up" : "Move up", run: () => move(-1) });
            actions.push({ label: "↓", name: "Move this clause down", run: () => move(1) });
          } else if (movable) {
            actions.push({ label: "↑", name: "Move up", run: () => onTree(tab.id, (root) => FlowCode.moveStatement(root, row.path, -1)) });
            actions.push({ label: "↓", name: "Move down", run: () => onTree(tab.id, (root) => FlowCode.moveStatement(root, row.path, 1)) });
          }
          if (row.kind === "if" || row.kind === "elif") {
            actions.push({
              label: "+ elif",
              name: "Add an elif",
              run: () => onTree(tab.id, (root) => {
                const last = chainEnd(FlowCode.stmtAt(root, row.path));
                last.else = [{ k: "if", id: null, text: "", negated: false, then: [holeStatement()], else: last.else }];
                return { root, path: null };
              }),
            });
            if (!chainEnd(stmt).else.length) {
              actions.push({
                label: "+ else",
                name: "Add an else",
                run: () => onTree(tab.id, (root) => {
                  chainEnd(FlowCode.stmtAt(root, row.path)).else = [holeStatement()];
                  return { root, path: null };
                }),
              });
            }
          }
          if (row.kind === "elif") {
            actions.push({
              label: "Remove elif",
              name: "Remove this elif and the lines inside it",
              danger: true,
              run: () => onTree(tab.id, (root) => {
                const parent = FlowCode.stmtAt(root, row.path.slice(0, -1));
                parent.else = FlowCode.stmtAt(root, row.path).else;
                return { root, path: null };
              }),
            });
          } else if (row.kind === "else") {
            actions.push({
              label: "Remove else",
              name: "Remove else and the lines inside it",
              danger: true,
              run: () => onTree(tab.id, (root) => {
                FlowCode.stmtAt(root, row.path).else = [];
                return { root, path: null };
              }),
            });
          } else if (movable) {
            actions.push({
              label: "Delete",
              name: row.kind === "simple" ? "Delete this line" : "Delete this " + (row.kind === "if" ? "if" : "loop") + " and the lines inside it",
              danger: true,
              run: () => onTree(tab.id, (root) => {
                const parentPath = row.path.slice(0, -1);
                const last = row.path[row.path.length - 1];
                FlowCode.listAt(root, parentPath, last[0]).splice(last[1], 1);
                return { root, path: null };
              }),
            });
          }
        }

        return (
          <div
            data-code-node={stmt ? stmt.id : undefined}
            tabIndex={0}
            aria-current={selected ? "true" : undefined}
            onFocus={(event) => {
              if (!selected) onSelect(row);
              if (event.target === event.currentTarget) event.currentTarget.scrollIntoView({ block: "nearest" });
            }}
            onClick={() => !selected && onSelect(row)}
            className={
              "fc-code-row flex min-h-[2.25rem] flex-wrap items-center gap-x-2 gap-y-1 rounded-md py-0.5 pr-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 " +
              (selected ? "bg-indigo-100 ring-2 ring-indigo-500 dark:bg-indigo-950 dark:ring-indigo-400" : "hover:bg-slate-50 dark:hover:bg-slate-800/50")
            }
            style={{ paddingLeft: `calc(${row.depth * 2}rem + 0.5rem)`, "--fc-depth": row.depth }}
          >
            <span className="fc-mono whitespace-pre-wrap text-[15px] leading-8 text-slate-900 dark:text-slate-100">{content}</span>
            {actions.length > 0 && (
              <span className="ml-auto flex flex-wrap gap-1 pl-2 font-sans">
                {actions.map((action) => (
                  <button
                    key={action.label}
                    type="button"
                    aria-label={action.name}
                    title={action.name}
                    onClick={(event) => {
                      event.stopPropagation();
                      action.run();
                    }}
                    className={(action.danger ? dangerButton : smallButton) + " !px-2 !py-0.5 text-xs"}
                  >
                    {action.label}
                  </button>
                ))}
              </span>
            )}
          </div>
        );
      }

      function CodeSection({ tab, doc, structure, types, selectedKey, onSelect, slotApi, edit, commitEdit, onTree, onShowInFlowchart, onMoveSub, onDeleteSub }) {
        const subs = doc.tabs.filter((item) => item.kind === "sub");
        const subNames = subs.map((item) => item.name);
        const env = types.envs[tab.id] || {};
        const rows = useMemo(() => (structure.ok ? FlowCode.rowsFor(structure.body, tab.kind === "sub" ? 1 : 0) : []), [structure, tab.kind]);
        const checkSubName = (text) => {
          const value = text.trim();
          if (!value) return { ok: true, value: "" };
          const problem = FlowLang.nameProblem(value, "The subprogram name");
          if (problem) return { ok: false, error: problem.message };
          if (subs.some((other) => other.id !== tab.id && String(other.name).toLowerCase() === value.toLowerCase())) {
            return { ok: false, error: "Another subprogram is already called " + value + "." };
          }
          return { ok: true, value };
        };
        const checkParams = (text) => {
          const parsed = FlowLang.parseParams(text);
          return parsed.error ? { ok: false, error: parsed.error.message } : { ok: true, value: parsed.params.join(", ") };
        };
        const defSelected = selectedKey === tab.id + "|" + rowKey({ kind: "def", path: [] });
        const subIndex = subs.findIndex((item) => item.id === tab.id);
        const lines = [];
        rows.forEach((row, index) => {
          const key = rowKey(row);
          lines.push(
            <div role="listitem" key={key}>
              <CodeRow
                tab={tab}
                doc={doc}
                row={row}
                env={env}
                types={types}
                subNames={subNames}
                selected={selectedKey === tab.id + "|" + key}
                onSelect={(chosen) => onSelect(tab.id, chosen)}
                slotApi={slotApi}
                edit={edit}
                commitEdit={commitEdit}
                onTree={onTree}
              />
            </div>,
          );
        });

        return (
          <section data-code-tab={tab.id} aria-label={tab.kind === "main" ? "Main program" : "Subprogram " + tab.name} className="scroll-mt-2">
            {tab.kind === "sub" ? (
              <div
                tabIndex={0}
                data-code-def={tab.id}
                aria-current={defSelected ? "true" : undefined}
