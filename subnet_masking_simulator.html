  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useRef, useEffect, useLayoutEffect, useCallback } = React;

      /* ---------------------------------------------------------------
         The network. One small subnet is shown in full: three computers
         and a router interface on one switch. The router's other links
         are drawn as wires only, labelled with the network they lead to.
         Private (RFC 1918) addresses are used inside the organisation and
         a documentation (RFC 5737) address stands in for the internet.
         --------------------------------------------------------------- */
      const PC1 = { name: "PC1", ip: "192.168.10.11", mac: "3C:52:82:10:00:11" };
      const PC2 = { name: "PC2", ip: "192.168.10.12", mac: "3C:52:82:10:00:12" };
      const PC3 = { name: "PC3", ip: "192.168.10.13", mac: "3C:52:82:10:00:13" };
      const MASK = "255.255.255.0";
      const LAN_ID = "192.168.10.0";
      const BROADCAST_MAC = "FF:FF:FF:FF:FF:FF";

      const ROUTER = {
        eth0: { ip: "192.168.10.1", mac: "00:1D:A1:10:00:01" },
        eth1: { ip: "192.168.20.1", mac: "00:1D:A1:20:00:01" },
        eth2: { ip: "192.168.30.129", mac: "00:1D:A1:30:00:01" },
        eth3: { mac: "00:1D:A1:FE:00:01" },
      };
      const NEXT_ROUTER_MAC = "5C:A6:2D:FE:00:02";

      // The routing table, most specific (longest mask) first. Checking in
      // this order and stopping at the first match gives the same answer as
      // a longest-prefix match, which is how a real router chooses.
      const ROUTES = [
        { id: "lan3", network: "192.168.30.128", mask: "255.255.255.128", prefix: 25, iface: "eth2" },
        { id: "lan1", network: "192.168.10.0", mask: "255.255.255.0", prefix: 24, iface: "eth0" },
        { id: "lan2", network: "192.168.20.0", mask: "255.255.255.0", prefix: 24, iface: "eth1" },
        { id: "default", network: "0.0.0.0", mask: "0.0.0.0", prefix: 0, iface: "eth3" },
      ];

      const SWITCH_TABLE = [
        { id: "pc1", port: 1, mac: PC1.mac, device: "PC1" },
        { id: "pc2", port: 2, mac: PC2.mac, device: "PC2" },
        { id: "pc3", port: 3, mac: PC3.mac, device: "PC3" },
        { id: "router", port: 4, mac: ROUTER.eth0.mac, device: "Router R1 (eth0)" },
      ];

      // PC1's ARP cache, already filled in by earlier traffic on its subnet.
      const PC1_ARP = [
        { ip: ROUTER.eth0.ip, mac: ROUTER.eth0.mac },
        { ip: PC3.ip, mac: PC3.mac },
      ];
      const arpFound = (entries, ip, note) =>
        entries.map((entry) => (entry.ip === ip ? Object.assign({}, entry, { state: "hit", note }) : entry));

      /* --------------------------- helpers --------------------------- */

      const octets = (ip) => ip.split(".").map(Number);
      const andIp = (ip, mask) => {
        const maskOctets = octets(mask);
        return octets(ip)
          .map((value, index) => value & maskOctets[index])
          .join(".");
      };
      const toBits = (value) => value.toString(2).padStart(8, "0");
      const maskPrefix = (mask) =>
        octets(mask).reduce(
          (count, value) => count + toBits(value).split("").filter((bit) => bit === "1").length,
          0,
        );

      // Every place a subnet mask is applied with AND uses this colour, in
      // the text, the calculation, the routing table and the diagram.
      const AND_TEXT = "text-fuchsia-700 dark:text-fuchsia-300";

      // Tiny inline formatter so the teaching text can carry **bold**,
      // `code` and ==an AND operation== without raw HTML.
      const renderInline = (text, and) => {
        const parts = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
        return parts.map((part, index) => {
          if (part.startsWith("**") && part.endsWith("**")) {
            return (
              <strong key={index} className={"font-bold" + (and ? "" : " text-slate-900 dark:text-white")}>
                {part.slice(2, -2)}
              </strong>
            );
          }
          if (part.startsWith("`") && part.endsWith("`")) {
            return (
              <code
                key={index}
                className={
                  "mono whitespace-nowrap rounded px-1 py-0.5 text-[0.92em] " +
                  (and
                    ? "bg-fuchsia-100 text-fuchsia-900 dark:bg-fuchsia-950 dark:text-fuchsia-200"
                    : "bg-slate-200 text-slate-900 dark:bg-slate-700 dark:text-slate-50")
                }
              >
                {part.slice(1, -1)}
              </code>
            );
          }
          return part;
        });
      };

      const renderRich = (text) =>
        String(text)
          .split(/(==[^=]+==)/g)
          .map((segment, index) =>
            segment.startsWith("==") && segment.endsWith("==") ? (
              <span key={index} className={"font-bold " + AND_TEXT}>
                {renderInline(segment.slice(2, -2), true)}
              </span>
            ) : (
              <React.Fragment key={index}>{renderInline(segment, false)}</React.Fragment>
            ),
          );

      const prefersReducedMotion = () => {
        try {
          return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {
          return false;
        }
      };

      /* ----------------------- step construction ----------------------
         Every step is a complete description of what is on screen: the
         devices in focus, the frame as it stands, any calculation, and the
         table that matters at that moment. Back therefore only has to show
         an earlier step, never undo anything. */

      const icmpFrame = (dest, extra) =>
        Object.assign(
          {
            kind: "icmp",
            caption: "Frame being built by PC1",
            dstMac: null,
            srcMac: PC1.mac,
            srcIp: PC1.ip,
            dstIp: dest.ip,
            ttl: 64,
            tags: {},
            andFields: [],
          },
          extra,
        );

      function routeTeach(route, destIp) {
        const result = andIp(destIp, route.mask);
        const sum = "==`" + destIp + "` AND `" + route.mask + "`== gives `" + result + "`";
        const matched = result === route.network;
        if (route.id === "lan3") {
          return (
            "This route is for the subnet on **eth2**, and it has a **different subnet mask**: `255.255.255.128`, or /25, so its network identifier is the first **25 bits** rather than 24. The router applies this route's own mask: " +
            sum +
            ", which is not `192.168.30.128`, so there is **no match**."
          );
        }
        if (route.id === "lan1") {
          return (
            "This route is for the subnet on **eth0**, the one the packet has just arrived from. The router applies this route's mask: " +
            sum +
            ", which is not `192.168.10.0`, so there is **no match**."
          );
        }
        if (route.id === "lan2") {
          return matched
            ? "This route is for the subnet on **eth1**. The router applies this route's mask: " +
                sum +
                ", which **equals** this route's network identifier, so there is a **match**: the destination is on the subnet connected to eth1. This is the most specific route that matches, so the router stops checking and the default route is not needed."
            : "This route is for the subnet on **eth1**. The router applies this route's mask: " +
                sum +
                ", which is not `192.168.20.0`, so there is **no match**. The destination is not on any of the subnets connected directly to this router.";
        }
        return (
          "The last route is the **default route**, `0.0.0.0` /0. Its mask is all zeros, so " +
          sum +
          ". ==ANDing with an all-zero mask== turns **any** address into `0.0.0.0`, which always equals this route's network identifier, so the default route matches **every** destination. That is why it is tried last and only used when no more specific route matches. It leads out of **eth3**, towards the next router."
        );
      }

      function buildSteps(sc) {
        const dest = sc.dest;
        const destNet = andIp(dest.ip, MASK);
        const local = destNet === LAN_ID;
        const pc1Panel = (extra) => Object.assign({ type: "host", host: "pc1", arp: PC1_ARP }, extra);

        const steps = [
          {
            id: "ping",
            title: "PC1 builds a ping request",
            teach:
              "A user on **PC1** types `ping " +
              dest.ip +
              "` to check that " +
              dest.intro +
              " can be reached. Ping creates an **ICMP Echo Request**, which is carried directly inside an **IP packet**: ICMP does not use TCP or UDP, so there are no port numbers. PC1 can fill in the IP header straight away, with source `" +
              PC1.ip +
              "` and destination `" +
              dest.ip +
              "`. What it cannot fill in yet is the **destination MAC address** for the link-layer frame. That depends on whether the destination is on PC1's own subnet, so PC1 has to work that out first.",
            focus: ["pc1"],
            frame: icmpFrame(dest, { tags: { srcIp: "PC1", dstIp: "destination" } }),
            panel: pc1Panel({ highlight: ["ip"] }),
          },
          {
            id: "mask-own",
            title: "PC1 ANDs its own IP address with its subnet mask",
            andAt: "pc1",
            teach:
              "PC1's network settings include its **subnet mask**, `255.255.255.0`, written /24 because it starts with 24 ones. ==PC1 applies the mask to its own IP address with a bitwise AND: `" +
              PC1.ip +
              "` AND `" +
              MASK +
              "`==. Wherever the mask has a 1 the address bit is kept, and wherever the mask has a 0 the bit becomes 0. What survives is the **network identifier**, so PC1's own subnet is `" +
              LAN_ID +
              "`.",
            focus: ["pc1"],
            frame: icmpFrame(dest, { tags: { srcIp: "AND with mask" }, andFields: ["srcIp"] }),
            calc: {
              type: "and",
              title: "PC1's IP address AND PC1's subnet mask",
              ip: { label: "PC1's IP", value: PC1.ip },
              mask: { label: "Subnet mask", value: MASK },
              resultLabel: "Network ID",
            },
            panel: pc1Panel({ highlight: ["ip", "mask"] }),
          },
          {
            id: "mask-dest",
            title: "PC1 ANDs the destination address with the same mask",
            andAt: "pc1",
            teach:
              "Now ==PC1 applies the same mask to the destination IP address: `" +
              dest.ip +
              "` AND `" +
              MASK +
              "`==. PC1 uses **its own** subnet mask because it has no way of knowing the destination's. In effect PC1 is asking: if this address were on my subnet, what would its network identifier be? The answer is `" +
              destNet +
              "`.",
            focus: ["pc1"],
            frame: icmpFrame(dest, { tags: { dstIp: "AND with mask" }, andFields: ["dstIp"] }),
            calc: {
              type: "and",
              title: "Destination IP address AND PC1's subnet mask",
              ip: { label: "Destination IP", value: dest.ip },
              mask: { label: "Subnet mask", value: MASK },
              resultLabel: "Network ID",
            },
            panel: pc1Panel({ highlight: ["mask"] }),
          },
          local
            ? {
                id: "compare",
                title: "Same network identifier: deliver directly",
                teach:
                  "Both answers are `" +
                  LAN_ID +
                  "`, so the destination is on the **same subnet** as PC1. PC1 can deliver the frame **directly** through the switch, and the router plays no part. That means the destination MAC address in the frame must be **PC3's own MAC address**.",
                focus: ["pc1"],
                frame: icmpFrame(dest),
                calc: {
                  type: "compare",
                  left: { label: "PC1's network ID", value: LAN_ID },
                  right: { label: "Destination's network ID", value: destNet },
                  same: true,
                  verdict: "Same subnet: send the frame directly to " + dest.ip,
                },
                panel: pc1Panel({}),
              }
            : {
                id: "compare",
                title: "Different network identifiers: send to the router",
                teach:
                  "The answers are different: `" +
                  LAN_ID +
                  "` for PC1 but `" +
                  destNet +
                  "` for the destination. The destination is **not on PC1's subnet**, so PC1 cannot deliver the frame to it directly. Instead PC1 sends the frame to its **default gateway**: the router's interface on this subnet, `" +
                  ROUTER.eth0.ip +
                  "`, which is stored in PC1's network settings (usually supplied by DHCP). The **destination IP address** stays as `" +
                  dest.ip +
                  "`. Only the frame's destination MAC address changes: it will be the **router's** MAC address.",
                note:
                  "In network settings the router is called the **default gateway**. Do not confuse this with a **gateway** in the AQA sense: a device that joins networks which use different protocols.",
                focus: ["pc1"],
                frame: icmpFrame(dest, { tags: { dstIp: "stays the same" } }),
                calc: {
                  type: "compare",
                  left: { label: "PC1's network ID", value: LAN_ID },
                  right: { label: "Destination's network ID", value: destNet },
                  same: false,
                  verdict: "Different subnets: send the frame to the default gateway, " + ROUTER.eth0.ip,
                },
                panel: pc1Panel({ highlight: ["gateway"] }),
              },
        ];

        if (local) {
          steps.push(
            {
              id: "add-mac",
              title: "PC1 adds PC3's MAC address to the frame",
              macHelp: true,
              teach:
                "The frame must be addressed to PC3 itself, so PC1 looks up `" +
                PC3.ip +
                "` in its **ARP cache**, a table of the IP addresses and matching MAC addresses of devices on its subnet, and finds `" +
                PC3.mac +
                "`. PC1 now finishes **encapsulating** the ping: the IP packet goes inside a link-layer frame with PC3's MAC address as the **destination MAC** and its own as the **source MAC**. The IP addresses identify the two ends of the whole journey; the MAC addresses identify the two ends of this one link. On the same subnet, those are the same two computers.",
              focus: ["pc1"],
              frame: icmpFrame(dest, { dstMac: PC3.mac, tags: { dstMac: "PC3" } }),
              panel: pc1Panel({ arp: arpFound(PC1_ARP, PC3.ip) }),
            },
            {
              id: "send",
              title: "PC1 sends the frame to the switch",
              teach:
                "The frame travels along PC1's cable into **port 1** of the switch. A switch works at the **link layer**: it decides where a frame goes using the destination **MAC address**, and never looks at the IP address inside.",
              focus: ["sw"],
              motion: [[{ kind: "icmp", from: "pc1", to: "sw" }]],
              frame: icmpFrame(dest, {
                caption: "Frame arriving at the switch",
                dstMac: PC3.mac,
                tags: { dstMac: "read by the switch" },
              }),
              panel: { type: "switch", arrived: "pc1" },
            },
            {
              id: "switch-forward",
              title: "The switch forwards the frame to PC3 only",
              teach:
                "The switch looks up `" +
                PC3.mac +
                "` in its **MAC address table** and finds it on **port 3**, so the frame goes out of port 3 **only**: PC2 and the router never see it. The switch built this table itself, by noting the **source** MAC address of the frames arriving on each port.",
              focus: ["sw"],
              motion: [[{ kind: "icmp", from: "sw", to: "pc3" }]],
              frame: icmpFrame(dest, {
                caption: "Frame leaving port 3",
                dstMac: PC3.mac,
                tags: { dstMac: "found on port 3" },
              }),
              panel: { type: "switch", arrived: "pc1", forward: "pc3" },
            },
            {
              id: "deliver",
              title: "PC3 accepts the ping",
              teach:
                "PC3 sees its own MAC address as the frame's destination, so it accepts the frame and removes the frame header. The IP packet's destination is PC3's own IP address, so the **ICMP Echo Request** is passed on to be answered. PC3 then sends an **Echo Reply** back to `" +
                PC1.ip +
                "`, making exactly the same decision in reverse: ==PC3 ANDs both IP addresses with its own subnet mask==, finds that PC1 is on its subnet too, and addresses the reply directly to PC1's MAC address, which is in its own ARP cache.",
              focus: ["pc3"],
              screens: { pc3: ["Echo Request", "received"] },
              frame: icmpFrame(dest, {
                caption: "Frame received by PC3",
                dstMac: PC3.mac,
                tags: { dstMac: "matches PC3", dstIp: "matches PC3" },
              }),
              panel: {
                type: "host",
                host: "pc3",
                arp: [
                  { ip: ROUTER.eth0.ip, mac: ROUTER.eth0.mac },
                  { ip: PC1.ip, mac: PC1.mac, state: "hit", note: "used for the reply" },
                ],
                highlight: ["ip", "mac"],
              },
            },
          );
          return steps;
        }

        // Destination on another network: the frame goes to the router.
        const toRouter = (extra) => icmpFrame(dest, Object.assign({ dstMac: ROUTER.eth0.mac }, extra));
        const routerFrame = (extra) =>
          icmpFrame(
            dest,
            Object.assign(
              { caption: "IP packet inside the router", dstMac: ROUTER.eth0.mac, removedLink: true },
              extra,
            ),
          );

        steps.push(
          {
            id: "add-mac",
            title: "PC1 adds the router's MAC address to the frame",
            macHelp: true,
            teach:
              "The frame must be addressed to the **router**, so PC1 looks up its default gateway, `" +
              ROUTER.eth0.ip +
              "`, in its **ARP cache**, a table of the IP addresses and matching MAC addresses of devices on its subnet, and finds `" +
              ROUTER.eth0.mac +
              "`. PC1 does **not** look for the MAC address of `" +
              dest.ip +
              "`: that computer is not on PC1's subnet, so PC1 could never send a frame straight to it. PC1 finishes **encapsulating** the ping with the router's MAC address as the **destination MAC** and its own as the **source MAC**.",
            focus: ["pc1"],
            frame: toRouter({ tags: { dstMac: "router eth0" } }),
            panel: pc1Panel({ arp: arpFound(PC1_ARP, ROUTER.eth0.ip), highlight: ["gateway"] }),
          },
          {
            id: "send",
            title: "PC1 sends the frame to the switch",
            teach:
              "PC1 sends the frame. Compare the two kinds of address inside it: the **destination MAC address** belongs to the router, but the **destination IP address** is still `" +
              dest.ip +
              "`. The MAC addresses describe only this one hop across the LAN; the IP addresses describe the whole journey.",
            focus: ["sw"],
            motion: [[{ kind: "icmp", from: "pc1", to: "sw" }]],
            frame: toRouter({
              caption: "Frame arriving at the switch",
              tags: { dstMac: "router eth0", dstIp: "not the router" },
            }),
            panel: { type: "switch", arrived: "pc1" },
          },
          {
            id: "switch-forward",
            title: "The switch forwards the frame to the router",
            teach:
              "The switch looks up `" +
              ROUTER.eth0.mac +
              "` in its **MAC address table** and finds it on **port 4**, so it sends the frame out of that port only. The switch neither knows nor cares that this device is a router: it never reads the IP address.",
            focus: ["sw"],
            motion: [[{ kind: "icmp", from: "sw", to: "r" }]],
            frame: toRouter({ caption: "Frame leaving port 4", tags: { dstMac: "found on port 4" } }),
            panel: { type: "switch", arrived: "pc1", forward: "router" },
          },
          {
            id: "router-receive",
            title: "The router reads the destination IP address",
            teach:
              "The frame's destination MAC address matches the router's **eth0** interface, so the router accepts the frame and removes the link-layer header. It reads the **destination IP address**, `" +
              dest.ip +
              "`, and looks for a route to it in its **routing table**. Each route has its **own** network identifier and its **own** subnet mask. For each route, ==the router ANDs the destination address with that route's mask== and checks whether the answer equals that route's network identifier. The most specific routes, with the longest masks, are tried first.",
            focus: ["router"],
            frame: routerFrame({ tags: { dstIp: "looked up" } }),
            panel: { type: "router", states: {} },
          },
        );

        const matchIndex = ROUTES.findIndex((route) => andIp(dest.ip, route.mask) === route.network);
        const statesAt = (checked) => {
          const states = {};
          ROUTES.slice(0, checked + 1).forEach((route, index) => {
            states[route.id] = {
              result: andIp(dest.ip, route.mask) === route.network ? "match" : "nomatch",
              current: index === checked,
            };
          });
          return states;
        };

        ROUTES.slice(0, matchIndex + 1).forEach((route, index) => {
          steps.push({
            id: "route-" + route.id,
            title: "Route " + (index + 1) + " of " + ROUTES.length + ": " + route.network + " /" + route.prefix,
            andAt: "router",
            teach: routeTeach(route, dest.ip),
            focus: ["router"],
            routeStates: statesAt(index),
            frame: routerFrame({ tags: { dstIp: "AND with route mask" }, andFields: ["dstIp"] }),
            calc: {
              type: "and",
              title: "Destination IP AND this route's subnet mask",
              ip: { label: "Destination IP", value: dest.ip },
              mask: { label: "Route's mask", value: route.mask },
              resultLabel: "AND result",
              compareTo: { label: "Route's network ID", value: route.network },
            },
            panel: { type: "router", states: statesAt(index) },
          });
        });

        const finalStates = statesAt(matchIndex);
        if (ROUTES[matchIndex].id === "lan2") {
          steps.push({
            id: "forward",
            title: "The router forwards the packet out of eth1",
            macHelp: true,
            teach:
              "The router sends the packet out of **eth1**, onto the 192.168.20.0 subnet. It wraps the packet in a **new frame** for this hop: the source MAC address is its own eth1 interface, `" +
              ROUTER.eth1.mac +
              "`, and the destination MAC address belongs to `" +
              dest.ip +
              "` itself, which the router finds in its own ARP cache for that subnet. The router **reduces the TTL** from 64 to 63, but the **source and destination IP addresses do not change**. A switch on that subnet now delivers the frame, just as the switch in scenario A delivered PC1's frame to PC3.",
            focus: ["router"],
            routeStates: finalStates,
            motion: [[{ kind: "icmp", from: "r", to: "lan2" }]],
            frame: icmpFrame(dest, {
              caption: "New frame sent out of eth1",
              srcMac: ROUTER.eth1.mac,
              dstMac: dest.mac,
              ttl: 63,
              tags: { srcMac: "router eth1", dstMac: "destination", ttl: "was 64", dstIp: "unchanged" },
            }),
            panel: { type: "router", states: finalStates, sent: "eth1" },
          });
        } else {
          steps.push({
            id: "forward",
            title: "The router forwards the packet along the default route",
            macHelp: true,
            teach:
              "The router sends the packet out of **eth3**, the uplink towards the rest of the network. It wraps the packet in a **new frame** addressed to the **next router's MAC address**, which it finds in its own ARP cache, reduces the **TTL** from 64 to 63, and leaves both IP addresses unchanged. The next router makes its own decision in exactly the same way, using its own routing table, and so on, hop by hop. One more change happens later: `" +
              PC1.ip +
              "` is a **private IP address**, so a router at the edge of the organisation's network will use **NAT** to replace it with a public IP address before the packet reaches the internet.",
            focus: ["router"],
            routeStates: finalStates,
            motion: [[{ kind: "icmp", from: "r", to: "up" }]],
            frame: icmpFrame(dest, {
              caption: "New frame sent out of eth3",
              srcMac: ROUTER.eth3.mac,
              dstMac: NEXT_ROUTER_MAC,
              ttl: 63,
              tags: { srcMac: "router eth3", dstMac: "next router", ttl: "was 64", dstIp: "unchanged" },
            }),
            panel: { type: "router", states: finalStates, sent: "eth3" },
          });
        }
        return steps;
      }

      // Where packets rest when a step has no animation of its own: wherever
      // the most recent movement left them.
      function computeRest(steps) {
        let current = [];
        return steps.map((step) => {
          if (step.motion) current = step.motion[step.motion.length - 1];
          return current;
        });
      }

      const SCENARIOS = [
        {
          id: "local",
          letter: "A",
          label: "A: Destination on this subnet",
          summary: "PC1 pings PC3, on the same subnet",
          dest: { ip: PC3.ip, mac: PC3.mac, intro: "**PC3**, on the same switch," },
          names: { pc1: "PC1 (sender)", pc3: "PC3 (destination)" },
          examPoints: [
            "A computer finds its own network identifier by ==ANDing its IP address with its subnet mask==.",
            "To test a destination, it ==ANDs the destination IP address with its own subnet mask==, because it cannot know the destination's mask.",
            "If the two network identifiers are the same, the destination is on the same subnet, so the frame is addressed directly to the destination's MAC address and delivered through the switch.",
            "The MAC address comes from the computer's ARP cache: a table of IP addresses and MAC addresses for devices on its own subnet.",
            "A switch forwards a frame using the destination MAC address and its MAC address table, never the IP address.",
          ],
        },
        {
          id: "remote",
          letter: "B",
          label: "B: Destination on another subnet",
          summary: "PC1 pings 192.168.20.25, on another subnet",
          dest: {
            ip: "192.168.20.25",
            mac: "B8:27:EB:20:00:25",
            intro: "a computer elsewhere in the building, on the 192.168.20.0 subnet,",
          },
          names: { pc1: "PC1 (sender)", pc3: "PC3" },
          examPoints: [
            "A computer ==ANDs both its own IP address and the destination IP address with its own subnet mask==.",
            "If the network identifiers differ, the frame is addressed to the MAC address of the default gateway: the router's interface on the computer's own subnet.",
            "The destination IP address does not change on the way; the MAC addresses change at every hop.",
            "A router ==ANDs the destination IP address with each route's own subnet mask== and compares the answer with that route's network identifier, trying the most specific routes first.",
            "The router sends the packet out of the matching route's interface, in a new frame, with the TTL reduced by one.",
          ],
        },
        {
          id: "default",
          letter: "C",
          label: "C: No matching subnet (default route)",
          summary: "PC1 pings 192.0.2.34, a server on the internet",
          dest: { ip: "192.0.2.34", intro: "a web server on the internet" },
          names: { pc1: "PC1 (sender)", pc3: "PC3" },
          examPoints: [
            "A destination that is not on the computer's own subnet is sent to its default gateway.",
            "The router checks the destination against each route in turn, ==ANDing it with that route's subnet mask==.",
            "When no specific route matches, the default route, 0.0.0.0 /0, is used. ==ANDing any address with its all-zero mask== gives 0.0.0.0, so it matches every address and is always tried last.",
            "The default route leads to the next router, which makes its own routing decision; the journey continues hop by hop.",
            "A private source address such as 192.168.10.11 is replaced using NAT at the edge of the organisation's network before the packet reaches the internet.",
          ],
        },
      ];

      SCENARIOS.forEach((scenario) => {
        scenario.steps = buildSteps(scenario);
        scenario.rest = computeRest(scenario.steps);
      });

      /* ---------------------------- diagram ---------------------------- */

      const SVG_TEXT = "fill-slate-800 dark:fill-slate-100";
      const SVG_MUTED = "fill-slate-600 dark:fill-slate-300";
      const SVG_HALO = "stroke-white dark:stroke-slate-900";

      // Packet routes across the drawing, following the cables. A leg can be
      // travelled either way.
      const LEGS = {
        "pc1>sw": [[190, 384], [190, 360], [440, 360], [440, 326], [500, 299]],
        "pc3>sw": [[810, 384], [810, 360], [560, 360], [560, 326], [500, 299]],
        "r>sw": [[500, 206], [500, 299]],
        "r>lan2": [[500, 206], [500, 158], [130, 158]],
        "r>up": [[500, 206], [500, 158], [500, 90]],
      };

      const legPoints = (from, to) => {
        if (LEGS[from + ">" + to]) return LEGS[from + ">" + to];
        if (LEGS[to + ">" + from]) return LEGS[to + ">" + from].slice().reverse();
        throw new Error("No cable from " + from + " to " + to);
      };

      const pointAlong = (points, fraction) => {
        const lengths = [];
        let total = 0;
        for (let index = 1; index < points.length; index += 1) {
          const length = Math.hypot(points[index][0] - points[index - 1][0], points[index][1] - points[index - 1][1]);
          lengths.push(length);
          total += length;
        }
        let remaining = fraction * total;
        for (let index = 0; index < lengths.length; index += 1) {
          if (remaining <= lengths[index] || index === lengths.length - 1) {
            const share = lengths[index] === 0 ? 1 : Math.min(1, remaining / lengths[index]);
            const [x1, y1] = points[index];
            const [x2, y2] = points[index + 1];
            return [x1 + (x2 - x1) * share, y1 + (y2 - y1) * share];
          }
          remaining -= lengths[index];
        }
        return points[points.length - 1];
      };

      const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

      const MOVE_MS = 1150;
      const PHASE_GAP_MS = 160;

      function Token() {
        return (
          <g>
            <rect
              x={-36}
              y={-15}
              width={72}
              height={30}
              rx={9}
              strokeWidth={2}
              className="fill-indigo-600 stroke-white dark:stroke-slate-900"
            />
            <text x={0} y={5} textAnchor="middle" fontSize={15} fontWeight={700} className="fill-white">
              Ping
            </text>
          </g>
        );
      }

      // Moves packets by writing SVG attributes directly, so an animation
      // frame never re-renders React. The initial render is the finished
      // state; the layout effect rewinds it to the start before painting.
      function PacketLayer({ phases, animate }) {
        const refs = useRef([]);
        const movers = useMemo(() => {
          const list = [];
          phases.forEach((phase, phaseIndex) =>
            phase.forEach((mover) =>
              list.push(Object.assign({}, mover, { phase: phaseIndex, points: legPoints(mover.from, mover.to) })),
            ),
          );
          return list;
        }, [phases]);
        const lastPhase = phases.length - 1;

        useLayoutEffect(() => {
          if (!animate || movers.length === 0) return undefined;
          const total = lastPhase * (MOVE_MS + PHASE_GAP_MS) + MOVE_MS;

          const place = (elapsed) => {
            movers.forEach((mover, index) => {
              const element = refs.current[index];
              if (!element) return;
              const start = mover.phase * (MOVE_MS + PHASE_GAP_MS);
              const progress = Math.max(0, Math.min(1, (elapsed - start) / MOVE_MS));
              const visible =
                mover.phase === lastPhase
                  ? elapsed >= start
                  : elapsed >= start && elapsed < start + MOVE_MS + PHASE_GAP_MS;
              const [x, y] = pointAlong(mover.points, easeInOut(progress));
              element.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
              element.setAttribute("opacity", visible ? "1" : "0");
            });
          };

          if (prefersReducedMotion()) {
            place(total);
            return undefined;
          }

          place(0);
          const begin = performance.now();
          let frame = 0;
          const tick = (now) => {
            const elapsed = now - begin;
            place(elapsed);
            if (elapsed < total) frame = requestAnimationFrame(tick);
          };
          frame = requestAnimationFrame(tick);
          // Animation frames stop in a hidden tab; make sure the packets
          // still finish where the step says they are.
          const settle = setTimeout(() => place(total), total + 300);
          return () => {
            cancelAnimationFrame(frame);
            clearTimeout(settle);
          };
        }, [movers, animate, lastPhase]);

        return (
          <g aria-hidden="true">
            {movers.map((mover, index) => {
              const [x, y] = mover.points[mover.points.length - 1];
              return (
                <g
                  key={index}
                  ref={(element) => {
                    refs.current[index] = element;
                  }}
                  transform={"translate(" + x + " " + y + ")"}
                  opacity={mover.phase === lastPhase ? 1 : 0}
                >
                  <Token />
                </g>
              );
            })}
          </g>
        );
      }

      function Arrow({ x1, x2, y, y1 = y, y2 = y }) {
        const length = Math.hypot(x2 - x1, y2 - y1);
        const ux = (x2 - x1) / length;
        const uy = (y2 - y1) / length;
        const baseX = x2 - ux * 10;
        const baseY = y2 - uy * 10;
        const head =
          "M " + x2 + " " + y2 +
          " L " + (baseX - uy * 5) + " " + (baseY + ux * 5) +
          " L " + (baseX + uy * 5) + " " + (baseY - ux * 5) + " Z";
        return (
          <g>
            <line x1={x1} y1={y1} x2={x2 - ux * 6} y2={y2 - uy * 6} strokeWidth={3} strokeLinecap="round" className="stroke-white" />
            <path d={head} className="fill-white" />
          </g>
        );
      }

      function FocusRing({ x, y, width, height, and }) {
        return (
          <rect
            x={x}
            y={y}
            width={width}
            height={height}
            rx={14}
            strokeWidth={and ? 3 : 2}
            className={
              and
                ? "fill-fuchsia-50 stroke-fuchsia-500 dark:fill-fuchsia-950 dark:stroke-fuchsia-400"
                : "fill-indigo-50 stroke-indigo-400 dark:fill-indigo-950 dark:stroke-indigo-400"
            }
          />

      }

      // Marks the device that is applying a subnet mask at this step.
      function AndPill({ cx, cy, label }) {

        return (

              x={cx - width / 2}

            />
