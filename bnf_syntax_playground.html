        const productions = useMemo(() => buildProductions(rules), [rules]);
        const fatalError = grammar.problems.some((problem) => problem.kind === "error");

        useEffect(() => {
          if (ruleNames.length === 0 || ruleNames.includes(startRule)) return;
          setStartRule(ruleNames[ruleNames.length - 1]);
        }, [ruleNames.join("|")]);

        useEffect(() => {
          if (rules.length === 0) { if (activeKey !== null) setActiveKey(null); return; }
          if (!rules.some((rule) => rule.key === activeKey)) setActiveKey(rules[0].key);
        }, [rules.map((rule) => rule.key).join("|")]);

        const results = useMemo(() => {
          if (fatalError || !startRule || productions.length === 0) return null;
          return tests.map((test) => {
            const input = ignoreSpaces ? test.replace(/\s+/g, "") : test;
            return { raw: test, input, outcome: earleyParse(productions, startRule, input) };
          });
        }, [productions, startRule, tests, ignoreSpaces, fatalError]);

        const acceptedCount = results ? results.filter((result) => result.outcome.ok).length : 0;
        const activeRule = rules.find((rule) => rule.key === activeKey) || null;

        const loadPreset = (id) => {
          const preset = PRESETS.find((candidate) => candidate.id === id) || PRESETS[0];
          graphCache.current.clear();
          setPresetId(preset.id);
          setGrammarText(preset.grammar);
          setEbnf(preset.ebnf);
          setTests(preset.tests.slice());
          setStartRule(preset.start);
          setOpenDerivations({});
          setNotice("Loaded the " + preset.name.toLowerCase() + " example.");
        };

        const replaceRuleLines = (rule, replacement) => {
          setGrammarText((current) => {
            const lines = current.split(/\r?\n/);
            return lines.slice(0, rule.line - 1).concat(replacement, lines.slice(rule.endLine)).join("\n");
          });
        };

        // A diagram edit only rewrites the grammar when the diagram is complete;
        // an unfinished one is kept on screen while the rule text stays put.
        const commitGraph = (rule, nextGraph, structural) => {
          const cached = graphCache.current.get(rule.key);
          const currentBody = cached ? cached.body : rule.body;
          const keepText = () => {
            graphCache.current.set(rule.key, { body: currentBody, graph: nextGraph });
            setGraphVersion((version) => version + 1);
          };

          if (!structural) { keepText(); return; }
          if (validateGraph(nextGraph, ruleNames).some((issue) => issue.blocking)) { setTooTangled(false); keepText(); return; }

          const compiled = compileGraph(nextGraph, ebnf);
          if (!compiled) { setTooTangled(true); keepText(); return; }
          setTooTangled(false);

          graphCache.current.set(rule.key, { body: compiled.body, graph: nextGraph });
          if (compiled.requiresEbnf && !ebnf) {
            setEbnf(true);
            setNotice("That diagram needs repetition or grouping, which plain BNF cannot write, so EBNF extensions have been switched on.");
          } else {
            setNotice("");
          }
          replaceRuleLines(rule, ["<" + rule.name + "> ::= " + compiled.body]);
          setGraphVersion((version) => version + 1);
        };

        const addRule = (name) => {
          if (!NAME_PATTERN.test(name)) return "Rule names must start with a letter, for example “digit”.";
          if (ruleNames.includes(name)) return "<" + name + "> already exists.";
          setGrammarText((current) => (current.replace(/\s+$/, "") + '\n<' + name + '> ::= ""').replace(/^\n/, ""));
          setActiveKey(name);
          setNotice("Added <" + name + ">. Build it up on the diagram.");
          return null;
        };

        const renameRule = (rule, name) => {
          if (!NAME_PATTERN.test(name)) return "Rule names must start with a letter, for example “digit”.";
          if (ruleNames.includes(name)) return "<" + name + "> already exists.";
          const escaped = rule.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          graphCache.current.delete(rule.key);
          setGrammarText((current) => current.replace(new RegExp("<\\s*" + escaped + "\\s*>", "g"), "<" + name + ">"));
          if (startRule === rule.name) setStartRule(name);
          setActiveKey(name);
          return null;
        };

        const deleteRule = (rule) => {
          graphCache.current.delete(rule.key);
          replaceRuleLines(rule, []);
          setActiveKey(null);
        };

        const updateTest = (index, value) => setTests((current) => current.map((test, position) => (position === index ? value : test)));
        const addTest = () => setTests((current) => current.concat([""]));
        const removeTest = (index) => {
          setTests((current) => current.filter((_, position) => position !== index));
          setOpenDerivations({});
        };

        const usesEbnfSyntax = /[[\]{}]/.test(grammarText);
        const tabClass = (name) => (
          "px-4 py-2 text-sm font-semibold rounded-t-lg border-b-2 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 " +
          (tab === name
            ? "border-indigo-600 text-indigo-700 dark:text-indigo-300 bg-white dark:bg-slate-800"
            : "border-transparent text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100")
        );

        return (
          <div className="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
            <header
              data-interactive-header
              className="flex flex-col md:flex-row md:items-center justify-between gap-3 px-4 md:px-6 py-4 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700"
            >
              <div>
                <h1 className="text-2xl font-bold text-slate-900 dark:text-slate-50">BNF & Syntax Diagram Playground</h1>
                <p className="text-sm text-slate-500 dark:text-slate-400">
                  Write a grammar as BNF or draw it as a syntax diagram, then test strings against it
                </p>
              </div>
              <div data-interactive-actions className="flex items-center gap-2">
                <label className="flex items-center gap-2 text-sm font-semibold">
                  <span className="sr-only md:not-sr-only">Example</span>
                  <select className={FIELD} aria-label="Example grammar" value={presetId} onChange={(event) => loadPreset(event.target.value)}>
                    {PRESETS.map((preset) => <option key={preset.id} value={preset.id}>{preset.name}</option>)}
                  </select>
                </label>
              </div>
            </header>

            <main className="max-w-[96rem] mx-auto px-4 md:px-6 py-5 flex flex-col gap-5">
              {notice ? (
                <p className="text-sm rounded-md border border-indigo-200 dark:border-indigo-800 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-900 dark:text-indigo-100 px-3 py-2">
                  {notice}
                </p>
              ) : null}

              <section className={CARD + " min-w-0"} aria-labelledby="grammar-heading">
                <h2 id="grammar-heading" className="sr-only">Grammar</h2>
                <div className="flex flex-wrap items-center justify-between gap-3 px-4 md:px-5 pt-3 border-b border-slate-200 dark:border-slate-700">
                  <div role="tablist" aria-label="Grammar view" className="flex gap-1">
                    <button
                      type="button"
                      role="tab"
                      id="tab-bnf"
                      aria-selected={tab === "bnf"}
                      aria-controls="panel-bnf"
                      className={tabClass("bnf")}
                      onClick={() => setTab("bnf")}
                    >
                      Write BNF
                    </button>
                    <button
                      type="button"
                      role="tab"
                      id="tab-diagram"
                      aria-selected={tab === "diagram"}
                      aria-controls="panel-diagram"
                      className={tabClass("diagram")}
                      onClick={() => setTab("diagram")}
                    >
                      Draw a syntax diagram
                    </button>
                  </div>
                  <label className="flex items-center gap-2 text-sm font-semibold cursor-pointer pb-2">
                    <input
                      type="checkbox"
                      className="w-4 h-4 accent-indigo-600"
                      checked={ebnf}
                      onChange={(event) => { setEbnf(event.target.checked); setNotice(""); }}
                    />
                    Allow EBNF extensions
                  </label>
                </div>

                {tab === "bnf" ? (
                  <div id="panel-bnf" role="tabpanel" aria-labelledby="tab-bnf" className="p-4 md:p-5 grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
                    <div className="min-w-0">
                      <label htmlFor="bnf-source" className="block text-sm font-semibold">Production rules</label>
                      <p className="mt-1 text-xs text-slate-600 dark:text-slate-300">
                        {ebnf
                          ? "[ x ] is optional, { x } repeats zero or more times, { x }+ repeats one or more times, and ( x ) groups. Write those characters as literals with quotes, e.g. \"(\"."
                          : "Plain BNF: one rule per line, alternatives separated by |, and recursion for repetition."}
                      </p>
                      <textarea
                        id="bnf-source"
                        className={"grammar-input mono mt-2 w-full h-72 resize-y " + FIELD}
                        value={grammarText}
                        spellCheck="false"
                        wrap="off"
                        onChange={(event) => { setGrammarText(event.target.value); setNotice(""); }}
                      />
                      {!ebnf && usesEbnfSyntax ? (
                        <p className="mt-2 text-sm rounded-md border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-900/25 text-amber-900 dark:text-amber-200 px-3 py-2">
                          {"EBNF extensions are switched off, so any [ ] and { } characters above are being treated as ordinary text to match."}
                        </p>
                      ) : null}
                      <Problems problems={grammar.problems} />
                    </div>

                    <div className="min-w-0">
                      <h3 className="text-sm font-bold">How to write the rules</h3>
                      <div className="mt-2 space-y-2 text-sm text-slate-700 dark:text-slate-300">
                        <p>
                          Every rule looks like <span className="mono">{"<name> ::= body"}</span>. Anything in angle brackets is a
                          reference to another rule; anything else is literal text the string must contain.
                        </p>
                        <ul className="list-disc pl-5 space-y-1">
                          <li><span className="mono">|</span> separates alternatives.</li>
                          <li>Spaces between symbols just separate them; they are not matched. To match a real space write <span className="mono">{'" "'}</span>.</li>
                          <li>Quote any literal that clashes with the notation, such as <span className="mono">{'"|"'}</span>, <span className="mono">{'"<"'}</span> or <span className="mono">{'"("'}</span>.</li>
                          <li><span className="mono">{"ε"}</span> or <span className="mono">{'""'}</span> means match nothing.</li>
                          <li>A rule may continue on the next line, which is handy for a long list of alternatives.</li>
                          <li>Lines starting with <span className="mono">//</span> are comments.</li>
                          <li>Left recursion such as <span className="mono">{"<expr> ::= <expr> + <term>"}</span> is fine here.</li>
                        </ul>
                        <p className="pt-1">
                          Anything you write here appears on the diagram tab, and anything you draw there is written back into these
                          rules once the diagram is fully connected.
                        </p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div id="panel-diagram" role="tabpanel" aria-labelledby="tab-diagram" className="p-4 md:p-5">
                    <div className="mb-3"><Legend /></div>
                    {rules.length === 0 || !activeRule ? (
                      <p className="text-sm text-slate-600 dark:text-slate-300">
                        There are no rules yet. Add one on the BNF tab, or name one below and choose <strong>Add rule</strong>.
                      </p>
                    ) : (
                      <DiagramDesigner
                        rule={activeRule}
                        graph={graphs.get(activeRule.key) || null}
                        rules={rules}
                        activeKey={activeKey}
                        onPick={setActiveKey}
                        ruleNames={ruleNames}
                        ebnf={ebnf}
                        tooTangled={tooTangled}
                        onChange={(next, structural) => commitGraph(activeRule, next, structural)}
                        onAddRule={addRule}
                        onRenameRule={renameRule}
                        onDeleteRule={deleteRule}
                      />
                    )}
                  </div>
                )}
              </section>

              <section className={CARD + " p-4 md:p-5 min-w-0"} aria-labelledby="tests-heading">
                <h2 id="tests-heading" className="text-lg font-bold">Test strings</h2>
                <p className="mt-1 text-xs text-slate-600 dark:text-slate-300">
                  Each string is checked against one rule. It passes only if the whole string can be derived from that rule.
                </p>

                <div className="mt-3 flex flex-wrap items-end gap-3">
                  <label className="flex flex-col gap-1 text-xs font-semibold">
                    Start rule
                    <select
                      className={FIELD + " mono"}
                      value={startRule}
                      onChange={(event) => { setStartRule(event.target.value); setOpenDerivations({}); }}
                    >
                      {ruleNames.length === 0 ? <option value="">(no rules yet)</option> : null}
                      {ruleNames.map((name) => <option key={name} value={name}>{"<" + name + ">"}</option>)}
                    </select>
                  </label>
                  <label className="flex items-center gap-2 text-sm font-semibold cursor-pointer pb-2">
                    <input
                      type="checkbox"
                      className="w-4 h-4 accent-indigo-600"
                      checked={ignoreSpaces}
                      onChange={(event) => setIgnoreSpaces(event.target.checked)}
                    />
                    Ignore spaces in test strings
                  </label>
                </div>

                {results ? (
                  <p className="mt-3 text-sm font-semibold" aria-live="polite">
                    {acceptedCount} of {results.length} {results.length === 1 ? "string is" : "strings are"} accepted by{" "}
                    <span className="mono">{"<" + startRule + ">"}</span>.
                  </p>
                ) : (
                  <p className="mt-3 text-sm rounded-md border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-900/25 text-amber-900 dark:text-amber-200 px-3 py-2">
                    {rules.length === 0 ? "Add at least one rule before testing strings." : "Fix the errors in the grammar before testing strings."}
                  </p>
                )}

                <ul className="mt-3 grid grid-cols-1 lg:grid-cols-2 gap-2">
                  {tests.map((test, index) => {
                    const result = results ? results[index] : null;
                    const outcome = result ? result.outcome : null;
                    const open = Boolean(openDerivations[index]);
                    const tree = outcome && outcome.ok ? tidyTree(outcome.tree)[0] : null;
                    return (
                      <li key={index} className="rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-3 min-w-0">
                        <div className="flex flex-wrap items-center gap-2">
                          <input
                            type="text"
                            className={FIELD + " mono grow min-w-0"}
                            value={test}
                            spellCheck="false"
                            aria-label={"Test string " + (index + 1)}
                            placeholder="type a string to test"
                            onChange={(event) => updateTest(index, event.target.value)}
                          />
                          {outcome ? (
                            <span
                              className={
                                "shrink-0 whitespace-nowrap rounded-md px-2.5 py-1 text-sm font-bold border " +
                                (outcome.ok
                                  ? "bg-emerald-50 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700"
                                  : "bg-rose-50 dark:bg-rose-900/40 text-rose-800 dark:text-rose-200 border-rose-300 dark:border-rose-700")
                              }
                            >
                              {outcome.ok ? "✓ Accepted" : "✗ Rejected"}
                            </span>
                          ) : null}
                          <button
                            type="button"
                            className="shrink-0 px-2 py-1 text-sm text-rose-600 dark:text-rose-400 hover:text-rose-800 dark:hover:text-rose-200"
                            aria-label={"Remove test string " + (index + 1)}
                            onClick={() => removeTest(index)}
                          >
                            {"✕"}
                          </button>
                        </div>

                        {outcome && !outcome.ok ? (
                          <div className="mt-2 text-sm text-slate-700 dark:text-slate-300">
                            {outcome.reason === "too-long" ? (
                              <span>That string is longer than {INPUT_LIMIT} characters, which this playground does not test.</span>
                            ) : outcome.reason === "too-complex" ? (
                              <span>This grammar needed too many steps for that string. Try simplifying the rules or shortening the string.</span>
                            ) : outcome.reason === "no-start" ? (
                              <span>Choose a start rule that exists.</span>
                            ) : result.input === "" ? (
                              <span>The empty string cannot be derived from <span className="mono">{"<" + startRule + ">"}</span>.</span>
                            ) : (
                              <span>
                                Matched{" "}
                                <span className="mono bg-emerald-100 dark:bg-emerald-900/50 text-emerald-900 dark:text-emerald-100 px-1 rounded">
                                  {result.input.slice(0, outcome.furthest) || "∅"}
                                </span>{" "}
                                then could go no further at{" "}
                                <span className="mono bg-rose-100 dark:bg-rose-900/50 text-rose-900 dark:text-rose-100 px-1 rounded">
                                  {result.input.slice(outcome.furthest) || "the end of the string"}
                                </span>.
                              </span>
                            )}
                          </div>
                        ) : null}

                        {outcome && outcome.ok ? (
                          <div className="mt-2">
                            <button
                              type="button"
                              className={BTN_QUIET}
                              aria-expanded={open}
                              onClick={() => setOpenDerivations((current) => ({ ...current, [index]: !current[index] }))}
                            >
                              {open ? "Hide derivation" : "Show derivation"}
                            </button>
                            {open ? (
                              <div className="mt-2 rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-3 text-sm overflow-x-auto">
                                {countTree(tree) > 600
                                  ? <p className="text-slate-600 dark:text-slate-300">This derivation is too large to draw. Try a shorter string.</p>
                                  : <DerivationTree node={tree} input={result.input} depth={0} />}
                              </div>
                            ) : null}
                          </div>
                        ) : null}
                      </li>
                    );
                  })}
                </ul>

                <div className="mt-3">
                  <button type="button" className={BTN_QUIET} onClick={addTest}>Add a test string</button>
                </div>
              </section>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
