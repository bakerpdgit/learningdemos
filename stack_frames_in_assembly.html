          ["", "mov ax, 3", "AX = 3"],
          ["", "push ax", "parameter width = 3", { param: "width" }],
          ["", "call perimeter", "AX = perimeter(3, 4)"],
          ["", "add sp, 4", "remove both parameters", { note: "The stack is empty again. perimeter's whole frame, including total, is now just free space." }],
          ["", "int 20h", "end the program"],
          ["perimeter", ""],
          ["", "push bp", "save main's BP"],
          ["", "mov bp, sp", "BP marks this frame"],
          ["", "sub sp, 2", "make room for total", { locals: ["total"], note: "The frame is complete: parameters at positive offsets from BP, the local variable at a negative offset." }],
          ["", "mov ax, [bp+4]", "AX = width"],
          ["", "push ax", "parameter n = width", { param: "n" }],
          ["", "call double", "AX = double(width)", { note: "Two frames are on the stack now: perimeter's underneath and double's on top." }],
          ["", "add sp, 2", "remove the parameter"],
          ["", "mov [bp-2], ax", "total = AX", { note: "AX is about to be reused, so the first result is kept in the local variable total." }],
          ["", "mov ax, [bp+6]", "AX = height"],
          ["", "push ax", "parameter n = height", { param: "n" }],
          ["", "call double", "AX = double(height)", { note: "double gets a fresh frame in the same place as before, this time with n = 4." }],
          ["", "add sp, 2", "remove the parameter"],
          ["", "add ax, [bp-2]", "AX = AX + total"],
          ["", "mov sp, bp", "discard the local variable", { note: "Epilogue, part 1: total's slot is now free space." }],
          ["", "pop bp", "restore main's BP"],
          ["", "ret", "back to main"],
          ["double", ""],
          ["", "push bp", "save perimeter's BP"],
          ["", "mov bp, sp", "BP marks this frame", { note: "double has its own BP, so its parameter n is at [bp+4] in its own frame." }],
          ["", "mov ax, [bp+4]", "AX = n"],
          ["", "add ax, ax", "AX = 2n"],
          ["", "pop bp", "restore perimeter's BP", { note: "BP points at perimeter's frame again, so [bp-2] and [bp+6] mean total and height once more." }],
          ["", "ret", "back to perimeter"],
        ],
        expect: { ax: 14 },
        result: "AX = 000E (14): perimeter(3, 4) = 2 × 3 + 2 × 4 = 14.",
        takeaways: [
          "A stack frame holds the parameters, the return address and the local variables, plus saved registers such as BP.",
          "Parameters are at positive offsets from BP and local variables at negative offsets.",
          "A local variable exists only while its frame does. Afterwards its slot is free space.",
          "Each call gets a fresh frame, so `double` can be called twice without mixing up its n.",
        ],
      },
      {
        id: "recursion",
        title: "6. Recursion",
        heading: "Recursion",
        intro: "A recursive subroutine calls itself. Each call gets its own stack frame with its own n, so sum(3), sum(2), sum(1) and sum(0) can all be in progress at the same time.",
        watch: [
          "The stack grows by one frame (3 words) for each call.",
          "The base case sum(0) returns without calling again.",
          "The frames unwind in reverse order, adding their own n as each one returns.",
        ],
        pseudocode: [
          "SUBROUTINE sum(n)",
          "  IF n = 0 THEN",
          "    RETURN 0",
          "  ENDIF",
          "  RETURN sum(n - 1) + n",
          "ENDSUBROUTINE",
          "",
          "answer ← sum(3)",
        ],
        source: [
          ["main", "mov ax, 3", "AX = 3"],
          ["", "push ax", "parameter n = 3", { param: "n" }],
          ["", "call sum", "AX = sum(3)"],
          ["", "add sp, 2", "remove the parameter"],
          ["", "int 20h", "end the program"],
          ["sum", ""],
          ["", "push bp", "save the caller's BP", { note: "Each level saves the BP of the level that called it, so the frames are chained together." }],
          ["", "mov bp, sp", "BP marks this frame"],
          ["", "mov ax, [bp+4]", "AX = n"],
          ["", "cmp ax, 0", "is n = 0?"],
          ["", "je done", "base case: return 0"],
          ["", "dec ax", "AX = n - 1"],
          ["", "push ax", "parameter n - 1", { param: "n" }],
          ["", "call sum", "AX = sum(n - 1)", { note: "Another sum frame is built on top. The level below is paused, not finished." }],
          ["", "add sp, 2", "remove the parameter"],
          ["", "add ax, [bp+4]", "AX = sum(n - 1) + n", { note: "Each level adds its own n, which is safe at [bp+4] in its own frame." }],
          ["done", "pop bp", "restore the caller's BP"],
          ["", "ret", "back to the caller"],
        ],
        expect: { ax: 6 },
        result: "AX = 0006 (6): sum(3) = 3 + 2 + 1 + 0 = 6.",
        takeaways: [
          "Every recursive call pushes a new frame. Nothing is overwritten, because each frame has its own n at `[bp+4]`.",
          "Without a base case the stack would keep growing until it ran out of memory: a stack overflow.",
          "Recursion costs memory: each level here uses 6 bytes of stack.",
        ],
      },
    ];
    </script>

    <script type="text/babel">
      const { useState, useMemo, useEffect, useRef, useCallback } = React;
      const { hex2, hex4, signed, offsetText, run, describeSlot, liveFrames, bpFrame, questionFor, STACK_BASE } = StackLab;

      const KIND_LEGEND = [
        ["ret", "return address"],
        ["param", "parameter"],
        ["bp", "saved BP"],
        ["saved", "saved register"],
        ["local", "local variable"],
        ["free", "free space"],
      ];

      // Text with `code` spans, as written in the scenario data.
      function Rich({ text }) {
        return String(text)
          .split("`")
          .map((part, index) =>
            index % 2 ? (
              <code key={index} className="inline-code">
                {part}
              </code>
            ) : (
              <React.Fragment key={index}>{part}</React.Fragment>
            ),
          );
      }

      function Instruction({ code }) {
        const [, mnemonic, operands] = code.match(/^(\S+)\s*(.*)$/);
        const pieces = operands.split(/\b(sp|bp)\b/);
        return (
          <React.Fragment>
            <span className="tok-op">{mnemonic}</span>
            {operands ? " " : ""}
            {pieces.map((piece, index) =>
              index % 2 ? (
                <span key={index} className={"tok-" + piece}>
                  {piece}
                </span>
              ) : (
                piece
              ),
            )}
          </React.Fragment>
        );
      }

      // Scrolls a row into view inside its own panel only. When the panel is
      // not a scroll box (narrow layouts) the page is left alone.
      function keepRowVisible(box, row, above) {
        if (!box || !row || box.scrollHeight <= box.clientHeight + 1) return;
        const head = box.querySelector("thead");
        const headHeight = head ? head.offsetHeight : 0;
        const boxRect = box.getBoundingClientRect();
        const rowRect = row.getBoundingClientRect();
        if (rowRect.top < boxRect.top + headHeight + 4) {
          box.scrollTop -= boxRect.top + headHeight + above - rowRect.top;
        } else if (rowRect.bottom > boxRect.bottom - 4) {
          box.scrollTop += rowRect.bottom - boxRect.bottom + 48;
        }
      }

      function CodePanel({ trace, stepIndex, done }) {
        const scrollRef = useRef(null);
        const [showBytes, setShowBytes] = useState(() => window.innerWidth >= 1440 || (window.innerWidth >= 768 && window.innerWidth < 1100));
        const state = trace.states[stepIndex];
        const lastStep = stepIndex > 0 ? trace.steps[stepIndex - 1] : null;
        const returnTargets = new Set();
        for (let where = state.regs.sp; where < STACK_BASE; where += 2) {
          const info = state.meta[where];
          if (info && info.kind === "ret") returnTargets.add(state.mem[where]);
        }

        useEffect(() => {
          const box = scrollRef.current;
          if (box) keepRowVisible(box, box.querySelector('[data-ip-row="true"]'), 40);
        }, [trace, stepIndex]);
        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = 0;
        }, [trace]);

        return (
          <section className="panel code-panel" aria-labelledby="code-title">
            <div className="panel-head">
              <h2 id="code-title">Code</h2>
              <span className="panel-note">8086 assembly, NASM syntax</span>
              <button type="button" className="mini-toggle" aria-pressed={showBytes} onClick={() => setShowBytes((value) => !value)}>
                Machine code
              </button>
            </div>
            <div className={"panel-scroll" + (showBytes ? "" : " hide-bytes")} ref={scrollRef}>
              <table className="code-table">
                <caption className="sr-only">Program listing with the address and machine code of each instruction</caption>
                <thead>
                  <tr>
                    <th scope="col">
                      <span className="sr-only">Markers</span>
                    </th>
                    <th scope="col">Address</th>
                    <th scope="col" className="bytes">
                      Machine code
                    </th>
                    <th scope="col">Instruction</th>
                    <th scope="col">Comment</th>
                  </tr>
                </thead>
                <tbody>
                  <tr className="code-directive">
                    <td className="marker"></td>
                    <td className="addr"></td>
                    <td className="bytes"></td>
                    <td>org 100h</td>
                    <td className="comment">; DOS loads a .COM program at 0100</td>
                  </tr>
                  {trace.program.lines.map((line, index) => {
                    const isIp = !done && line.address === state.regs.ip;
                    const isLast = Boolean(lastStep) && lastStep.line === line.index && !isIp;
                    const isReturn = returnTargets.has(line.address);
                    const labelRow = line.label ? (
                      <tr key={"label-" + line.label} className="code-label-row">
                        <td className="marker"></td>
                        <td className="addr"></td>
                        <td className="bytes"></td>
                        <td colSpan={2}>
                          <span className="code-label">{line.label}:</span>
                        </td>
                      </tr>
                    ) : null;
                    return (
                      <React.Fragment key={line.index}>
                        {labelRow}
                        <tr
                          className={"code-row" + (isIp ? " is-ip" : "") + (isLast ? " is-last" : "")}
                          data-ip-row={isIp ? "true" : undefined}
                          aria-current={isIp ? "step" : undefined}
                        >
                          <td className="marker">
                            {isIp && (
                              <span className="chip chip-ip" title="IP: the next instruction to run">
                                IP ▸
                              </span>
                            )}
                            {isReturn && (
                              <span className="chip chip-ret" title="A return address on the stack points here">
                                ↩<span className="sr-only">a return address on the stack points here</span>
                              </span>
                            )}
                            {isLast && <span className="sr-only">just ran</span>}
                          </td>
                          <td className="addr">{hex4(line.address)}</td>
                          <td className="bytes">{line.bytes.map(hex2).join(" ")}</td>
                          <td>
                            <Instruction code={line.code} />
                          </td>
                          <td className="comment">; {line.comment}</td>
                        </tr>
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <ul className="code-key" aria-label="Key">
              <li>
                <span className="chip chip-ip">IP ▸</span> next instruction
              </li>
              <li>
                <span className="chip chip-ret">↩</span> a return address on the stack points here
              </li>
            </ul>
          </section>
        );
      }

      function Registers({ trace, stepIndex }) {
        const state = trace.states[stepIndex];
        const previous = stepIndex > 0 ? trace.states[stepIndex - 1] : null;
        const lastStep = stepIndex > 0 ? trace.steps[stepIndex - 1] : null;
        const usesFlags = trace.program.lines.some((line) => line.ins.op === "cmp");
        const changed = (name) => Boolean(previous) && previous.regs[name] !== state.regs[name] && (name !== "ip" || lastStep.jumped);

        const general = ["ax", "bx", "cx", "dx"].map((name) => {
          const value = state.regs[name];
          const isChanged = changed(name);
          return (
            <div key={name} className={"reg" + (isChanged ? " is-changed" : "")}>
              <div className="reg-name">{name.toUpperCase()}</div>
              <div className="reg-value">{hex4(value)}</div>
              <div className="reg-sub">
                = {signed(value)}
                {isChanged ? ", was " + signed(previous.regs[name]) : ""}
              </div>
            </div>
          );
        });
        const pointerRoles = { sp: "top of stack", bp: "frame base", ip: "next to run" };
        const pointers = ["sp", "bp", "ip"].map((name) => {
          const isChanged = changed(name);
          return (
            <div key={name} className={"reg reg-" + name + (isChanged ? " is-changed" : "")}>
              <div className="reg-name">{name.toUpperCase()}</div>
              <div className="reg-value">{hex4(state.regs[name])}</div>
              <div className="reg-sub">{isChanged ? "was " + hex4(previous.regs[name]) : pointerRoles[name]}</div>
            </div>
          );
        });
        const zfChanged = Boolean(previous) && previous.flags.zf !== state.flags.zf;

        return (
          <section className="panel reg-card" aria-labelledby="registers-title">
            <div className="panel-head">
              <h2 id="registers-title">Registers</h2>
              <span className="panel-note">16-bit values in hex</span>
            </div>
            <div className="reg-grid">{general}</div>
            <div className={"reg-grid pointers" + (usesFlags ? " with-flags" : "")}>
              {pointers}
              {usesFlags && (
                <div className={"reg" + (zfChanged ? " is-changed" : "")}>
                  <div className="reg-name">ZF</div>
                  <div className="reg-value">{state.flags.zf}</div>
                  <div className="reg-sub">{zfChanged ? "was " + previous.flags.zf : "zero flag"}</div>
                </div>
              )}
            </div>
          </section>
        );
      }

      function changesFor(trace, stepIndex) {
        const before = trace.states[stepIndex - 1];
        const after = trace.states[stepIndex];
        const step = trace.steps[stepIndex - 1];
        const items = [];
        ["ax", "bx", "cx", "dx", "sp", "bp"].forEach((name) => {
          if (before.regs[name] !== after.regs[name]) items.push(name.toUpperCase() + " " + hex4(before.regs[name]) + " → " + hex4(after.regs[name]));
        });
        if (step.jumped) items.push("IP " + hex4(before.regs.ip) + " → " + hex4(after.regs.ip));
        step.writes.forEach((where) => items.push("[" + hex4(where) + "] ← " + hex4(after.mem[where])));
        if (before.flags.zf !== after.flags.zf) items.push("ZF " + before.flags.zf + " → " + after.flags.zf);
        return items;
      }

      function IntroSection({ scenario, number }) {
        return (
          <div className="guide-section">
            <p className="kicker">Scenario {number} of {STACK_SCENARIOS.length}</p>
            <h3>{scenario.heading}</h3>
            <p>
              <Rich text={scenario.intro} />
            </p>
            <h4>Watch for</h4>
            <ul>
              {scenario.watch.map((item) => (
                <li key={item}>
                  <Rich text={item} />
                </li>
              ))}
            </ul>
            <h4>The same idea in AQA pseudocode</h4>
            <pre className="pseudo">{scenario.pseudocode.join("\n")}</pre>
            {scenario.aside && (
              <p className="note">
                <Rich text={scenario.aside} />
              </p>
            )}
            <p>
              Press <strong>Step</strong> (or the → key) to run the first instruction.
            </p>
          </div>
        );
      }

      function StepSection({ trace, stepIndex }) {
        const step = trace.steps[stepIndex - 1];
        const line = trace.program.lines[step.line];
        const changes = changesFor(trace, stepIndex);
        return (
          <div className="guide-section">
            <p className="kicker">
              Step {stepIndex} of {trace.steps.length} · just ran
            </p>
            <h3>
              <code className="inline-code">{line.code}</code> <span className="panel-note">at {hex4(line.address)}</span>
            </h3>
            {step.explain.map((text, index) => (
              <p key={index}>
                <Rich text={text} />
              </p>
            ))}
            {step.note && (
              <p className="note">
                <Rich text={step.note} />
              </p>
            )}
            <h4>Changed</h4>
            {changes.length ? (
              <ul className="changes">
                {changes.map((item) => (
                  <li key={item}>{item}</li>
                ))}
              </ul>
            ) : (
              <p>
                Nothing apart from IP, which moved on to the next instruction.
                {step.op === "cmp" ? " ZF already held " + trace.states[stepIndex].flags.zf + " from an earlier instruction." : ""}
              </p>
            )}
          </div>
        );
      }

      function SummarySection({ scenario, nextScenario }) {
        return (
          <div className="guide-section">
            <p className="kicker">Program finished</p>
            <h3>{scenario.heading}</h3>
            <p className="result">
              <Rich text={scenario.result} />
            </p>
            <h4>Key points</h4>
            <ul>
              {scenario.takeaways.map((item) => (
                <li key={item}>
                  <Rich text={item} />
                </li>
              ))}
            </ul>
            <p>
              {nextScenario ? (
                <React.Fragment>
                  Next: <strong>{nextScenario.title}</strong>. Use Back to review any step.
                </React.Fragment>
              ) : (
                "That is the last scenario. Use Back to review any step, or choose another scenario."
              )}
            </p>
          </div>
        );
      }

      function PredictSection({ question, answer, tally, onPick, onReveal, headingRef }) {
        const finished = answer.solved || answer.revealed;
        const tried = answer.tried;
        const answerText = question.options.find((option) => option.id === question.answer).text;
        return (
          <div className="guide-section predict-section" role="group" aria-labelledby="predict-title">
            <p className="kicker">Predict before you step</p>
            <h3 id="predict-title" tabIndex={-1} ref={headingRef}>
              <Rich text={question.prompt} />
            </h3>
            <div className="options">
              {question.options.map((option) => {
                const wrong = tried.includes(option.id) && option.id !== question.answer;
                const right = finished && option.id === question.answer;
                return (
                  <button
                    key={option.id}
                    type="button"
                    className={"option" + (wrong ? " is-wrong" : "") + (right ? " is-right" : "")}
                    disabled={finished || wrong}
                    onClick={() => onPick(option.id)}
                  >
                    {option.text}
                    {wrong && <span className="sr-only"> (incorrect)</span>}
                    {right && <span className="sr-only"> (correct)</span>}
                  </button>
                );
              })}
            </div>
            <div aria-live="polite">
              {answer.solved && (
                <p className="feedback good">
                  ✓ Correct. {question.reason} Press Step to run it.
                </p>
              )}
              {!answer.solved && answer.revealed && (
                <p className="feedback">
                  The answer is {answerText}. {question.reason} Press Step to run it.
                </p>
              )}
              {!finished && tried.length > 0 && (
                <p className="feedback bad">
                  ✗ Not quite. <Rich text={question.hint} />
                </p>
              )}
            </div>
            <div className="predict-foot">
              <span>
                Right first time: {tally.first} of {tally.answered}
              </span>
              {!finished && tried.length > 0 && (
                <button type="button" className="btn btn-small" onClick={onReveal}>
                  Show answer
                </button>
              )}
            </div>
          </div>
        );
      }

      function StackPanel({ trace, stepIndex }) {
        const scrollRef = useRef(null);
        const state = trace.states[stepIndex];
        const step = stepIndex > 0 ? trace.steps[stepIndex - 1] : null;
        const lowest = Math.min(trace.lowestSp - 4, STACK_BASE - 2 * 7);
        const addresses = [];
        for (let where = lowest; where <= STACK_BASE; where += 2) addresses.push(where);
        const frames = liveFrames(state);
        const frameAt = new Map(frames.map((frame) => [frame.low, frame]));
        const covered = new Set();
        frames.forEach((frame) => {
          for (let where = frame.low; where <= frame.high; where += 2) covered.add(where);
        });
        const offsetOwner = bpFrame(state);
        const reads = new Set(step ? step.reads : []);
        const writes = new Set(step ? step.writes : []);
        const pushed = step && (step.op === "push" || step.op === "call");
        const { sp, bp } = state.regs;

        useEffect(() => {
          const box = scrollRef.current;
          if (box) keepRowVisible(box, box.querySelector('[data-sp-row="true"]'), 70);
        }, [trace, stepIndex]);

        return (
          <section className="panel stack-panel" aria-labelledby="stack-title">
            <div className="panel-head">
              <h2 id="stack-title">Stack in memory</h2>
              <span className="panel-note">One 16-bit word (2 bytes) per slot · grows up the screen, towards lower addresses</span>
            </div>
            <div className="panel-scroll" ref={scrollRef}>
              <table className="stack-table">
                <caption className="sr-only">
                  Stack memory from address {hex4(lowest)} down to the bottom of the stack at {hex4(STACK_BASE)}. SP is {hex4(sp)} and BP is {hex4(bp)}.
                </caption>
                <thead>
                  <tr>
                    <th scope="col">
                      <span className="sr-only">Pointer</span>
                    </th>
                    <th scope="col">Offset</th>
                    <th scope="col">Address</th>
                    <th scope="col">Value</th>
                    <th scope="col">What it holds</th>
                    <th scope="col">Frame</th>
                  </tr>
                </thead>
                <tbody>
                  {addresses.map((where) => {
                    const slot = describeSlot(state, where);
                    const info = state.meta[where];
                    const showOffset = offsetOwner !== null && info && info.owner === offsetOwner && where >= sp;
                    const written = writes.has(where);
                    const read = reads.has(where) && !written;
                    const classes = [
                      slot.kind === "base" ? "slot-base" : slot.live ? "slot-live" : "slot-free",
                      where === sp ? "is-sp" : "",
                      written ? "slot-written" : "",
                      read ? "slot-read" : "",
                    ].filter(Boolean);
                    let frameCell = null;
                    if (frameAt.has(where)) {
                      const frame = frameAt.get(where);
                      frameCell = (
                        <td rowSpan={(frame.high - frame.low) / 2 + 1} className={"frame-cell has-frame" + (frame.current ? " is-current" : "")}>
                          <span className="frame-name">{frame.fn}</span>
                          {frame.args.length > 0 && <span className="frame-args">{frame.args.map((arg) => arg.name + "=" + arg.value).join(", ")}</span>}
                          {frame.current && <span className="frame-current">current</span>}
                        </td>
                      );
                    } else if (!covered.has(where)) {
                      frameCell = <td className="frame-cell"></td>;
                    }
                    return (
                      <tr key={where} className={classes.join(" ")} data-sp-row={where === sp ? "true" : undefined}>
                        <td className="ptr-cell">
                          {where === sp && <span className="ptr ptr-sp">SP ▸</span>}
                          {where === bp && <span className="ptr ptr-bp">BP ▸</span>}
                        </td>
                        <td className="offset-cell">{showOffset ? offsetText(where - bp) : ""}</td>
                        <td className="addr-cell">{hex4(where)}</td>
                        <td className="value-cell">{hex4(state.mem[where] || 0)}</td>
                        <td className={"meaning-cell kind-" + slot.kind}>
                          {slot.text}
                          {written && <span className="slot-tag write">{pushed ? "pushed" : "written"}</span>}
                          {read && <span className="slot-tag read">{slot.live ? "read" : "popped"}</span>}
                        </td>
                        {frameCell}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <ul className="legend" aria-label="Key">
              {KIND_LEGEND.map(([kind, text]) => (
                <li key={kind} className={"kind-" + kind}>
                  {text}
                </li>
              ))}
            </ul>
          </section>
        );
      }

      const EMPTY_ANSWER = { tried: [], solved: false, revealed: false };
      const resolved = (answer) => Boolean(answer && (answer.solved || answer.revealed));

      function initialScenarioId() {
        const fromHash = decodeURIComponent(window.location.hash.slice(1));
        return STACK_SCENARIOS.some((scenario) => scenario.id === fromHash) ? fromHash : STACK_SCENARIOS[0].id;
      }

      function App() {
        const [scenarioId, setScenarioId] = useState(initialScenarioId);
        const [stepIndex, setStepIndex] = useState(0);
        const [predict, setPredict] = useState(false);
        const [answers, setAnswers] = useState({});
        const predictHeadingRef = useRef(null);
        const guideRef = useRef(null);
        const stepByUser = useRef(false);

        const scenarioNumber = STACK_SCENARIOS.findIndex((scenario) => scenario.id === scenarioId);
        const scenario = STACK_SCENARIOS[scenarioNumber];
        const nextScenario = STACK_SCENARIOS[scenarioNumber + 1] || null;
        const trace = useMemo(() => run(scenario), [scenario]);
        const total = trace.steps.length;
        const done = stepIndex >= total;
        const question = useMemo(() => (predict && !done ? questionFor(trace, stepIndex) : null), [predict, done, trace, stepIndex]);
        const answer = answers[stepIndex] || EMPTY_ANSWER;
        const blocked = Boolean(question) && !resolved(answer);

        const tally = useMemo(() => {
          let answered = 0;
          let first = 0;
          Object.keys(answers).forEach((key) => {
            const entry = answers[key];
            const asked = questionFor(trace, Number(key));
            if (!asked || !entry.tried.length && !entry.revealed) return;
            answered += 1;
            if (entry.tried[0] === asked.answer) first += 1;
          });
          return { answered, first };
        }, [answers, trace]);

        const changeScenario = (id) => {
          setScenarioId(id);
          setStepIndex(0);
          setAnswers({});
          try {
            window.history.replaceState(null, "", "#" + id);
          } catch (error) {
            // A local file preview may not allow history changes.
          }
        };

        const step = useCallback(() => {
          if (blocked || done) return;
          stepByUser.current = true;
          setStepIndex((index) => Math.min(total, index + 1));
        }, [blocked, done, total]);
        const back = useCallback(() => {
          stepByUser.current = false;
          setStepIndex((index) => Math.max(0, index - 1));
        }, []);
        const restart = () => {
          stepByUser.current = false;
          setStepIndex(0);
        };
        const runToCallOrReturn = () => {
          let index = stepIndex;
          while (index < total) {
            if (predict && questionFor(trace, index) && !resolved(answers[index])) break;
            const op = trace.steps[index].op;
            index += 1;
            if (op === "call" || op === "ret") break;
          }
          stepByUser.current = true;
          setStepIndex(index);
        };

        const pick = (id) => {
          setAnswers((current) => {
            const entry = current[stepIndex] || EMPTY_ANSWER;
            if (resolved(entry) || entry.tried.includes(id)) return current;
            return { ...current, [stepIndex]: { ...entry, tried: entry.tried.concat(id), solved: id === question.answer } };
          });
        };
        const reveal = () => {
          setAnswers((current) => ({ ...current, [stepIndex]: { ...(current[stepIndex] || EMPTY_ANSWER), revealed: true } }));
        };

        useEffect(() => {
          if (guideRef.current) guideRef.current.scrollTop = 0;
        }, [scenarioId, stepIndex]);

        // Links such as #recursion choose a scenario, even on this page.
        useEffect(() => {
          const onHash = () => {
            const id = initialScenarioId();
            if (window.location.hash && id !== scenarioId) changeScenario(id);
          };
          window.addEventListener("hashchange", onHash);
          return () => window.removeEventListener("hashchange", onHash);
        });

        // After a step lands on a new prediction, move focus to it so that
        // keyboard users are not left on the now-disabled Step button.
        useEffect(() => {
          if (stepByUser.current && blocked && predictHeadingRef.current) predictHeadingRef.current.focus();
          stepByUser.current = false;
        }, [stepIndex, blocked]);

        useEffect(() => {
          const onKey = (event) => {
            if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
            if (event.target.closest && event.target.closest("input, select, textarea, [contenteditable]")) return;
            if (event.key === "ArrowRight") {
              event.preventDefault();
              step();
            } else if (event.key === "ArrowLeft") {
              event.preventDefault();
              back();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [step, back]);

        return (
          <div className="stack-lab">
            <header data-interactive-header>
              <div>
                <h1>Stack Frames in Assembly</h1>
                <p>Step through real 8086 code and watch SP, BP and the stack change in memory</p>
              </div>
              <div data-interactive-actions>
                <select aria-label="Scenario" value={scenarioId} onChange={(event) => changeScenario(event.target.value)}>
                  {STACK_SCENARIOS.map((item) => (
                    <option key={item.id} value={item.id}>
                      {item.title}
                    </option>
                  ))}
                </select>
                <button type="button" className="predict-toggle" aria-pressed={predict} onClick={() => setPredict((value) => !value)}>
                  <span className="switch" aria-hidden="true"></span>
                  Predict mode
                </button>
              </div>
            </header>

            <main className="lab-main">
              <CodePanel trace={trace} stepIndex={stepIndex} done={done} />

              <div className="cpu-panel">
                <Registers trace={trace} stepIndex={stepIndex} />
                <section className="panel guide-card" aria-label="Explanation">
                  <div className="panel-scroll" ref={guideRef}>
                    {question && (
                      <PredictSection
                        question={question}
                        answer={answer}
                        tally={tally}
                        onPick={pick}
                        onReveal={reveal}
                        headingRef={predictHeadingRef}
                      />
                    )}
                    {stepIndex === 0 && <IntroSection scenario={scenario} number={scenarioNumber + 1} />}
                    {stepIndex > 0 && !done && <StepSection trace={trace} stepIndex={stepIndex} />}
                    {done && <SummarySection scenario={scenario} nextScenario={nextScenario} />}
                  </div>
                </section>
              </div>

              <StackPanel trace={trace} stepIndex={stepIndex} />
            </main>

            <div className="lab-controls">
              <div className="control-group">
                <button type="button" className="btn" onClick={restart} disabled={stepIndex === 0}>
                  Restart
                </button>
                <button type="button" className="btn" onClick={runToCallOrReturn} disabled={done || blocked}>
                  Run to next call or ret
                </button>
              </div>
              <div className="control-group">
                {blocked && <span className="blocked-hint">Make your prediction to continue</span>}
                <span className="step-count" aria-live="polite">
                  {done ? "Finished: " + total + " instructions" : "Step " + stepIndex + " of " + total}
                </span>
                <button type="button" className="btn" onClick={back} disabled={stepIndex === 0} title="Back one instruction (← key)">
                  ◀ Back
                </button>
                {!done && (
                  <button type="button" className="btn btn-primary" onClick={step} disabled={blocked} title="Run the next instruction (→ key)">
                    Step ▶
                  </button>
                )}
                {done && nextScenario && (
                  <button type="button" className="btn btn-primary" onClick={() => changeScenario(nextScenario.id)}>
                    Next scenario ▶
                  </button>
                )}
                {done && !nextScenario && (
                  <button type="button" className="btn btn-primary" onClick={() => changeScenario(STACK_SCENARIOS[0].id)}>
                    Back to scenario 1 ▶
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
