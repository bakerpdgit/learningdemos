    <style>
      :root {
        color-scheme: light;
        --page: #f1f5f9;
        --card: #ffffff;
        --soft: #f8fafc;
        --ink: #0f172a;
        --muted: #475569;
        --faint: #94a3b8;
        --line: #cbd5e1;
        --line-soft: #e2e8f0;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: #eef2ff;
        --accent-ink: #3730a3;
        --focus: #4f46e5;
        --on-strong: #ffffff;
        --op-ink: #4338ca;
        --label-ink: #9a3412;
        --comment: #64748b;
        --code-chip: #eef2ff;
        --sp: #be123c;
        --sp-strong: #be123c;
        --bp: #6d28d9;
        --bp-strong: #6d28d9;
        --ip-strong: #4338ca;
        --ip-soft: #e0e7ff;
        --ret: #92400e;
        --ret-soft: #fef3c7;
        --ret-line: #d97706;
        --param: #075985;
        --param-soft: #e0f2fe;
        --param-line: #0284c7;
        --savedbp: #5b21b6;
        --savedbp-soft: #ede9fe;
        --savedbp-line: #7c3aed;
        --saved: #334155;
        --saved-soft: #e2e8f0;
        --saved-line: #64748b;
        --local: #065f46;
        --local-soft: #d1fae5;
        --local-line: #059669;
        --changed: #fef9c3;
        --changed-line: #ca8a04;
        --tag-write-bg: #a16207;
        --tag-write-ink: #ffffff;
        --tag-read-bg: #0369a1;
        --tag-read-ink: #ffffff;
        --frame-line: #94a3b8;
        --good: #047857;
        --good-soft: #ecfdf5;
        --bad: #b91c1c;
        --bad-soft: #fef2f2;
        --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, "Courier New", monospace;
      }

      html.dark {
        color-scheme: dark;
        --page: #020617;
        --card: #0f172a;
        --soft: #131d33;
        --ink: #e2e8f0;
        --muted: #a3b1c6;
        --faint: #64748b;
        --line: #334155;
        --line-soft: #1e293b;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-soft: #1e1b4b;
        --accent-ink: #c7d2fe;
        --focus: #a5b4fc;
        --on-strong: #0f172a;
        --op-ink: #a5b4fc;
        --label-ink: #fdba74;
        --comment: #8b9bb4;
        --code-chip: #1e293b;
        --sp: #fda4af;
        --sp-strong: #fb7185;
        --bp: #c4b5fd;
        --bp-strong: #a78bfa;
        --ip-strong: #818cf8;
        --ip-soft: #1e1b4b;
        --ret: #fcd34d;
        --ret-soft: #2d1f05;
        --ret-line: #d97706;
        --param: #7dd3fc;
        --param-soft: #0a2540;
        --param-line: #0284c7;
        --savedbp: #c4b5fd;
        --savedbp-soft: #23124a;
        --savedbp-line: #7c3aed;
        --saved: #cbd5e1;
        --saved-soft: #1e293b;
        --saved-line: #64748b;
        --local: #6ee7b7;
        --local-soft: #062e22;
        --local-line: #059669;
        --changed: #33290a;
        --changed-line: #eab308;
        --tag-write-bg: #facc15;
        --tag-write-ink: #1c1917;
        --tag-read-bg: #38bdf8;
        --tag-read-ink: #082f49;
        --frame-line: #64748b;
        --good: #4ade80;
        --good-soft: #052e1a;
        --bad: #fca5a5;
        --bad-soft: #3b0d0d;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      button,
      select {
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mono {
        font-family: var(--mono);
      }

      /* Full-height app shell once the three panels sit side by side. The
         production site bar is 58px tall, so the built page subtracts it or
         the step controls fall below the viewport. Narrower than that the
         page scrolls and the controls stick to the bottom. */
      .stack-lab {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      @media (min-width: 1280px) {
        .stack-lab {
          height: 100vh;
          min-height: 0;
        }
        body[data-site-page="interactive"] .stack-lab {
          height: calc(100vh - 58px);
        }
      }

      [data-interactive-header] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 20px;
        padding: 14px 24px;
        background: #4338ca;
        color: #fff;
      }
      [data-interactive-header] h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      [data-interactive-header] p {
        margin: 0;
        font-size: 0.85rem;
      }
      [data-interactive-actions] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .predict-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font-size: 0.84rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      .predict-toggle:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .predict-toggle:focus-visible {
        outline-color: #fff;
      }
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 30px;
        height: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.3);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .predict-toggle[aria-pressed="true"] .switch {
        background: #10b981;
      }
      .predict-toggle[aria-pressed="true"] .switch::after {
        transform: translateX(12px);
      }

      .lab-main {
        flex: 1 1 auto;
        display: grid;
        gap: 12px;
        padding: 12px;
        align-items: start;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "code" "cpu" "stack";
      }
      @media (min-width: 768px) {
        .lab-main {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          grid-template-areas: "code stack" "cpu stack";
        }
      }
      /* With two columns the page scrolls, so keep the stack in view beside
         the code and the explanation. */
      @media (min-width: 768px) and (max-width: 1279px) {
        .stack-panel {
          position: sticky;
          top: 12px;
          max-height: calc(100vh - 90px);
        }
        .stack-panel .panel-scroll {
          flex: 1 1 auto;
          min-height: 0;
          overflow: auto;
        }
      }
      @media (min-width: 1280px) {
        /* An explicit flexible row, so the shared shell's align-content
           rule for post-header grids cannot collapse the panels. */
        .lab-main {
          min-height: 0;
          overflow: hidden;
          align-items: stretch;
          grid-template-columns: minmax(0, 1fr) minmax(0, 0.82fr) minmax(0, 1.22fr);
          grid-template-rows: minmax(0, 1fr);
          grid-template-areas: "code cpu stack";
        }
        .panel,
        .cpu-panel {
          min-height: 0;
        }
        .panel-scroll {
          flex: 1 1 auto;
          min-height: 0;
          overflow: auto;
        }
      }
      .code-panel {
        grid-area: code;
      }
      .cpu-panel {
        grid-area: cpu;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .stack-panel {
        grid-area: stack;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .panel-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 9px 14px 8px;
        border-bottom: 1px solid var(--line-soft);
      }
      .panel-head h2 {
        margin: 0;
        font-size: 1rem;
      }
      .panel-note {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .panel-scroll {
        overflow-x: auto;
      }

      .mini-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .mini-toggle[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-ink);
      }

      /* Code listing */
      .code-table,
      .stack-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .code-table th,
      .stack-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--card);
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-align: left;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .code-table td {
        padding: 2px 8px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.45;
        vertical-align: top;
        white-space: nowrap;
      }
      .code-table td.marker {
        width: 3.6rem;
        padding-right: 0;
      }
      .code-table .addr {
        color: var(--muted);
      }
      .code-table .bytes {
        color: var(--faint);
      }
      .code-table .comment {
        min-width: 7rem;
        color: var(--comment);
        white-space: normal;
      }
      .hide-bytes .bytes {
        display: none;
      }
      .code-label-row td {
        padding-top: 9px;
      }
      .code-label {
        color: var(--label-ink);
        font-weight: 700;
      }
      .code-directive td {
        color: var(--comment);
      }
      .code-row.is-last td {
        background: var(--soft);
      }
      .code-row.is-last td:first-child {
        box-shadow: inset 4px 0 0 var(--faint);
      }
      .code-row.is-ip td {
        background: var(--ip-soft);
      }
      .code-row.is-ip td:first-child {
        box-shadow: inset 4px 0 0 var(--ip-strong);
      }
      .tok-op {
        color: var(--op-ink);
        font-weight: 700;
      }
      .tok-sp {
        color: var(--sp);
        font-weight: 700;
      }
      .tok-bp {
        color: var(--bp);
        font-weight: 700;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 1px 3px 1px 0;
        padding: 2px 5px;
        border-radius: 4px;
        font: 700 10.5px/1.2 "Segoe UI", system-ui, sans-serif;
        white-space: nowrap;
      }
      .chip-ip {
        background: var(--ip-strong);
        color: var(--on-strong);
      }
      .chip-ret {
        border: 1px solid var(--ret-line);
        background: var(--ret-soft);
        color: var(--ret);
      }
      .code-key {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 0;
        padding: 8px 14px 10px;
        border-top: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 0.75rem;
        list-style: none;
      }

      /* Registers */
      .reg-card {
        flex: 0 0 auto;
      }
      .reg-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 10px 12px 0;
      }
      .reg-grid + .reg-grid {
        padding-bottom: 12px;
      }
      .reg-grid.pointers {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .reg-grid.pointers.with-flags {
        grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 0.75fr);
      }
      .reg {
        min-width: 0;
        padding: 4px 8px 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }
      .reg-name {
        font-size: 0.75rem;
        font-weight: 700;
      }
      .reg-value {
        font: 600 1.1rem/1.25 var(--mono);
      }
      .reg-sub {
        overflow: hidden;
        min-height: 1rem;
        color: var(--muted);
        font-size: 0.7rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .reg-sp {
        box-shadow: inset 4px 0 0 var(--sp-strong);
      }
      .reg-bp {
        box-shadow: inset 4px 0 0 var(--bp-strong);
      }
      .reg-ip {
        box-shadow: inset 4px 0 0 var(--ip-strong);
      }
      .reg.is-changed {
        border-color: var(--changed-line);
        background: var(--changed);
      }
      .reg.is-changed .reg-sub {
        color: var(--ink);
        font-weight: 600;
      }

      /* Explanation and prediction */
      .guide-card {
        flex: 1 1 auto;
      }
      .guide-section {
        padding: 12px 14px;
      }
      .guide-section + .guide-section {
        border-top: 1px solid var(--line);
      }
      .guide-section p {
        margin: 0 0 8px;
      }
      .guide-section ul {
        margin: 0 0 10px;
        padding-left: 1.2rem;
      }
      .guide-section li {
        margin: 2px 0;
      }
      .guide-section h3 {
        margin: 2px 0 8px;
        font-size: 1.05rem;
        line-height: 1.3;
      }
      .guide-section h4 {
        margin: 10px 0 4px;
        font-size: 0.85rem;
      }
      .kicker {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .inline-code {
        padding: 0 4px;
        border-radius: 4px;
        background: var(--code-chip);
        font-family: var(--mono);
        font-size: 0.9em;
        white-space: nowrap;
      }
      .note {
        margin: 10px 0;
        padding: 8px 10px;
        border-left: 4px solid var(--accent);
        border-radius: 0 8px 8px 0;
        background: var(--accent-soft);
      }
      .pseudo {
        overflow-x: auto;
        margin: 4px 0 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre;
      }
      .changes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
      }
      .changes li {
        margin: 0;
        padding: 3px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--soft);
        font: 12px/1.3 var(--mono);
      }
      .result {
        font-weight: 700;
      }
      .predict-section {
        background: var(--accent-soft);
        border-radius: 12px 12px 0 0;
      }
      .predict-section h3:focus {
        outline: none;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 8px 0;
      }
      .option {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
        font: 600 14px/1.2 var(--mono);
        cursor: pointer;
      }
      .option:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .option:disabled {
        cursor: default;
      }
      .option.is-wrong {
        border-color: var(--bad);
        background: var(--bad-soft);
        color: var(--bad);
        text-decoration: line-through;
      }
      .option.is-right {
        border-color: var(--good);
        background: var(--good-soft);
        color: var(--good);
      }
      .feedback {
        margin: 0 0 8px;
        font-weight: 600;
      }
      .feedback.good {
        color: var(--good);
      }
      .feedback.bad {
        color: var(--bad);
      }
      .predict-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      /* Stack memory */
      .stack-table th {
        padding: 6px;
      }
      .stack-table td {
        height: 30px;
        padding: 0 6px;
        border-bottom: 1px solid var(--line-soft);
        font-size: 13px;
        vertical-align: middle;
        white-space: nowrap;
      }
      .stack-table .ptr-cell {
        width: 2.9rem;
        padding-right: 0;
      }
      .stack-table .offset-cell,
      .stack-table .addr-cell,
      .stack-table .value-cell {
        font-family: var(--mono);
      }
      .stack-table .offset-cell {
        color: var(--bp);
        font-size: 12px;
      }
      .stack-table .addr-cell {
        color: var(--muted);
      }
      .stack-table .value-cell {
        font-weight: 600;
      }
      .stack-table .meaning-cell {
        min-width: 9rem;
        border-left: 4px solid transparent;
        line-height: 1.25;
        white-space: normal;
      }
      .meaning-cell.kind-ret {
        border-left-color: var(--ret-line);
        background: var(--ret-soft);
        color: var(--ret);
      }
      .meaning-cell.kind-param {
        border-left-color: var(--param-line);
        background: var(--param-soft);
        color: var(--param);
      }
      .meaning-cell.kind-bp {
        border-left-color: var(--savedbp-line);
        background: var(--savedbp-soft);
        color: var(--savedbp);
      }
      .meaning-cell.kind-saved {
        border-left-color: var(--saved-line);
        background: var(--saved-soft);
        color: var(--saved);
      }
      .meaning-cell.kind-local {
        border-left-color: var(--local-line);
        background: var(--local-soft);
        color: var(--local);
      }
      .slot-free td {
        color: var(--faint);
      }
      .slot-free .meaning-cell {
        font-style: italic;
      }
      .slot-free .value-cell {
        font-weight: 400;
      }
      .slot-base td {
        border-top: 2px solid var(--line);
        color: var(--muted);
      }
      .slot-base .meaning-cell {
        font-size: 12px;
      }
      .is-sp td:not(.frame-cell) {
        box-shadow: inset 0 2px 0 var(--sp-strong);
      }
      .slot-written .value-cell,
      .slot-written .addr-cell {
        background: var(--changed);
        color: var(--ink);
      }
      .slot-read .value-cell {
        box-shadow: inset 0 0 0 2px var(--tag-read-bg);
      }
      .is-sp.slot-read .value-cell {
        box-shadow: inset 0 2px 0 var(--sp-strong), inset 0 0 0 2px var(--tag-read-bg);
      }
      .slot-tag {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 5px;
        border-radius: 4px;
        font: 700 9.5px/1.2 "Segoe UI", system-ui, sans-serif;
        font-style: normal;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: 1px;
      }
      .slot-tag.write {
        background: var(--tag-write-bg);
        color: var(--tag-write-ink);
      }
      .slot-tag.read {
        background: var(--tag-read-bg);
        color: var(--tag-read-ink);
      }
      /* SP and BP can point at the same slot, so the chips stack. */
      .ptr {
        display: block;
        width: fit-content;
        margin: 1px 0;
        padding: 2px 4px;
        border-radius: 4px;
        color: var(--on-strong);
        font: 700 10px/1.1 "Segoe UI", system-ui, sans-serif;
        white-space: nowrap;
      }
      .ptr-sp {
        background: var(--sp-strong);
      }
      .ptr-bp {
        background: var(--bp-strong);
      }
      .stack-table .frame-cell {
        position: relative;
        width: 7.5rem;
        min-width: 6.5rem;
        padding: 3px 6px 3px 20px;
        border-bottom-color: transparent;
        color: var(--muted);
        font-size: 11.5px;

  <body>
    <div id="root"></div>
    <noscript>This activity needs JavaScript enabled.</noscript>

    <script id="stack-machine">
    // A small 16-bit 8086 simulator for the stack-frame walkthroughs.
    // Each program is real NASM-syntax 8086 code laid out as a DOS .COM
    // program: code is loaded at 0100h and SP starts at FFFEh. The
    // assembler encodes the instruction forms used here so the listed
    // addresses and machine code match what NASM produces, and the run
    // records what every stack slot means so the page can label it.
    const StackLab = (function () {
      "use strict";

      const ORIGIN = 0x0100;
      const STACK_BASE = 0xfffe;
      const STACK_LIMIT = 0xff00;
      const REG_CODES = { ax: 0, cx: 1, dx: 2, bx: 3, sp: 4, bp: 5, si: 6, di: 7 };
      const ALU = { add: 0, or: 1, and: 4, sub: 5, xor: 6, cmp: 7 };
      const JUMPS = { jmp: 0xeb, je: 0x74, jz: 0x74, jne: 0x75, jnz: 0x75, jl: 0x7c, jge: 0x7d, jle: 0x7e, jg: 0x7f };
      const STACK_OPS = new Set(["push", "pop", "call", "ret"]);

      const hex4 = (value) => (value & 0xffff).toString(16).toUpperCase().padStart(4, "0");
      const hex2 = (value) => (value & 0xff).toString(16).toUpperCase().padStart(2, "0");
      const signed = (value) => ((value & 0x8000) ? (value & 0xffff) - 0x10000 : value & 0xffff);
      const has = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
      const offsetText = (disp) => (disp === 0 ? "bp" : disp > 0 ? "bp+" + disp : "bp-" + -disp);

      function parseNumber(text) {
        const value = text.trim().toLowerCase();
        if (/^-?\d+$/.test(value)) return parseInt(value, 10);
        if (/^0x[0-9a-f]+$/.test(value)) return parseInt(value.slice(2), 16);
        if (/^[0-9][0-9a-f]*h$/.test(value)) return parseInt(value.slice(0, -1), 16);
        return null;
      }

      function parseOperand(text) {
        const raw = text.trim();
        const value = raw.toLowerCase();
        if (has(REG_CODES, value)) return { type: "reg", reg: value };
        const memory = value.match(/^(word\s+)?\[\s*bp\s*(?:([+-])\s*([0-9a-fx]+h?))?\s*\]$/);
        if (memory) {
          const amount = memory[3] ? parseNumber(memory[3]) : 0;
          if (amount === null) throw new Error("Bad displacement in " + raw);
          return { type: "mem", disp: memory[2] === "-" ? -amount : amount, sized: Boolean(memory[1]) };
        }
        const number = parseNumber(value);
        if (number !== null) return { type: "imm", value: number };
        if (/^[a-z_][a-z0-9_]*$/i.test(raw)) return { type: "label", name: raw };
        throw new Error("Unsupported operand " + raw);
      }

      function parseInstruction(code) {
        const match = code.trim().match(/^([a-z]+)\s*(.*)$/i);
        if (!match) throw new Error("Cannot read instruction " + code);
        return { op: match[1].toLowerCase(), operands: match[2] ? match[2].split(",").map(parseOperand) : [] };
      }

      const imm16 = (value) => [value & 0xff, (value >> 8) & 0xff];
      const fitsImm8 = (value) => signed(value) >= -128 && signed(value) <= 127;

      function memoryModrm(reg, disp) {
        if (disp < -128 || disp > 127) throw new Error("Displacement out of range");
        // mod 01, r/m 110 is [bp + disp8]. [bp] with no displacement still
        // needs a zero disp8 because mod 00, r/m 110 means a direct address.
        return [0x46 | (reg << 3), disp & 0xff];
      }

      // Returns the machine code NASM emits for one instruction. While the
      // first pass is still measuring sizes, jump ranges are not checked.
      function encode(ins, address, labels, measuring) {
        const [a, b] = ins.operands;
        const reg = (operand) => REG_CODES[operand.reg];
        const target = (operand) => {
          if (!operand || operand.type !== "label") throw new Error(ins.op + " needs a label");
          if (!has(labels, operand.name)) throw new Error("Unknown label " + operand.name);
          return labels[operand.name];
        };
        const shape = ins.operands.map((operand) => operand.type).join(",");
        switch (ins.op) {
          case "push":
            if (shape === "reg") return [0x50 + reg(a)];
            break;
          case "pop":
            if (shape === "reg") return [0x58 + reg(a)];
            break;
          case "mov":
            if (shape === "reg,reg") return [0x89, 0xc0 | (reg(b) << 3) | reg(a)];
            if (shape === "reg,imm") return [0xb8 + reg(a), ...imm16(b.value)];
            if (shape === "reg,mem") return [0x8b, ...memoryModrm(reg(a), b.disp)];
            if (shape === "mem,reg") return [0x89, ...memoryModrm(reg(b), a.disp)];
            if (shape === "mem,imm" && a.sized) return [0xc7, ...memoryModrm(0, a.disp), ...imm16(b.value)];
            break;
          case "add":
          case "or":
          case "and":
          case "sub":
          case "xor":
          case "cmp": {
            const ext = ALU[ins.op];
            const base = ext << 3;
            if (shape === "reg,reg") return [base + 1, 0xc0 | (reg(b) << 3) | reg(a)];
            if (shape === "reg,mem") return [base + 3, ...memoryModrm(reg(a), b.disp)];
            if (shape === "mem,reg") return [base + 1, ...memoryModrm(reg(b), a.disp)];
            if (shape === "reg,imm") {
              if (fitsImm8(b.value)) return [0x83, 0xc0 | (ext << 3) | reg(a), b.value & 0xff];
              if (reg(a) === 0) return [base + 5, ...imm16(b.value)];
              return [0x81, 0xc0 | (ext << 3) | reg(a), ...imm16(b.value)];
            }
            if (shape === "mem,imm" && a.sized) {
              if (fitsImm8(b.value)) return [0x83, ...memoryModrm(ext, a.disp), b.value & 0xff];
              return [0x81, ...memoryModrm(ext, a.disp), ...imm16(b.value)];
            }
            break;
          }
          case "inc":
            if (shape === "reg") return [0x40 + reg(a)];
            break;
          case "dec":
            if (shape === "reg") return [0x48 + reg(a)];
            break;
          case "call":
            if (shape === "label") return [0xe8, ...imm16(target(a) - (address + 3))];
            break;
          case "ret":
            if (shape === "") return [0xc3];
            if (shape === "imm") return [0xc2, ...imm16(a.value)];
            break;
          case "int":
            if (shape === "imm") return [0xcd, a.value & 0xff];
            break;
          default:
            if (has(JUMPS, ins.op) && shape === "label") {
              const rel = target(a) - (address + 2);
              if (!measuring && (rel < -128 || rel > 127)) throw new Error("Short jump out of range");
              return [JUMPS[ins.op], rel & 0xff];
            }
        }
        throw new Error("Unsupported instruction form: " + ins.op + " " + shape);
      }

      // Lines are [label, code, comment, options]. A label may stand alone
      // (code empty) and then names the next instruction.
      function assemble(source) {
        const lines = [];
        let pendingLabel = null;
        source.forEach(([label, code, comment, options]) => {
          if (!code) {
            pendingLabel = label;
            return;
          }
          lines.push({
            index: lines.length,
            label: label || pendingLabel || "",
            code,
            comment: comment || "",
            options: options || {},
            ins: parseInstruction(code),
          });
          pendingLabel = null;
        });

        const placeholder = {};
        lines.forEach((line) => {
          if (line.label) placeholder[line.label] = ORIGIN;
        });
        const labels = {};
        let address = ORIGIN;
        lines.forEach((line) => {
          line.address = address;
          if (line.label) {
            if (has(labels, line.label)) throw new Error("Duplicate label " + line.label);
            labels[line.label] = address;
          }
          address += encode(line.ins, address, placeholder, true).length;
        });
        lines.forEach((line) => {
          line.bytes = encode(line.ins, line.address, labels, false);
          line.next = line.address + line.bytes.length;
        });

        const functionNames = new Set([lines[0].label]);
        lines.forEach((line) => {
          if (line.ins.op === "call") functionNames.add(line.ins.operands[0].name);
        });
        const functions = Array.from(functionNames)
          .map((name) => ({ name, address: labels[name] }))
          .sort((left, right) => left.address - right.address);
        const byAddress = new Map(lines.map((line) => [line.address, line]));
        const functionAt = (where) => functions.filter((fn) => fn.address <= where).pop().name;
        return { lines, labels, byAddress, functions, functionAt, end: address };
      }

      function frameLabel(frame) {
        if (!frame.args.length) return frame.fn;
        return frame.fn + "(" + frame.args.map((arg) => arg.name + "=" + arg.value).join(", ") + ")";
      }

      // Short enough for a stack slot: a single argument identifies a
      // recursive level, more than one would crowd the row.
      function shortLabel(frame) {
        return frame.args.length === 1 ? frameLabel(frame) : frame.fn;
      }

      function run(scenario) {
        const program = assemble(scenario.source);
        const regs = { ax: 0, bx: 0, cx: 0, dx: 0, si: 0, di: 0, bp: 0, sp: STACK_BASE, ip: ORIGIN };
        const flags = { zf: 0, sf: 0, cf: 0, of: 0 };
        const memory = new Map([[STACK_BASE, 0]]);
        const meta = new Map([[STACK_BASE, { kind: "base" }]]);
        const frames = [{ id: 0, fn: program.lines[0].label, args: [], label: program.lines[0].label, active: true }];
        const frameStack = [0];
        const steps = [];
        const states = [];
        let halted = false;

        const current = () => frames[frameStack[frameStack.length - 1]];
        const caller = () => frames[frameStack[frameStack.length - 2]] || null;

        function snapshot() {
          const metaCopy = {};
          meta.forEach((value, key) => {
            metaCopy[key] = Object.assign({}, value);
          });
          return {
            regs: Object.assign({}, regs),
            flags: Object.assign({}, flags),
            mem: Object.fromEntries(memory),
            meta: metaCopy,
            frames: frames.map((frame) => Object.assign({}, frame, { args: frame.args.slice() })),
            frameStack: frameStack.slice(),
          };
        }

        function checkAddress(where) {
          if (where % 2 !== 0 || where < STACK_LIMIT || where > STACK_BASE) {
            throw new Error(scenario.id + ": memory access outside the stack at " + hex4(where));
          }
        }
        function read(where, step) {
          checkAddress(where);
          step.reads.push(where);
          return memory.has(where) ? memory.get(where) : 0;
        }
        function write(where, value, info, step) {
          checkAddress(where);
          memory.set(where, value & 0xffff);
          if (info) meta.set(where, info);
          step.writes.push(where);
        }
        function push(value, info, step) {
          regs.sp = (regs.sp - 2) & 0xffff;
          write(regs.sp, value, info, step);
        }
        function pop(step) {
          const value = read(regs.sp, step);
          regs.sp = (regs.sp + 2) & 0xffff;
          return value;
        }

        function arithmetic(op, x, y) {
          const raw = op === "add" ? x + y : x - y;
          const result = raw & 0xffff;
          flags.zf = result === 0 ? 1 : 0;
          flags.sf = result & 0x8000 ? 1 : 0;
          if (op === "add") {
            flags.cf = raw > 0xffff ? 1 : 0;
            flags.of = (x ^ result) & (y ^ result) & 0x8000 ? 1 : 0;
          } else {
            flags.cf = x < y ? 1 : 0;
            flags.of = (x ^ y) & (x ^ result) & 0x8000 ? 1 : 0;
          }
          return result;
        }

        function jumpTaken(op) {
          switch (op) {
            case "jmp": return true;
            case "je": case "jz": return flags.zf === 1;
            case "jne": case "jnz": return flags.zf === 0;
            case "jl": return flags.sf !== flags.of;
            case "jge": return flags.sf === flags.of;
            case "jle": return flags.zf === 1 || flags.sf !== flags.of;
            case "jg": return flags.zf === 0 && flags.sf === flags.of;
            default: return false;
          }
        }

        function describeMemory(where) {
          const info = meta.get(where);
          if (!info) return "";
          if (info.kind === "ret") return "the return address";
          if (info.kind === "param") return "parameter " + info.name;
          if (info.kind === "bp") return "the saved BP";
          if (info.kind === "local") return info.name ? "local variable " + info.name : "a local variable";
          if (info.kind === "saved") return "the saved " + info.reg.toUpperCase();
          return "";
        }

        const value = (number) => "`" + hex4(number) + "` (" + signed(number) + ")";

        function execute(line, step) {
          const { op, operands } = line.ins;
          const [a, b] = operands;
          const say = (text) => step.explain.push(text);
          let nextIp = line.next;

          const operandValue = (operand) => {
            if (operand.type === "reg") return regs[operand.reg];
            if (operand.type === "imm") return operand.value & 0xffff;
            if (operand.type === "mem") return read((regs.bp + operand.disp) & 0xffff, step);
            throw new Error("Cannot read " + operand.type);
          };
          const operandName = (operand) => {
            if (operand.type === "reg") return operand.reg.toUpperCase();
            if (operand.type === "mem") return "[" + offsetText(operand.disp) + "]";
            return String(operand.value);
          };
          const addressOf = (operand) => (regs.bp + operand.disp) & 0xffff;
          const addressSum = (operand) =>
            "BP " + (operand.disp < 0 ? "− " + -operand.disp : "+ " + operand.disp) + " = `" + hex4(regs.bp) + "` " +
            (operand.disp < 0 ? "− " + -operand.disp : "+ " + operand.disp) + " = `" + hex4(addressOf(operand)) + "`";

          switch (op) {
            case "push": {
              const sp = regs.sp;
              const name = a.reg.toUpperCase();
              let info;
              if (line.options.param) {
                info = { kind: "param", name: line.options.param, owner: current().id, pending: true };
              } else if (a.reg === "bp") {
                info = { kind: "bp", owner: current().id, of: caller() ? shortLabel(caller()) : "the caller" };
              } else {
                info = { kind: "saved", reg: a.reg, owner: current().id, of: shortLabel(caller() || current()) };
              }
              push(regs[a.reg], info, step);
              say("`push " + a.reg + "` puts a copy of " + name + " on top of the stack. SP goes down by 2 first (`" + hex4(sp) + "` → `" + hex4(regs.sp) + "`), then " + name + "'s value " + value(regs[a.reg]) + " is written to address `" + hex4(regs.sp) + "`.");
              if (info.kind === "param") say("This is parameter " + info.name + " for the next call.");
              else if (info.kind === "bp") say("This saves the caller's BP so that it can be put back before returning.");
              else say("This keeps the caller's " + name + " safe while the subroutine uses " + name + " for its own work.");
              break;
            }
            case "pop": {
              const sp = regs.sp;
              const name = a.reg.toUpperCase();
              const popped = pop(step);
              regs[a.reg] = popped;
              say("`pop " + a.reg + "` copies the value on top of the stack (" + value(popped) + " at `" + hex4(sp) + "`) into " + name + ", then SP goes up by 2 (`" + hex4(sp) + "` → `" + hex4(regs.sp) + "`).");
              say("The value is still in memory, but that slot is now free space and can be overwritten.");
              break;
            }
            case "call": {
              const sp = regs.sp;
              const targetName = a.name;
              const callerFrame = current();
              const args = [];
              for (let where = regs.sp; where < STACK_BASE; where += 2) {
                const info = meta.get(where);
                if (!info || info.kind !== "param" || !info.pending || info.owner !== callerFrame.id) break;
                args.push({ where, name: info.name, value: signed(memory.get(where)) });
              }
              const frame = { id: frames.length, fn: targetName, args: args.map(({ name, value: argValue }) => ({ name, value: argValue })), active: true };
              frame.label = frameLabel(frame);
              frames.push(frame);
              args.forEach(({ where }) => {
                meta.set(where, Object.assign({}, meta.get(where), { owner: frame.id, pending: false }));
              });
              frameStack.push(frame.id);
              push(line.next, { kind: "ret", owner: frame.id, to: shortLabel(callerFrame) }, step);
              nextIp = program.labels[targetName];
              step.frame = frame.label;
              say("`call " + targetName + "` does two things. First it pushes the return address `" + hex4(line.next) + "`, the address of the instruction straight after the call, so SP goes `" + hex4(sp) + "` → `" + hex4(regs.sp) + "`.");
              say("Then it jumps: IP becomes `" + hex4(nextIp) + "`, the first instruction of " + targetName + ".");
              break;
            }
            case "ret": {
              const sp = regs.sp;
              const returning = current();
              const address = pop(step);
              if (a) regs.sp = (regs.sp + a.value) & 0xffff;
              nextIp = address;
              returning.active = false;
              frameStack.pop();
              step.frame = returning.label;
              const back = program.byAddress.get(address);
              say("`ret` pops the value on top of the stack (`" + hex4(address) + "` at `" + hex4(sp) + "`) into IP, so SP goes `" + hex4(sp) + "` → `" + hex4(regs.sp) + "`.");
              say("Execution carries on at `" + hex4(address) + "`" + (back ? ", the `" + back.code + "` just after the call in " + program.functionAt(address) : "") + ". " + returning.label + " has finished, so its stack frame is no longer in use.");
              break;
            }
            case "mov": {
              if (a.type === "reg" && b.type === "reg" && a.reg === "bp" && b.reg === "sp") {
                regs.bp = regs.sp;
                say("`mov bp, sp` copies SP into BP, so BP = `" + hex4(regs.bp) + "`. BP now stays fixed for the rest of this subroutine, even when SP moves.");
                say("From BP, `[bp+2]` is the return address, `[bp+4]` is the first parameter and `[bp-2]` would be the first local variable.");
              } else if (a.type === "reg" && b.type === "reg" && a.reg === "sp" && b.reg === "bp") {
                const sp = regs.sp;
                regs.sp = regs.bp;
                say("`mov sp, bp` copies BP into SP (`" + hex4(sp) + "` → `" + hex4(regs.sp) + "`). In one move this discards everything above the saved BP, including the local variables.");
              } else if (a.type === "reg" && b.type === "mem") {
                const where = addressOf(b);
                const loaded = read(where, step);
                const what = describeMemory(where);
                regs[a.reg] = loaded;
                say("Reads memory at " + addressSum(b) + (what ? ", which holds " + what : "") + ". " + a.reg.toUpperCase() + " = " + value(loaded) + ".");
              } else if (a.type === "mem") {
                const where = addressOf(a);
                const stored = operandValue(b);
                const old = meta.get(where);
                const info = old && old.kind === "local" ? Object.assign({}, old, { set: true }) : { kind: "local", name: null, owner: current().id, set: true };
                write(where, stored, info, step);
                say("Writes " + operandName(b) + "'s value " + value(stored) + " to memory at " + addressSum(a) + (info.name ? ": this is the local variable " + info.name : "") + ".");
              } else {
                const copied = operandValue(b);
                regs[a.reg] = copied;
                say(b.type === "imm"
                  ? "Puts the value " + value(copied) + " into " + a.reg.toUpperCase() + "."
                  : "Copies " + b.reg.toUpperCase() + " into " + a.reg.toUpperCase() + ", so " + a.reg.toUpperCase() + " = " + value(copied) + ".");
              }
              break;
            }
            case "add":
            case "sub":
            case "cmp": {
              if (a.type === "reg" && a.reg === "sp" && b.type === "imm") {
                const sp = regs.sp;
                regs.sp = arithmetic(op, regs.sp, b.value);
                if (op === "add") {
                  say("`add sp, " + b.value + "` moves SP up by " + b.value + " (`" + hex4(sp) + "` → `" + hex4(regs.sp) + "`). This removes " + b.value / 2 + " word" + (b.value === 2 ? "" : "s") + " from the top of the stack in one go, without reading them.");
                  say("The values are still in memory, but those slots are now free space.");
                } else {
                  const names = line.options.locals || [];
                  for (let slot = 0; slot < b.value / 2; slot += 1) {
                    const where = (regs.bp - 2 * (slot + 1)) & 0xffff;
                    meta.set(where, { kind: "local", name: names[slot] || null, owner: current().id, set: false });
                  }
                  say("`sub sp, " + b.value + "` moves SP down by " + b.value + " (`" + hex4(sp) + "` → `" + hex4(regs.sp) + "`), reserving " + b.value / 2 + " word" + (b.value === 2 ? "" : "s") + " for local variables" + (names.length ? " (" + names.join(", ") + ")" : "") + ".");
                  say("Nothing is written, so the new space still holds whatever was left there before.");
                }
                break;
              }
              const x = operandValue(a);
              const y = operandValue(b);
              const result = arithmetic(op, x, y);
              const destination = operandName(a);
              const sourceName = b.type === "mem" ? "the value at " + operandName(b) : b.type === "reg" ? b.reg.toUpperCase() : String(b.value);
              if (op === "cmp") {
                say("`cmp` compares " + destination + " (" + signed(x) + ") with " + sourceName + " (" + signed(y) + ") by working out " + signed(x) + " − " + signed(y) + " = " + signed(result) + ". The answer is thrown away; only the flags are kept.");
                say(result === 0 ? "The result is zero, so the zero flag ZF = 1 (they are equal)." : "The result is not zero, so the zero flag ZF = 0 (they are not equal).");
              } else {
                if (b.type === "mem") read((regs.bp + b.disp) & 0xffff, step);
                if (a.type === "reg") regs[a.reg] = result;
                else write(addressOf(a), result, null, step);
                say((op === "add" ? "Adds " : "Subtracts ") + sourceName + (b.type === "mem" ? " (address `" + hex4(addressOf(b)) + "`)" : "") + (op === "add" ? " to " : " from ") + destination + ": " + signed(x) + (op === "add" ? " + " : " − ") + signed(y) + " = " + signed(result) + ". " + destination + " = " + value(result) + ".");
              }
              break;
            }
            case "inc":
            case "dec": {
              const x = regs[a.reg];
              const keepCarry = flags.cf;
              regs[a.reg] = arithmetic(op === "inc" ? "add" : "sub", x, 1);
              flags.cf = keepCarry;
              say((op === "inc" ? "Adds 1 to " : "Subtracts 1 from ") + a.reg.toUpperCase() + ": " + signed(x) + (op === "inc" ? " + 1" : " − 1") + " = " + signed(regs[a.reg]) + ".");
              break;
            }
            case "int": {
              if (a.value !== 0x20) throw new Error("Only int 20h is simulated");
              halted = true;
              nextIp = line.address;
              say("`int 20h` hands control back to DOS, which ends the program.");
              break;
            }
            default: {
              if (!has(JUMPS, op)) throw new Error("Cannot execute " + op);
              const taken = jumpTaken(op);
              if (taken) nextIp = program.labels[a.name];
              if (op === "jmp") say("Jumps to " + a.name + " at `" + hex4(nextIp) + "`.");
              else if (taken) say("ZF = 1, so the jump is taken: IP becomes `" + hex4(nextIp) + "` (" + a.name + ").");
              else say("ZF = 0, so the jump is not taken: execution continues with the next instruction.");
            }
          }
          step.jumped = nextIp !== line.next && !halted;
          regs.ip = nextIp;
        }

        states.push(snapshot());
        while (!halted) {
          if (steps.length >= 400) throw new Error(scenario.id + ": the program did not finish");
          const line = program.byAddress.get(regs.ip);
          if (!line) throw new Error(scenario.id + ": IP " + hex4(regs.ip) + " is not the start of an instruction");
          const step = { index: steps.length, line: line.index, address: line.address, op: line.ins.op, reads: [], writes: [], explain: [], frame: null };
          execute(line, step);
          if (line.options.note) step.note = line.options.note;
          step.halted = halted;
          steps.push(step);
          states.push(snapshot());
        }

        const lowestSp = Math.min(...states.map((state) => state.regs.sp));
        return { scenario, program, steps, states, lowestSp };
      }

      // The meaning of one stack slot in a given state.
      function describeSlot(state, where) {
        const info = state.meta[where];
        const live = where >= state.regs.sp;
        const kindNames = { ret: "return address", param: "parameter", bp: "saved BP", saved: "saved register", local: "local variable" };
        if (info && info.kind === "base") return { kind: "base", live: true, text: "bottom of the stack (DOS left 0000 here)" };
        if (!live) {
          return { kind: "free", live: false, text: info && kindNames[info.kind] ? "free · was " + kindNames[info.kind] : "free" };
        }
        if (!info) return { kind: "data", live: true, text: "data" };
        const frameActive = state.frames[info.owner] && state.frames[info.owner].active;
        const number = signed(state.mem[where] || 0);
        switch (info.kind) {
          case "ret":
            return { kind: "ret", live, text: "return address → " + info.to };
          case "param":
            if (info.pending) return { kind: "param", live, text: "parameter " + info.name + " = " + number + " (for the next call)" };
            return { kind: "param", live, text: "parameter " + info.name + " = " + number + (frameActive ? "" : " · call finished") };
          case "bp":
            return { kind: "bp", live, text: "saved BP (" + info.of + "'s)" };
          case "saved":
            return { kind: "saved", live, text: "saved " + info.reg.toUpperCase() + " = " + number + " (" + info.of + "'s)" };
          case "local":
            return { kind: "local", live, text: (info.name ? "local " + info.name : "local variable") + (info.set ? " = " + number : " (not set yet)") };
          default:
            return { kind: "data", live, text: "data" };
        }
      }

      // Live frames with the address range each one occupies.
      function liveFrames(state) {
        const ranges = [];
        state.frameStack.forEach((id, depth) => {
          let low = Infinity;
          let high = -Infinity;
          Object.keys(state.meta).forEach((key) => {
            const where = Number(key);
            const info = state.meta[key];
            if (info.owner === id && where >= state.regs.sp && info.kind !== "base") {
              low = Math.min(low, where);
              high = Math.max(high, where);
            }
          });
          if (low !== Infinity) {
            ranges.push({ id, label: state.frames[id].label, fn: state.frames[id].fn, args: state.frames[id].args, low, high, current: depth === state.frameStack.length - 1 });
          }
        });
        return ranges;
      }

      // The frame whose saved BP sits at BP, so its slots can show [bp±n].
      function bpFrame(state) {
        const info = state.meta[state.regs.bp];
        return info && info.kind === "bp" && state.regs.bp >= state.regs.sp ? info.owner : null;
      }

      // A prediction for the instruction about to run, or null when the
      // instruction does not touch the stack. Answers come from the next
      // state so they always agree with the simulation.
      function questionFor(trace, index) {
        const step = trace.steps[index];
        if (!step) return null;
        const before = trace.states[index];
        const after = trace.states[index + 1];
        const line = trace.program.lines[step.line];
        const { op, operands } = line.ins;
        const [a, b] = operands;
        const sp = before.regs.sp;
        const code = "`" + line.code + "`";

        // Stack-address answers only offer addresses inside the stack, so
        // that no option wraps round past FFFF.
        function build(kind, prompt, correct, candidates, format, hint, reason) {
          const inStack = format === stackAddress;
          const values = [correct];
          const offer = (candidate) => {
            const wrapped = candidate & 0xffff;
            const allowed = !inStack || (wrapped >= STACK_LIMIT && wrapped <= STACK_BASE);
            if (allowed && values.length < 4 && !values.includes(wrapped)) values.push(wrapped);
          };
          candidates.forEach(offer);
          for (let delta = 2; values.length < 4 && delta < 0x100; delta += 2) {
            offer(correct - delta);
            offer(correct + delta);
          }
          values.sort((left, right) => left - right);
          return {
            kind,
            prompt,
            options: values.map((number) => ({ id: hex4(number), text: format(number) })),
            answer: hex4(correct),
            hint,
            reason,
          };
        }
        const address = (number) => hex4(number);
        const stackAddress = (number) => hex4(number);
        // Small values are data and read more easily in denary as well;
        // larger ones in these programs are always addresses.
        const data = (number) => (number < 0x100 ? hex4(number) + " (" + number + ")" : hex4(number));

        // Distractors: the wrong direction, no change, a one-byte move and
        // twice the move.
        const spQuestion = () => {
          const delta = signed((after.regs.sp - sp) & 0xffff);
          return build(
          "sp",
          "What will SP be after " + code + " runs?",
          after.regs.sp,
          [sp - delta, sp, sp + Math.sign(delta), sp + 2 * delta],
          stackAddress,
          after.regs.sp < sp
            ? "The stack grows towards lower addresses, and each slot is one 16-bit word: 2 bytes."
            : "Taking items off the stack moves SP back towards the bottom of the stack (higher addresses).",
          "SP goes from " + hex4(sp) + " to " + hex4(after.regs.sp) + ".",
          );
        };

        if (op === "push") return spQuestion();
        if (op === "call") {
          // Alternate between the two things a call changes.
          const earlierCalls = trace.steps.slice(0, index).filter((earlier) => earlier.op === "call").length;
          if (earlierCalls % 2 === 1) return spQuestion();
          return build(
            "return",
            "Which return address will " + code + " push onto the stack?",
            line.next,
            [line.address, trace.program.labels[a.name], sp - 2],
            address,
            "When the subroutine finishes, which instruction should run next?",
            hex4(line.next) + " is the address of the instruction straight after the call.",
          );
        }
        if (op === "ret") {
          const deeper = [];
          for (let where = sp + 2; where < STACK_BASE; where += 2) {
            if (before.meta[where] && before.meta[where].kind === "ret") deeper.push(before.mem[where]);
          }
          const fn = trace.program.labels[trace.program.functionAt(line.address)];
          return build(
            "ret",
            "Where will execution continue after " + code + "?",
            after.regs.ip,
            deeper.concat([line.next, fn, sp]),
            address,
            "`ret` uses whatever address is on the top of the stack, where SP points.",
            hex4(after.regs.ip) + " is the value on top of the stack at " + hex4(sp) + ".",
          );
        }
        if (op === "pop") {
          return build(
            "pop",
            "What value will " + a.reg.toUpperCase() + " hold after " + code + "?",
            after.regs[a.reg],
            [before.regs[a.reg], before.mem[sp + 2] || 0, sp],
            data,
            "Look at the slot that SP points to.",
            "The top of the stack (address " + hex4(sp) + ") holds " + hex4(after.regs[a.reg]) + ".",
          );
        }
        if ((op === "add" || op === "sub" || op === "mov") && a.type === "reg" && a.reg === "sp") return spQuestion();
        if (op === "mov" && a.type === "reg" && a.reg === "bp" && b.type === "reg") {
          return build(
            "bp",
            "What will BP be after " + code + "?",
            after.regs.bp,
            [before.regs.bp, sp + 2, sp - 2],
            stackAddress,
            "`mov bp, sp` copies the value that is in SP.",
            "BP becomes a copy of SP: " + hex4(after.regs.bp) + ".",
          );
        }
        if (op === "mov" && a.type === "reg" && b.type === "mem") {
          const where = (before.regs.bp + b.disp) & 0xffff;
          return build(
            "load",
            "Which value will " + code + " load into " + a.reg.toUpperCase() + "?",
            after.regs[a.reg],
            [before.mem[where + 2] || 0, before.mem[where - 2] || 0, where],
            data,
            "Work out the address BP " + (b.disp < 0 ? "− " + -b.disp : "+ " + b.disp) + " first, then find it in the stack.",
            "BP " + (b.disp < 0 ? "− " + -b.disp : "+ " + b.disp) + " = " + hex4(where) + ", which holds " + hex4(after.regs[a.reg]) + ".",
          );
        }
        if (op === "mov" && a.type === "mem") {
          const where = (before.regs.bp + a.disp) & 0xffff;
          return build(
            "store",
            "Which memory address will " + code + " write to?",
            where,
            [before.regs.bp, sp, where + 4, (before.regs.bp - a.disp) & 0xffff],
            stackAddress,
            "Work out BP " + (a.disp < 0 ? "− " + -a.disp : "+ " + a.disp) + ".",
            "BP " + (a.disp < 0 ? "− " + -a.disp : "+ " + a.disp) + " = " + hex4(before.regs.bp) + (a.disp < 0 ? " − " + -a.disp : " + " + a.disp) + " = " + hex4(where) + ".",
          );
        }
        return null;
      }

      return { ORIGIN, STACK_BASE, STACK_OPS, hex2, hex4, signed, offsetText, assemble, run, describeSlot, liveFrames, bpFrame, questionFor };
    })();
    // The walkthroughs, simplest first. Each source line is
    // [label, instruction, comment, options]; options.note is shown after
    // that line runs, options.param names a pushed parameter and
    // options.locals names the slots made by sub sp. expect is checked
    // by the build so a program cannot silently stop teaching its point.
